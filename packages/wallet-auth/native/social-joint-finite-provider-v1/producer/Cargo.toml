[package]
name="ynx-social-normal-finite-joint-custodian"
version="0.0.1"
edition="2024"
[workspace]
[lib]
crate-type=["rlib","staticlib"]
[features]
native-custody=["dep:libsignal-protocol","dep:rand","dep:zeroize"]
[dependencies]
serde={version="1",features=["derive"]}
serde_json={version="1",features=["preserve_order"]}
base64="0.22.1"
sha2="0.10"
libc="0.2"
libsignal-protocol={path="../../keeper-r4/original/native-source/native/rust/protocol",optional=true}
rand={version="0.9",optional=true}
zeroize={version="1.8",optional=true}
