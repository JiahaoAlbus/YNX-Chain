# Secret-manager integration contract candidate.
# This file intentionally creates no runtime secret object and is not included
# by the default Kustomize base until a provider and named owners are accepted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-manager-integration-contract
  namespace: ynx-security-platform
  labels:
    security.ynx/status: not-configured
data:
  contract.json: |
    {
      "schemaVersion": 1,
      "status": "not-configured",
      "valueMaterialAllowed": false,
      "providerSelectionRequired": true,
      "workloadIdentityRequired": true,
      "environmentBindingRequired": true,
      "namedOwnerRequired": true,
      "multiPartyBreakGlassRequired": true,
      "rotationEvidenceRequired": true,
      "recoveryBoundaryRequired": true,
      "acceptedAdapters": [
        "external-secrets-operator-candidate",
        "csi-secrets-store-candidate"
      ],
      "prohibited": [
        "inline value material",
        "cross-purpose credentials",
        "browser delivery",
        "CI log output",
        "automatic break-glass execution"
      ]
    }
