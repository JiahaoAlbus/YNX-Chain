# Istio service mesh configuration for mTLS enforcement.
# Production requires service-to-service mTLS with workload identity.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-mtls-strict
  namespace: ynx-services
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all-default
  namespace: ynx-services
spec:
  {}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-gateway
  namespace: ynx-services
spec:
  selector:
    matchLabels:
      security.ynx/ingress-enabled: "true"
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: default-mtls
  namespace: ynx-services
spec:
  host: "*.ynx-services.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
