name: exchange

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/exchange.yml"
      - "Makefile"
      - "chain-metadata/**"
      - "docs/guides/EXCHANGE_GUIDE.md"
      - "exchange/**"
      - "internal/api/**"
      - "internal/chain/**"
      - "internal/consensus/**"
      - "internal/mutationfreeze/**"
      - "scripts/fixtures/generate-exchange-vectors/**"
      - "scripts/lib/exchange-candidate.mjs"
      - "scripts/package/exchange-**"
      - "scripts/verify/exchange-**"
      - "sdk/js/**"
      - "testdata/exchange-signed-transactions.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/exchange.yml"
      - "Makefile"
      - "chain-metadata/**"
      - "docs/guides/EXCHANGE_GUIDE.md"
      - "exchange/**"
      - "internal/api/**"
      - "internal/chain/**"
      - "internal/consensus/**"
      - "internal/mutationfreeze/**"
      - "scripts/fixtures/generate-exchange-vectors/**"
      - "scripts/lib/exchange-candidate.mjs"
      - "scripts/package/exchange-**"
      - "scripts/verify/exchange-**"
      - "sdk/js/**"
      - "testdata/exchange-signed-transactions.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: make dependency-audit
      - run: make contract-tooling-check
      - run: make exchange-vector-check
      - run: make exchange-package-integrity-check
      - run: make exchange-integration-check
      - run: make exchange-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ynx-exchange-${{ github.sha }}
          path: tmp/packages/exchange/
          if-no-files-found: error
          retention-days: 30
