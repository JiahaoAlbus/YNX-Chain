name: Desktop Grant matched source closure
on:
  push:
    branches: [codex/desktop-grant-base188-closure-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normal-source-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.7.0'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - run: node --test packages/wallet-auth/test/desktop-grant-backend-inputs.test.mjs
      - run: node packages/wallet-auth/node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck false --exactOptionalPropertyTypes --module NodeNext --moduleResolution NodeNext --target ES2022 --typeRoots packages/wallet-auth/node_modules/@types --types node packages/wallet-auth/test/types/desktop-grant-backend.mts
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-grant-base188-source-package
          path: canonical-common-source-package
          if-no-files-found: error
