name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: make dependency-audit
      - run: make env-check
      - run: make no-placeholder-check
      - run: make secret-scan
      - run: make contract-tooling-check
      - run: make test
      - run: make monitoring-check
      - run: make indexer-check
      - run: make explorer-check
      - run: make faucet-check
      - run: make deploy-dry-run
      - run: make smoke-test
      - run: make grant-package
      - run: make ecosystem-package
      - run: make exchange-package
      - run: make mainnet-readiness

  pay-card-ios-native:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ExpoModulesJSI 57 declares Swift tools 6.2, so both native
          # candidates use the Xcode 26.2 toolchain on the macOS 15 runner.
          - app: pay
            scheme: YNXPay
            developer_dir: /Applications/Xcode_26.2.app/Contents/Developer
          - app: card
            scheme: YNXCard
            developer_dir: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Apply the version-locked ExpoModulesJSI Swift 6.2 patch
        run: node ../pay/scripts/patch-expo-modules-jsi.mjs
      - run: npx pod-install ios
      - name: Build iOS Simulator app without signing
        run: >-
          xcodebuild
          -workspace ios/${{ matrix.scheme }}.xcworkspace
          -scheme ${{ matrix.scheme }}
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
