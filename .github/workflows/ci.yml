name: ci

on:
  push:
    branches: [main, codex/social-r37-tpm-compile-20261018]
  pull_request:
    branches: [main]

jobs:
  test:
    if: github.ref != 'refs/heads/codex/social-r37-tpm-compile-20261018' && github.head_ref != 'codex/social-r37-tpm-compile-20261018'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: make dependency-audit
      - run: make env-check
      - run: make no-placeholder-check
      - run: make secret-scan
      - run: make contract-tooling-check
      - run: make test
      - run: make monitoring-check
      - run: make indexer-check
      - run: make explorer-check
      - run: make faucet-check
      - run: make deploy-dry-run
      - run: make smoke-test
      - run: make grant-package
      - run: make ecosystem-package
      - run: make exchange-package
      - run: make mainnet-readiness

  social-tpm-r37-compile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/social-r37-tpm-compile-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build fixed Linux crypto source and run public mathematical controls
        run: python3 scripts/ci/social-linux-crypto-r1/execute.py "$RUNNER_TEMP/social-linux-crypto-r1-result"
      - name: Preserve first cause and exact compiler/dependency/header manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-linux-crypto-r1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/social-linux-crypto-r1-result/*.json
            ${{ runner.temp }}/social-linux-crypto-r1-result/*.raw
            ${{ runner.temp }}/social-linux-crypto-r1-result/crypto-build/BUILD.log
            ${{ runner.temp }}/social-linux-crypto-r1-result/crypto-build/OUTPUT_SHA256SUMS
            ${{ runner.temp }}/social-linux-crypto-r1-result/crypto-build/oqs-install
            ${{ runner.temp }}/social-linux-crypto-r1-result/crypto-build/sodium-install
            ${{ runner.temp }}/social-linux-crypto-r1-result/crypto-build/vendor/liboqs-5a1a854b0dc9f2141bdc771c555ee60c37950183/src/sig/ml_dsa/mldsa-native_ml-dsa-87_ref
          if-no-files-found: error
