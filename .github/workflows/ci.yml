name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # The original Cloud workflow owns the explicit IDE-only source selection.
    # Do not wake service smoke/deploy/package targets for its narrow draft PR.
    if: >-
      ${{ !(github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.head_ref == 'codex/cloud-key-recovery-rotation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make env-check
      - run: make no-placeholder-check
      - run: make secret-scan
      - run: make test
      - run: make contract-tooling-check
      - run: make monitoring-check
      - run: make indexer-check
      - run: make explorer-check
      - run: make faucet-check
      - run: make deploy-dry-run
      - run: make smoke-test
      - run: make grant-package
      - run: make ecosystem-package
      - run: make exchange-package
      - run: make mainnet-readiness
