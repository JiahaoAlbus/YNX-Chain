name: ci

on:
  push:
    branches: [main, codex/social-r37-tpm-compile-20261018]
  pull_request:
    branches: [main]

jobs:
  test:
    if: github.ref != 'refs/heads/codex/social-r37-tpm-compile-20261018' && github.head_ref != 'codex/social-r37-tpm-compile-20261018'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: make dependency-audit
      - run: make env-check
      - run: make no-placeholder-check
      - run: make secret-scan
      - run: make contract-tooling-check
      - run: make test
      - run: make monitoring-check
      - run: make indexer-check
      - run: make explorer-check
      - run: make faucet-check
      - run: make deploy-dry-run
      - run: make smoke-test
      - run: make grant-package
      - run: make ecosystem-package
      - run: make exchange-package
      - run: make mainnet-readiness

  social-tpm-r37-compile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/social-r37-tpm-compile-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact R37 production TU without hardware or services
        run: python3 scripts/ci/social-tpm-r41/compile.py "$RUNNER_TEMP/social-tpm-r41-result"
      - name: Preserve first cause and exact compiler/dependency/header manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-current-r41-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/social-tpm-r41-result/*.json
            ${{ runner.temp }}/social-tpm-r41-result/*.raw
          if-no-files-found: error
