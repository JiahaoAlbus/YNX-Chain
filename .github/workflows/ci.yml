name: ci

on:
  push:
    branches: [main, codex/social-r37-tpm-compile-20261018]
  pull_request:
    branches: [main]

jobs:
  test:
    if: github.ref != 'refs/heads/codex/social-r37-tpm-compile-20261018' && github.head_ref != 'codex/social-r37-tpm-compile-20261018'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: make dependency-audit
      - run: make env-check
      - run: make no-placeholder-check
      - run: make secret-scan
      - run: make contract-tooling-check
      - run: make test
      - run: make monitoring-check
      - run: make indexer-check
      - run: make explorer-check
      - run: make faucet-check
      - run: make deploy-dry-run
      - run: make smoke-test
      - run: make grant-package
      - run: make ecosystem-package
      - run: make exchange-package
      - run: make mainnet-readiness

  social-tpm-r37-compile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/social-r37-tpm-compile-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile R62 complete codec then link exact retained R60 real storage-open graph
        run: python3 scripts/ci/social-tpm-r62/compile.py "$RUNNER_TEMP/social-tpm-r62-result"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Preserve R62 first cause and exact dependency/compiler/header inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-tpm-r62-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/social-tpm-r62-result/*.json
            ${{ runner.temp }}/social-tpm-r62-result/*.raw
            ${{ runner.temp }}/social-tpm-r62-result/*.o
            ${{ runner.temp }}/social-tpm-r62-result/r60-storage-open-link
          if-no-files-found: error
          retention-days: 1
