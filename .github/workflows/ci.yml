name: ci

on:
  push:
    branches: [main, codex/v5-p06-pay]
  pull_request:
    branches: [main]

jobs:
  test:
    if: github.ref != 'refs/heads/codex/v5-p06-pay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check normal Pay original-order and Source lifecycle consumers
        run: node --test apps/pay/native/r6/*.test.mjs
      - run: make dependency-audit
      - run: make env-check
      - run: make no-placeholder-check
      - run: make secret-scan
      - run: make contract-tooling-check
      - run: make test
      - run: make monitoring-check
      - run: make indexer-check
      - run: make explorer-check
      - run: make faucet-check
      - run: make deploy-dry-run
      - run: make smoke-test
      - run: make grant-package
      - run: make ecosystem-package
      - run: make exchange-package
      - run: make mainnet-readiness

  pay-original-recovery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v5-p06-pay' && github.event.head_commit.message != 'Gate unqualified Comet QA inputs' && github.event.head_commit.message != 'Prepare isolated OpenSSL QA inputs' && github.event.head_commit.message != 'Reject incomplete Pay Main bridge inventory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test Source liveness and original invoice lookup
        run: go test ./internal/payproduct -run '^Test(LivenessDoesNotClaimNativePaySourceReadiness|MerchantInvoiceLookupKeepsOriginalAcrossAuthorityRefusals|RefundUnknownColdStoreCannotBeReleasedOrResent|MerchantHTTPPartialRefundUsesScopedProviderAndColdSeventyReadback|PaymentOutcomeHTTPRequiresFreshOriginalPayerProof)$' -count=1
      - name: Test normal Pay Source status and original recovery
        run: node --test apps/pay/native/r6/main-result.test.mjs
      - name: Install exact original merchant dependencies
        working-directory: apps/merchant-console
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Test original merchant lookup and authority refusal
        run: node --test apps/merchant-console/test/request-boundary.test.js apps/merchant-console/test/merchant-recovery-normal.test.js

  pay-qa-input:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v5-p06-pay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test distinct Comet input gate
        run: node --test apps/pay/native/scripts/qa-comet-input.test.mjs apps/pay/native/scripts/qa-openssl-input.test.mjs apps/pay/native/r6/desktop-bridge-identity.test.mjs apps/pay/native/r6/candidate-invoice-entry.test.mjs
      - name: Test Pay current and original order recovery
        run: node --test apps/pay/native/r6/client-current-boundary.test.mjs apps/pay/native/r6/original-order.test.mjs apps/pay/native/r6/direct-review-unknown.test.mjs

  pay-ui-lifecycle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v5-p06-pay'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Pay GUI lifecycle and stale return
        run: |
          xcrun swiftc -frontend -parse apps/pay/native/macos/PayReconnectState.swift apps/pay/native/macos/PayStatusMessage.swift apps/pay/native/macos/PayInvoiceReferenceStore.swift apps/pay/native/macos/PayApp.swift
          xcrun swiftc apps/pay/native/macos/PayReconnectState.swift apps/pay/native/macos/PayReconnectStateTests.swift -o "$RUNNER_TEMP/pay-reconnect-state-test"
          "$RUNNER_TEMP/pay-reconnect-state-test"
          xcrun swiftc apps/pay/native/macos/PayStatusMessage.swift apps/pay/native/macos/PayStatusMessageTests.swift -o "$RUNNER_TEMP/pay-status-message-test"
          "$RUNNER_TEMP/pay-status-message-test"
          xcrun swiftc apps/pay/native/macos/PayInvoiceReferenceStore.swift apps/pay/native/macos/PayInvoiceReferenceStoreTests.swift -o "$RUNNER_TEMP/pay-invoice-reference-test"
          "$RUNNER_TEMP/pay-invoice-reference-test"
          p06_suite="ynx.pay.test.$(uuidgen)"
          "$RUNNER_TEMP/pay-invoice-reference-test" write "$p06_suite"
          p06_invoice=$("$RUNNER_TEMP/pay-invoice-reference-test" verify "$p06_suite")
          P06_RESTORED_INVOICE="$p06_invoice" node --test --test-name-pattern='the fixed Shop loan and Pay read use the same live protected order' apps/pay/native/r6/original-order.test.mjs
      - name: Plan and build unconnected local QA app
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/pay-tmp" "$RUNNER_TEMP/pay-clang" "$RUNNER_TEMP/pay-swift"
          node apps/pay/native/scripts/build-qa.mjs --plan --r6 --mac-app > "$RUNNER_TEMP/pay-plan.json"
          TMPDIR="$RUNNER_TEMP/pay-tmp" CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/pay-clang" SWIFT_MODULECACHE_PATH="$RUNNER_TEMP/pay-swift" node apps/pay/native/scripts/build-qa.mjs --r6 --mac-app "$RUNNER_TEMP/pay-qa"
          "$RUNNER_TEMP/pay-qa/YNX Pay QA.app/Contents/MacOS/YNXPay" --self-check > "$RUNNER_TEMP/pay-self-check.json"
          node -e 'const r=require(process.argv[1]); if(r.code!=="NATIVE_PAY_NORMAL_MAIN_SOURCE_NOT_SUPPLIED" || r.mainApproval!==false || r.submission!==false) process.exit(1)' "$RUNNER_TEMP/pay-self-check.json"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/pay-unconnected-qa.tar.gz" pay-qa pay-plan.json pay-self-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: pay-unconnected-local-qa-${{ github.sha }}
          path: ${{ runner.temp }}/pay-unconnected-qa.tar.gz
          if-no-files-found: error
          retention-days: 7
