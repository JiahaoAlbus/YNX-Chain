name: Social matched normal source cohort
on:
  push:
    branches: [codex/wallet-auth49-social-matched-device-cohort-20261108]
  pull_request:
    paths:
      - packages/wallet-auth/scripts/social-matched-normal-cohort.*
      - packages/wallet-auth/scripts/manifests/social-matched-normal-cohort.json
      - packages/wallet-auth/test/social-matched-normal-cohort.test.mjs
      - packages/wallet-auth/test/types/social-matched-normal-cohort.mts
      - scripts/ci/social-matched-normal-*.mjs
      - .github/workflows/social-matched-normal-cohort.yml
  workflow_dispatch:
jobs:
  matched-source-package:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/wallet-auth49-social-matched-device-cohort-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/social-matched-normal-cohort.mjs 2>&1 | tee social-matched-normal.log
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - run: node scripts/ci/social-matched-normal-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: social-matched-normal-cohort
          path: |
            social-matched-normal.log
            ${{ runner.temp }}/social-matched-normal-*/**
            canonical-common-source-package
