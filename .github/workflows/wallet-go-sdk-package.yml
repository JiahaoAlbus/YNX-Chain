name: Wallet Go SDK formal package

on:
  workflow_dispatch:
  push:
    branches: [codex/wallet-desktop-cli-sdk-20260813]
    paths:
      - .github/workflows/wallet-go-sdk-package.yml
      - scripts/release/build-wallet-go-sdk.mjs
      - release/wallet-cli/go-sdk/ynx-wallet-go-sdk-0.1.0.tgz

permissions:
  contents: read

jobs:
  build-install-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.0
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Rebuild deterministic package
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp release/wallet-cli/go-sdk/ynx-wallet-go-sdk-0.1.0.tgz "$RUNNER_TEMP/committed.tgz"
          node scripts/release/build-wallet-go-sdk.mjs f27b5867227e172756d4a8c3638905c668874f33 > "$RUNNER_TEMP/evidence/build.json"
          package=release/wallet-cli/go-sdk/ynx-wallet-go-sdk-0.1.0.tgz
          test "$(stat -c %s "$package")" = 5610
          test "$(sha256sum "$package" | cut -d ' ' -f 1)" = 9834b5c37d089ccbbfcd7afee18c0a4ff421d762be7d2d1e473e162241950208
          cmp "$package" "$RUNNER_TEMP/committed.tgz"
      - name: Extract, install and test module package
        run: |
          mkdir -p "$RUNNER_TEMP/module"
          tar -xzf release/wallet-cli/go-sdk/ynx-wallet-go-sdk-0.1.0.tgz -C "$RUNNER_TEMP/module"
          cd "$RUNNER_TEMP/module/package"
          test "$(go list -m)" = github.com/JiahaoAlbus/YNX-Chain/sdk/wallet/go
          go test ./...
      - name: Run packaged real consumer and fail-closed cases
        run: |
          cd "$RUNNER_TEMP/module/package"
          go run ./examples/real-consumer -vector testdata/product-session-http-proof-v1.json -timeout 15s > "$RUNNER_TEMP/evidence/real-consumer.json"
          jq -e '.connected == true and .chainId == "0x1917" and .vectorVerified == true and .ephemeralSigningVerified == true and .privateKeyPersisted == false' "$RUNNER_TEMP/evidence/real-consumer.json"
          if go run ./examples/real-consumer -vector testdata/product-session-http-proof-v1.json -rpc http://127.0.0.1:1 > "$RUNNER_TEMP/evidence/http.stdout" 2> "$RUNNER_TEMP/evidence/http.stderr"; then exit 1; fi
          grep -F 'RPC must be an absolute HTTPS URL without userinfo' "$RUNNER_TEMP/evidence/http.stderr"
          if go run ./examples/real-consumer -vector testdata/product-session-http-proof-v1.json -rpc https://127.0.0.1:1 -timeout 2s > "$RUNNER_TEMP/evidence/unreachable.stdout" 2> "$RUNNER_TEMP/evidence/unreachable.stderr"; then exit 1; fi
          grep -E 'RPC unavailable|deadline exceeded' "$RUNNER_TEMP/evidence/unreachable.stderr"
          jq -n --arg workflowSourceCommit "$GITHUB_SHA" --argjson workflowRunId "$GITHUB_RUN_ID" '{schemaVersion:1,packageSourceCommit:"f27b5867227e172756d4a8c3638905c668874f33",workflowSourceCommit:$workflowSourceCommit,workflowRunId:$workflowRunId,runner:"ubuntu-24.04-x64",go:"1.25.0",minimumRuntime:"Go 1.25.0",minimumOS:"Ubuntu 24.04.4 x64 directly tested",bytes:5610,sha256:"9834b5c37d089ccbbfcd7afee18c0a4ff421d762be7d2d1e473e162241950208",signingClass:"unsigned_go_module_testnet_candidate",deterministicRebuild:true,cleanExtracted:true,moduleTests:true,realConsumer:true,vectorVerified:true,ephemeralSigningVerified:true,privateKeyPersisted:false,chainId:"0x1917",httpFailureClosed:true,unreachableRpcFailureClosed:true,accountClaimed:false,balanceClaimed:false,transactionCreated:false,productionSigned:false,downloadHosted:false,deployedPublic:false}' > "$RUNNER_TEMP/evidence/lifecycle.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ynx-wallet-go-sdk-package
          path: |
            release/wallet-cli/go-sdk/ynx-wallet-go-sdk-0.1.0.tgz
            ${{ runner.temp }}/evidence
          if-no-files-found: error

  verify-downloaded-artifact:
    needs: build-install-and-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ynx-wallet-go-sdk-package
          path: downloaded
      - name: Verify downloaded package and evidence
        run: |
          package="$(find downloaded -name ynx-wallet-go-sdk-0.1.0.tgz -type f -print -quit)"
          evidence="$(find downloaded -name lifecycle.json -type f -print -quit)"
          test -n "$package" && test -n "$evidence"
          test "$(stat -c %s "$package")" = 5610
          test "$(sha256sum "$package" | cut -d ' ' -f 1)" = 9834b5c37d089ccbbfcd7afee18c0a4ff421d762be7d2d1e473e162241950208
          jq -e '.deterministicRebuild == true and .cleanExtracted == true and .moduleTests == true and .realConsumer == true and .vectorVerified == true and .ephemeralSigningVerified == true and .privateKeyPersisted == false and .chainId == "0x1917" and .httpFailureClosed == true and .unreachableRpcFailureClosed == true and .productionSigned == false and .downloadHosted == false and .deployedPublic == false' "$evidence"
          jq -n --arg sourceCommit "$GITHUB_SHA" --argjson workflowRunId "$GITHUB_RUN_ID" '{schemaVersion:1,sourceCommit:$sourceCommit,workflowRunId:$workflowRunId,downloaded:true,bytesVerified:true,sha256Verified:true,bytes:5610,sha256:"9834b5c37d089ccbbfcd7afee18c0a4ff421d762be7d2d1e473e162241950208"}' > downloaded-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ynx-wallet-go-sdk-package-download-verification
          path: downloaded-verification.json
          if-no-files-found: error
