          /usr/bin/python3 -B apps/browser/privacy-routing/tor/tests/test_r2_path_sample.py "$RUNNER_TEMP/ynx-r2-path-sample-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 -B apps/browser/privacy-routing/tor/tests/test_r2_offline_preparation.py "$RUNNER_TEMP/ynx-r2-offline-preparation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 -B apps/browser/privacy-routing/tor/tests/test_r2_comparison_binding.py "$RUNNER_TEMP/ynx-r2-comparison-binding-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
