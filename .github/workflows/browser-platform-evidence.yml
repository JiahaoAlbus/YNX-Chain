          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_snowflake_policy_fatal.py --native-source "$GITHUB_WORKSPACE/apps/browser/native/Sources/YNXBrowserNative" --qa-core-products "$qa_core_products" --module-cache "$RUNNER_TEMP/ynx-policy-fatal-module-cache" --output "$RUNNER_TEMP/ynx-snowflake-policy-fatal"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_snowflake_coverage_fence.py --qa-core-products "$qa_core_products" --module-cache "$RUNNER_TEMP/ynx-policy-fatal-module-cache" --output "$RUNNER_TEMP/ynx-snowflake-coverage-fence"
          mkdir -p "$RUNNER_TEMP/ynx-nym-protected"
          YNX_NYM_TEST_OUTPUT="$RUNNER_TEMP/ynx-nym-protected" /bin/bash apps/browser/privacy-routing/nym/tests/test-protected-nym.sh
          mkdir -p "$RUNNER_TEMP/ynx-nym-synthetic"
          YNX_NYM_TEST_OUTPUT="$RUNNER_TEMP/ynx-nym-synthetic" /bin/bash apps/browser/privacy-routing/nym/tests/test-synthetic-nym.sh
          mkdir -p "$RUNNER_TEMP/ynx-browser-page-readout"
          YNX_P05_READOUT_EVIDENCE_DIRECTORY="$RUNNER_TEMP/ynx-browser-page-readout" npm --prefix apps/browser run build:macos
          normal_role_executable="$GITHUB_WORKSPACE/apps/browser/dist/macos/YNX Browser Testnet Preview.app/Contents/MacOS/YNXBrowserNative"
          qa_role_executable="$qa_core_products/YNXBrowserNative"
          normal_role_sha256=$(shasum -a 256 "$normal_role_executable" | cut -d ' ' -f 1)
          qa_role_sha256=$(shasum -a 256 "$qa_role_executable" | cut -d ' ' -f 1)
          /usr/bin/python3 apps/browser/test/test_nym_public_role_guard.py --normal-executable "$normal_role_executable" --normal-sha256 "$normal_role_sha256" --qa-executable "$qa_role_executable" --qa-sha256 "$qa_role_sha256" --output "$RUNNER_TEMP/ynx-nym-public-role-guard"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_public_qa_entry_arguments.py --normal-executable "$normal_role_executable" --normal-sha256 "$normal_role_sha256" --qa-executable "$qa_role_executable" --qa-sha256 "$qa_role_sha256" --output "$RUNNER_TEMP/ynx-public-qa-entry-arguments"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_public_qa_entry_arguments.py --suite mixed-role --normal-executable "$normal_role_executable" --normal-sha256 "$normal_role_sha256" --qa-executable "$qa_role_executable" --qa-sha256 "$qa_role_sha256" --output "$RUNNER_TEMP/ynx-public-qa-mixed-roles"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/acceptance-kit/test-native-consumer.py --output "$RUNNER_TEMP/p05-acceptance-consumer"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/acceptance-kit/test-native-consumer.py --dispatcher-only --output "$RUNNER_TEMP/p05-acceptance-dispatcher"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/acceptance-kit/test-native-private-input.py --output "$RUNNER_TEMP/p05-acceptance-private-input"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_trial_withdrawal.py --output "$RUNNER_TEMP/ynx-trial-withdrawal"
          mkdir -p apps/browser/evidence/platform/macos "$RUNNER_TEMP/Applications"
          ditto 'apps/browser/dist/macos/YNX Browser Testnet Preview.app' "$RUNNER_TEMP/Applications/YNX Browser Testnet Preview.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/Applications/YNX Browser Testnet Preview.app"
          codesign -dv --verbose=4 "$RUNNER_TEMP/Applications/YNX Browser Testnet Preview.app" 2> apps/browser/evidence/platform/macos/codesign.txt
      - name: Cold launch and restart
        run: |
          APP="$RUNNER_TEMP/Applications/YNX Browser Testnet Preview.app"
          "$APP/Contents/MacOS/YNXBrowserNative" > apps/browser/evidence/platform/macos/cold-launch.log 2>&1 &
          PID=$!
          sleep 6
          kill -0 "$PID"
          echo "pid=$PID running=true" > apps/browser/evidence/platform/macos/cold-launch.txt
          screencapture -x apps/browser/evidence/platform/macos/cold-launch.png || true
          kill "$PID"
          wait "$PID" || true
          YNX_BROWSER_EVIDENCE_STATE=private "$APP/Contents/MacOS/YNXBrowserNative" > apps/browser/evidence/platform/macos/restart.log 2>&1 &
          PID=$!
          sleep 5
          kill -0 "$PID"
          echo "pid=$PID running=true" > apps/browser/evidence/platform/macos/restart.txt
          screencapture -x apps/browser/evidence/platform/macos/private.png || true
          kill "$PID"
          wait "$PID" || true
          shasum -a 256 apps/browser/dist/macos/YNX-Browser-Testnet-Preview-macOS.zip > apps/browser/evidence/platform/macos/sha256.txt
          stat -f '%z bytes' apps/browser/dist/macos/YNX-Browser-Testnet-Preview-macOS.zip > apps/browser/evidence/platform/macos/size.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ynx-browser-macos-testnet-preview
          path: |
