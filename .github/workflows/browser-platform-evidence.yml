          /usr/bin/python3 -B apps/browser/privacy-routing/tor/tests/test_tor_onion_targets.py "$RUNNER_TEMP/ynx-tor-onion-policy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_snowflake_phase_source_sync.py --output "$RUNNER_TEMP/ynx-native-phase-sync.json"
          /usr/bin/python3 -B apps/browser/privacy-routing/tor/tests/test_successor_cli_bundle_seal.py --output "$RUNNER_TEMP/ynx-tor-cli-bundle-seal"
          /usr/bin/python3 -B apps/browser/privacy-routing/tor/tests/test_successor_prepare_stages.py "$RUNNER_TEMP/ynx-tor-cli-prepare-stages"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_snowflake_safe_phases.py --synthetic-only --output "$RUNNER_TEMP/ynx-snowflake-safe-phases"
          /usr/bin/python3 apps/browser/scripts/ci-public-egress-guard.py --output "$RUNNER_TEMP/ynx-public-egress-guard"
          /usr/bin/python3 apps/browser/test/test_public_entry_scope.py --output "$RUNNER_TEMP/ynx-public-entry-scope"
