name: Browser platform evidence

on:
  workflow_dispatch:
  push:
    branches: [codex/ecosystem-browser-search]
    paths:
      - "apps/browser/android/**"
      - "apps/browser/ios/**"
      - "apps/browser/native/**"
      - "apps/browser/privacy-routing/**"
      - "apps/browser/windows/**"
      - "apps/browser/scripts/**"
      - "apps/browser/test/**"
      - "apps/browser/package.json"
      - "apps/browser/package-lock.json"
      - "packages/web4-permissions/**"
      - ".github/workflows/browser-platform-evidence.yml"

permissions:
  contents: read

jobs:
  android-install-cold-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36 platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" < <(yes)
      - name: Android policy and packaging regression
        run: |
          mkdir -p "$RUNNER_TEMP/android-instrumentation"
          YNX_ANDROID_POLICY_TEST_OUTPUT="$RUNNER_TEMP/android-policy" bash apps/browser/android/offline-tests/run.sh
          python3 -m unittest discover -s apps/browser/test -p test_android_packaging.py
          python3 apps/browser/android/tests/test-downloads.py --output "$RUNNER_TEMP/android-downloads"
          python3 apps/browser/android/tests/test-downloads.py --suite target-delta --output "$RUNNER_TEMP/android-download-targets"
          node apps/browser/android/instrumentation/tests/dom-evidence-check.cjs
      - name: Build isolated debug QA and real platform instrumentation APKs
        run: |
          mkdir -p "$RUNNER_TEMP/android-instrumentation"
          ANDROID_SDK_ROOT="$ANDROID_HOME" YNX_ANDROID_BUILD_ROOT="$RUNNER_TEMP/browser-android-build" bash apps/browser/scripts/build-android.sh --debug-qa 2>&1 | tee "$RUNNER_TEMP/android-instrumentation/target-build.log"
          python3 apps/browser/scripts/package-android-instrumentation.py --source apps/browser/android/instrumentation --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/android-instrumentation/journey-build" 2>&1 | tee "$RUNNER_TEMP/android-instrumentation/journey-build.log"
          python3 apps/browser/scripts/package-android-instrumentation.py --source apps/browser/android/instrumentation-saf --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/android-instrumentation/saf-build" 2>&1 | tee "$RUNNER_TEMP/android-instrumentation/saf-build.log"
      - name: Enable normal hosted-runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Standard UI, cold restore, HTTPS/search and SAF evidence
        timeout-minutes: 45
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          avd-name: YNX_BROWSER_API_36
          emulator-port: 5554
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          # Action executes script lines in separate shells. Keep the owned journey in one process.
          script: python3 apps/browser/android/instrumentation-host/ci-journey.py --adb "$ANDROID_HOME/platform-tools/adb" --serial "$ANDROID_SERIAL" --output "$RUNNER_TEMP/android-instrumentation/actual-journey" --target-apk "$GITHUB_WORKSPACE/apps/browser/dist/android/YNX-Browser-Debug-QA-Android.apk" --journey-build "$RUNNER_TEMP/android-instrumentation/journey-build" --saf-build "$RUNNER_TEMP/android-instrumentation/saf-build"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ynx-browser-android-debug-qa
          path: |
            apps/browser/dist/android/YNX-Browser-Debug-QA-Android.apk
            apps/browser/dist/android/*.build.json
            apps/browser/android/instrumentation
            apps/browser/android/instrumentation-saf
            apps/browser/android/instrumentation-host
            ${{ runner.temp }}/android-instrumentation
            ${{ runner.temp }}/android-policy
            ${{ runner.temp }}/android-downloads
            ${{ runner.temp }}/android-download-targets
          if-no-files-found: error

  macos-package-cold-launch:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - name: Check Nym diagnostic DATA capture boundaries
        working-directory: apps/browser/privacy-routing/nym/qa-glue
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          /usr/bin/python3 -m unittest test_qa_directory_capture -v
          /usr/bin/python3 -m unittest test_qa_capability_directory_capture -v
          /usr/bin/python3 -m unittest test_epoch_cache_control -v
          /usr/bin/python3 -m unittest test_nym_reply_surb_observer -v
          /usr/bin/python3 -m unittest test_nym_https_head_probe test_nym_https_ddg_probe -v
          /usr/bin/python3 ../tests/test_public_native_supply.py -v
          /usr/bin/python3 -B ../test_directory_http_observation.py -v
      - name: Build, ad-hoc sign and install Testnet Preview
        run: |
          NYM_PHASED_TEST_ROOT="$RUNNER_TEMP" /usr/bin/python3 -IB apps/browser/privacy-routing/nym/directory-progress/test-phased-normal-successor.py
          NYM_PHASED_TEST_ROOT="$RUNNER_TEMP" /usr/bin/python3 -IB apps/browser/test/test_interactive_route_qa_package.py
          npm --prefix apps/browser ci
          node --test apps/browser/privacy-routing/leak-tests/tests/acceptance-kit.test.mjs
          node --test apps/browser/privacy-routing/leak-tests/tests/native-control-bridge.test.mjs apps/browser/privacy-routing/leak-tests/tests/native-fault-cutoff.test.mjs
          node --test apps/browser/privacy-routing/leak-tests/tests/native-recovery-binding.test.mjs
          node --test apps/browser/privacy-routing/leak-tests/tests/native-terminal-binding.test.mjs
          node --test apps/browser/privacy-routing/leak-tests/tests/native-launch-inputs.test.mjs
          node --test apps/browser/privacy-routing/leak-tests/tests/native-inflight-binding.test.mjs
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/acceptance-kit/test-native-inflight.py --output "$RUNNER_TEMP/ynx-native-inflight-swift"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/acceptance-kit/test-native-inflight.py --download-evidence-only --output "$RUNNER_TEMP/ynx-native-download-evidence-swift"
          node --test apps/browser/privacy-routing/leak-tests/tests/matrix-purpose.test.mjs
          node --test apps/browser/privacy-routing/leak-tests/tests/synthetic-udp-boundary.test.mjs
          node --test apps/browser/privacy-routing/leak-tests/tests/matrix-udp-cutoff.test.mjs
          node --test apps/browser/privacy-routing/leak-tests/tests/matrix-tcp-cutoff.test.mjs
          mkdir -m 700 "$RUNNER_TEMP/ynx-loopback-stream-fault"
          node --test apps/browser/privacy-routing/leak-tests/tests/streaming-cutoff-observation.test.mjs
          stream_status=0
          node apps/browser/privacy-routing/leak-tests/streaming-fault-runner.mjs "$RUNNER_TEMP/ynx-loopback-stream-fault" || stream_status=$?
          # 2 means the controlled HTTPS/WSS/download check passed without platform qualification.
          test "$stream_status" -eq 2
          /bin/sh apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/ci-start-gate.sh "$RUNNER_TEMP/ynx-route-start-gate"
          /bin/sh apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/ci-epoch-closure.sh "$RUNNER_TEMP/ynx-route-epoch-closure"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_stop_cancellation.py --output "$RUNNER_TEMP/ynx-owned-stop-cancellation"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_capture_contract.py --output "$RUNNER_TEMP/ynx-gate-capture"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_nym_entry_binding.py --output "$RUNNER_TEMP/ynx-nym-entry-binding"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_nym_entry_binding.py --listener-loss-only --output "$RUNNER_TEMP/ynx-nym-entry-loss"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_nym_entry_binding.py --listener-generation-only --output "$RUNNER_TEMP/ynx-nym-entry-generation"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_nym_entry_binding.py --tor-listener-generation-only --output "$RUNNER_TEMP/ynx-tor-entry-generation"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_nym_entry_binding.py --existing-flow-revoke-only --output "$RUNNER_TEMP/ynx-existing-flow-revoke"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_nym_entry_binding.py --proof-flow-authorization-only --output "$RUNNER_TEMP/ynx-proof-flow-authorization"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test-interactive-route-controller.py --output "$RUNNER_TEMP/ynx-interactive-route-controller"
          /bin/sh apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/ci-output-discard.sh "$RUNNER_TEMP/ynx-route-output-discard"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_synthetic_canary.py --output "$RUNNER_TEMP/ynx-synthetic-canary"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_canary_late_ingress.py --output "$RUNNER_TEMP/ynx-canary-late-ingress"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_host_command_classification.py --output "$RUNNER_TEMP/ynx-filter-host-commands"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_synthetic_provider_fault.py --output "$RUNNER_TEMP/ynx-provider-self-fault"
