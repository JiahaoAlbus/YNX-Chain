          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_synthetic_proof.py --output "$RUNNER_TEMP/ynx-synthetic-proof"
          /usr/bin/python3 apps/browser/privacy-routing/leak-tests/platform-probe/macos-filter/test_normal_proof.py --output "$RUNNER_TEMP/ynx-normal-proof"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_startup_delta.py "$RUNNER_TEMP/ynx-tor-startup-delta"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_worker_ownership.py "$RUNNER_TEMP/ynx-tor-worker-ownership-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_gate_cleanup_consumers.py "$RUNNER_TEMP/ynx-tor-gate-cleanup-consumer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
