          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_stale_transport_poll.py "$RUNNER_TEMP/ynx-tor-disconnect-fence" --disconnect-fence-only
          /usr/bin/python3 -B apps/browser/privacy-routing/tor/tests/test_managed_arti_start_ownership.py "$RUNNER_TEMP/p05-managed-arti-start-ownership"
          /bin/sh apps/browser/privacy-routing/tor/tests/test-production-startup-module.sh "$RUNNER_TEMP/ynx-tor-production-startup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_search_observation_delta.py "$RUNNER_TEMP/ynx-search-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_public_search_diagnostic.py "$RUNNER_TEMP/ynx-public-search-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_public_search_scratch_delta.py "$RUNNER_TEMP/ynx-public-scratch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_public_search_failure_stage.py "$RUNNER_TEMP/ynx-public-failure-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_r2_runtime_trace.py "$RUNNER_TEMP/ynx-tor-r2-trace-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 apps/browser/privacy-routing/tor/tests/test_r2_runtime_trace.py --sealed-target-only "$RUNNER_TEMP/ynx-tor-r2-pt-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
