name: IDE preproof Target guarded normal source
on:
  push:
    branches: [codex/wallet-auth49-ide-get-preproof-target-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ide-get-preproof-target:
    if: github.ref == 'refs/heads/codex/wallet-auth49-ide-get-preproof-target-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - name: Check new preproof custody MODEL and strict declarations only
        shell: bash
        run: node packages/wallet-auth/scripts/ci/ide-finite-get-preproof-target-source.mjs 2>&1 | tee ide-get-preproof-target-controls.log
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wallet-auth49-ide-get-preproof-target-source
          if-no-files-found: error
          path: |
            ide-get-preproof-target-controls.log
            canonical-common-source-package
