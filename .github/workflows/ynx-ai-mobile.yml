name: YNX AI mobile release evidence

on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: 'Existing AI Android preview run ID for installed-only recheck'
        required: false
        type: string
      artifact_name:
        description: 'Exact Android preview artifact name from that run'
        required: false
        type: string
  push:
    branches: [codex/ecosystem-ai]
    paths:
      - "apps/ai/mobile/**"
      - ".github/workflows/ynx-ai-mobile.yml"
  pull_request:
    paths:
      - "apps/ai/mobile/**"
      - ".github/workflows/ynx-ai-mobile.yml"

permissions:
  contents: read
  actions: read

jobs:
  ios-simulator:
    if: ${{ inputs.artifact_run == '' || inputs.artifact_run == null }}
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ai/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/ai/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm test && pnpm run product-check
      - name: Verify installed iOS original file custody
        run: node scripts/installed-ios-originals-check.mjs --output-dir "$RUNNER_TEMP/ynx-ai-installed-originals"
      - name: Verify owning iOS protected native review
        run: node scripts/protected-ios-review-check.mjs --output-dir "$RUNNER_TEMP/ynx-ai-protected-review"
      - name: Read iOS normal native build inputs
        run: pnpm run native-build-inputs --platform ios --output-dir "$RUNNER_TEMP/ynx-ai-ios-inputs"
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Select and boot an available iOS Simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable == true)][0].udid')
          test -n "$UDID" -a "$UDID" != "null"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build unsigned Simulator app
        run: |
          xcodebuild \
            -workspace ios/YNXAI.xcworkspace \
            -scheme YNXAI \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Install, cold launch, restart, and deep-link
        run: |
          APP=ios/build/DerivedData/Build/Products/Release-iphonesimulator/YNXAI.app
          test -d "$APP"
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "$APP"
          xcrun simctl terminate "${{ steps.simulator.outputs.udid }}" com.ynxweb4.ai 2>/dev/null || true
          xcrun simctl launch "${{ steps.simulator.outputs.udid }}" com.ynxweb4.ai
          xcrun simctl terminate "${{ steps.simulator.outputs.udid }}" com.ynxweb4.ai
          xcrun simctl launch "${{ steps.simulator.outputs.udid }}" com.ynxweb4.ai
          xcrun simctl openurl "${{ steps.simulator.outputs.udid }}" "ynxai://wallet-auth/callback?fixture=invalid"
          ditto -c -k --sequesterRsrc --keepParent "$APP" ios/YNXAI-simulator.zip
          shasum -a 256 ios/YNXAI-simulator.zip | tee ios/YNXAI-simulator.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ynx-ai-ios-simulator-${{ github.sha }}
          path: |
            apps/ai/mobile/ios/YNXAI-simulator.zip
            apps/ai/mobile/ios/YNXAI-simulator.sha256
            ${{ runner.temp }}/ynx-ai-ios-inputs/
            ${{ runner.temp }}/ynx-ai-installed-originals/
            ${{ runner.temp }}/ynx-ai-protected-review/
          if-no-files-found: error

  android-preview:
    if: ${{ inputs.artifact_run == '' || inputs.artifact_run == null }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/ai/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/ai/mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm test && pnpm run product-check
      - name: Read Android normal native build inputs
        run: pnpm run native-build-inputs --platform android --output-dir "$RUNNER_TEMP/ynx-ai-android-inputs"
      - name: Generate test-only Android signing key
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,OU=Android,O=Unknown,L=Unknown,ST=Unknown,C=US"
      - name: Build preview APK
        env:
          NODE_ENV: production
        run: cd android && ./gradlew :app:assembleRelease --console=plain
      - name: Verify Android installed application originals
        run: cd android && ./gradlew :app:verifyInstalledApplicationOriginals --console=plain
      - name: Verify manifest, signing class, and hash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android/app-release-signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee android/app-release-badging.txt
          shasum -a 256 "$APK" | tee android/app-release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ynx-ai-android-preview-${{ github.sha }}
          path: |
            apps/ai/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/ai/mobile/android/app-release-signing.txt
            apps/ai/mobile/android/app-release-badging.txt
            apps/ai/mobile/android/app-release.sha256
            apps/ai/mobile/android/app/build/installed-originals-checks-*/
            ${{ runner.temp }}/ynx-ai-android-inputs/
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-ynx-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if test -e /dev/kvm; then test -r /dev/kvm && test -w /dev/kvm; else echo 'KVM unavailable; emulator will use software acceleration'; fi
      - name: Exercise installed task entry without an account
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: python3 apps/ai/mobile/scripts/installed-task-smoke.py apps/ai/mobile/android/app/build/outputs/apk/release/app-release.apk

  android-installed-recheck:
    if: ${{ inputs.artifact_run != '' && inputs.artifact_run != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/ynx-ai-preview
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Verify original APK hash
        shell: bash
        run: |
          mapfile -t apks < <(find "$RUNNER_TEMP/ynx-ai-preview" -type f -name app-release.apk)
          mapfile -t hashes < <(find "$RUNNER_TEMP/ynx-ai-preview" -type f -name app-release.sha256)
          test "${#apks[@]}" -eq 1 && test "${#hashes[@]}" -eq 1
          expected=$(awk '{print $1}' "${hashes[0]}")
          actual=$(sha256sum "${apks[0]}" | awk '{print $1}')
          test "$actual" = "$expected"
          echo "YNX_APK_PATH=${apks[0]}" >> "$GITHUB_ENV"
          echo "APK_SHA256=$actual"
      - name: Prepare emulator acceleration if available
        run: |
          if test -e /dev/kvm; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-ynx-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo 'KVM unavailable; emulator will use software acceleration'
          fi
      - name: Exercise original installed task entry without an account
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 apps/ai/mobile/scripts/installed-task-smoke.py "$YNX_APK_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ynx-ai-android-task-ui-${{ github.run_id }}
          path: ${{ runner.temp }}/ynx-ai-task-ui-last.xml
          if-no-files-found: warn
