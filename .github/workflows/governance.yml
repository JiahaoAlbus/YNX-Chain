name: governance

on:
  push:
    branches: [main, codex/final-governance]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/governance/package-lock.json
      - name: Install governance UI dependencies
        run: npm --prefix apps/governance ci
      - name: Verify governance control plane
        run: bash ./scripts/verify/governance-check.sh
      - name: Exercise four-validator governance Testnet lifecycle
        run: bash ./scripts/verify/governance-testnet-drill.sh
