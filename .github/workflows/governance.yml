name: governance

on:
  push:
    branches: [main, codex/final-governance]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/governance/package-lock.json
      - name: Install governance UI dependencies
        run: npm --prefix apps/governance ci
      - name: Verify governance control plane
        run: bash ./scripts/verify/governance-check.sh
      - name: Exercise four-validator governance Testnet lifecycle
        run: bash ./scripts/verify/governance-testnet-drill.sh
