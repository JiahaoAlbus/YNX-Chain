name: Cloud and Docs iOS Simulator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/cloud/mobile/**"
      - "apps/docs/mobile/**"
      - ".github/workflows/cloud-docs-ios-simulator.yml"

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: cloud
            scheme: YNXCloud
            project: YNXCloud.xcodeproj
          - product: docs
            scheme: YNXDocs
            project: YNXDocs.xcodeproj
    defaults:
      run:
        working-directory: apps/${{ matrix.product }}/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack package managers
        run: corepack enable
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.product }}/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm test && pnpm run i18n-check
      - name: Select a Swift 6.2 or newer Xcode toolchain
        run: |
          selected=""
          for candidate in /Applications/Xcode_*.app; do
            version="$($candidate/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swiftc --version | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p')"
            major="${version%% *}"
            minor="${version##* }"
            if [ -n "$major" ] && { [ "$major" -gt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -ge 2 ]; }; }; then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"
          sudo xcode-select --switch "$selected/Contents/Developer"
          xcodebuild -version
          swiftc --version
        working-directory: .
      - run: pod install --project-directory=ios
      - name: Build unsigned Simulator app
        run: >-
          xcodebuild
          -workspace ios/${{ matrix.scheme }}.xcworkspace
          -scheme ${{ matrix.scheme }}
          -configuration Release
          -sdk iphonesimulator
          -derivedDataPath build/ios-derived
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package evidence
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/ios-derived/Build/Products/Release-iphonesimulator/${{ matrix.scheme }}.app" "build/${{ matrix.scheme }}-simulator.zip"
          shasum -a 256 "build/${{ matrix.scheme }}-simulator.zip" > "build/${{ matrix.scheme }}-simulator.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ynx-${{ matrix.product }}-ios-simulator-${{ github.sha }}
          path: |
            apps/${{ matrix.product }}/mobile/build/${{ matrix.scheme }}-simulator.zip
            apps/${{ matrix.product }}/mobile/build/${{ matrix.scheme }}-simulator.sha256
          if-no-files-found: error
          retention-days: 14
