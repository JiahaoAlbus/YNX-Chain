name: Social named matching Native boundary profile
on:
  push:
    branches: [codex/wallet-auth49-social-native-boundary-ci-20261108]
  workflow_dispatch:
  pull_request:
    paths:
      - packages/wallet-auth/test/fixtures/social-joint-native-matching-profile/**
      - scripts/ci/social-joint-native-boundary*
      - .github/workflows/social-joint-native-boundary.yml
jobs:
  public-matching-social-profile-only:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/wallet-auth49-social-native-boundary-ci-20261108'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/social-joint-native-boundary.mjs 2>&1 | tee social-joint-native-boundary.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: social-joint-native-matching-boundary
          path: |
            social-joint-native-boundary.log
            ${{ runner.temp }}/social-joint-native-boundary-*/**/*.json
            ${{ runner.temp }}/social-joint-native-boundary-*/**/*.stdout
            ${{ runner.temp }}/social-joint-native-boundary-*/**/*.stderr
