{
  "name": "PQ Source703-only continuation",
  "on": {
    "push": {
      "branches": [
        "codex/ynx-pq-source703-continuation-20261101"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read",
    "checks": "read"
  },
  "jobs": {
    "source703-continuation": {
      "if": "github.event_name == 'push' && github.ref == 'refs/heads/codex/ynx-pq-source703-continuation-20261101' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "concurrency": {
        "group": "ynx-source703-continuation-${{ github.ref }}-${{ github.sha }}",
        "cancel-in-progress": false
      },
      "defaults": {
        "run": {
          "working-directory": "${{ github.workspace }}/source703"
        }
      },
      "env": {
        "GOMAXPROCS": "2",
        "GOGC": "50",
        "GOMEMLIMIT": "1536MiB",
        "CGO_ENABLED": "0",
        "GOPROXY": "https://proxy.golang.org",
        "GOSUMDB": "sum.golang.org"
      },
      "steps": [
        {
          "name": "Checkout exact controller",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "controller",
            "fetch-depth": 2,
            "persist-credentials": false
          }
        },
        {
          "name": "Checkout immutable source703 and historical counterexamples",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "7037966eb2ce7a7167f02a09ee1f3bc0eebd1026",
            "path": "source703",
            "fetch-depth": 0,
            "filter": "blob:none",
            "persist-credentials": false
          }
        },
        {
          "name": "Install original pinned Go",
          "uses": "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e",
          "with": {
            "go-version": "1.26.10",
            "check-latest": false,
            "cache": true,
            "cache-dependency-path": "source703/go.sum"
          }
        },
        {
          "name": "Install original pinned Node",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24.19.0",
            "check-latest": false,
            "cache": "npm",
            "cache-dependency-path": "source703/package-lock.json"
          }
        },
        {
          "name": "Verify pure continuation controls",
          "working-directory": "${{ github.workspace }}/controller",
          "run": "python3 -B scripts/verify/test_pq_source703_continuation.py"
        },
        {
          "name": "Validate original cancelled scope and both real Git identities",
          "id": "identity",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -B \"$GITHUB_WORKSPACE/controller/scripts/verify/pq-source703-continuation.py\" preflight",
          "timeout-minutes": 2
        },
        {
          "name": "Generate canonical IDE contract fixture",
          "if": "${{ !cancelled() && steps.identity.outcome == 'success' }}",
          "timeout-minutes": 3,
          "env": {
            "NODE_OPTIONS": "--max-old-space-size=1536"
          },
          "run": "npm ci --ignore-scripts --no-audit --no-fund\nnpm run hardhat:build -- contracts/devtools/SampleEVMWriteCounter.sol contracts/tokens/SampleYNXTCompatibleERC20.sol\nnpm run contracts:selectors\ngit diff --exit-code -- artifacts\ntest -s artifacts/contracts/devtools/SampleEVMWriteCounter.sol/SampleEVMWriteCounter.json\ntest -s artifacts/contracts/tokens/SampleYNXTCompatibleERC20.sol/SampleYNXTCompatibleERC20.json\nsha256sum contracts/devtools/SampleEVMWriteCounter.sol artifacts/contracts/devtools/SampleEVMWriteCounter.sol/SampleEVMWriteCounter.json artifacts/ynx-selector-metadata.json\nsha256sum contracts/tokens/SampleYNXTCompatibleERC20.sol artifacts/contracts/tokens/SampleYNXTCompatibleERC20.sol/SampleYNXTCompatibleERC20.json\n",
          "id": "materials"
        },
        {
          "name": "Verify Whole BFT gateway and native container readback",
          "id": "pqgateway",
          "if": "${{ !cancelled() && steps.identity.outcome == 'success' }}",
          "env": {
            "YNX_PQ_STAKING_ORIGINALS_FIXTURE_OUT": "${{ runner.temp }}/ynx-pq-staking-originals-public-interop.json",
            "YNX_PQ_CONTRACT_DEPLOY_FIXTURE_OUT": "${{ runner.temp }}/ynx-pq-contract-deploy-public-interop.json"
          },
          "run": "go test -p 1 -count=1 -timeout=180s ./internal/bftgateway ./cmd/ynx-bft-gatewayd\ntest -s \"$YNX_PQ_CONTRACT_DEPLOY_FIXTURE_OUT\"\nsha256sum \"$YNX_PQ_CONTRACT_DEPLOY_FIXTURE_OUT\"\n"
        },
        {
          "name": "Verify existing Chain readback and recovery after protocol integration",
          "if": "${{ !cancelled() && steps.identity.outcome == 'success' }}",
          "run": "go test -p 1 -count=1 -timeout=180s ./internal/mutationfreeze ./internal/indexer ./internal/explorer ./internal/faucet ./cmd/ynx-indexerd",
          "id": "tail49"
        },
        {
          "name": "Verify existing Chain SDK after protocol integration",
          "if": "${{ !cancelled() && steps.identity.outcome == 'success' }}",
          "run": "node --test sdk/js/index.test.mjs",
          "id": "tail50"
        },
        {
          "name": "Emit application-backed public Wallet HTTP fixture",
          "id": "walletfixture",
          "if": "${{ !cancelled() && steps.identity.outcome == 'success' }}",
          "env": {
            "YNX_PQ_WALLET_FIXTURE_OUT": "${{ runner.temp }}/ynx-pq-wallet-public-http-fixture.json"
          },
          "run": "go test -p 1 -count=1 -timeout=90s -run '^TestGatewayPQWalletPublicHTTPFixture$' ./internal/bftgateway\ntest -s \"$YNX_PQ_WALLET_FIXTURE_OUT\"\nsha256sum \"$YNX_PQ_WALLET_FIXTURE_OUT\"\n"
        },
        {
          "name": "Verify shared Wallet policy and Chain payment authorization regressions",
          "if": "${{ !cancelled() && steps.identity.outcome == 'success' }}",
          "run": "go test -p 1 -count=1 -timeout=90s -run '^(TestClassicSession.*|TestAccountPolicyConfigRequiresExplicitExactOriginAndNetwork|TestBFTPaySerializesNonceAndReturnsZeroFeeIdempotentReplay|TestBFTPayRejectsInconsistentCommittedResponse|TestMerchantBindingRejectsForeignIntentAndInvoiceWithoutEffects|TestMerchantBindingRejectsMissingUntrustedOrUnavailableOriginal)$' ./internal/appgateway ./internal/paygateway",
          "id": "tail53"
        },
        {
          "name": "Reproduce private verifier process-exit telemetry counterexample",
          "if": "${{ !cancelled() && steps.identity.outcome == 'success' }}",
          "run": "if bash scripts/verify/reuse-pq-history-counterexamples.sh; then\n  exit 0\nfi\nYNX_EXIT_CASE=\"$RUNNER_TEMP/ynx-pq-private-exit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"\numask 077\nmkdir \"$YNX_EXIT_CASE\"\ncp scripts/ops/validate-private-consensus-copy.py \"$YNX_EXIT_CASE/fixed-wrapper.py\"\ntrap 'cp \"$YNX_EXIT_CASE/fixed-wrapper.py\" scripts/ops/validate-private-consensus-copy.py' EXIT\ngit show 30230a9ab1f691e30fb590d89cb465bf5c1e1a30:scripts/ops/validate-private-consensus-copy.py > \"$YNX_EXIT_CASE/original-wrapper.py\"\ncp \"$YNX_EXIT_CASE/original-wrapper.py\" scripts/ops/validate-private-consensus-copy.py\nset +e\n(cd scripts/ops && python3 -B -m unittest test_validate_private_consensus_copy.PrivateCopyControls.test_exit_mm_race_requires_final_same_identity_zombie -v) > \"$YNX_EXIT_CASE/original-red.log\" 2>&1\nYNX_EXIT_RED_STATUS=$?\nset -e\ncp \"$YNX_EXIT_CASE/fixed-wrapper.py\" scripts/ops/validate-private-consensus-copy.py\ntrap - EXIT\ncat \"$YNX_EXIT_CASE/original-red.log\"\ntest \"$YNX_EXIT_RED_STATUS\" -ne 0\ngrep -F 'PRIVATE_COPY_EXIT_MM_TRANSITION_REJECTED' \"$YNX_EXIT_CASE/original-red.log\"\ntrap 'cp \"$YNX_EXIT_CASE/fixed-wrapper.py\" scripts/ops/validate-private-consensus-copy.py' EXIT\ngit show 1ace731419fbe9f8af57dee3335cf660409f9ca3:scripts/ops/validate-private-consensus-copy.py > \"$YNX_EXIT_CASE/original-diagnostic-wrapper.py\"\ncp \"$YNX_EXIT_CASE/original-diagnostic-wrapper.py\" scripts/ops/validate-private-consensus-copy.py\nset +e\n(cd scripts/ops && python3 -B -m unittest test_validate_private_consensus_copy.PrivateCopyControls.test_live_rss_failure_retains_errno_flags_without_retiring_task -v) > \"$YNX_EXIT_CASE/original-diagnostic-red.log\" 2>&1\nYNX_DIAGNOSTIC_RED_STATUS=$?\nset -e\ncp \"$YNX_EXIT_CASE/fixed-wrapper.py\" scripts/ops/validate-private-consensus-copy.py\ntrap - EXIT\ncat \"$YNX_EXIT_CASE/original-diagnostic-red.log\"\ntest \"$YNX_DIAGNOSTIC_RED_STATUS\" -ne 0\ngrep -F 'PRIVATE_COPY_RSS_DIAGNOSTIC_MISSING' \"$YNX_EXIT_CASE/original-diagnostic-red.log\"\n",
          "id": "tail54"
        },
        {
          "name": "Verify operator checkpoint format and original read-lock admission",
          "if": "${{ !cancelled() && steps.identity.outcome == 'success' }}",
          "run": "set -euo pipefail\numask 077\nexport LC_ALL=C\nynx_launch=scripts/ops/ynx-consensus-pq-remote-signer-launch.sh\nbash -n \"$ynx_launch\"\njq -e '.schema == \"ynx-pq-remote-service-v1\" and .checkpointFormat == \"@EXPLICIT_CHECKPOINT_FORMAT@\" and .abciState == \"@EXISTING_ORIGINAL_COMMITTED_STATE_FILE@\"' scripts/ops/ynx-consensus-pq-remote-signer.conf.in >/dev/null\nfail() { printf '%s\\n' \"checkpoint control refused: $1\" >&2; exit 78; }\n# Extract the actual production admission functions, never execute\n# the launcher's top-level identity/credential/service operations.\nfor ynx_name in canonical_path trusted_parents regular_file private_file checkpoint_source; do\n  ynx_body=$(sed -n \"/^${ynx_name}() {$/,/^}$/p\" \"$ynx_launch\")\n  [[ -n $ynx_body ]] || fail \"missing production function: $ynx_name\"\n  eval \"$ynx_body\"\n  declare -F \"$ynx_name\" >/dev/null || fail 'production function not loaded'\ndone\nynx_fixture=$(mktemp -d \"$GITHUB_WORKSPACE/.ynx-checkpoint-control.XXXXXX\")\nchmod 700 \"$ynx_fixture\"\ntrap 'rm -rf -- \"$ynx_fixture\"' EXIT\n# Only mount observation is a fixture stub; real path, UID, mode,\n# link and prefix checks remain the production implementation.\nreadonly_mount() {\n  [[ $1 == \"$ynx_fixture/\"* ]] || fail 'unexpected fixture mount path'\n  [[ $1 != \"${ynx_non_ro:-}\" ]] || fail 'source or credential mount is not read-only'\n}\nynx_inventory() {\n  (cd \"$ynx_fixture\"; find . -type f -exec sha256sum -- {} +; find . -printf '%P|%y|%m|%l\\n') | sort\n}\nynx_cases=0\nynx_expect() {\n  local path=$1 format=$2 wanted=$3 reason=$4 before output rc=0\n  before=$(ynx_inventory)\n  output=$(checkpoint_source \"$path\" \"$format\" 2>&1) || rc=$?\n  if [[ $rc != \"$wanted\" || $output != *\"$reason\"* ]]; then\n    printf 'Unexpected result: format=%s rc=%s wanted=%s\\n%s\\n' \"$format\" \"$rc\" \"$wanted\" \"$output\" >&2\n    fail 'wrong outcome or rejection cause'\n  fi\n  [[ $(ynx_inventory) == \"$before\" ]] || fail 'admission changed fixture bytes or metadata'\n  ynx_cases=$((ynx_cases + 1))\n}\nynx_formats=(atomic-committed-json-v1 snapshot-journal-v1 block-journal-v2)\nynx_magics=('{' $'YNX_ABCI_SNAPSHOT_JOURNAL_V1\\n' $'YNX_ABCI_BLOCK_JOURNAL_V2\\n')\nfor ynx_i in 0 1 2; do\n  ynx_dir=\"$ynx_fixture/$ynx_i\"\n  mkdir -m 700 \"$ynx_dir\"\n  printf '%s' \"${ynx_magics[$ynx_i]}\" > \"$ynx_dir/state\"\n  chmod 600 \"$ynx_dir/state\"\n  if [[ $ynx_i != 0 ]]; then\n    : > \"$ynx_dir/state.read.lock\"\n    chmod 600 \"$ynx_dir/state.read.lock\"\n  fi\n  ynx_expect \"$ynx_dir/state\" \"${ynx_formats[$ynx_i]}\" 0 ''\ndone\n# The atomic positive needed no lock. Add one only for wrong-format\n# cases, so they reach prefix rejection rather than missing-lock refusal.\n: > \"$ynx_fixture/0/state.read.lock\"\nchmod 600 \"$ynx_fixture/0/state.read.lock\"\nfor ynx_i in 0 1 2; do\n  for ynx_j in 0 1 2; do\n    [[ $ynx_i != \"$ynx_j\" ]] || continue\n    ynx_expect \"$ynx_fixture/$ynx_i/state\" \"${ynx_formats[$ynx_j]}\" 78 'original committed source does not match the configured checkpoint format'\n  done\ndone\nynx_expect \"$ynx_fixture/0/state\" auto 78 'unsupported committed checkpoint format'\nfor ynx_i in 1 2; do\n  ynx_dir=\"$ynx_fixture/$ynx_i\"\n  ynx_state=\"$ynx_dir/state\"\n  ynx_lock=\"$ynx_state.read.lock\"\n  ynx_format=${ynx_formats[$ynx_i]}\n  printf '%s' \"${ynx_magics[$ynx_i]%$'\\n'}\" > \"$ynx_state\"\n  ynx_expect \"$ynx_state\" \"$ynx_format\" 78 'original committed source does not match the configured checkpoint format'\n  printf '%s' \"${ynx_magics[$ynx_i]}\" > \"$ynx_state\"\n  rm -- \"$ynx_lock\"\n  ynx_expect \"$ynx_state\" \"$ynx_format\" 78 'missing path or symlink component'\n  : > \"$ynx_dir/lock-target\"\n  chmod 600 \"$ynx_dir/lock-target\"\n  ln -s \"$ynx_dir/lock-target\" \"$ynx_lock\"\n  ynx_expect \"$ynx_state\" \"$ynx_format\" 78 'noncanonical or unsupported path'\n  rm -- \"$ynx_lock\"\n  : > \"$ynx_lock\"\n  chmod 644 \"$ynx_lock\"\n  ynx_expect \"$ynx_state\" \"$ynx_format\" 78 'original private file must be owned by service UID with mode 0600'\n  chmod 600 \"$ynx_lock\"\n  ynx_non_ro=$ynx_state\n  ynx_expect \"$ynx_state\" \"$ynx_format\" 78 'source or credential mount is not read-only'\n  ynx_non_ro=$ynx_lock\n  ynx_expect \"$ynx_state\" \"$ynx_format\" 78 'source or credential mount is not read-only'\n  unset ynx_non_ro\ndone\n[[ $ynx_cases == 22 ]] || fail 'unexpected control count'\nprintf 'YNX_REMOTE_CHECKPOINT_OPERATOR_CONTROLS_PASS %s\\n' \"$ynx_cases\"\n",
          "id": "tail55"
        },
        {
          "name": "Seal actual seven continuation outcomes and retain original cancellation",
          "if": "${{ always() && steps.identity.outcome == 'success' }}",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -B \"$GITHUB_WORKSPACE/controller/scripts/verify/pq-source703-continuation.py\" seal",
          "timeout-minutes": 2
        },
        {
          "name": "Upload only fixed public continuation qualification",
          "if": "${{ always() && steps.identity.outcome == 'success' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "ynx-source703-continuation-${{ github.sha }}-${{ github.run_id }}",
            "path": "${{ runner.temp }}/ynx-source703-continuation-public/*.json",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
