name: Original four-process PQ functional path

on:
  push:
    branches:
      - codex/ynx-pq-normal-process-20261031
      - codex/ynx-pq-current75-baseline-20261101
  workflow_dispatch:
    inputs:
      load_profile:
        description: C06 diagnostic ready/timings profile; fixed source-only joint qualification; no pure-cache A/B claim
        type: choice
        default: functional
        options: [functional, currentc06-online-100x5-commitstages]
      signing_mode:
        description: Fresh independent functional window; never replay original UNKNOWN
        type: choice
        default: both
        options:
          - both
          - online
          - pre-signed

permissions:
  contents: read
  actions: read

concurrency:
  group: pq-normal-process-${{ github.ref }}
  cancel-in-progress: false

jobs:
  functional:
    if: github.ref != 'refs/heads/codex/ynx-pq-current75-baseline-20261101' && (github.event_name != 'workflow_dispatch' || inputs.load_profile != 'currentc06-online-100x5-commitstages')
    name: Normal original PQ processes (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        mode: [online, pre-signed]
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1024MiB
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
      SIGNING_MODE: ${{ matrix.mode }}
      REQUESTED_MODE: ${{ inputs.signing_mode || 'both' }}
    steps:
      - name: Receive the exact original source and required helper ancestor
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
          filter: blob:none
          persist-credentials: false
      - name: Install the pinned normal owner toolchain without shared caches
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache: false
      - name: Execute all original callee controls including Linux private FD inheritance
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor a78803d31632a461df7f012e2c13e46f17c48e6d HEAD
          python3 -B - <<'PY'
          import unittest
          for pattern, count in [('test_pq_normal_process_lab.py', 9), ('test_consensus_linux_cohort.py', 8)]:
              suite = unittest.defaultTestLoader.discover('scripts/loadtest', pattern=pattern)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if result.testsRun != count or result.skipped or not result.wasSuccessful():
                  raise SystemExit('all original controls must actually execute and pass on Linux: ' + pattern)
          PY
      - name: Execute one newly admitted original four-process functional window
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        run: |
          set -euo pipefail
          python3 -B scripts/loadtest/pq-normal-process-lab.py \
            --source "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" \
            --mode "$SIGNING_MODE" --execute
      - name: Retain only original public results and first failure
        if: always() && (env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pq-normal-process-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pq-normal-process-*/public/
          if-no-files-found: warn
          retention-days: 14

  currentc06-independent-readytimings:
    name: C06 diagnostic normal DATA-ready online 100 offered TPS with all 500 requests
    if: github.ref == 'refs/heads/codex/ynx-pq-current75-baseline-20261101' && github.run_attempt == 1 && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.load_profile == 'currentc06-online-100x5-commitstages'))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1024MiB
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Receive only this fixed profile controller and its pure controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/pq-normal-process.yml
            /scripts/loadtest/pq-current75-baseline-ci.py
            /scripts/loadtest/test_pq_current75_baseline_ci.py
      - name: Validate only the new fixed-profile source qualification and invocation controls
        run: python3 -I -B controller/scripts/loadtest/test_pq_current75_baseline_ci.py -v
      - name: Receive the exact joint-qualified sourcec06 Go graph and original helper ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c06b4607247a1fdf7e485337ab03206984baa71c
          path: source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/resource-market-ci.yml
            /go.mod
            /go.sum
            /cmd/
            /internal/
            /pkg/
            /third_party/cometbft/
            /scripts/ops/validate-pq-remote-normal-ci.py
            /scripts/loadtest/pq-source-artifact-intake.py
      - name: Receive the exact existing independent-load driver without modifying its methods
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 36d937f45fa9a144aa0d7520633a5654755b454c
          path: tools
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/loadtest/
      - name: Validate new c06 finite receiver and original owned store metadata
        run: |
          set -euo pipefail
          test "$(git -C tools rev-parse HEAD)" = "36d937f45fa9a144aa0d7520633a5654755b454c"
          python3 -I -B tools/scripts/loadtest/test_pq_c06_source_qualification.py -v
          python3 -I -B tools/scripts/loadtest/test_pq_owned_storage_window.py -v
          python3 -I -B tools/scripts/loadtest/test_pq_commit_observation.py CommitObservationDeclaredControls.test_c06_original_output_ceiling_rejects_oversize_before_parse_or_copy CommitObservationDeclaredControls.test_old703_and_unqualified_source_refused_before_source_check_or_start -v
          echo 'Completed proof/Commit/header controls reused; no39/41/old8 groups rerun; actual500 outcomes remain required'
      - name: Install the original pinned normal toolchain without shared build caches
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify finite sourcec06 joint qualification DATA then execute the sole original bounded load window
        id: load
        env:
          GH_TOKEN: ${{ github.token }}
          PQ_BASELINE_PROFILE: currentc06-online-100x5-commitstages
        run: |
          python3 -I -B controller/scripts/loadtest/pq-current75-baseline-ci.py \
            --source "$GITHUB_WORKSPACE/source" --tools "$GITHUB_WORKSPACE/tools" --execute
      - name: Preserve only public original receipts proofs and full-demand partial outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pq-currentc06-online-100x5-commitstages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pq-currentc06-source-qualification-*.json
            ${{ runner.temp }}/pq-independent-load-*/public/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
