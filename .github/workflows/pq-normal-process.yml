name: Original four-process PQ functional path

on:
  push:
    branches:
      - codex/ynx-pq-normal-process-20261031
      - codex/ynx-pq-current75-baseline-20261101
  workflow_dispatch:
    inputs:
      load_profile:
        description: Exact own1b fresh504 initialization then first100 online100x5; separate fresh Root window required
        type: choice
        default: functional
        options: [functional, first100-own1b-initialize-before-load]
      signing_mode:
        description: Fresh independent functional window; never replay original UNKNOWN
        type: choice
        default: both
        options:
          - both
          - online
          - pre-signed

permissions:
  contents: read
  actions: read

concurrency:
  group: pq-normal-process-${{ github.ref }}
  cancel-in-progress: false

jobs:
  functional:
    if: github.ref != 'refs/heads/codex/ynx-pq-current75-baseline-20261101' && (github.event_name != 'workflow_dispatch' || inputs.load_profile != 'first100-own1b-initialize-before-load')
    name: Normal original PQ processes (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        mode: [online, pre-signed]
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1024MiB
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
      SIGNING_MODE: ${{ matrix.mode }}
      REQUESTED_MODE: ${{ inputs.signing_mode || 'both' }}
    steps:
      - name: Receive the exact original source and required helper ancestor
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
          filter: blob:none
          persist-credentials: false
      - name: Install the pinned normal owner toolchain without shared caches
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache: false
      - name: Execute all original callee controls including Linux private FD inheritance
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor a78803d31632a461df7f012e2c13e46f17c48e6d HEAD
          python3 -B - <<'PY'
          import unittest
          for pattern, count in [('test_pq_normal_process_lab.py', 9), ('test_consensus_linux_cohort.py', 8)]:
              suite = unittest.defaultTestLoader.discover('scripts/loadtest', pattern=pattern)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if result.testsRun != count or result.skipped or not result.wasSuccessful():
                  raise SystemExit('all original controls must actually execute and pass on Linux: ' + pattern)
          PY
      - name: Execute one newly admitted original four-process functional window
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        run: |
          set -euo pipefail
          python3 -B scripts/loadtest/pq-normal-process-lab.py \
            --source "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" \
            --mode "$SIGNING_MODE" --execute
      - name: Retain only original public results and first failure
        if: always() && (env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pq-normal-process-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pq-normal-process-*/public/
          if-no-files-found: warn
          retention-days: 14

  first100-controller-controls:
    name: Fixed first100 controller pure guards only
    if: github.ref == 'refs/heads/codex/ynx-pq-current75-baseline-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Receive only this fixed profile controller and its pure controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/pq-normal-process.yml
            /scripts/loadtest/pq-current75-baseline-ci.py
            /scripts/loadtest/test_pq_current75_baseline_ci.py
            /scripts/loadtest/pq-hosted-initialization-space-ci.py
            /scripts/loadtest/test_pq_hosted_initialization_space_ci.py
      - name: Receive exact measured normal initializer and original lifecycle guards
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 67870e2be35295fb903e4d6f1723092e2facef7f
          path: tools
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/loadtest/
      - name: Validate only the new fixed-profile source qualification and invocation controls
        run: |
          python3 -I -B - <<'PYCONTROLLER'
          import importlib.util, unittest
          from pathlib import Path
          path=Path('controller/scripts/loadtest/test_pq_current75_baseline_ci.py')
          spec=importlib.util.spec_from_file_location('fixed_first100_controls',path)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
          if result.testsRun!=14 or result.skipped or not result.wasSuccessful():
              raise SystemExit('all14 first100 pure controls must execute and pass')
          PYCONTROLLER
      - name: Verify fixed hosted initialization space preparation controls
        run: |
          python3 -I -B - <<'PYSPACE'
          import importlib.util, unittest
          from pathlib import Path
          path=Path('controller/scripts/loadtest/test_pq_hosted_initialization_space_ci.py')
          spec=importlib.util.spec_from_file_location('fixed_hosted_space_controls',path)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          suite=unittest.defaultTestLoader.loadTestsFromModule(module)
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun!=30 or result.skipped or not result.wasSuccessful():
              raise SystemExit('all30 hosted space pure controls must execute and pass')
          PYSPACE
      - name: Execute all284 pinned pure controls and original Linux RSS lifecycle
        run: |
          python3 -I -B - <<'PYPINS'
          import importlib.util
          from pathlib import Path
          path=Path('controller/scripts/loadtest/pq-current75-baseline-ci.py')
          spec=importlib.util.spec_from_file_location('first100_controller',path)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          module.verify_tools(Path('tools').resolve(strict=True))
          PYPINS
          python3 -B tools/scripts/loadtest/pq-staged-harness-controls.py --run
          python3 -B - <<'PYCONTROLS'
          import unittest
          for pattern,count in [('test_consensus_linux_cohort.py',8),('test_linux_owned_rss.py',16),('test_linux_thread_group_exit.py',6),('test_window_failure_cleanup.py',3)]:
              suite=unittest.defaultTestLoader.discover('tools/scripts/loadtest',pattern=pattern)
              result=unittest.TextTestRunner(verbosity=2).run(suite)
              if result.testsRun!=count or result.skipped or not result.wasSuccessful():raise SystemExit('all original actual Linux controls required: '+pattern)
          PYCONTROLS

  first100-own1b-initialize-before-load:
    name: Own1b normal504 initialization then first100 online100x5
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ynx-pq-current75-baseline-20261101' && github.run_attempt == 1 && inputs.load_profile == 'first100-own1b-initialize-before-load' && inputs.signing_mode == 'online'
    needs: first100-controller-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1024MiB
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Receive only this fixed profile controller and its pure controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/pq-normal-process.yml
            /scripts/loadtest/pq-current75-baseline-ci.py
            /scripts/loadtest/test_pq_current75_baseline_ci.py
            /scripts/loadtest/pq-hosted-initialization-space-ci.py
            /scripts/loadtest/test_pq_hosted_initialization_space_ci.py
      - name: Receive exact own1b qualified source graph for initialization and first100
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1b0ea548aca6b5260a9824d0edd3012d52e53521
          path: source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/resource-market-ci.yml
            /go.mod
            /go.sum
            /cmd/
            /internal/
            /pkg/
            /third_party/cometbft/
            /scripts/ops/validate-pq-remote-normal-ci.py
            /scripts/loadtest/pq-source-artifact-intake.py
      - name: Receive exact measured normal initializer and original lifecycle guards
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 67870e2be35295fb903e4d6f1723092e2facef7f
          path: tools
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/loadtest/
      - name: Install the original pinned normal toolchain without shared build caches
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare only explicitly authorized unused Android space on hosted VM
        env:
          PQ_BASELINE_PROFILE: first100-own1b-initialize-before-load
          PQ_HOSTED_SPACE_PREPARATION: remove-unused-android-for-first100-own1b-v1
        run: python3 -I -B controller/scripts/loadtest/pq-hosted-initialization-space-ci.py --execute
      - name: Execute sole same-window normal504 initialization then first100 and cleanup
        id: first100
        env:
          PQ_BASELINE_PROFILE: first100-own1b-initialize-before-load
        run: |
          python3 -I -B controller/scripts/loadtest/pq-current75-baseline-ci.py \
            --source "$GITHUB_WORKSPACE/source" --tools "$GITHUB_WORKSPACE/tools" --execute
      - name: Preserve original preparation census first100 readback resources and first failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pq-first100-own1b-initialize-before-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pq-first100-own1b-source-functional-*.json
            ${{ runner.temp }}/pq-independent-load-*/public/
            ${{ runner.temp }}/pq-hosted-initialization-space-${{ github.run_id }}-1/BEFORE.json
            ${{ runner.temp }}/pq-hosted-initialization-space-${{ github.run_id }}-1/INTENT.json
            ${{ runner.temp }}/pq-hosted-initialization-space-${{ github.run_id }}-1/AFTER.json
            ${{ runner.temp }}/pq-hosted-initialization-space-${{ github.run_id }}-1/RESULT.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
