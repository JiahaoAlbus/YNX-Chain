name: Original four-process PQ functional path

on:
  push:
    branches:
      - codex/ynx-pq-normal-process-20261031
      - codex/ynx-pq-current75-baseline-20261101
  workflow_dispatch:
    inputs:
      load_profile:
        description: Exact normal finite online live wire and TCP baseline; no business pressure
        type: choice
        default: functional
        options: [functional, normal-live-d903-finite]
      signing_mode:
        description: Fresh independent functional window; never replay original UNKNOWN
        type: choice
        default: both
        options:
          - both
          - online
          - pre-signed

permissions:
  contents: read
  actions: read

concurrency:
  group: pq-normal-process-${{ github.ref }}
  cancel-in-progress: false

jobs:
  functional:
    if: github.ref != 'refs/heads/codex/ynx-pq-current75-baseline-20261101' && (github.event_name != 'workflow_dispatch' || inputs.load_profile != 'normal-live-d903-finite')
    name: Normal original PQ processes (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        mode: [online, pre-signed]
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1024MiB
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
      SIGNING_MODE: ${{ matrix.mode }}
      REQUESTED_MODE: ${{ inputs.signing_mode || 'both' }}
    steps:
      - name: Receive the exact original source and required helper ancestor
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
          filter: blob:none
          persist-credentials: false
      - name: Install the pinned normal owner toolchain without shared caches
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache: false
      - name: Execute all original callee controls including Linux private FD inheritance
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor a78803d31632a461df7f012e2c13e46f17c48e6d HEAD
          python3 -B - <<'PY'
          import unittest
          for pattern, count in [('test_pq_normal_process_lab.py', 9), ('test_consensus_linux_cohort.py', 8)]:
              suite = unittest.defaultTestLoader.discover('scripts/loadtest', pattern=pattern)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if result.testsRun != count or result.skipped or not result.wasSuccessful():
                  raise SystemExit('all original controls must actually execute and pass on Linux: ' + pattern)
          PY
      - name: Execute one newly admitted original four-process functional window
        if: env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode
        run: |
          set -euo pipefail
          python3 -B scripts/loadtest/pq-normal-process-lab.py \
            --source "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" \
            --mode "$SIGNING_MODE" --execute
      - name: Retain only original public results and first failure
        if: always() && (env.REQUESTED_MODE == 'both' || env.REQUESTED_MODE == matrix.mode)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pq-normal-process-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pq-normal-process-*/public/
          if-no-files-found: warn
          retention-days: 14

  normal-live-d903-finite:
    name: Normal live wire and endpoint TCP finite baseline - no pressure
    if: github.ref == 'refs/heads/codex/ynx-pq-current75-baseline-20261101' && github.run_attempt == 1 && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.load_profile == 'normal-live-d903-finite'))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1024MiB
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Receive exact sole controller and pure invocation controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/pq-normal-process.yml
            /scripts/loadtest/pq-current75-baseline-ci.py
            /scripts/loadtest/test_pq_current75_baseline_ci.py
      - name: Verify exact finite live profile invocation guards
        run: python3 -I -B controller/scripts/loadtest/test_pq_current75_baseline_ci.py -v
      - name: Receive fixed original normal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d9038b9292f9c28d38decb9717282e50febffdb1
          path: source
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /go.mod
            /go.sum
            /cmd/
            /internal/
            /pkg/
            /contracts/
            /third_party/cometbft/
            /scripts/verify/wire-live-matching-source-ci.py
            /scripts/loadtest/pq-source-artifact-intake.py
      - name: Receive and verify only the independently pinned matching supplier object
        run: |
          git -C source fetch --no-tags --depth=1 origin 54b104fb1cdf3d7d2e89e3bc40eafc6d61f8f076
          test "$(git -C source rev-parse HEAD)" = "d9038b9292f9c28d38decb9717282e50febffdb1"
          test "$(git -C source rev-parse 54b104fb1cdf3d7d2e89e3bc40eafc6d61f8f076:third_party/cometbft)" = "b1e9a83ab11ed141fda90bc47521faa412176caa"
          test -z "$(git -C source status --porcelain)"
      - name: Receive fixed original supervisor and live consumer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 542ff46f54dd68ab702d48326ad91cc30eb6ead5
          path: tools
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/loadtest/
      - name: Install pinned original normal toolchain without shared caches
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache: false
      - name: Execute one original online four-node finite live baseline and cleanup
        env:
          PQ_BASELINE_PROFILE: normal-live-d903-finite
        run: |
          python3 -I -B controller/scripts/loadtest/pq-current75-baseline-ci.py --source "$GITHUB_WORKSPACE/source" --tools "$GITHUB_WORKSPACE/tools" --execute
      - name: Preserve original raw live observations endpoint counters business proof and first failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pq-normal-live-d903-finite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pq-normal-process-*/public/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
