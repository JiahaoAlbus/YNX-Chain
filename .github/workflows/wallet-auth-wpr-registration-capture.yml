name: Wallet Auth WPR original registration capture delta
on:
  workflow_dispatch:
  push:
    branches: [codex/wallet-auth49-wpr-registration-capture-20261107]
  pull_request:
    paths:
      - packages/wallet-auth/native/original-auth-source-v2-dispatch*
      - packages/wallet-auth/native/original-wallet-product-registration-capture*
      - packages/wallet-auth/test/wpr-native-registration-capture*
      - packages/wallet-auth/scripts/ci/wpr-native-registration-capture.mjs
      - .github/workflows/wallet-auth-wpr-registration-capture.yml
permissions:
  contents: read
jobs:
  wpr-registered-raw-capture-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - run: node packages/wallet-auth/scripts/ci/wpr-native-registration-capture.mjs
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wpr-original-registration-capture-source-data
          if-no-files-found: error
          path: |
            WPR_NATIVE_REGISTRATION_CAPTURE_DATA
            canonical-common-source-package
