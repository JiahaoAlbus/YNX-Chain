name: Desktop Grant LINK wrapper normal source consumer
on:
  push:
    branches: [codex/wallet-auth49-link-wrapper-normal-20261108]
  pull_request:
    paths:
      - packages/wallet-auth/scripts/native/desktop-grant-link-normal-inputs.mjs
      - packages/wallet-auth/scripts/manifests/desktop-grant*json
      - packages/wallet-auth/integration/DESKTOP_GRANT_STRONG_LINK_COHORT.json
      - packages/wallet-auth/test/desktop-grant-link-wrapper-normal.test.mjs
      - packages/wallet-auth/test/fixtures/desktop-grant-link-wrapper-normal/**
      - scripts/ci/desktop-grant-link-wrapper*js
      - .github/workflows/desktop-grant-link-wrapper-normal.yml
  workflow_dispatch:
jobs:
  normal-source-only:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/wallet-auth49-link-wrapper-normal-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/desktop-grant-link-wrapper-normal.mjs 2>&1 | tee desktop-grant-link-wrapper-normal.log
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - run: node scripts/ci/desktop-grant-link-wrapper-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-grant-link-wrapper-normal
          path: |
            desktop-grant-link-wrapper-normal.log
            ${{ runner.temp }}/desktop-link-wrapper-*/**
            canonical-common-source-package
