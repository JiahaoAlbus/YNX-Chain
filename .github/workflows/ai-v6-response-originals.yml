name: AI V6 response originals DATA
on:
  push:
    branches: [codex/wallet-auth49-ai-v6-response-originals-20261107]
    paths:
      - packages/wallet-auth/native/ai-v6-response-originals/**
      - packages/wallet-auth/test/ai-v6-response-originals/**
      - packages/wallet-auth/scripts/ci/ai-v6-response-originals.py
      - .github/workflows/ai-v6-response-originals.yml
permissions:
  contents: read
jobs:
  response-originals-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: python3 packages/wallet-auth/scripts/ci/ai-v6-response-originals.py
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wallet-auth49-ai-v6-response-originals-source
          path: canonical-common-source-package
          if-no-files-found: error
