name: chain-core

on:
  push:
    branches:
      - codex/final-chain-core
      - codex/chain-batch-v01-performance
    paths:
      - ".github/workflows/chain-core.yml"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "docs/architecture/STREAMBFT_CANDIDATE.md"
      - "docs/formal/streambft/**"
      - "docs/integration/**"
      - "release/**"
      - "scripts/validate/**"
      - "scripts/loadtest/**"
      - "scripts/contracts/**"
      - "scripts/verify/integration-contract-check.mjs"
      - "scripts/verify/chain-core-release-check.mjs"
      - "scripts/verify/streambft-candidate-check.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/chain-core.yml"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "docs/architecture/STREAMBFT_CANDIDATE.md"
      - "docs/formal/streambft/**"
      - "docs/integration/**"
      - "release/**"
      - "scripts/validate/**"
      - "scripts/loadtest/**"
      - "scripts/contracts/**"
      - "scripts/verify/integration-contract-check.mjs"
      - "scripts/verify/chain-core-release-check.mjs"
      - "scripts/verify/streambft-candidate-check.sh"
  workflow_dispatch:
    inputs:
      synthetic_pair_rss:
        description: Run the isolated synthetic pair RSS measurement
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: chain-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Chain Core source and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Execute original Linux worker affinity limits stdin and cleanup case
        run: |
          python3 -B - <<'PYLINUX'
          import importlib.util, io, json, os, pathlib, platform, sys, unittest
          assert sys.platform == 'linux', 'actual Linux process test must not skip'
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pq-post-ready-linux-controls'
          destination.mkdir(mode=0o700)
          path = pathlib.Path('scripts/loadtest/test_pq_independent_load.py')
          spec = importlib.util.spec_from_file_location('original_linux_worker_controls', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          name = 'IndependentLoadControls.test_real_worker_thread_spawn_keeps_limits_and_stdin_without_preexec'
          suite = unittest.defaultTestLoader.loadTestsFromName(name, module)
          output = io.StringIO()
          result = unittest.TextTestRunner(stream=output, verbosity=2).run(suite)
          log = output.getvalue()
          print(log, end='')
          (destination / 'original-case.log').write_text(log)
          value = dict(case=name, sourceCommit=os.environ['GITHUB_SHA'], runID=os.environ['GITHUB_RUN_ID'],
                       platform=sys.platform, kernel=platform.release(), testsRun=result.testsRun,
                       skipped=len(result.skipped), failures=len(result.failures), errors=len(result.errors),
                       successful=result.wasSuccessful(), nodeStarted=False, businessLoadExecuted=False,
                       meaning='Original real child from worker thread; inherited CPU affinity and file-size rlimit, piped stdin, exit0 and owned cleanup assertions. No chain throughput measured.')
          (destination / 'RESULT.json').write_text(json.dumps(value, sort_keys=True) + '\n')
          assert result.testsRun == 1 and not result.skipped and result.wasSuccessful(), 'original Linux worker case failed or skipped'
          PYLINUX
          python3 -B scripts/loadtest/test_linux_owned_rss.py -v
          python3 -B scripts/loadtest/test_linux_thread_group_exit.py -v
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        id: source-go
        with:
          go-version: "1.25"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Build original signed public proof offline verifier
        env:
          GOMAXPROCS: "1"
          GOMEMLIMIT: "160MiB"
          YNX_PQ_TRANSACTION_PROOF_FIXTURE_OUT: ${{ runner.temp }}/pq-perf-original-public-proof.json
          SOURCE_GO_CACHE_HIT: ${{ steps.source-go.outputs.cache-hit }}
        run: |
          printf 'Original source Go cache hit: %s\n' "$SOURCE_GO_CACHE_HIT"
          go env GOVERSION GOOS GOARCH GOTOOLCHAIN
          go build -p 1 -o "${{ runner.temp }}/pq-perf-original-verifier" ./cmd/ynx-consensus-proof-verify
      - name: Produce original signed public proof fixture and offline verifier
        env:
          GOMAXPROCS: "1"
          GOMEMLIMIT: "160MiB"
          YNX_PQ_TRANSACTION_PROOF_FIXTURE_OUT: ${{ runner.temp }}/pq-perf-original-public-proof.json
        run: |
          go test -p 1 ./internal/consensus -run '^TestPQConsensusTransactionProofPublicFixture$' -count=1 -timeout=60s -v
          test -s "$YNX_PQ_TRANSACTION_PROOF_FIXTURE_OUT"
      - name: Verify canonical PQ Whole and Native N1 clients with UNKNOWN original readback
        env:
          GOMAXPROCS: "1"
          GOMEMLIMIT: "160MiB"
          YNX_PERF_PQ_PROOF_FIXTURE: ${{ runner.temp }}/pq-perf-original-public-proof.json
          YNX_PERF_PQ_PROOF_VERIFIER: ${{ runner.temp }}/pq-perf-original-verifier
        run: go test -p 1 -race ./cmd/ynx-consensus-perf-client -run '^TestPQ(Whole|Member|Registration)Case' -count=1 -timeout=30s -v
      - name: Verify bounded performance controller and evidence contracts
        run: >-
          node --test
          scripts/loadtest/consensus-light-plan.test.mjs
          scripts/loadtest/native-resource-sample.test.mjs
          scripts/loadtest/native-resource-probe.test.mjs
          scripts/loadtest/owned-process-race.test.mjs
          scripts/loadtest/same-control-readback.test.mjs
          scripts/loadtest/pq-fresh-phase-readback.test.mjs
      - name: Verify semantic original result transport and process controls
        run: python3 -B scripts/loadtest/test_pq_semantic_ci_readback.py -v
      - name: Verify fixed1695 semantic original transport and process controls
        run: python3 -B scripts/loadtest/test_pq_1695_semantic_readback.py -v
      - name: Verify fixed1695 own source originals with explicit opt-in skips
        run: python3 -B scripts/loadtest/test_pq_1695_source_qualification.py -v
      - name: Verify fixed d24 original semantic and source readback controls
        run: |
          python3 -B scripts/loadtest/test_pq_d24_semantic_readback.py -v
          python3 -B scripts/loadtest/test_pq_d24_source_readback.py -v
      - name: Verify full first100 cohort counts and censored latency readback
        run: python3 -B scripts/loadtest/test_pq_first100_readback.py -v
      - name: Verify original d24 cohort and separate stage denominators
        run: |
          python3 -B scripts/loadtest/test_pq_first100_d24_readback.py -v
          python3 -B scripts/loadtest/test_pq_first100_1695_cold_readback.py -v
          python3 -B scripts/loadtest/test_pq_first100_1695_public_readback.py -v
          python3 -B scripts/loadtest/test_pq_7c25_source_qualification.py -v
          python3 -B scripts/loadtest/test_pq_first100_7c25_ci.py -v
          python3 -B scripts/loadtest/test_pq_first100_7c25_readback.py -v
          python3 -B scripts/loadtest/test_pq_first100_7c25_native_readback.py -v
          python3 -B scripts/loadtest/test_pq_current_live_reader_wiring.py -v
          python3 -B scripts/loadtest/test_pq_7c25_native_source_dependencies.py -v
          python3 -B scripts/loadtest/test_pq_finalize_7c25_semantic_ci.py -v
          python3 -B scripts/loadtest/test_pq_7c25_semantic_readback.py -v
          python3 -B scripts/loadtest/test_pq_first100_stage_summary.py -v
          python3 -B scripts/loadtest/test_pq_first100_held_readback.py -v
          python3 -B scripts/loadtest/pq-same-runner-controls.py
          python3 -B scripts/loadtest/test_pq_public_proof_readback.py -v
          python3 -B scripts/loadtest/test_pq_staged_independent_scheduler.py -v
          python3 -B scripts/loadtest/test_pq_finalize_observation.py -v
          python3 -B scripts/loadtest/test_pq_normal_leg_stages.py -v
          python3 -B scripts/loadtest/test_pq_hop_byte_accounting.py -v
          python3 -B scripts/loadtest/test_pq_successor_availability_readback.py -v
      - name: Verify optional held public input footprint and original readiness metrics
        run: |
          python3 -B scripts/loadtest/test_pq_held_input_footprint.py -v
          python3 -B scripts/loadtest/test_pq_ready_metrics.py -v
      - name: Verify original bounded sender and post-ready checkpoint ordering
        run: |
          python3 -B scripts/loadtest/test_pq_bounded_sender_backend.py -v
          python3 -B scripts/loadtest/test_pq_helper_lifecycle.py -v
      - name: Verify serial original verifier admission and shared deadline
        run: |
          python3 -B - <<'PYSERIAL'
          import importlib.util, sys, unittest
          from pathlib import Path
          if sys.platform != 'linux':
              raise RuntimeError('actual Linux original verifier admission controls required')
          path = Path('scripts/loadtest/test_pq_serial_verifier_admission.py')
          spec = importlib.util.spec_from_file_location('original_serial_verifier_controls', path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          if suite.countTestCases() != 26:
              raise RuntimeError('exact 26 original serial verifier controls required')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 26 or result.skipped or not result.wasSuccessful():
              raise RuntimeError('all 26 original verifier controls must actually pass without skips')
          PYSERIAL
      - name: Verify bounded post-cutoff verifier diagnostics on Linux
        run: python3 -B scripts/loadtest/pq-verifier-cutoff-controls.py
      - name: Verify normal public owner stream isolation and lost acknowledgements
        run: |
          python3 -B scripts/loadtest/test_pq_public_owner_transport.py -v
          python3 -B - <<'PYPOISON'
          import importlib.util, sys, unittest
          from pathlib import Path
          if sys.platform != 'linux':
              raise RuntimeError('actual Linux original owner retirement required')
          spec = importlib.util.spec_from_file_location('original_owner_poison', Path('scripts/loadtest/test_pq_owner_poison_retirement.py'))
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          if suite.countTestCases() != 31:
              raise RuntimeError('exact 31 original owner retirement controls required')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 31 or result.skipped or not result.wasSuccessful():
              raise RuntimeError('all 31 original owner retirement controls must execute without skips')
          PYPOISON
          python3 -B scripts/loadtest/test_pq_guarded_original_stdin.py -v
          python3 -B scripts/loadtest/test_pq_public_owner_readback.py -v
          python3 -B scripts/loadtest/test_pq_public_owner_parent_readback.py -v
          python3 -B scripts/loadtest/test_pq_sender_backend_selection.py -v
          python3 -B scripts/loadtest/test_pq_normal_callgraph.py -v
          python3 -B scripts/loadtest/test_pq_live_materials_transport.py -v
          python3 -B scripts/loadtest/test_resource_guard_sampling.py -v
          python3 -B - <<'PYPROCESSRSS'
          import importlib.util, unittest
          from pathlib import Path
          path = Path('scripts/loadtest/test_pq_process_rss_observation.py')
          spec = importlib.util.spec_from_file_location('original_process_rss_controls', path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          if suite.countTestCases() != 13:
              raise RuntimeError('exact 13 original process RSS observation controls required')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 13 or result.skipped or not result.wasSuccessful():
              raise RuntimeError('all 13 original process RSS observation controls must execute without skips')
          PYPROCESSRSS
          python3 -B - <<'PYRESOURCE'
          import importlib.util, unittest
          from pathlib import Path
          path = Path('scripts/loadtest/test_pq_resource_first_cause.py')
          spec = importlib.util.spec_from_file_location('original_resource_first_cause', path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          if suite.countTestCases() != 6:
              raise RuntimeError('exact six original resource first-cause controls required')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 6 or result.skipped or not result.wasSuccessful():
              raise RuntimeError('all six original resource first-cause controls must execute without skips')
          PYRESOURCE
          python3 -B - <<'PYLAUNCH'
          import importlib.util, sys, unittest
          from pathlib import Path
          if sys.platform != 'linux':
              raise RuntimeError('actual Linux launch lifecycle controls required')
          path = Path('scripts/loadtest/test_window_pending_launch.py')
          spec = importlib.util.spec_from_file_location('original_pending_launch', path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          if suite.countTestCases() != 31:
              raise RuntimeError('exact 31 original pending launch controls required')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 31 or result.skipped or not result.wasSuccessful():
              raise RuntimeError('all 31 original pending launch controls must execute without skips')
          PYLAUNCH
          python3 -B scripts/loadtest/test_pq_initialization_measurements.py -v
      - name: Verify synthetic Commit clock original evidence readback
        run: |
          set -euo pipefail
          python3 -B -c 'import os,sys; assert sys.platform == "linux" and hasattr(os,"pidfd_open")'
          if ! python3 -B scripts/loadtest/test_pq_commit_clock_readback.py > "$RUNNER_TEMP/commit-clock-readback.log" 2>&1; then
            cat "$RUNNER_TEMP/commit-clock-readback.log"; exit 1
          fi
          cat "$RUNNER_TEMP/commit-clock-readback.log"
          grep -q 'Ran 31 tests' "$RUNNER_TEMP/commit-clock-readback.log"
          if grep -qi 'skipped' "$RUNNER_TEMP/commit-clock-readback.log"; then exit 1; fi
          python3 -B scripts/loadtest/test_pq_commit_validation_readback.py
          python3 -B scripts/loadtest/test_pq_commit_clock_source_qualification.py
          if ! python3 -B scripts/loadtest/test_pq_before59_held_source.py -v > "$RUNNER_TEMP/before59-held-source.log" 2>&1; then
            cat "$RUNNER_TEMP/before59-held-source.log"; exit 1
          fi
          cat "$RUNNER_TEMP/before59-held-source.log"
          grep -q '^Ran 5 tests ' "$RUNNER_TEMP/before59-held-source.log"
          if grep -qi 'skipped' "$RUNNER_TEMP/before59-held-source.log"; then exit 1; fi
          python3 -B scripts/loadtest/pq-source-evidence-controls.py
      - name: Verify synthetic sampler first-failure retention
        run: |
          python3 -B scripts/loadtest/test_pq_same_runner_synthetic_rss.py \
            SyntheticRSSControls.test_sampler_stop_never_replaces_first_failure \
            SyntheticRSSControls.test_sampler_stop_failure_without_first_failure_is_not_hidden -v
      - name: Measure original pair producers using synthetic data on Linux
        if: github.event_name == 'workflow_dispatch' && inputs.synthetic_pair_rss && github.ref == 'refs/heads/codex/chain-monotonic-reader-20261121'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -B scripts/loadtest/test_pq_same_runner_synthetic_rss.py -v
          python3 -B scripts/loadtest/pq-same-runner-synthetic-rss.py --run --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/synthetic-pair-rss.json"
      - name: Preserve synthetic pair RSS result
        if: always() && github.event_name == 'workflow_dispatch' && inputs.synthetic_pair_rss && github.ref == 'refs/heads/codex/chain-monotonic-reader-20261121'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-pair-rss-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synthetic-pair-rss.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify hardware observation and record actual CI host separately
        run: |
          python3 -B scripts/loadtest/test_pq_runtime_hardware.py -v
          python3 -B scripts/loadtest/pq-runtime-hardware.py --workdir "$RUNNER_TEMP"
      - run: npm ci
      - run: npm run hardhat:build
      - name: Generate original contract selectors required by ABCI execution fixtures
        run: npm run contracts:selectors
      - name: Verify compiler output preserves controlled evidence and scanner failures
        run: node --test scripts/contracts/hardhat-output.test.mjs
      - run: make static-check
      - run: make streambft-candidate-check
      - run: make consensus-abci-check
      - name: Verify actual ready-sender Commit phase observations
        run: >-
          go test -p 1 ./cmd/ynx-consensus-perf-client
          -run '^(TestReadySenderFastAccountAdvancesBeforeSlowPeer|TestReadySenderSegmentedIntentBarrierAndRecovery|TestMonotonicObservation.*)$'
          -count=1 -timeout=45s -v
      - run: node scripts/verify/integration-contract-check.mjs
      - run: node scripts/verify/chain-core-release-check.mjs
      - run: make no-placeholder-check
      - name: Verify exact public fixture scan and fail-closed inventory
        run: bash scripts/validate/secret-scan-check.sh
      - run: make secret-scan
      - name: Select pinned normal helper toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.26.10"
      - name: Build current Whole-proof successor client without replacing frozen fresh client
        env:
          GOMAXPROCS: "1"
          GOMEMLIMIT: "160MiB"
        run: |
          test -z "$(git status --porcelain)"
          mkdir -m 0700 "$RUNNER_TEMP/ynx-pq-performance-successor-client"
          go build -p 1 -trimpath -buildvcs=true -o "$RUNNER_TEMP/ynx-pq-performance-successor-client/ynx-consensus-perf-client" ./cmd/ynx-consensus-perf-client
          go version -m "$RUNNER_TEMP/ynx-pq-performance-successor-client/ynx-consensus-perf-client" > "$RUNNER_TEMP/ynx-pq-performance-successor-client/go-build-info.txt"
          python3 - "$RUNNER_TEMP/ynx-pq-performance-successor-client" <<'PYMETA'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          version = subprocess.check_output(['go', 'version'], text=True).strip()
          assert version == 'go version go1.26.10 linux/amd64', version
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == os.environ['GITHUB_SHA']
          info = (root / 'go-build-info.txt').read_text()
          assert 'vcs.revision=' + commit in info and 'vcs.modified=false' in info
          files = {}
          for name in ('ynx-consensus-perf-client', 'go-build-info.txt'):
              path = root / name
              assert path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= 128 << 20
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(65536), b''):
                      digest.update(chunk)
              files[name] = dict(bytes=path.stat().st_size, sha256=digest.hexdigest())
          result = dict(kind='ynx-pq-performance-successor-client-build', commit=commit, producerCommit=os.environ['GITHUB_SHA'],
                        sourceTree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                        clientCodeTree=subprocess.check_output(['git', 'rev-parse', 'HEAD:cmd/ynx-consensus-perf-client'], text=True).strip(),
                        target='linux-amd64', goVersion=version, files=files,
                        normalSourceTestsToolchain='original chain-core Go 1.25 source job',
                        frozenFresh70ClientReplaced=False, executionAuthorized=False, publicDeployment=False)
          with (root / 'SOURCE.json').open('x') as handle:
              json.dump(result, handle, sort_keys=True, separators=(',', ':'))
              handle.write('\n')
          PYMETA
      - name: Upload current successor client with separate source identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ynx-pq-performance-successor-client-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-pq-performance-successor-client/
          if-no-files-found: error
          retention-days: 7
      - name: Checkout exact client source required by original fresh callee
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: 70e7e450997a0ae77dbad5a8be3682f482c6ddd8
          path: pq-client-pinned-source
          persist-credentials: false
      - name: Prebuild bounded Linux PQ performance client for Root-scheduled windows
        working-directory: pq-client-pinned-source
        env:
          GOMAXPROCS: "1"
          GOMEMLIMIT: "160MiB"
        run: |
          test -z "$(git status --porcelain)"
          mkdir -m 0700 "$RUNNER_TEMP/ynx-pq-performance-client"
          go build -p 1 -trimpath -buildvcs=true -o "$RUNNER_TEMP/ynx-pq-performance-client/ynx-consensus-perf-client" ./cmd/ynx-consensus-perf-client
          go version -m "$RUNNER_TEMP/ynx-pq-performance-client/ynx-consensus-perf-client" > "$RUNNER_TEMP/ynx-pq-performance-client/go-build-info.txt"
          python3 - "$RUNNER_TEMP/ynx-pq-performance-client" <<'PYMETA'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          version = subprocess.check_output(['go', 'version'], text=True).strip()
          assert version == 'go version go1.26.10 linux/amd64', version
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == '70e7e450997a0ae77dbad5a8be3682f482c6ddd8'
          info = (root / 'go-build-info.txt').read_text()
          assert 'vcs.revision=' + commit in info and 'vcs.modified=false' in info
          files = {}
          for name in ('ynx-consensus-perf-client', 'go-build-info.txt'):
              path = root / name
              assert path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= 128 << 20
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(65536), b''):
                      digest.update(chunk)
              files[name] = dict(bytes=path.stat().st_size, sha256=digest.hexdigest())
          result = dict(kind='ynx-pq-performance-client-build', commit=commit, producerCommit=os.environ['GITHUB_SHA'],
                        sourceTree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                        clientCodeTree=subprocess.check_output(['git', 'rev-parse', 'HEAD:cmd/ynx-consensus-perf-client'], text=True).strip(),
                        target='linux-amd64', goVersion=version, files=files,
                        normalSourceTestsToolchain='original chain-core Go 1.25 source job',
                        executionAuthorized=False, publicDeployment=False)
          with (root / 'SOURCE.json').open('x') as handle:
              json.dump(result, handle, sort_keys=True, separators=(',', ':'))
              handle.write('\n')
          PYMETA
      - name: Upload prebuilt public PQ performance client and exact source identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ynx-pq-performance-client-linux-amd64-70e7e450997a0ae77dbad5a8be3682f482c6ddd8-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-pq-performance-client/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Chain Core handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chain-core-handoff-${{ github.sha }}
          path: |
            FEATURE_COMPLETION_EVIDENCE.md
            docs/architecture/STREAMBFT_CANDIDATE.md
            docs/integration/CHAIN_CORE_INTEGRATION_HANDOFF.md
            docs/integration/CHAIN_CORE_CROSS_PRODUCT_TEST_VECTORS.json
            docs/integration/CHAIN_CORE_DEPENDENCY_ACCEPTANCE.md
            docs/integration/WEBSITE_HANDOFF.md
            release/integration/chain-core-contract.json
            release/chain-core/artifact-registry.json
            release/chain-core/product-release.json
            release/chain-core/public-product-metadata.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve original Linux worker case result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pq-post-ready-linux-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pq-post-ready-linux-controls/
          if-no-files-found: error
          retention-days: 90

  rss-source-controls:
    name: Process RSS and stage source controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Execute exact same-source 13 RSS and 49 stage controls
        run: |
          python3 -B - <<'PYRSSSOURCE'
          import hashlib, importlib.util, json, os, pathlib, subprocess, sys, unittest
          assert sys.platform == 'linux', 'actual Linux source controls required'
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA'], 'exact checked-out source required'
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pq-process-rss-source-controls'
          destination.mkdir(mode=0o700)
          report = dict(sourceCommit=source, runID=os.environ['GITHUB_RUN_ID'],
                        runAttempt=os.environ['GITHUB_RUN_ATTEMPT'], platform=sys.platform,
                        groups=[], testsRun=0, skipped=0, successful=False,
                        sourceQualificationGranted=False, normalGoOrChainEvidence=False,
                        pressureAuthorized=False, fullVerifyRequired=True,
                        meaning='Independent pure source controls only. The complete original verify job and run must still succeed; this job grants no Tools or runtime qualification.')
          def retain():
              (destination / 'RESULT.json').write_text(json.dumps(report, sort_keys=True) + '\n')
          retain()
          for filename, expected in [('test_pq_process_rss_observation.py', 13),
                                     ('test_pq_first100_stage_summary.py', 49)]:
              path = pathlib.Path('scripts/loadtest') / filename
              spec = importlib.util.spec_from_file_location('rss_source_' + path.stem, path)
              module = importlib.util.module_from_spec(spec); sys.modules[spec.name] = module
              spec.loader.exec_module(module)
              suite = unittest.defaultTestLoader.loadTestsFromModule(module)
              assert suite.countTestCases() == expected, 'exact original source control count required'
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              report['groups'].append(dict(file=filename, sourceSHA256=hashlib.sha256(path.read_bytes()).hexdigest(),
                  expected=expected, testsRun=result.testsRun, skipped=len(result.skipped),
                  failures=len(result.failures), errors=len(result.errors), successful=result.wasSuccessful()))
              report['testsRun'] += result.testsRun; report['skipped'] += len(result.skipped)
              retain()
          report['successful'] = (report['testsRun'] == 62 and report['skipped'] == 0
                                 and all(row['successful'] and row['testsRun'] == row['expected'] for row in report['groups']))
          retain()
          print(json.dumps(report, sort_keys=True))
          assert report['successful'], 'all 62 original source controls must execute without skips'
          PYRSSSOURCE
      - name: Preserve source-only RSS and stage control result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pq-process-rss-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pq-process-rss-source-controls/RESULT.json
          if-no-files-found: error
          retention-days: 90

  before59-original-composition:
    name: Before59 original Linux source composition and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: '1.26.11'
      - name: Execute exact source-only original composition and normal build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -B - <<'PYBEFORE'
          import importlib.util, sys, unittest
          from pathlib import Path
          assert sys.platform == 'linux', 'actual Linux original composition required'
          for name,count in (('test_pq_before59_composition_ci',5),('test_pq_before59_composition_readback',6)):
              spec=importlib.util.spec_from_file_location(name,Path('scripts/loadtest')/(name+'.py'))
              module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
              suite=unittest.defaultTestLoader.loadTestsFromModule(module)
              result=unittest.TextTestRunner(verbosity=2).run(suite)
              if result.testsRun!=count or result.skipped or not result.wasSuccessful():
                  raise RuntimeError('all original composition controls must execute without skips: '+name)
          PYBEFORE
          python3 -I -B scripts/loadtest/pq-before59-composition-ci.py --run
      - name: Retain only the original before59 source-build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: before59-source-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/before59-composition-original/
          if-no-files-found: error
          retention-days: 7
