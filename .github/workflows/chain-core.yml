name: chain-core

on:
  push:
    branches:
      - codex/final-chain-core
      - codex/ynx-pq-perf-integration
      - codex/v5-link-native-ci
      - codex/v5-link-protected-client
    paths:
      - ".github/workflows/chain-core.yml"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "hardhat.config.ts"
      - "cmd/**"
      - "internal/**"
      - "docs/architecture/STREAMBFT_CANDIDATE.md"
      - "docs/formal/streambft/**"
      - "docs/integration/**"
      - "release/**"
      - "scripts/validate/**"
      - "scripts/loadtest/**"
      - "scripts/contracts/**"
      - "scripts/verify/contract-tooling-check.*"
      - "scripts/verify/integration-contract-check.mjs"
      - "scripts/verify/chain-core-release-check.mjs"
      - "scripts/verify/streambft-candidate-check.sh"
  pull_request:
    branches:
      - main
      - codex/ynx-pq-perf-integration
    paths:
      - ".github/workflows/chain-core.yml"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "hardhat.config.ts"
      - "cmd/**"
      - "internal/**"
      - "docs/architecture/STREAMBFT_CANDIDATE.md"
      - "docs/formal/streambft/**"
      - "docs/integration/**"
      - "release/**"
      - "scripts/validate/**"
      - "scripts/loadtest/**"
      - "scripts/contracts/**"
      - "scripts/verify/contract-tooling-check.*"
      - "scripts/verify/integration-contract-check.mjs"
      - "scripts/verify/chain-core-release-check.mjs"
      - "scripts/verify/streambft-candidate-check.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chain-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  combined-archive-deployment:
    name: LINK Product transport and archive deployment controls
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Check actual object deployment parsing and rejection controls
        run: node --test cmd/ynx-secure-link-private-client/combined-archive-deployment.test.mjs cmd/ynx-secure-link-private-client/combined-archive-product-symbols.test.mjs cmd/ynx-secure-link-private-client/combined-supply-profile.test.mjs cmd/ynx-secure-link-private-client/core20-fixed-agent-profile.test.mjs cmd/ynx-secure-link-private-client/retained-suffix.test.mjs cmd/ynx-secure-link/server-tls-ci.test.mjs
      - name: Check original resource-current native client and Darwin kernel peer lifecycle
        env:
          YNX_LINK_RESOURCE_CURRENT_TEST_ARTIFACTS: ${{ runner.temp }}/resource-current-native-evidence
        run: node --test cmd/ynx-secure-link-caller/resource-current-native.test.mjs cmd/ynx-secure-link-caller/resource-current-held-native.test.mjs
      - name: Preserve original PUBLIC native client inputs, binaries and first-cause evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-current-native-darwin-${{ github.sha }}
          path: ${{ runner.temp }}/resource-current-native-evidence
          if-no-files-found: error
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # original immutable setup-go
        with:
          go-version: "1.26.10"
          cache: false
      - name: Check same-connection owned client image and physical close
        env:
          CGO_ENABLED: "1"
          GOMAXPROCS: "2"
          GOMEMLIMIT: 1536MiB
          GOCACHE: ${{ runner.temp }}/task-grant-go-cache
          GOTMPDIR: ${{ runner.temp }}/task-grant-go-tmp
          YNX_LINK_OWNED_LOCAL_CLIENT_TEST_EVIDENCE: ${{ runner.temp }}/owned-local-client
          YNX_LINK_OWNED_LOCAL_CLIENT_TEST_SOCKET_ROOT: /private/tmp/ynx-oc-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$GOCACHE" "$GOTMPDIR"
          install -d -m 700 "$YNX_LINK_OWNED_LOCAL_CLIENT_TEST_EVIDENCE" "$YNX_LINK_OWNED_LOCAL_CLIENT_TEST_SOCKET_ROOT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const files=['go.mod','go.sum','.github/workflows/chain-core.yml',...fs.readdirSync('internal/securelink')
            .filter(n=>n.startsWith('local_caller')||n.startsWith('ipc')).sort().map(n=>'internal/securelink/'+n)];
          const pins=files.map(file=>{const b=fs.readFileSync(file);return {file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          fs.writeFileSync(process.env.YNX_LINK_OWNED_LOCAL_CLIENT_TEST_EVIDENCE+'/SOURCE-BEFORE.json',JSON.stringify(pins,null,2)+'\n',{flag:'wx'});
          NODE
          set +e
          go test -mod=readonly -race -p 1 -count=1 -timeout=120s -json -run '^TestOriginalLocalCaller(Exchange|Peer)' ./internal/securelink > "$YNX_LINK_OWNED_LOCAL_CLIENT_TEST_EVIDENCE/go.jsonl" 2> "$YNX_LINK_OWNED_LOCAL_CLIENT_TEST_EVIDENCE/go.stderr"
          export YNX_LINK_OWNED_LOCAL_CLIENT_TEST_STATUS=$?
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const root=process.env.YNX_LINK_OWNED_LOCAL_CLIENT_TEST_EVIDENCE;
          const before=JSON.parse(fs.readFileSync(root+'/SOURCE-BEFORE.json'));
          const after=before.map(({file})=>{const b=fs.readFileSync(file);return {file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          fs.writeFileSync(root+'/SOURCE-AFTER.json',JSON.stringify(after,null,2)+'\n',{flag:'wx'});
          const rows=fs.readFileSync(root+'/go.jsonl','utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const names=['ExchangeCompleteFINAndDebt','ExchangePreflightNoSocket','ExchangePartialAndBounds',
            'ExchangeCancellationJoinsCallback','ExchangeConcurrentCurrentAndCleanup','ExchangeCloseUnknownRetainsOriginal',
            'PeerSameConnectedIdentity','PeerRejectsWrongExpectedIdentity','PeerCloseUnknownRetainedOnce','PeerActualExecChange']
            .map(n=>'TestOriginalLocalCaller'+n);
          const result={exit:Number(process.env.YNX_LINK_OWNED_LOCAL_CLIENT_TEST_STATUS),required:names,
            run:names.filter(n=>rows.filter(r=>r.Test===n&&r.Action==='run').length===1),
            pass:names.filter(n=>rows.filter(r=>r.Test===n&&r.Action==='pass').length===1),
            failures:rows.filter(r=>r.Action==='fail'||r.Action==='skip'),sourceBeforeAfterSame:JSON.stringify(before)===JSON.stringify(after),PUBLIC:true,RootAdmission:false,SourceAdmission:false};
          fs.writeFileSync(root+'/CI-RESULT.json',JSON.stringify(result,null,2)+'\n',{flag:'wx'});
          assert.equal(result.exit,0);assert.deepEqual(result.run,names);assert.deepEqual(result.pass,names);assert.equal(result.failures.length,0);assert.equal(result.sourceBeforeAfterSame,true);
          NODE
      - name: Preserve owned client actual kernel and close evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-local-client-darwin-${{ github.sha }}
          path: ${{ runner.temp }}/owned-local-client
          if-no-files-found: error
      - name: Check new Product Unix transport and C ABI lifecycle with PUBLIC fixture loan
        env:
          CGO_ENABLED: "1"
          GOMAXPROCS: "2"
          GOWORK: "off"
          GOCACHE: ${{ runner.temp }}/product-transport-go-cache
          GOTMPDIR: ${{ runner.temp }}/product-transport-go-tmp
          TMPDIR: ${{ runner.temp }}/product-transport-native-tmp
        run: |
          mkdir -p "$GOCACHE" "$GOTMPDIR" "$TMPDIR"
          go test -mod=readonly -race -p 1 -count=1 -timeout=90s -tags=securelink_product_pay_transport,securelink_product_pay_transport_fixture -run '^TestProductPrivate' ./internal/securelink
      - name: Check private TaskGrant registered server and actual caller drain
        env:
          YNX_LINK_TASK_GRANT_CI_EVIDENCE: ${{ runner.temp }}/tg
          GOMAXPROCS: "2"
          GOCACHE: ${{ runner.temp }}/task-grant-go-cache
          GOTMPDIR: ${{ runner.temp }}/task-grant-go-tmp
        run: |
          mkdir -p "$GOCACHE" "$GOTMPDIR"
          sh cmd/ynx-secure-link-caller/check.sh task-grant
      - name: Preserve TaskGrant Darwin kernel controls and original first cause
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-grant-transport-darwin-${{ github.sha }}
          path: ${{ runner.temp }}/tg
          if-no-files-found: error
      - name: Check local Social directory original caller and W/A response drain
        env:
          YNX_LINK_SOCIAL_DIRECTORY_CI_EVIDENCE: ${{ runner.temp }}/sd
          GOMAXPROCS: "2"
          GOCACHE: ${{ runner.temp }}/task-grant-go-cache
          GOTMPDIR: ${{ runner.temp }}/task-grant-go-tmp
        run: sh cmd/ynx-secure-link-caller/check.sh social-directory
      - name: Preserve Social directory Darwin transport and first cause
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: social-directory-transport-darwin-${{ github.sha }}
          path: ${{ runner.temp }}/sd
          if-no-files-found: error
      - name: Check fixed P08 resource caller and owned response drain
        env:
          YNX_LINK_TASK_READ_RESOURCE_CI_EVIDENCE: ${{ runner.temp }}/tr
          GOMAXPROCS: "2"
          GOCACHE: ${{ runner.temp }}/task-grant-go-cache
          GOTMPDIR: ${{ runner.temp }}/task-grant-go-tmp
        run: sh cmd/ynx-secure-link-caller/check.sh task-read-resource
      - name: Preserve P08 Darwin transport and original first cause
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-read-resource-darwin-${{ github.sha }}
          path: ${{ runner.temp }}/tr
          if-no-files-found: error
      - name: Read the immutable original SDK continuation consumer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: 2ac465fcbc21e04af9794634b318c394a2cc6b3f
          path: original-sdk-task-read-normal
          persist-credentials: false
      - name: Install only original locked SDK runtime dependencies
        working-directory: original-sdk-task-read-normal/packages/wallet-auth
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Check actual Auth NAPI getter and original SDK continuation consumer
        env:
          YNX_LINK_TASK_READ_NORMAL_SDK_SOURCE: ${{ github.workspace }}/original-sdk-task-read-normal
          YNX_LINK_TASK_READ_NORMAL_EVIDENCE: ${{ runner.temp }}/tn
          YNX_LINK_TASK_READ_NORMAL_SOCKET_ROOT: /private/tmp/ynx-ln-${{ github.run_id }}-${{ github.run_attempt }}
          GOCACHE: ${{ runner.temp }}/task-grant-go-cache
          GOTMPDIR: ${{ runner.temp }}/task-grant-go-tmp
        run: node cmd/ynx-secure-link-caller/task-read-resource-normal-consumer-ci.mjs
      - name: Preserve actual supplier closure and six new consumer results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-read-normal-consumer-darwin-${{ github.sha }}
          path: ${{ runner.temp }}/tn
          if-no-files-found: error

  resource-current-native-linux:
    name: LINK resource-current native client and Linux kernel peer controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Check same-socket native peer identity, original frame and physical drain
        env:
          YNX_LINK_RESOURCE_CURRENT_TEST_ARTIFACTS: ${{ runner.temp }}/resource-current-native-evidence
        run: node --test cmd/ynx-secure-link-caller/resource-current-native.test.mjs cmd/ynx-secure-link-caller/resource-current-held-native.test.mjs
      - name: Preserve original PUBLIC native client inputs, binaries and first-cause evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-current-native-linux-${{ github.sha }}
          path: ${{ runner.temp }}/resource-current-native-evidence
          if-no-files-found: error
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # original immutable setup-go
        with:
          go-version: "1.26.10"
          cache: false
      - name: Check private TaskGrant registered server and actual caller drain
        env:
          YNX_LINK_TASK_GRANT_CI_EVIDENCE: ${{ runner.temp }}/tg
          GOMAXPROCS: "2"
          GOCACHE: ${{ runner.temp }}/task-grant-go-cache
          GOTMPDIR: ${{ runner.temp }}/task-grant-go-tmp
        run: |
          mkdir -p "$GOCACHE" "$GOTMPDIR"
          sh cmd/ynx-secure-link-caller/check.sh task-grant
      - name: Preserve TaskGrant Linux kernel controls and original first cause
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-grant-transport-linux-${{ github.sha }}
          path: ${{ runner.temp }}/tg
          if-no-files-found: error
      - name: Check local Social directory original caller and W/A response drain
        env:
          YNX_LINK_SOCIAL_DIRECTORY_CI_EVIDENCE: ${{ runner.temp }}/sd
          GOMAXPROCS: "2"
          GOCACHE: ${{ runner.temp }}/task-grant-go-cache
          GOTMPDIR: ${{ runner.temp }}/task-grant-go-tmp
        run: sh cmd/ynx-secure-link-caller/check.sh social-directory
      - name: Preserve Social directory Linux transport and first cause
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: social-directory-transport-linux-${{ github.sha }}
          path: ${{ runner.temp }}/sd
          if-no-files-found: error
      - name: Check fixed P08 resource caller and owned response drain
        env:
          YNX_LINK_TASK_READ_RESOURCE_CI_EVIDENCE: ${{ runner.temp }}/tr
          GOMAXPROCS: "2"
          GOCACHE: ${{ runner.temp }}/task-grant-go-cache
          GOTMPDIR: ${{ runner.temp }}/task-grant-go-tmp
        run: sh cmd/ynx-secure-link-caller/check.sh task-read-resource
      - name: Preserve P08 Linux transport and original first cause
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-read-resource-linux-${{ github.sha }}
          path: ${{ runner.temp }}/tr
          if-no-files-found: error

  resource-current-auth-reader-go:
    name: LINK actual Auth Reader and original P09 Go lifecycle
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: a2c482534959cc3a63733835d86464853376ea2f
          path: original-p09-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # original immutable setup-go
        with:
          go-version: "1.26.10"
          cache: false
      - name: Build fixed original fixture and exercise real Reader ACK and prewrite custody
        env:
          YNX_LINK_P09_FIXTURE_SOURCE: ${{ github.workspace }}/original-p09-source
          YNX_LINK_AUTH_READER_TEST_ARTIFACTS: ${{ runner.temp }}/ar
          YNX_LINK_AUTH_READER_BUILD_SCRATCH: ${{ runner.temp }}/ab
        run: node cmd/ynx-secure-link-caller/resource-current-auth-reader-ci.mjs
      - name: Preserve original source, compiler, process, body and first-cause evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-current-auth-reader-go-${{ github.sha }}
          path: ${{ runner.temp }}/ar
          if-no-files-found: error

  contract-tooling-scope:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/ynx-pq-perf-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 2
      - id: paths
        name: Select only changed contract toolchain inputs
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$AFTER" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}"; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
          fi
          git diff --name-only "$BEFORE" "$AFTER" -- \
            package.json package-lock.json hardhat.config.ts \
            scripts/contracts scripts/verify/contract-tooling-check.sh \
            scripts/verify/contract-tooling-check.mjs > "$RUNNER_TEMP/contract-tooling-changes.txt"
          if [[ -s "$RUNNER_TEMP/contract-tooling-changes.txt" ]]; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          fi

  contract-tooling:
    name: Contract tooling dependency and compatibility
    needs: contract-tooling-scope
    if: needs.contract-tooling-scope.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify immutable workflow actions
        run: node scripts/verify/github-actions-pins-check.mjs
      - name: Install the locked contract toolchain with its checked compatibility adaptation
        run: npm ci
      - name: Run the unchanged dependency audit
        run: make dependency-audit
      - name: Build contracts and run the real configuration, network and type regressions
        run: make contract-tooling-check

  verify:
    name: Chain Core source and release gate
    # Preserve every pre-existing trigger/gate. Only the two newly added LINK
    # events use the strict owned-closure job below; mixed candidates fail there.
    if: >-
      (github.event_name != 'push' || github.ref != 'refs/heads/codex/ynx-pq-perf-integration') &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/codex/v5-link-native-ci') &&
      !(github.event_name == 'pull_request' && github.base_ref == 'codex/ynx-pq-perf-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify bounded performance controller and evidence contracts
        run: >-
          node --test
          scripts/loadtest/consensus-light-plan.test.mjs
          scripts/loadtest/native-resource-sample.test.mjs
          scripts/loadtest/native-resource-probe.test.mjs
          scripts/loadtest/owned-process-race.test.mjs
          scripts/loadtest/same-control-readback.test.mjs
      - run: npm ci
      - run: npm run hardhat:build
      - run: npm run contracts:selectors
      - name: Verify compiler output preserves controlled evidence and scanner failures
        run: node --test scripts/contracts/hardhat-output.test.mjs
      - run: make static-check
      - run: make streambft-candidate-check
      - run: make consensus-abci-check
      - name: Verify actual ready-sender Commit phase observations
        run: >-
          go test -p 1 ./cmd/ynx-consensus-perf-client
          -run '^(TestReadySenderFastAccountAdvancesBeforeSlowPeer|TestReadySenderSegmentedIntentBarrierAndRecovery|TestMonotonicObservation.*)$'
          -count=1 -timeout=45s -v
      - run: make integration-contract-check
      - run: make chain-core-release-check
      - run: make no-placeholder-check
      - run: make secret-scan
      - name: Upload Chain Core handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chain-core-handoff-${{ github.sha }}
          path: |
            FEATURE_COMPLETION_EVIDENCE.md
            docs/architecture/STREAMBFT_CANDIDATE.md
            docs/integration/CHAIN_CORE_INTEGRATION_HANDOFF.md
            docs/integration/CHAIN_CORE_CROSS_PRODUCT_TEST_VECTORS.json
            docs/integration/CHAIN_CORE_DEPENDENCY_ACCEPTANCE.md
            docs/integration/WEBSITE_HANDOFF.md
            release/integration/chain-core-contract.json
            release/chain-core/artifact-registry.json
            release/chain-core/product-release.json
            release/chain-core/public-product-metadata.json
          if-no-files-found: error
          retention-days: 90

  link-scope:
    name: Select actual LINK changed closure
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
      exclusive_link: ${{ steps.paths.outputs.exclusive_link }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Select event-bound inputs and reject changes outside the LINK lease
        env:
          LINK_EVENT: ${{ github.event_name }}
          LINK_REF: ${{ github.ref }}
          LINK_BASE_REF: ${{ github.base_ref }}
          LINK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LINK_BASE: ${{ github.event.pull_request.base.sha }}
          LINK_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          sh cmd/ynx-secure-link/check.sh ci-scope >> "$GITHUB_OUTPUT"

  link-native:
    name: LINK native S3 source and isolated transport (not Chain release)
    needs: link-scope
    if: needs.link-scope.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
      CGO_ENABLED: "1"
      OPENSSL_VERSION: "3.6.4"
      # Tarball digest from the official openssl/openssl release asset metadata.
      OPENSSL_SOURCE_SHA256: "9bffaa1ad1e07b354c21bd3324ec02fa15579f45a7d0494b3e74bc449b7333ef"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # original immutable setup-go
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Verify original immutable workflow action policy
        run: node scripts/verify/github-actions-pins-check.mjs chain-core.yml
      - name: Preserve the original source safety scanners
        run: |
          make no-placeholder-check
          make secret-scan
      - name: Prepare job-private inputs and evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/securelink-source" "$RUNNER_TEMP/securelink-evidence"
          printf 'GOCACHE=%s\n' "$RUNNER_TEMP/securelink-go-cache" >> "$GITHUB_ENV"
          printf 'OPENSSL_PREFIX=%s\n' "$RUNNER_TEMP/securelink-openssl" >> "$GITHUB_ENV"
          go version | tee "$RUNNER_TEMP/securelink-evidence/go-version.txt"
          test "$(go env GOVERSION)" = go1.26.10
          cc --version > "$RUNNER_TEMP/securelink-evidence/compiler.txt"
      - name: Build the actual Node caller for original ingress and continuation PQ TLS
        run: |
          set -euo pipefail
          node cmd/ynx-secure-link-caller/build.mjs 2>&1 | tee "$RUNNER_TEMP/securelink-evidence/task-grant-caller-build.log"
          git rev-parse HEAD > "$RUNNER_TEMP/securelink-evidence/task-grant-source-head.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const leaves = ['go.mod','go.sum','cmd/ynx-secure-link-caller/build.mjs',
            'cmd/ynx-secure-link-caller/native.c','cmd/ynx-secure-link-caller/inbound-caller.mjs',
            'cmd/ynx-secure-link-caller/task-grant-transport.mjs',
            'cmd/ynx-secure-link-caller/task-grant-transport-private.mjs',
            'internal/securelink/authority_ingress.go','internal/securelink/authority_ingress_unix.go',
            'internal/securelink/task_grant_transport_unix.go',
            'internal/securelink/task_grant_transport_openssl_test.go',
            'cmd/ynx-secure-link-caller/task-read-resource-caller.mjs',
            'cmd/ynx-secure-link-caller/task-read-resource-continuation.mjs',
            'cmd/ynx-secure-link-caller/task-read-continuation-tls-peer.mjs',
            'internal/securelink/task_read_continuation.go',
            'internal/securelink/task_read_continuation_unix.go',
            'internal/securelink/task_read_continuation_openssl_test.go',
            'cmd/ynx-secure-link-caller/build/caller.node'];
          const inputs = leaves.map(file => {const bytes=fs.readFileSync(file);return {file,bytes:bytes.length,
            sha256:createHash('sha256').update(bytes).digest('hex')};});
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'securelink-evidence/task-grant-native-inputs.json'),
            JSON.stringify({inputs,PUBLIC:true,RootAdmission:false,SourceAdmission:false},null,2)+'\n',{flag:'wx'});
          NODE
      - name: Cache only the bounded upstream source archive (never keys or native binaries)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/securelink-source/openssl-3.6.4.tar.gz
          key: link-openssl-source-${{ runner.os }}-${{ runner.arch }}-3.6.4-${{ env.OPENSSL_SOURCE_SHA256 }}
      - name: Verify official source and build the fixed private OpenSSL runtime
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          archive="$RUNNER_TEMP/securelink-source/openssl-$OPENSSL_VERSION.tar.gz"
          source_url="https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          if [[ ! -e "$archive" ]]; then
            curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
              --max-time 180 --retry 2 --max-filesize 60000000 "$source_url" -o "$archive"
          fi
          test -f "$archive" && test ! -L "$archive"
          test "$(stat -c %s "$archive")" -le 60000000
          printf '%s  %s\n' "$OPENSSL_SOURCE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/securelink-source"
          cd "$RUNNER_TEMP/securelink-source/openssl-$OPENSSL_VERSION"
          # Upstream Apache-2.0 license and all notices travel with the evidence.
          grep -q 'Apache License' LICENSE.txt
          cp LICENSE.txt "$RUNNER_TEMP/securelink-evidence/OPENSSL-LICENSE.txt"
          if [[ -f NOTICE ]]; then cp NOTICE "$RUNNER_TEMP/securelink-evidence/OPENSSL-NOTICE.txt"; fi
          printf 'url=%s\nsha256=%s\nlicense=Apache-2.0\n' "$source_url" "$OPENSSL_SOURCE_SHA256" > "$RUNNER_TEMP/securelink-evidence/openssl-source.txt"
          printf '%s\n' './Configure linux-x86_64 --release shared --prefix=<job-private> --openssldir=<job-private>/ssl --libdir=lib' > "$RUNNER_TEMP/securelink-evidence/openssl-build-flags.txt"
          ./Configure linux-x86_64 --release shared --prefix="$OPENSSL_PREFIX" \
            --openssldir="$OPENSSL_PREFIX/ssl" --libdir=lib
          make -j2 build_sw > "$RUNNER_TEMP/securelink-evidence/openssl-build.log" 2>&1
          make install_sw install_ssldirs >> "$RUNNER_TEMP/securelink-evidence/openssl-build.log" 2>&1
          test -r "$OPENSSL_PREFIX/ssl/openssl.cnf"
          printf '%s\n' "$OPENSSL_PREFIX/bin" >> "$GITHUB_PATH"
          printf 'PKG_CONFIG_LIBDIR=%s\n' "$OPENSSL_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          printf 'PKG_CONFIG_PATH=%s\n' "$OPENSSL_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s\n' "$OPENSSL_PREFIX/lib" >> "$GITHUB_ENV"
      - name: Read back runtime provenance and test actual PQ positive and negative paths
        env:
          YNX_LINK_OWNED_LOCAL_CLIENT_TEST_EVIDENCE: ${{ runner.temp }}/securelink-evidence/owned-client
          YNX_LINK_OWNED_LOCAL_CLIENT_TEST_SOCKET_ROOT: /tmp/ynx-oc-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$(pkg-config --modversion openssl)" = "$OPENSSL_VERSION"
          test "$(pkg-config --variable=prefix openssl)" = "$OPENSSL_PREFIX"
          openssl version -a | tee "$RUNNER_TEMP/securelink-evidence/openssl-runtime.txt"
          openssl list -providers >> "$RUNNER_TEMP/securelink-evidence/openssl-runtime.txt"
          openssl list -tls-groups | grep -F SecP384r1MLKEM1024
          openssl list -tls-signature-algorithms | grep -i mldsa87
          sha256sum "$OPENSSL_PREFIX/lib/libssl.so.3" "$OPENSSL_PREFIX/lib/libcrypto.so.3" > "$RUNNER_TEMP/securelink-evidence/openssl-libraries.sha256"
          sha256sum "$OPENSSL_PREFIX/ssl/openssl.cnf" > "$RUNNER_TEMP/securelink-evidence/openssl-config.sha256"
          sh cmd/ynx-secure-link/check.sh native 2>&1 | tee "$RUNNER_TEMP/securelink-evidence/native-check.log"
          test "$(grep -c '^--- PASS: TestDesktopTaskGrantNativeTLSSevenRoutesToActualNode ' "$RUNNER_TEMP/securelink-evidence/native-check.log")" = 1
          test "$(grep -c '^--- PASS: TestOriginalTaskReadContinuationNativeTLSWholePath ' "$RUNNER_TEMP/securelink-evidence/native-check.log")" = 1
          test "$(grep -c '^    --- PASS: TestOriginalTaskReadContinuationNativeTLSWholePath/' "$RUNNER_TEMP/securelink-evidence/native-check.log")" = 2
          for owned_test in ExchangeCompleteFINAndDebt ExchangePreflightNoSocket ExchangePartialAndBounds ExchangeCancellationJoinsCallback ExchangeConcurrentCurrentAndCleanup ExchangeCloseUnknownRetainsOriginal PeerSameConnectedIdentity PeerRejectsWrongExpectedIdentity PeerCloseUnknownRetainedOnce PeerActualExecChange; do
            test "$(grep -c "^--- PASS: TestOriginalLocalCaller$owned_test " "$RUNNER_TEMP/securelink-evidence/native-check.log")" = 1
          done
          CGO_ENABLED=0 sh cmd/ynx-secure-link/check.sh stub 2>&1 | tee "$RUNNER_TEMP/securelink-evidence/unavailable-check.log"
      - name: Exercise the normal command through private IPC and actual PQ TLS
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/securelink-evidence"
          go build -mod=readonly -p 1 -tags securelink_openssl -o "$evidence/ynx-secure-link-linux-amd64" ./cmd/ynx-secure-link
          go version -m "$evidence/ynx-secure-link-linux-amd64" > "$evidence/binary-buildinfo.txt"
          python3 cmd/ynx-secure-link/smoke.py "$evidence/ynx-secure-link-linux-amd64" --output "$evidence/normal-entry-smoke.json"
          git diff --exit-code
          git rev-parse HEAD > "$evidence/source-head.txt"
          sha256sum "$evidence/ynx-secure-link-linux-amd64" > "$evidence/binary.sha256"
      - name: Exercise finite7 GET, Auth loan callee and independent AI V6 physical PQ transport
        env:
          YNX_LINK_IDE_FINITE_GET_TEST_ARTIFACTS: ${{ runner.temp }}/securelink-finite7-private
          YNX_LINK_IDE_FINITE_GET_CI_EVIDENCE: ${{ runner.temp }}/securelink-evidence/finite7
        run: node cmd/ynx-secure-link-caller/ide-finite-get-ci.mjs
      - name: Compile the actual Auth server lease adapter and check empty Root cleanup
        env:
          YNX_LINK_SERVER_TLS_CI_PRIVATE: ${{ runner.temp }}/securelink-server-tls-private
          YNX_LINK_SERVER_TLS_CI_EVIDENCE: ${{ runner.temp }}/securelink-evidence/server-tls
        run: node cmd/ynx-secure-link/server-tls-ci.mjs
      - name: Upload scoped evidence and upstream notices (no test keys)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: link-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/securelink-evidence/
          if-no-files-found: error
          retention-days: 14
