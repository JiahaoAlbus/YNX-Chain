          git rev-parse HEAD > "$evidence/source-head.txt"
          node cmd/ynx-secure-link/p04-native-docker-ci.mjs "$RUNNER_TEMP/p04-native-docker" "$evidence"
          docker version > "$evidence/docker-version.txt"
          docker buildx version > "$evidence/buildx-version.txt"
      - name: Build the exact protected P04 native target without publication
        working-directory: ${{ runner.temp }}/p04-native-docker
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/p04-native-docker-evidence"
          node --input-type=module -e '
            import fs from "node:fs";
            import {spawnSync} from "node:child_process";
            const {buildCommand: [program, ...args]} = JSON.parse(fs.readFileSync(process.argv[1]));
            const result = spawnSync(program, args, {stdio: "inherit"});
            process.exit(result.status ?? 1);
          ' "$evidence/INPUTS.json" 2>&1 | tee "$evidence/native-build.log"
          image=$(cat ./image.id)
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker image inspect "$image" > "$evidence/native-image.json"
          cp ./image.id "$evidence/image.id"
          cp ./image-metadata.json "$evidence/build-metadata.json"
          container=$(docker create --network none "$image")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/ynx-cloudd" ./ynx-cloudd
          sha256sum ./ynx-cloudd > "$evidence/binary.sha256"
          go version -m ./ynx-cloudd | tee "$evidence/binary-buildinfo.txt"
          grep -Fx './ynx-cloudd: go1.26.11' "$evidence/binary-buildinfo.txt"
          grep -E '^[[:space:]]*build[[:space:]]+CGO_ENABLED=1$' "$evidence/binary-buildinfo.txt"
          grep -E '^[[:space:]]*build[[:space:]]+-tags=cloud_auth_v2,cloud_http_v5,cloud_auth_finite_get,cloud_link_finite_get,securelink_openssl,securelink_reviewed_server_tls$' "$evidence/binary-buildinfo.txt"
      - name: Verify the real image entrypoint, OpenSSL linkage and missing configuration refusal
        working-directory: ${{ runner.temp }}/p04-native-docker
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/p04-native-docker-evidence"
          image=$(cat ./image.id)
          status=0
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            "$image" > "$evidence/native-entry.stdout" 2> "$evidence/native-entry.stderr" || status=$?
          test "$status" = 1
          test ! -s "$evidence/native-entry.stdout"
          grep -F 'protected Cloud deployment requires the original Auth, runtime and V2 DATA configuration' "$evidence/native-entry.stderr"
          sh ./context/apps/cloud/scripts/verify-protected-cloud-image.sh "$image" 2>&1 | tee "$evidence/native-image-controls.log"
      - name: Verify original Auth source refusal before listener acquisition
