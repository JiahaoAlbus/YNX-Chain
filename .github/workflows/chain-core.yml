name: chain-core

on:
  push:
    branches:
      - codex/final-chain-core
      - codex/chain-performance-20261017
    paths:
      - ".github/workflows/chain-core.yml"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "docs/architecture/STREAMBFT_CANDIDATE.md"
      - "docs/formal/streambft/**"
      - "docs/integration/**"
      - "release/**"
      - "scripts/validate/**"
      - "scripts/loadtest/**"
      - "scripts/verify/integration-contract-check.mjs"
      - "scripts/verify/chain-core-release-check.mjs"
      - "scripts/verify/perf-v13-integration-check*.mjs"
      - "scripts/verify/perf-v13-fee-chunks-integration-check*.mjs"
      - "scripts/verify/perf-v13-borrowed-recovery-integration-check*.mjs"
      - "scripts/verify/perf-v13-seal-guarded-integration-check*.mjs"
      - "scripts/verify/perf-v13-seal-compact-default-integration-check*.mjs"
      - "scripts/verify/perf-v13-anchor-order-integration-check*.mjs"
      - "scripts/verify/streambft-candidate-check.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/chain-core.yml"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "docs/architecture/STREAMBFT_CANDIDATE.md"
      - "docs/formal/streambft/**"
      - "docs/integration/**"
      - "release/**"
      - "scripts/validate/**"
      - "scripts/loadtest/**"
      - "scripts/verify/integration-contract-check.mjs"
      - "scripts/verify/chain-core-release-check.mjs"
      - "scripts/verify/perf-v13-integration-check*.mjs"
      - "scripts/verify/perf-v13-fee-chunks-integration-check*.mjs"
      - "scripts/verify/perf-v13-borrowed-recovery-integration-check*.mjs"
      - "scripts/verify/perf-v13-seal-guarded-integration-check*.mjs"
      - "scripts/verify/perf-v13-seal-compact-default-integration-check*.mjs"
      - "scripts/verify/perf-v13-anchor-order-integration-check*.mjs"
      - "scripts/verify/streambft-candidate-check.sh"
  workflow_dispatch:
    inputs:
      run_linux_supply:
        description: "Root-scheduled private Linux Supply256x4@512; 45s active+15s cleanup; separate from Darwin comparisons"
        type: boolean
        default: false
      linux_supply_transport:
        description: "Existing ABCI transport for explicitly scheduled Linux Supply case; other workload/caps unchanged"
        type: choice
        options:
          - socket
          - grpc
        default: socket
      linux_supply_profile:
        description: "Fixed Supply shape, always1024 total; 512x2 is gRPC only"
        type: choice
        options:
          - supply-256x4
          - supply-512x2
        default: supply-256x4
      linux_supply_pacing:
        description: "Explicit bounded short-jitter compensation for512x2 only; relative remains default"
        type: choice
        options:
          - relative
          - bounded-cadence
          - grouped-cadence4
          - paired-relative-bounded
          - paired-bounded-grouped
          - paired-independent-shared
        default: relative
      measure_anchor_validation:
        description: "Compare full Validate anchor ordering on retained actual1024state; no network workload"
        type: boolean
        default: false
      measure_observer_phases:
        description: "Opt-in original RPC/quorum/durable timing on a separately scheduled single Supply case; no extra calls"
        type: boolean
        default: false
      measure_supply_1000_fixture:
        description: "Explicit2048 sender fixture-only resource measurement; original45+15/1GiB32MiB guards, no nodes or network workload"
        type: boolean
        default: false
      measure_state_hash_encoding:
        description: "Compare original and chunked canonical encoders on the retained real 1024-transfer state"
        type: boolean
        default: false
      measure_real_fee_history:
        description: "Measure bounded actual signed application history beyond the default reader limit"
        type: boolean
        default: false
      profile_state_validation:
        description: "Sample full state validation CPU: at most 32 calls, stop scheduling after 2s, 1 MiB output cap"
        type: boolean
        default: false
      build_darwin_phase_node:
        description: "Build an isolated darwin/arm64 phase-timing node candidate after all normal gates"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chain-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Chain Core source and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Prepare matched Commit probe dependencies
        env:
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "160MiB"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ynx-commit-storage-pair"
          git rev-parse HEAD HEAD:internal HEAD:cmd/ynx-consensus-perf-client > "$RUNNER_TEMP/ynx-commit-storage-pair/source-pins.txt"
          go version > "$RUNNER_TEMP/ynx-commit-storage-pair/go-version.txt"
          go mod download 2>&1 | tee "$RUNNER_TEMP/ynx-commit-storage-pair/dependencies.log"
      - name: Measure matched Commit storage and crash recovery
        env:
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "160MiB"
          GOPROXY: "off"
          GOTOOLCHAIN: "local"
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          YNX_CHAIN_PERF: "1"
          YNX_CHAIN_PERF_DIR: ${{ runner.temp }}/ynx-commit-storage-pair
        run: |
          set -o pipefail
          go test -p 1 ./internal/consensus -run '^(TestCommitStorageMatchedPerformance|TestBlockJournalAbruptExit|TestBlockJournalFailedWriterRetiresWithoutPublishing)$' -count=1 -timeout=45s -v 2>&1 | tee "$RUNNER_TEMP/ynx-commit-storage-pair/go-test.log"
      - name: Measure guarded seal phases and verify mutation fallback
        env:
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "160MiB"
          GOPROXY: "off"
          GOTOOLCHAIN: "local"
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
        run: |
          set -o pipefail
          go test -p 1 ./internal/consensus -run '^TestSeal' -count=1 -timeout=45s -v 2>&1 | tee "$RUNNER_TEMP/ynx-commit-storage-pair/seal-phases-and-safety.log"
      - name: Verify anchor ordering and explicitly selected full validation cost
        env:
          YNX_MEASURE_ANCHOR_VALIDATION: ${{ inputs.measure_anchor_validation && '1' || '0' }}
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "160MiB"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOWORK: "off"
        run: |
          set -o pipefail
          anchor_args=(-count=1)
          if [[ "$YNX_MEASURE_ANCHOR_VALIDATION" == "1" ]]; then
            anchor_args=(-bench '^BenchmarkStateAnchorComparison$' -benchtime=200ms -count=3)
          fi
          go test -p 1 ./internal/consensus -run '^TestStateAnchorRecordShortCircuitPreservesValidation$' "${anchor_args[@]}" -timeout=45s -v 2>&1 | tee "$RUNNER_TEMP/ynx-commit-storage-pair/anchor-validation-cost.log"
      - name: Retain actual matched Commit evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commit-storage-pair-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-commit-storage-pair
          if-no-files-found: error
          retention-days: 90
      - run: npm ci
      - run: npm run hardhat:build
      - name: Verify compiler output preserves controlled evidence and scanner failures
        run: node --test scripts/contracts/hardhat-output.test.mjs
      - run: make static-check
      - run: make streambft-candidate-check
      - run: make consensus-abci-check
      - name: Verify bounded performance controller and evidence contracts
        run: >-
          node --test
          scripts/loadtest/consensus-light-plan.test.mjs
          scripts/loadtest/native-resource-sample.test.mjs
          scripts/loadtest/native-resource-probe.test.mjs
          scripts/loadtest/node-phase-timing.test.mjs
          scripts/loadtest/owned-process-race.test.mjs
          scripts/loadtest/same-control-readback.test.mjs
          scripts/verify/perf-v13-integration-check.test.mjs
          scripts/verify/perf-v13-fee-chunks-integration-check.test.mjs
          release/integration/candidates/perf-state-v13-fee-chunks/check.test.mjs
          scripts/verify/perf-v13-borrowed-recovery-integration-check.test.mjs
          release/integration/candidates/perf-state-v13-borrowed-recovery/check.test.mjs
          scripts/verify/perf-v13-seal-guarded-integration-check.test.mjs
          release/integration/candidates/perf-state-v13-seal-guarded/check.test.mjs
          scripts/verify/perf-v13-seal-compact-default-integration-check.test.mjs
          release/integration/candidates/perf-state-v13-seal-compact-default/check.test.mjs
          scripts/verify/perf-v13-anchor-order-integration-check.test.mjs
          release/integration/candidates/perf-state-v13-anchor-order/check.test.mjs
      - name: Verify Linux Supply isolation and refusal counterexamples (no nodes)
        run: python3 -B scripts/loadtest/test_supply_linux_window.py -v
      - name: Verify ready-sender Commit phases and bounded event timeline
        run: >-
          go test -p 1 ./cmd/ynx-consensus-perf-client
          -run '^(TestEndpointFair.*|TestSharedReplay.*|TestDurableReaderSharesOnlyReplayCryptoFactsAcrossIndependentStores|TestObserverPhaseTiming.*|TestReadyPacing.*|TestReadySenderFastAccountAdvancesBeforeSlowPeer|TestReadySenderSegmentedIntentBarrierAndRecovery|TestReadyTimeline.*|TestReadySenderCumulative.*|TestTerminalStreamReadback.*|TestEndpointAndWorkloadBounds|TestStreamingWorkload.*)$'
          -count=1 -timeout=45s -v
      - name: Verify opt-in node phase timings against real durable execution
        run: go test -p 1 ./cmd/ynx-abci -run '^TestPhaseTiming' -count=1 -timeout=45s -v
      - name: Measure bounded real signed fee history
        if: github.event_name == 'workflow_dispatch' && inputs.measure_real_fee_history
        env:
          YNX_CHAIN_REAL_HISTORY: "1"
          YNX_CHAIN_VALIDATE_CPU_PROFILE: ${{ inputs.profile_state_validation && '1' || '0' }}
          YNX_CHAIN_REAL_HISTORY_DIR: ${{ runner.temp }}/ynx-real-fee-history
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "512MiB"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOWORK: "off"
        run: go test -p 1 ./cmd/ynx-consensus-perf-client -run '^TestStreamingWorkloadActualFeeHistoryReadback$' -count=1 -timeout=240s -v
      - name: Measure same actual large-history seal phases without rewriting input
        if: github.event_name == 'workflow_dispatch' && inputs.measure_real_fee_history
        env:
          YNX_CHAIN_SEAL_REAL_HISTORY: "1"
          YNX_CHAIN_REAL_HISTORY_DIR: ${{ runner.temp }}/ynx-real-fee-history
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "512MiB"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOWORK: "off"
        run: |
          set -o pipefail
          go test -p 1 ./internal/consensus -run '^TestSealGuardedActualLargeHistoryPhases$' -count=1 -timeout=45s -v 2>&1 | tee "$RUNNER_TEMP/ynx-real-fee-history/seal-phases.log"
      - name: Retain actual signed fee-history evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.measure_real_fee_history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-fee-history-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-real-fee-history
          if-no-files-found: error
          retention-days: 90
      - name: Retain small selected application and seal phase reports
        if: always() && github.event_name == 'workflow_dispatch' && inputs.measure_real_fee_history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-fee-history-phases-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ynx-real-fee-history/result.json
            ${{ runner.temp }}/ynx-real-fee-history/seal-phases.json
            ${{ runner.temp }}/ynx-real-fee-history/seal-phases.log
            ${{ runner.temp }}/ynx-commit-storage-pair/source-pins.txt
            ${{ runner.temp }}/ynx-commit-storage-pair/go-version.txt
          if-no-files-found: error
          retention-days: 90
      - name: Render selected state validation CPU stacks
        if: success() && github.event_name == 'workflow_dispatch' && inputs.measure_real_fee_history && inputs.profile_state_validation
        env:
          GOMAXPROCS: "1"
          GOMEMLIMIT: "128MiB"
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOWORK: "off"
        run: go tool pprof -top -nodecount=30 -unit=ms "${{ runner.temp }}/ynx-real-fee-history/state-validation.cpu.pprof" > "${{ runner.temp }}/ynx-real-fee-history/state-validation-top.txt"
      - name: Retain small selected state validation profile
        if: always() && github.event_name == 'workflow_dispatch' && inputs.measure_real_fee_history && inputs.profile_state_validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: state-validation-profile-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ynx-real-fee-history/state-validation.cpu.pprof
            ${{ runner.temp }}/ynx-real-fee-history/state-validation-top.txt
            ${{ runner.temp }}/ynx-real-fee-history/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify fixed unpublished anchor-order V13 integration contract
        run: make integration-contract-perf-v13-anchor-order-check
      - run: make chain-core-release-check
      - run: make no-placeholder-check
      - run: make secret-scan
      - name: Measure explicitly selected2048 fixture resources without nodes
        if: github.event_name == 'workflow_dispatch' && inputs.measure_supply_1000_fixture
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
          GOMAXPROCS: "1"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOWORK: "off"
          YNX_NETWORK_REQUESTED: ${{ inputs.run_linux_supply && '1' || '0' }}
        run: |
          set -o pipefail
          test "$YNX_NETWORK_REQUESTED" = 0
          mkdir "$RUNNER_TEMP/ynx-fixture-resource-build" "$RUNNER_TEMP/ynx-fixture-resource-evidence"
          python3 -B scripts/loadtest/supply-linux-window.py --prepare-1000-fixture > "$RUNNER_TEMP/ynx-fixture-resource-evidence/recipe.json"
          python3 -B scripts/loadtest/supply-linux-window.py --measure-1000-fixture --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ynx-fixture-resource-build" --case "$RUNNER_TEMP/ynx-fixture-resource-case" --receipt "$RUNNER_TEMP/ynx-fixture-resource-evidence/actual.json"
      - name: Preserve fixture-only raw resources including refusal
        if: always() && github.event_name == 'workflow_dispatch' && inputs.measure_supply_1000_fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-resources-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ynx-fixture-resource-evidence/
            ${{ runner.temp }}/ynx-fixture-resource-case/
          if-no-files-found: error
          retention-days: 90
      - name: Build and run explicitly scheduled isolated Linux Supply case
        if: github.event_name == 'workflow_dispatch' && inputs.run_linux_supply
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
          GOMAXPROCS: "1"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOWORK: "off"
          YNX_SUPPLY_TRANSPORT: ${{ inputs.linux_supply_transport }}
          YNX_SUPPLY_PROFILE: ${{ inputs.linux_supply_profile }}
          YNX_SUPPLY_PACING: ${{ inputs.linux_supply_pacing }}
          YNX_OBSERVER_PHASE_TIMING: ${{ inputs.measure_observer_phases && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/ynx-linux-supply-build" "$RUNNER_TEMP/ynx-linux-supply-evidence"
          observer_args=()
          if [ "$YNX_OBSERVER_PHASE_TIMING" = 1 ]; then
            observer_args+=(--observer-phases)
          fi
          if [ "$YNX_SUPPLY_PACING" = paired-relative-bounded ]; then
            test "$YNX_OBSERVER_PHASE_TIMING" = 0
            python3 -B scripts/loadtest/supply-linux-window.py --prepare-pair --transport "$YNX_SUPPLY_TRANSPORT" --profile "$YNX_SUPPLY_PROFILE" > "$RUNNER_TEMP/ynx-linux-supply-evidence/recipe.json"
          elif [ "$YNX_SUPPLY_PACING" = paired-bounded-grouped ]; then
            test "$YNX_OBSERVER_PHASE_TIMING" = 0
            python3 -B scripts/loadtest/supply-linux-window.py --prepare-pair --pair-kind bounded-grouped --transport "$YNX_SUPPLY_TRANSPORT" --profile "$YNX_SUPPLY_PROFILE" > "$RUNNER_TEMP/ynx-linux-supply-evidence/recipe.json"
          elif [ "$YNX_SUPPLY_PACING" = paired-independent-shared ]; then
            test "$YNX_OBSERVER_PHASE_TIMING" = 1
            python3 -B scripts/loadtest/supply-linux-window.py --prepare-pair --pair-kind independent-shared --observer-phases --transport "$YNX_SUPPLY_TRANSPORT" --profile "$YNX_SUPPLY_PROFILE" > "$RUNNER_TEMP/ynx-linux-supply-evidence/recipe.json"
          else
            python3 -B scripts/loadtest/supply-linux-window.py --transport "$YNX_SUPPLY_TRANSPORT" --profile "$YNX_SUPPLY_PROFILE" --pacing "$YNX_SUPPLY_PACING" "${observer_args[@]}" > "$RUNNER_TEMP/ynx-linux-supply-evidence/recipe.json"
          fi
          python3 -B scripts/loadtest/supply-linux-window.py --check-runner --build "$RUNNER_TEMP/ynx-linux-supply-build" --case "$RUNNER_TEMP/ynx-linux-supply-preflight" > "$RUNNER_TEMP/ynx-linux-supply-evidence/preflight.json"
          go build -p 1 -trimpath -o "$RUNNER_TEMP/ynx-linux-supply-build/ynx-abci" ./cmd/ynx-abci
          go build -p 1 -trimpath -o "$RUNNER_TEMP/ynx-linux-supply-build/cometbft" github.com/cometbft/cometbft/cmd/cometbft
          go build -p 1 -trimpath -o "$RUNNER_TEMP/ynx-linux-supply-build/ynx-consensus-perf-fixture" ./cmd/ynx-consensus-perf-fixture
          go build -p 1 -trimpath -o "$RUNNER_TEMP/ynx-linux-supply-build/ynx-consensus-perf-client" ./cmd/ynx-consensus-perf-client
          if [ "$YNX_SUPPLY_PACING" = paired-relative-bounded ]; then
            python3 -B scripts/loadtest/supply-linux-window.py --execute-pair --transport "$YNX_SUPPLY_TRANSPORT" --profile "$YNX_SUPPLY_PROFILE" --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ynx-linux-supply-build" --case "$RUNNER_TEMP/ynx-linux-supply-pair" --receipt "$RUNNER_TEMP/ynx-linux-supply-evidence/actual.json"
          elif [ "$YNX_SUPPLY_PACING" = paired-bounded-grouped ]; then
            python3 -B scripts/loadtest/supply-linux-window.py --execute-pair --pair-kind bounded-grouped --transport "$YNX_SUPPLY_TRANSPORT" --profile "$YNX_SUPPLY_PROFILE" --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ynx-linux-supply-build" --case "$RUNNER_TEMP/ynx-linux-supply-pair" --receipt "$RUNNER_TEMP/ynx-linux-supply-evidence/actual.json"
          elif [ "$YNX_SUPPLY_PACING" = paired-independent-shared ]; then
            python3 -B scripts/loadtest/supply-linux-window.py --execute-pair --pair-kind independent-shared --observer-phases --transport "$YNX_SUPPLY_TRANSPORT" --profile "$YNX_SUPPLY_PROFILE" --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ynx-linux-supply-build" --case "$RUNNER_TEMP/ynx-linux-supply-pair" --receipt "$RUNNER_TEMP/ynx-linux-supply-evidence/actual.json"
          else
            python3 -B scripts/loadtest/supply-linux-window.py --execute --transport "$YNX_SUPPLY_TRANSPORT" --profile "$YNX_SUPPLY_PROFILE" --pacing "$YNX_SUPPLY_PACING" "${observer_args[@]}" --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/ynx-linux-supply-build" --case "$RUNNER_TEMP/ynx-linux-supply-case" --receipt "$RUNNER_TEMP/ynx-linux-supply-evidence/actual.json"
          fi
      - name: Preserve isolated Linux Supply raw evidence including failure
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_linux_supply
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-supply-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ynx-linux-supply-evidence
            ${{ runner.temp }}/ynx-linux-supply-case
            ${{ runner.temp }}/ynx-linux-supply-pair
          if-no-files-found: error
          retention-days: 90
      - name: Measure selected matched state hash encoders
        id: state_hash_encoding
        if: github.event_name == 'workflow_dispatch' && inputs.measure_state_hash_encoding
        env:
          YNX_CHAIN_ENCODING_STATE: ${{ github.workspace }}/docs/performance/fixtures/state-hash-real-1024.json
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "160MiB"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOWORK: "off"
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/ynx-state-hash-encoding"
          git rev-parse HEAD HEAD:internal > "$RUNNER_TEMP/ynx-state-hash-encoding/source-pins.txt"
          printf '%s  %s\n' 'ea203b08c94178ec0132b71f3ec16d731de8e44595f6fd742e331b41d80caf56' 'docs/performance/fixtures/state-hash-real-1024.json' | sha256sum -c -
          cp docs/performance/fixtures/state-hash-real-1024.manifest.json "$RUNNER_TEMP/ynx-state-hash-encoding/fixture-manifest.json"
          go test -p 1 ./internal/consensus -run '^$' -bench '^BenchmarkCommittedStateHashJSON/(original_borrowed_encoder|fee_chunked_encoder)$' -benchtime=200ms -count=3 -timeout=45s -v 2>&1 | tee "$RUNNER_TEMP/ynx-state-hash-encoding/go-benchmark.log"
      - name: Retain selected matched state hash encoder evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.measure_state_hash_encoding && steps.state_hash_encoding.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: state-hash-encoding-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-state-hash-encoding
          if-no-files-found: error
          retention-days: 90
      - name: Build isolated Darwin phase-timing node candidate
        if: github.event_name == 'workflow_dispatch' && inputs.build_darwin_phase_node
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "160MiB"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOWORK: "off"
        run: |
          mkdir "$RUNNER_TEMP/ynx-darwin-phase-node"
          go build -p 1 -trimpath -o "$RUNNER_TEMP/ynx-darwin-phase-node/ynx-abci" ./cmd/ynx-abci
          node scripts/loadtest/write-phase-node-build-receipt.mjs "$RUNNER_TEMP/ynx-darwin-phase-node"
          go build -p 1 -trimpath -o "$RUNNER_TEMP/ynx-darwin-phase-node/cometbft" github.com/cometbft/cometbft/cmd/cometbft
          node scripts/loadtest/write-comet-build-receipt.mjs "$RUNNER_TEMP/ynx-darwin-phase-node"
          go build -p 1 -trimpath -o "$RUNNER_TEMP/ynx-darwin-phase-node/ynx-consensus-perf-client" ./cmd/ynx-consensus-perf-client
          node scripts/loadtest/write-phase-node-build-receipt.mjs "$RUNNER_TEMP/ynx-darwin-phase-node" client
      - name: Retain isolated Darwin phase-timing node candidate
        if: github.event_name == 'workflow_dispatch' && inputs.build_darwin_phase_node
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darwin-phase-node-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-darwin-phase-node
          if-no-files-found: error
          retention-days: 90
      - name: Upload Chain Core handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chain-core-handoff-${{ github.sha }}
          path: |
            FEATURE_COMPLETION_EVIDENCE.md
            docs/architecture/STREAMBFT_CANDIDATE.md
            docs/integration/CHAIN_CORE_INTEGRATION_HANDOFF.md
            docs/integration/CHAIN_CORE_CROSS_PRODUCT_TEST_VECTORS.json
            docs/integration/CHAIN_CORE_DEPENDENCY_ACCEPTANCE.md
            docs/integration/WEBSITE_HANDOFF.md
            release/integration/chain-core-contract.json
            release/chain-core/artifact-registry.json
            release/chain-core/product-release.json
            release/chain-core/public-product-metadata.json
          if-no-files-found: error
          retention-days: 90
