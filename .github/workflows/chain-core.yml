name: chain-core

on:
  push:
    branches:
      - codex/final-chain-core
      - codex/chain-performance-20261017
    paths:
      - ".github/workflows/chain-core.yml"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "docs/architecture/STREAMBFT_CANDIDATE.md"
      - "docs/formal/streambft/**"
      - "docs/integration/**"
      - "release/**"
      - "scripts/validate/**"
      - "scripts/loadtest/**"
      - "scripts/verify/integration-contract-check.mjs"
      - "scripts/verify/chain-core-release-check.mjs"
      - "scripts/verify/streambft-candidate-check.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/chain-core.yml"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "docs/architecture/STREAMBFT_CANDIDATE.md"
      - "docs/formal/streambft/**"
      - "docs/integration/**"
      - "release/**"
      - "scripts/validate/**"
      - "scripts/loadtest/**"
      - "scripts/verify/integration-contract-check.mjs"
      - "scripts/verify/chain-core-release-check.mjs"
      - "scripts/verify/streambft-candidate-check.sh"
  workflow_dispatch:
    inputs:
      measure_real_fee_history:
        description: "Measure bounded actual signed application history beyond the default reader limit"
        type: boolean
        default: false
      build_darwin_phase_node:
        description: "Build an isolated darwin/arm64 phase-timing node candidate after all normal gates"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chain-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Chain Core source and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify bounded performance controller and evidence contracts
        run: >-
          node --test
          scripts/loadtest/consensus-light-plan.test.mjs
          scripts/loadtest/native-resource-sample.test.mjs
          scripts/loadtest/native-resource-probe.test.mjs
          scripts/loadtest/node-phase-timing.test.mjs
          scripts/loadtest/owned-process-race.test.mjs
          scripts/loadtest/same-control-readback.test.mjs
          scripts/verify/perf-v13-integration-check.test.mjs
      - name: Prepare matched Commit probe dependencies
        env:
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "160MiB"
        run: |
          mkdir -p "$RUNNER_TEMP/ynx-commit-storage-pair"
          git rev-parse HEAD HEAD:internal HEAD:cmd/ynx-consensus-perf-client > "$RUNNER_TEMP/ynx-commit-storage-pair/source-pins.txt"
          go version > "$RUNNER_TEMP/ynx-commit-storage-pair/go-version.txt"
          go mod download 2>&1 | tee "$RUNNER_TEMP/ynx-commit-storage-pair/dependencies.log"
      - name: Measure matched Commit storage and crash recovery
        env:
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "160MiB"
          GOPROXY: "off"
          GOTOOLCHAIN: "local"
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          YNX_CHAIN_PERF: "1"
          YNX_CHAIN_PERF_DIR: ${{ runner.temp }}/ynx-commit-storage-pair
        run: |
          go test -p 1 ./internal/consensus -run '^(TestCommitStorageMatchedPerformance|TestBlockJournalAbruptExit|TestBlockJournalFailedWriterRetiresWithoutPublishing)$' -count=1 -timeout=45s -v 2>&1 | tee "$RUNNER_TEMP/ynx-commit-storage-pair/go-test.log"
      - name: Retain actual matched Commit evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commit-storage-pair-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-commit-storage-pair
          if-no-files-found: error
          retention-days: 90
      - run: npm ci
      - run: npm run hardhat:build
      - name: Verify compiler output preserves controlled evidence and scanner failures
        run: node --test scripts/contracts/hardhat-output.test.mjs
      - run: make static-check
      - run: make streambft-candidate-check
      - run: make consensus-abci-check
      - name: Verify ready-sender Commit phases and bounded event timeline
        run: >-
          go test -p 1 ./cmd/ynx-consensus-perf-client
          -run '^(TestReadySenderFastAccountAdvancesBeforeSlowPeer|TestReadySenderSegmentedIntentBarrierAndRecovery|TestReadyTimeline.*|TestReadySenderCumulative.*|TestTerminalStreamReadback.*|TestEndpointAndWorkloadBounds|TestStreamingWorkload.*)$'
          -count=1 -timeout=45s -v
      - name: Verify opt-in node phase timings against real durable execution
        run: go test -p 1 ./cmd/ynx-abci -run '^TestPhaseTiming' -count=1 -timeout=45s -v
      - name: Verify fixed unpublished performance V13 integration contract
        run: make integration-contract-perf-v13-check
      - run: make chain-core-release-check
      - run: make no-placeholder-check
      - run: make secret-scan
      - name: Measure bounded real signed fee history
        if: github.event_name == 'workflow_dispatch' && inputs.measure_real_fee_history
        env:
          YNX_CHAIN_REAL_HISTORY: "1"
          YNX_CHAIN_REAL_HISTORY_DIR: ${{ runner.temp }}/ynx-real-fee-history
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "512MiB"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOWORK: "off"
        run: go test -p 1 ./cmd/ynx-consensus-perf-client -run '^TestStreamingWorkloadActualFeeHistoryReadback$' -count=1 -timeout=240s -v
      - name: Retain actual signed fee-history evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.measure_real_fee_history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-fee-history-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-real-fee-history
          if-no-files-found: error
          retention-days: 90
      - name: Build isolated Darwin phase-timing node candidate
        if: github.event_name == 'workflow_dispatch' && inputs.build_darwin_phase_node
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
          GOMAXPROCS: "1"
          GOGC: "50"
          GOMEMLIMIT: "160MiB"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOWORK: "off"
        run: |
          mkdir "$RUNNER_TEMP/ynx-darwin-phase-node"
          go build -p 1 -trimpath -o "$RUNNER_TEMP/ynx-darwin-phase-node/ynx-abci" ./cmd/ynx-abci
          node scripts/loadtest/write-phase-node-build-receipt.mjs "$RUNNER_TEMP/ynx-darwin-phase-node"
      - name: Retain isolated Darwin phase-timing node candidate
        if: github.event_name == 'workflow_dispatch' && inputs.build_darwin_phase_node
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darwin-phase-node-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-darwin-phase-node
          if-no-files-found: error
          retention-days: 90
      - name: Upload Chain Core handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chain-core-handoff-${{ github.sha }}
          path: |
            FEATURE_COMPLETION_EVIDENCE.md
            docs/architecture/STREAMBFT_CANDIDATE.md
            docs/integration/CHAIN_CORE_INTEGRATION_HANDOFF.md
            docs/integration/CHAIN_CORE_CROSS_PRODUCT_TEST_VECTORS.json
            docs/integration/CHAIN_CORE_DEPENDENCY_ACCEPTANCE.md
            docs/integration/WEBSITE_HANDOFF.md
            release/integration/chain-core-contract.json
            release/chain-core/artifact-registry.json
            release/chain-core/product-release.json
            release/chain-core/public-product-metadata.json
          if-no-files-found: error
          retention-days: 90
