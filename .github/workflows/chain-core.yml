name: chain-core

on:
  push:
    branches:
      - codex/final-chain-core
      - codex/chain-batch-v01-performance
    paths:
      - ".github/workflows/chain-core.yml"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "docs/architecture/STREAMBFT_CANDIDATE.md"
      - "docs/formal/streambft/**"
      - "docs/integration/**"
      - "release/**"
      - "scripts/validate/**"
      - "scripts/loadtest/**"
      - "scripts/verify/integration-contract-check.mjs"
      - "scripts/verify/chain-core-release-check.mjs"
      - "scripts/verify/streambft-candidate-check.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/chain-core.yml"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "docs/architecture/STREAMBFT_CANDIDATE.md"
      - "docs/formal/streambft/**"
      - "docs/integration/**"
      - "release/**"
      - "scripts/validate/**"
      - "scripts/loadtest/**"
      - "scripts/verify/integration-contract-check.mjs"
      - "scripts/verify/chain-core-release-check.mjs"
      - "scripts/verify/streambft-candidate-check.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chain-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Chain Core source and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Produce original signed public proof fixture and offline verifier
        env:
          GOMAXPROCS: "1"
          GOMEMLIMIT: "160MiB"
          YNX_PQ_TRANSACTION_PROOF_FIXTURE_OUT: ${{ runner.temp }}/pq-perf-original-public-proof.json
        run: |
          go build -p 1 -o "${{ runner.temp }}/pq-perf-original-verifier" ./cmd/ynx-consensus-proof-verify
          go test -p 1 ./internal/consensus -run '^TestPQConsensusTransactionProofPublicFixture$' -count=1 -timeout=60s -v
          test -s "$YNX_PQ_TRANSACTION_PROOF_FIXTURE_OUT"
      - name: Verify canonical PQ Whole and Native N1 clients with UNKNOWN original readback
        env:
          GOMAXPROCS: "1"
          GOMEMLIMIT: "160MiB"
          YNX_PERF_PQ_PROOF_FIXTURE: ${{ runner.temp }}/pq-perf-original-public-proof.json
          YNX_PERF_PQ_PROOF_VERIFIER: ${{ runner.temp }}/pq-perf-original-verifier
        run: go test -p 1 -race ./cmd/ynx-consensus-perf-client -run '^TestPQ(Whole|Member|Registration)Case' -count=1 -timeout=30s -v
      - name: Verify bounded performance controller and evidence contracts
        run: >-
          node --test
          scripts/loadtest/consensus-light-plan.test.mjs
          scripts/loadtest/native-resource-sample.test.mjs
          scripts/loadtest/native-resource-probe.test.mjs
          scripts/loadtest/owned-process-race.test.mjs
          scripts/loadtest/same-control-readback.test.mjs
          scripts/loadtest/pq-fresh-phase-readback.test.mjs
      - run: npm ci
      - run: npm run hardhat:build
      - name: Generate original contract selectors required by ABCI execution fixtures
        run: npm run contracts:selectors
      - name: Verify compiler output preserves controlled evidence and scanner failures
        run: node --test scripts/contracts/hardhat-output.test.mjs
      - run: make static-check
      - run: make streambft-candidate-check
      - run: make consensus-abci-check
      - name: Verify actual ready-sender Commit phase observations
        run: >-
          go test -p 1 ./cmd/ynx-consensus-perf-client
          -run '^(TestReadySenderFastAccountAdvancesBeforeSlowPeer|TestReadySenderSegmentedIntentBarrierAndRecovery)$'
          -count=1 -timeout=45s -v
      - run: node scripts/verify/integration-contract-check.mjs
      - run: node scripts/verify/chain-core-release-check.mjs
      - run: make no-placeholder-check
      - name: Verify exact public fixture scan and fail-closed inventory
        run: bash scripts/validate/secret-scan-check.sh
      - run: make secret-scan
      - name: Select pinned normal helper toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.26.10"
      - name: Build current Whole-proof successor client without replacing frozen fresh client
        env:
          GOMAXPROCS: "1"
          GOMEMLIMIT: "160MiB"
        run: |
          test -z "$(git status --porcelain)"
          mkdir -m 0700 "$RUNNER_TEMP/ynx-pq-performance-successor-client"
          go build -p 1 -trimpath -buildvcs=true -o "$RUNNER_TEMP/ynx-pq-performance-successor-client/ynx-consensus-perf-client" ./cmd/ynx-consensus-perf-client
          go version -m "$RUNNER_TEMP/ynx-pq-performance-successor-client/ynx-consensus-perf-client" > "$RUNNER_TEMP/ynx-pq-performance-successor-client/go-build-info.txt"
          python3 - "$RUNNER_TEMP/ynx-pq-performance-successor-client" <<'PYMETA'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          version = subprocess.check_output(['go', 'version'], text=True).strip()
          assert version == 'go version go1.26.10 linux/amd64', version
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == os.environ['GITHUB_SHA']
          info = (root / 'go-build-info.txt').read_text()
          assert 'vcs.revision=' + commit in info and 'vcs.modified=false' in info
          files = {}
          for name in ('ynx-consensus-perf-client', 'go-build-info.txt'):
              path = root / name
              assert path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= 128 << 20
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(65536), b''):
                      digest.update(chunk)
              files[name] = dict(bytes=path.stat().st_size, sha256=digest.hexdigest())
          result = dict(kind='ynx-pq-performance-successor-client-build', commit=commit, producerCommit=os.environ['GITHUB_SHA'],
                        sourceTree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                        clientCodeTree=subprocess.check_output(['git', 'rev-parse', 'HEAD:cmd/ynx-consensus-perf-client'], text=True).strip(),
                        target='linux-amd64', goVersion=version, files=files,
                        normalSourceTestsToolchain='original chain-core Go 1.25 source job',
                        frozenFresh70ClientReplaced=False, executionAuthorized=False, publicDeployment=False)
          with (root / 'SOURCE.json').open('x') as handle:
              json.dump(result, handle, sort_keys=True, separators=(',', ':'))
              handle.write('\n')
          PYMETA
      - name: Upload current successor client with separate source identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ynx-pq-performance-successor-client-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-pq-performance-successor-client/
          if-no-files-found: error
          retention-days: 7
      - name: Checkout exact client source required by original fresh callee
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: 70e7e450997a0ae77dbad5a8be3682f482c6ddd8
          path: pq-client-pinned-source
          persist-credentials: false
      - name: Prebuild bounded Linux PQ performance client for Root-scheduled windows
        working-directory: pq-client-pinned-source
        env:
          GOMAXPROCS: "1"
          GOMEMLIMIT: "160MiB"
        run: |
          test -z "$(git status --porcelain)"
          mkdir -m 0700 "$RUNNER_TEMP/ynx-pq-performance-client"
          go build -p 1 -trimpath -buildvcs=true -o "$RUNNER_TEMP/ynx-pq-performance-client/ynx-consensus-perf-client" ./cmd/ynx-consensus-perf-client
          go version -m "$RUNNER_TEMP/ynx-pq-performance-client/ynx-consensus-perf-client" > "$RUNNER_TEMP/ynx-pq-performance-client/go-build-info.txt"
          python3 - "$RUNNER_TEMP/ynx-pq-performance-client" <<'PYMETA'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          version = subprocess.check_output(['go', 'version'], text=True).strip()
          assert version == 'go version go1.26.10 linux/amd64', version
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == '70e7e450997a0ae77dbad5a8be3682f482c6ddd8'
          info = (root / 'go-build-info.txt').read_text()
          assert 'vcs.revision=' + commit in info and 'vcs.modified=false' in info
          files = {}
          for name in ('ynx-consensus-perf-client', 'go-build-info.txt'):
              path = root / name
              assert path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= 128 << 20
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(65536), b''):
                      digest.update(chunk)
              files[name] = dict(bytes=path.stat().st_size, sha256=digest.hexdigest())
          result = dict(kind='ynx-pq-performance-client-build', commit=commit, producerCommit=os.environ['GITHUB_SHA'],
                        sourceTree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                        clientCodeTree=subprocess.check_output(['git', 'rev-parse', 'HEAD:cmd/ynx-consensus-perf-client'], text=True).strip(),
                        target='linux-amd64', goVersion=version, files=files,
                        normalSourceTestsToolchain='original chain-core Go 1.25 source job',
                        executionAuthorized=False, publicDeployment=False)
          with (root / 'SOURCE.json').open('x') as handle:
              json.dump(result, handle, sort_keys=True, separators=(',', ':'))
              handle.write('\n')
          PYMETA
      - name: Upload prebuilt public PQ performance client and exact source identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ynx-pq-performance-client-linux-amd64-70e7e450997a0ae77dbad5a8be3682f482c6ddd8-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-pq-performance-client/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Chain Core handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chain-core-handoff-${{ github.sha }}
          path: |
            FEATURE_COMPLETION_EVIDENCE.md
            docs/architecture/STREAMBFT_CANDIDATE.md
            docs/integration/CHAIN_CORE_INTEGRATION_HANDOFF.md
            docs/integration/CHAIN_CORE_CROSS_PRODUCT_TEST_VECTORS.json
            docs/integration/CHAIN_CORE_DEPENDENCY_ACCEPTANCE.md
            docs/integration/WEBSITE_HANDOFF.md
            release/integration/chain-core-contract.json
            release/chain-core/artifact-registry.json
            release/chain-core/product-release.json
            release/chain-core/public-product-metadata.json
          if-no-files-found: error
          retention-days: 90
