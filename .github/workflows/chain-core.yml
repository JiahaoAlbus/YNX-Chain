          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # original immutable setup-go
        with:
          go-version: '1.26.11'
          cache: false
      - name: Stage only the original P04 source and Docker context
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/p04-native-docker-evidence"
