name: Android completion supplier normal SDK intake
on:
  push:
    branches: [codex/wallet-auth49-android-completion-intake-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prefix-types-and-source-package:
    if: github.ref == 'refs/heads/codex/wallet-auth49-android-completion-intake-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.7.0'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - shell: bash
        run: |
          set -euo pipefail
          export YNX_COMPLETION_INTAKE_OUT="$GITHUB_WORKSPACE/completion-intake-output"
          node scripts/ci/android-completion-producer-intake.mjs 2>&1 | tee completion-intake.log
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-completion-normal-intake
          path: |
            completion-intake.log
            completion-intake-output
            canonical-common-source-package
