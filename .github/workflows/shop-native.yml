name: shop-ios-evidence

on:
  pull_request:
    paths:
      - "internal/commerce/**"
      - "apps/shop/native/**"
      - "apps/seller-console/native/**"
      - "apps/seller-console/mutation-intents.js"
      - "apps/seller-console/test/inventory-batch-cli.test.mjs"
      - "apps/seller-console/test/inventory-batch-http.mjs"
      - "apps/seller-console/test/mutation-intents.test.mjs"
      - "apps/seller-console/test/warehouse-*.mjs"
      - "apps/seller-console/scripts/current-wallet-sdk.mjs"
      - "apps/seller-console/vendor/ynx-chain-wallet-auth-1.2.0-r9.tgz"
      - ".github/workflows/shop-native.yml"
  push:
    branches: [main, codex/ecosystem-shop, "codex/shop-*"]
    paths:
      - "internal/commerce/**"
      - "apps/shop/native/**"
      - "apps/seller-console/native/**"
      - "apps/seller-console/mutation-intents.js"
      - "apps/seller-console/test/inventory-batch-cli.test.mjs"
      - "apps/seller-console/test/inventory-batch-http.mjs"
      - "apps/seller-console/test/mutation-intents.test.mjs"
      - "apps/seller-console/test/warehouse-*.mjs"
      - "apps/seller-console/scripts/current-wallet-sdk.mjs"
      - "apps/seller-console/vendor/ynx-chain-wallet-auth-1.2.0-r9.tgz"
      - ".github/workflows/shop-native.yml"
  workflow_dispatch:

jobs:
  change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      source-only: ${{ steps.scope.outputs.source-only }}
      read-tests: ${{ steps.scope.outputs.read-tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        name: Select affected checks from actual source paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          base = os.environ.get("BASE_SHA", "")
          changed = []
          if os.environ["EVENT_NAME"] != "workflow_dispatch" and re.fullmatch(r"[0-9a-f]{40}", base) and base != "0" * 40:
              try:
                  if subprocess.run(["git", "cat-file", "-e", base + "^{commit}"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                      subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", base], check=True)
                  raw = subprocess.check_output(["git", "diff", "--name-only", "-z", base, "HEAD"])
                  changed = raw.decode().rstrip("\0").split("\0") if raw else []
              except (subprocess.SubprocessError, UnicodeError):
                  changed = []  # uncertain comparison keeps the full checks
          def source_path(path):
              return path.startswith("internal/commerce/native_invoice_source_") and path.endswith(".go")
          def native_client_path(path):
              return path in {"internal/commerce/native_pay_client.go", "internal/commerce/native_pay_archive_client_test.go"}
          read_path = lambda p: source_path(p) or native_client_path(p)
          allowed = lambda p: read_path(p) or p in {"internal/commerce/NATIVE_INVOICE_SOURCE_READ.md", ".github/workflows/shop-native.yml"}
          source_only = bool(changed) and any(map(read_path, changed)) and all(map(allowed, changed))
          tests = []
          if not source_only or any(map(source_path, changed)):
              tests.extend(["TestShopInvoiceSource", "TestShopRuntime", "TestShopNativeAPI"])
          if source_only and any(map(native_client_path, changed)):
              tests.extend(["TestNativeShopPay", "TestBusinessNativeInvoice", "TestNativeInvoice"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("source-only=" + str(source_only).lower() + "\n")
              output.write("read-tests=^(" + "|".join(tests) + ")\n")
          print("Read-plane-only checks:", source_only, "actual changed files:", len(changed))
          PY
  order-recovery:
    needs: change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify original intent recovery and build the normal Shop service
        if: needs.change-scope.outputs.source-only != 'true'
        run: |
          set -euo pipefail
          go test -mod=readonly -race -tags commerce_v2 ./internal/commerce ./internal/commerce/cmd/shopd -run '^(TestNativeInvoice|TestBusinessNativeIntent|TestBusinessNativeInvoice|TestNativeShopPay|TestOriginalShopBrowserSeal|TestShopRuntime|TestShopNativeAPI|TestBuyerData|TestPrivacy|TestInventoryBatch|TestCheckout|TestCartRevision|TestWarehouse|TestReturnReceipt|TestBusinessTransition|TestOrderTransition|TestOrderLifecycle)' -count=1
      - name: Verify affected Source and Native Pay reads on original transports
        env:
          READ_TESTS: ${{ needs.change-scope.outputs.read-tests }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shop-original-source-read"
          chmod 700 "$RUNNER_TEMP/shop-original-source-read"
          SHOP_SOURCE_READ_SOCKET_ROOT="$RUNNER_TEMP/shop-original-source-read" \
            go test -mod=readonly -race -tags commerce_v2 ./internal/commerce ./internal/commerce/cmd/shopd -run "$READ_TESTS" -count=1 -v
          go build -mod=readonly -tags commerce_v2 -o "$RUNNER_TEMP/ynx-shopd" ./internal/commerce/cmd/shopd
      - uses: actions/setup-java@v4
        if: needs.change-scope.outputs.source-only != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Check actual Android intent consumer and narrow route policy
        if: needs.change-scope.outputs.source-only != 'true'
        run: |
          set -euo pipefail
          DEPS="$RUNNER_TEMP/shop-intent-deps"
          CLASSES="$RUNNER_TEMP/shop-intent-classes"
          mvn -q dependency:copy -Dartifact=org.json:json:20250517 -DoutputDirectory="$DEPS"
          mvn -q dependency:copy -Dartifact=junit:junit:4.13.2 -DoutputDirectory="$DEPS"
          mvn -q dependency:copy -Dartifact=org.hamcrest:hamcrest-core:1.3 -DoutputDirectory="$DEPS"
          javac -cp "$DEPS/*" -d "$CLASSES" \
            apps/shop/native/android/app/src/main/java/com/ynxweb4/shop/{NativeProductState,NativeBusinessPolicy,BuyerReceipt,NativeIntentObservation}.java \
            apps/shop/native/android/app/src/test/java/com/ynxweb4/shop/NativeIntentObservationTest.java
          java -cp "$CLASSES:$DEPS/*" org.junit.runner.JUnitCore com.ynxweb4.shop.NativeIntentObservationTest
      - uses: actions/setup-node@v4
        if: needs.change-scope.outputs.source-only != 'true'
        with:
          node-version: "22"
      - name: Check inventory CLI against the original official Native SDK input
        if: needs.change-scope.outputs.source-only != 'true'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ynx-shop-inventory-tools" --no-package-lock --ignore-scripts \
            esbuild@0.25.9 @noble/curves@2.2.0 @noble/hashes@2.2.0
          node apps/seller-console/native/check-inventory-cli.mjs "$RUNNER_TEMP/ynx-shop-inventory-tools/node_modules" "$RUNNER_TEMP/inventory-http-fixture.mjs" "$RUNNER_TEMP/warehouse-http-fixture.mjs"
          YNX_SHOP_INVENTORY_CLI_FIXTURE="$RUNNER_TEMP/inventory-http-fixture.mjs" \
            go test -mod=readonly -race -tags commerce_v2 ./internal/commerce -run '^TestInventoryBatchCLIActualHTTP' -count=1 -v
          YNX_SHOP_WAREHOUSE_CLI_FIXTURE="$RUNNER_TEMP/warehouse-http-fixture.mjs" \
            go test -mod=readonly -race -tags commerce_v2 ./internal/commerce -run '^TestWarehouseCLIActualHTTP' -count=1 -v

  android-app-candidate:
    needs: change-scope
    if: needs.change-scope.outputs.source-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Supply the original pinned Native compiler dependencies
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ynx-shop-native-tools" --no-package-lock --ignore-scripts \
            esbuild@0.25.9 @noble/curves@2.2.0 @noble/hashes@2.2.0
          ln -s "$RUNNER_TEMP/ynx-shop-native-tools/node_modules" apps/shop/node_modules
      - name: Build the actual Android app and check original intent recovery
        env:
          YNX_SHOP_API_URL: https://shop-api.ynxweb4.com
        run: |
          set -euo pipefail
          bash apps/shop/native/android/gradlew -p apps/shop/native/android --no-daemon \
            :app:assembleDebug :app:testDebugUnitTest --tests com.ynxweb4.shop.NativeIntentObservationTest --tests com.ynxweb4.shop.NativeInvoiceJourneyTest
      - uses: actions/upload-artifact@v4
        with:
          name: ynx-shop-android-debug
          path: |
            apps/shop/native/android/app/build/outputs/apk/debug/*.apk
            apps/shop/native/android/app/build/test-results/testDebugUnitTest/*.xml
            apps/shop/native/android/app/build/generated/commerce-native-r9/assets/native-session/sdk-manifest.json

  language-regression:
    needs: change-scope
    if: needs.change-scope.outputs.source-only != 'true'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check production language selection and legacy preference preservation
        run: |
          set -euo pipefail
          xcrun swiftc apps/shop/native/ios/YNXShop/ShopLanguage.swift \
            apps/shop/native/ios/tests/ShopLanguageChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-language-checks"
          "$RUNNER_TEMP/ynx-shop-language-checks"
          xcrun swiftc -frontend -parse apps/shop/native/ios/YNXShop/ShopModel.swift \
            apps/shop/native/ios/YNXShop/ContentView.swift

  ios-simulator:
    needs: language-regression
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/shop/native/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Supply exact public dependencies for the normal Native R9 recipe
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ynx-shop-native-tools" --no-package-lock --ignore-scripts \
            esbuild@0.25.9 @noble/curves@2.2.0 @noble/hashes@2.2.0
          ln -s "$RUNNER_TEMP/ynx-shop-native-tools/node_modules" ../../node_modules
          node -e 'const r=require("node:module").createRequire(process.cwd()+"/YNXShop.xcodeproj/package-check.cjs");if(r("esbuild").version!=="0.25.9")throw Error("Native compiler mismatch")'
      - name: Check original Main intent navigation contract
        run: node --test ../pay-intent-navigation.test.mjs
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project YNXShop.xcodeproj \
            -scheme YNXShop \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/YNXShopDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/ynx-shop-ios-build.log"
      - name: Check invoice preview context using the actual generated Native pin
        run: |
          set -euo pipefail
          SDK_PIN="$(find "$RUNNER_TEMP/YNXShopDerivedData" -path '*/commerce-native-r9/NativeSDKPin.swift' -print -quit)"
          test -n "$SDK_PIN"
          SOURCES=()
          for SOURCE in YNXShop/*.swift; do
            case "$SOURCE" in
              */ContentView.swift|*/YNXShopApp.swift) ;;
              *) SOURCES+=("$SOURCE") ;;
            esac
          done
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/InvoicePreviewContextChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-invoice-preview-checks"
          "$RUNNER_TEMP/ynx-shop-invoice-preview-checks"
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/NativeAPIChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-native-api-checks"
          "$RUNNER_TEMP/ynx-shop-native-api-checks"
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/BuyerJourneyChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-buyer-journey-checks"
          "$RUNNER_TEMP/ynx-shop-buyer-journey-checks"
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/NativeInvoiceJourneyChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-native-invoice-journey-checks"
          "$RUNNER_TEMP/ynx-shop-native-invoice-journey-checks"
      - name: Boot, install, launch, and exercise deep link
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone") and x["isAvailable"]))')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH="$RUNNER_TEMP/YNXShopDerivedData/Build/Products/Debug-iphonesimulator/YNXShop.app"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.ynxweb4.shop
          python3 - "$DEVICE_ID" <<'PY'
          import subprocess
          import sys

          subprocess.run(
              ["xcrun", "simctl", "openurl", sys.argv[1], "ynxshop://wallet-auth/callback"],
              check=True,
              timeout=20,
          )
          PY
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/ynx-shop-deeplink.png"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/YNXShop-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ynx-shop-ios-simulator
          path: |
            ${{ runner.temp }}/YNXShop-simulator.zip
            ${{ runner.temp }}/ynx-shop-ios-build.log
            ${{ runner.temp }}/ynx-shop-deeplink.png
