name: shop-ios-evidence

on:
  pull_request:
    paths:
      - "internal/commerce/**"
      - "apps/shop/native/**"
      - "apps/seller-console/native/**"
      - "apps/seller-console/mutation-intents.js"
      - "apps/seller-console/test/inventory-batch-cli.test.mjs"
      - "apps/seller-console/test/inventory-batch-http.mjs"
      - "apps/seller-console/test/mutation-intents.test.mjs"
      - "apps/seller-console/test/warehouse-*.mjs"
      - "apps/seller-console/test/fulfillment-*.mjs"
      - "apps/seller-console/test/return-decision-*.mjs"
      - "apps/seller-console/test/listing-*.mjs"
      - "apps/seller-console/scripts/current-wallet-sdk.mjs"
      - "apps/seller-console/vendor/ynx-chain-wallet-auth-1.2.0-r9.tgz"
      - ".github/workflows/shop-native.yml"
  push:
    branches: [main, codex/ecosystem-shop, "codex/shop-*"]
    paths:
      - "internal/commerce/**"
      - "apps/shop/native/**"
      - "apps/seller-console/native/**"
      - "apps/seller-console/mutation-intents.js"
      - "apps/seller-console/test/inventory-batch-cli.test.mjs"
      - "apps/seller-console/test/inventory-batch-http.mjs"
      - "apps/seller-console/test/mutation-intents.test.mjs"
      - "apps/seller-console/test/warehouse-*.mjs"
      - "apps/seller-console/test/fulfillment-*.mjs"
      - "apps/seller-console/test/return-decision-*.mjs"
      - "apps/seller-console/test/listing-*.mjs"
      - "apps/seller-console/scripts/current-wallet-sdk.mjs"
      - "apps/seller-console/vendor/ynx-chain-wallet-auth-1.2.0-r9.tgz"
      - ".github/workflows/shop-native.yml"
  workflow_dispatch:

env:
  YNX_SHOP_NATIVE_RECEIPT_FIXTURE: ${{ github.workspace }}/apps/shop/native/testdata/native-paid-order.json

jobs:
  change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      navigation-only: ${{ steps.scope.outputs.navigation-only }}
      source-only: ${{ steps.scope.outputs.source-only }}
      lifecycle-fixture-only: ${{ steps.scope.outputs.lifecycle-fixture-only }}
      native-client-only: ${{ steps.scope.outputs.native-client-only }}
      apple-view-only: ${{ steps.scope.outputs.apple-view-only }}
      read-tests: ${{ steps.scope.outputs.read-tests }}
      receipt-test-delta: ${{ steps.scope.outputs.receipt-test-delta }}
      fulfillment-only: ${{ steps.scope.outputs.fulfillment-only }}
      fulfillment-checks: ${{ steps.scope.outputs.fulfillment-checks }}
      return-decision-only: ${{ steps.scope.outputs.return-decision-only }}
      return-decision-checks: ${{ steps.scope.outputs.return-decision-checks }}
      notification-only: ${{ steps.scope.outputs.notification-only }}
      notification-driver-only: ${{ steps.scope.outputs.notification-driver-only }}
      listing-only: ${{ steps.scope.outputs.listing-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        name: Select affected checks from actual source paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          base = os.environ.get("BASE_SHA", "")
          changed = []
          if os.environ["EVENT_NAME"] != "workflow_dispatch" and re.fullmatch(r"[0-9a-f]{40}", base) and base != "0" * 40:
              try:
                  if subprocess.run(["git", "cat-file", "-e", base + "^{commit}"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                      subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", base], check=True)
                  raw = subprocess.check_output(["git", "diff", "--name-only", "-z", base, "HEAD"])
                  changed = raw.decode().rstrip("\0").split("\0") if raw else []
              except (subprocess.SubprocessError, UnicodeError):
                  changed = []  # uncertain comparison keeps the full checks
          def source_path(path):
              return (path.startswith("internal/commerce/native_invoice_source_") and path.endswith(".go")) or path.startswith("internal/securelink/") or path.startswith("cmd/ynx-secure-link-caller/") or path.startswith("internal/commerce/third_party/productreadsource/") or path in {"internal/commerce/PRODUCT_SOURCE_DEPENDENCIES.json", "internal/commerce/verify_product_source_inputs.py"}
          def native_client_path(path):
              return path in {"internal/commerce/native_pay_client.go", "internal/commerce/native_pay_archive_client_test.go"}
          receipt_files = {"internal/commerce/business_effect.go", "internal/commerce/business_effect_http.go", "internal/commerce/business_effect_plans.go", "internal/commerce/business_native_invoice_boundary_test.go", "internal/commerce/model.go", "internal/commerce/return_receipt.go", "internal/commerce/return_receipt_test.go", "internal/commerce/service.go", "internal/commerce/store.go"}
          def receipt_path(path):
              return path in receipt_files or path.startswith("internal/commerce/native_payment_")
          read_path = lambda p: source_path(p) or native_client_path(p) or receipt_path(p)
          allowed = lambda p: read_path(p) or p in {"internal/commerce/NATIVE_INVOICE_SOURCE_READ.md", "internal/commerce/NATIVE_PAYMENT_RECEIPT.md", ".github/workflows/shop-native.yml", "go.mod"}
          navigation_files = {"apps/shop/native/pay-intent-navigation.mjs", "apps/shop/native/pay-intent-navigation.test.mjs", "apps/shop/native/scripts/prepare-pay-operation-test-source.mjs", "apps/shop/native/testdata/pay-original-operation-source.json"}
          navigation_only = bool(changed) and any(p in navigation_files for p in changed) and all(p in navigation_files or p == ".github/workflows/shop-native.yml" for p in changed)
          apple_view_files = {"apps/shop/native/ios/YNXShop/ContentView.swift", ".github/workflows/shop-native.yml"}
          apple_view_only = bool(changed) and "apps/shop/native/ios/YNXShop/ContentView.swift" in changed and all(p in apple_view_files for p in changed)
          native_client_only = bool(changed) and any(p.startswith("apps/shop/native/") for p in changed) and all(p.startswith("apps/shop/native/") or p == ".github/workflows/shop-native.yml" for p in changed)
          source_only = bool(changed) and any(map(read_path, changed)) and all(map(allowed, changed))
          lifecycle_fixture_files = {"internal/commerce/business_native_intent_test.go", "internal/commerce/business_native_invoice_test.go", "internal/commerce/native_order_cancellation_test.go"}
          lifecycle_fixture_only = bool(changed) and any(p in lifecycle_fixture_files for p in changed) and all(p in lifecycle_fixture_files or p == ".github/workflows/shop-native.yml" for p in changed)
          if lifecycle_fixture_only:
              source_only = True  # unchanged production/client trees reuse their exact verified builds
          if source_only and "go.mod" in changed:
              module = "github.com/JiahaoAlbus/YNX-Chain/authowned/productreadsource"
              permitted = {"require " + module + " v0.0.0", "replace " + module + " => ./internal/commerce/third_party/productreadsource", ""}
              delta = subprocess.check_output(["git", "diff", "--unified=0", base, "HEAD", "--", "go.mod"]).decode()
              lines = [line[1:].strip() for line in delta.splitlines() if line.startswith(("+", "-")) and not line.startswith(("+++", "---"))]
              source_only = all(line in permitted for line in lines)
          notification_files = {"internal/commerce/native_pay_notification.go", "internal/commerce/native_pay_notification_test.go", "internal/commerce/native_pay_notification_joint_driver_test.go", "internal/commerce/NATIVE_PAY_NOTIFICATIONS.md", "internal/commerce/native_payment_receipt.go", "internal/commerce/store.go", "internal/commerce/model.go", "internal/commerce/server.go", "internal/commerce/cmd/shopd/native_api.go", "internal/commerce/cmd/shopd/native_api_test.go", "internal/commerce/cmd/shopd/main.go", "internal/commerce/cmd/shopd/native_notification_credentials.go", "internal/commerce/cmd/shopd/native_notification_credentials_test.go"}
          notification_driver_files = {"internal/commerce/native_pay_notification_joint_driver_test.go", "internal/commerce/NATIVE_PAY_NOTIFICATIONS.md", ".github/workflows/shop-native.yml"}
          notification_driver_only = bool(changed) and "internal/commerce/native_pay_notification_joint_driver_test.go" in changed and all(p in notification_driver_files for p in changed)
          notification_only = bool(changed) and any(p.startswith("internal/commerce/native_pay_notification") for p in changed) and all(p in notification_files or p == ".github/workflows/shop-native.yml" for p in changed)
          listing_files = {"apps/seller-console/native/listing-cli.mjs", "apps/seller-console/native/check-listing-cli.mjs", "apps/seller-console/native/LISTING.md", "apps/seller-console/test/listing-cli.test.mjs", "apps/seller-console/test/listing-http.mjs", "internal/commerce/native_listing.go", "internal/commerce/native_listing_test.go", "internal/commerce/publish_listing.go", "internal/commerce/server.go", "internal/commerce/business_routes.go", "internal/commerce/seller_mutation_lookup.go", "internal/commerce/cmd/shopd/native_api.go", "internal/commerce/cmd/shopd/native_api_test.go"}
          listing_only = bool(changed) and any(p in listing_files and "listing" in p for p in changed) and all(p in listing_files or p == ".github/workflows/shop-native.yml" for p in changed)
          fulfillment_files = {"apps/seller-console/native/fulfillment-cli.mjs", "apps/seller-console/native/check-fulfillment-cli.mjs", "apps/seller-console/native/FULFILLMENT.md", "apps/seller-console/test/fulfillment-cli.test.mjs", "apps/seller-console/test/fulfillment-http.mjs", "internal/commerce/fulfillment_cli_test.go"}
          fulfillment_only = bool(changed) and any(p in fulfillment_files for p in changed) and all(p in fulfillment_files or p == ".github/workflows/shop-native.yml" for p in changed)
          fulfillment_checks = not native_client_only and not notification_only and not listing_only and (fulfillment_only or not changed or any(p in fulfillment_files or p in {".github/workflows/shop-native.yml", "internal/commerce/service.go", "internal/commerce/model.go", "internal/commerce/native_payment_receipt.go", "internal/commerce/business_order_transition.go"} for p in changed))
          return_files = {"apps/seller-console/native/return-decision-cli.mjs", "apps/seller-console/native/check-return-decision-cli.mjs", "apps/seller-console/native/RETURN_DECISIONS.md", "apps/seller-console/test/return-decision-cli.test.mjs", "apps/seller-console/test/return-decision-http.mjs", "internal/commerce/original_return_decision_test.go", "internal/commerce/business_order_transition.go", "internal/commerce/service.go", "internal/commerce/server.go", "internal/commerce/seller_mutation_lookup.go"}
          return_decision_only = bool(changed) and any(p in return_files for p in changed) and all(p in return_files or p == ".github/workflows/shop-native.yml" for p in changed)
          return_decision_checks = not native_client_only and not notification_only and not listing_only and (return_decision_only or not changed or any(p in return_files or p == ".github/workflows/shop-native.yml" for p in changed))
          tests = []
          if not source_only or any(map(source_path, changed)):
              tests.extend(["TestShopInvoiceSource", "TestShopRuntime", "TestShopNativeAPI"])
          if source_only and any(map(native_client_path, changed)):
              tests.extend(["TestNativeShopPay", "TestBusinessNativeInvoice", "TestNativeInvoice"])
          if source_only and any(map(receipt_path, changed)):
              tests.extend(["TestNativePaymentReceipt", "TestBusinessNativeInvoice", "TestBusinessSettlement", "TestBusinessPayPerDispatch", "TestPaidSettlement", "TestReturnReceipt", "TestOrderTransition", "TestOrderLifecycle", "TestSnapshot", "TestBuyerData", "TestNativeInvoicePrivacy", "TestShopRuntime", "TestShopNativeAPI"])
          receipt_test_delta = False
          receipt_test = "internal/commerce/native_payment_receipt_test.go"
          test_delta_paths = {receipt_test, "internal/commerce/native_payment_joint_driver_test.go", "internal/commerce/NATIVE_PAYMENT_RECEIPT.md", ".github/workflows/shop-native.yml"}
          if source_only and receipt_test in changed and all(p in test_delta_paths for p in changed):
              old = subprocess.check_output(["git", "show", base + ":" + receipt_test]).decode()
              current = open(receipt_test).read()
              if current.startswith(old):
                  new_tests = re.findall(r"^func (Test[A-Za-z0-9_]+)\(t \*testing\.T\)", current[len(old):], re.M)
                  if new_tests:
                      receipt_test_delta = True
                      tests = new_tests
          if lifecycle_fixture_only:
              tests = ["TestBusinessNativeIntentColdRecoveryUsesOriginalOrderAndNeverSettles", "TestNativeInvoiceCreateAndLookupBindOnlyExactOriginalBill", "TestNativeInvoicePrivacyDeletionRetainsCancelledOriginalAndUnknown", "TestNativeOrderCancellation"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("navigation-only=" + str(navigation_only).lower() + "\n")
              output.write("listing-only=" + str(listing_only).lower() + "\n")
              output.write("notification-driver-only=" + str(notification_driver_only).lower() + "\n")
              output.write("notification-only=" + str(notification_only).lower() + "\n")
              output.write("return-decision-only=" + str(return_decision_only).lower() + "\n")
              output.write("return-decision-checks=" + str(return_decision_checks).lower() + "\n")
              output.write("fulfillment-only=" + str(fulfillment_only).lower() + "\n")
              output.write("fulfillment-checks=" + str(fulfillment_checks).lower() + "\n")
              output.write("receipt-test-delta=" + str(receipt_test_delta).lower() + "\n")
              output.write("apple-view-only=" + str(apple_view_only).lower() + "\n")
              output.write("native-client-only=" + str(native_client_only).lower() + "\n")
              output.write("source-only=" + str(source_only).lower() + "\n")
              output.write("lifecycle-fixture-only=" + str(lifecycle_fixture_only).lower() + "\n")
              output.write("read-tests=^(" + "|".join(tests) + ")\n")
          print("Read-plane-only checks:", source_only, "actual changed files:", len(changed))
          PY
  native-pay-navigation:
    needs: change-scope
    if: needs.change-scope.outputs.navigation-only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare exact original Pay source for controlled contract tests
        working-directory: .
        run: |
          node apps/shop/native/scripts/prepare-pay-operation-test-source.mjs "$RUNNER_TEMP/ynx-shop-pay-original-source"
          echo "YNX_SHOP_FIXED_PAY_RECOVERY_SOURCE_ROOT=$RUNNER_TEMP/ynx-shop-pay-original-source" >> "$GITHUB_ENV"
      - name: Check original Main order navigation and IPC contract
        run: node --test apps/shop/native/pay-intent-navigation.test.mjs
  order-recovery:
    needs: change-scope
    if: needs.change-scope.outputs.navigation-only != 'true' && needs.change-scope.outputs.apple-view-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify complete original Auth and LINK input packages
        run: python3 internal/commerce/verify_product_source_inputs.py
      - name: Verify original intent recovery and build the normal Shop service
        if: needs.change-scope.outputs.navigation-only != 'true' && needs.change-scope.outputs.source-only != 'true' && needs.change-scope.outputs.fulfillment-only != 'true' && needs.change-scope.outputs.return-decision-only != 'true' && needs.change-scope.outputs.notification-only != 'true' && needs.change-scope.outputs.listing-only != 'true' && needs.change-scope.outputs.native-client-only != 'true'
        run: |
          set -euo pipefail
          go test -mod=readonly -race -tags commerce_v2 ./internal/commerce ./internal/commerce/cmd/shopd -run '^(TestNativeOrderCancellation|TestNativePaymentReceiptLateOrCanceled|TestNativePrice|TestNativeSellerSetup|TestNativeSellerRoleRevocation|TestAIOriginal|TestAIRecent|TestAINormal|TestCommerceLateAI|TestNativeInvoice|TestBusinessNativeIntent|TestBusinessNativeInvoice|TestNativeShopPay|TestOriginalShopBrowserSeal|TestShopRuntime|TestShopNativeAPI|TestBuyerData|TestPrivacy|TestInventoryBatch|TestCheckout|TestCartRevision|TestWarehouse|TestReturnReceipt|TestBusinessTransition|TestOrderTransition|TestOrderLifecycle)' -count=1
      - name: Verify affected Source and Native Pay reads on original transports
        if: needs.change-scope.outputs.native-client-only != 'true' && needs.change-scope.outputs.fulfillment-only != 'true' && needs.change-scope.outputs.return-decision-only != 'true' && needs.change-scope.outputs.notification-only != 'true' && needs.change-scope.outputs.listing-only != 'true'
        env:
          READ_TESTS: ${{ needs.change-scope.outputs.read-tests }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shop-original-source-read"
          chmod 700 "$RUNNER_TEMP/shop-original-source-read"
          SHOP_SOURCE_READ_SOCKET_ROOT="$RUNNER_TEMP/shop-original-source-read" \
            go test -mod=readonly -race -tags commerce_v2 ./internal/commerce ./internal/commerce/cmd/shopd -run "$READ_TESTS" -count=1 -v
          if [ "${{ needs.change-scope.outputs.receipt-test-delta }}" != "true" ]; then
            go build -mod=readonly -tags commerce_v2 -o "$RUNNER_TEMP/ynx-shopd" ./internal/commerce/cmd/shopd
          fi
      - name: Check original Native Pay notification receiver and affected durable receipt state
        if: needs.change-scope.outputs.notification-only == 'true' && needs.change-scope.outputs.notification-driver-only != 'true'
        run: |
          set -euo pipefail
          go test -mod=readonly -race -tags commerce_v2 ./internal/commerce ./internal/commerce/cmd/shopd -run '^(TestNativePayNotification|TestShopNativeAPI|TestCommercePersistenceSchemaMigrationRollbackAndRecovery|TestSnapshot|TestNativePaymentReceipt(OriginalPartial|LostRead|Cumulative|KeepsPending))' -count=1 -v | tee "$RUNNER_TEMP/shop-native-notification-checks.log"
          go build -mod=readonly -tags commerce_v2 -o "$RUNNER_TEMP/ynx-shopd-notifications" ./internal/commerce/cmd/shopd
      - uses: actions/upload-artifact@v4
        if: always() && needs.change-scope.outputs.notification-only == 'true' && needs.change-scope.outputs.notification-driver-only != 'true'
        with:
          name: ynx-shop-native-notification-service
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/shop-native-notification-checks.log
            ${{ runner.temp }}/ynx-shopd-notifications
      - name: Compile explicit original notification TLS read driver without rerunning funds workflows
        if: needs.change-scope.outputs.notification-driver-only == 'true'
        run: |
          set -euo pipefail
          go test -c -mod=readonly -race -tags commerce_v2 ./internal/commerce -o "$RUNNER_TEMP/shop-notification-original-read-driver"
      - uses: actions/upload-artifact@v4
        if: needs.change-scope.outputs.notification-driver-only == 'true'
        with:
          name: ynx-shop-native-notification-read-driver
          path: ${{ runner.temp }}/shop-notification-original-read-driver
          if-no-files-found: error
      - uses: actions/setup-java@v4
        if: needs.change-scope.outputs.navigation-only != 'true' && needs.change-scope.outputs.source-only != 'true' && needs.change-scope.outputs.fulfillment-only != 'true' && needs.change-scope.outputs.return-decision-only != 'true' && needs.change-scope.outputs.notification-only != 'true' && needs.change-scope.outputs.listing-only != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Check actual Android intent consumer and narrow route policy
        if: needs.change-scope.outputs.navigation-only != 'true' && needs.change-scope.outputs.source-only != 'true' && needs.change-scope.outputs.fulfillment-only != 'true' && needs.change-scope.outputs.return-decision-only != 'true' && needs.change-scope.outputs.notification-only != 'true' && needs.change-scope.outputs.listing-only != 'true'
        run: |
          set -euo pipefail
          DEPS="$RUNNER_TEMP/shop-intent-deps"
          CLASSES="$RUNNER_TEMP/shop-intent-classes"
          mvn -q dependency:copy -Dartifact=org.json:json:20250517 -DoutputDirectory="$DEPS"
          mvn -q dependency:copy -Dartifact=junit:junit:4.13.2 -DoutputDirectory="$DEPS"
          mvn -q dependency:copy -Dartifact=org.hamcrest:hamcrest-core:1.3 -DoutputDirectory="$DEPS"
          javac -cp "$DEPS/*" -d "$CLASSES" \
            apps/shop/native/android/app/src/main/java/com/ynxweb4/shop/{NativeProductState,NativeBusinessPolicy,BuyerReceipt,NativeIntentObservation,ProductSession,BuyerOrderReadback,OriginalOrderLink}.java \
            apps/shop/native/android/app/src/test/java/com/ynxweb4/shop/{NativeIntentObservationTest,OriginalOrderLinkTest,NativeBusinessPolicyTest}.java
          java -cp "$CLASSES:$DEPS/*" org.junit.runner.JUnitCore com.ynxweb4.shop.NativeIntentObservationTest com.ynxweb4.shop.OriginalOrderLinkTest com.ynxweb4.shop.NativeBusinessPolicyTest
      - uses: actions/setup-node@v4
        if: needs.change-scope.outputs.listing-only == 'true' || (needs.change-scope.outputs.notification-only != 'true' && (needs.change-scope.outputs.source-only != 'true' || needs.change-scope.outputs.fulfillment-checks == 'true'))
        with:
          node-version: "22"
      - name: Check original Native Seller listing strings and cold original publication only
        if: needs.change-scope.outputs.listing-only == 'true'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ynx-shop-listing-tools" --no-package-lock --ignore-scripts \
            esbuild@0.25.9 @noble/curves@2.2.0 @noble/hashes@2.2.0
          node apps/seller-console/native/check-listing-cli.mjs "$RUNNER_TEMP/ynx-shop-listing-tools/node_modules" "$RUNNER_TEMP/listing-http-fixture.mjs"
          YNX_SHOP_LISTING_EVIDENCE_DIR="$RUNNER_TEMP/shop-listing-evidence" \
          YNX_SHOP_LISTING_CLI_FIXTURE="$RUNNER_TEMP/listing-http-fixture.mjs" \
            go test -mod=readonly -race -tags commerce_v2 ./internal/commerce ./internal/commerce/cmd/shopd -run '^(TestNativeListing|TestP0701|TestShopNativeAPI)' -count=1 -v | tee "$RUNNER_TEMP/shop-listing-checks.log"
          go build -mod=readonly -tags commerce_v2 -o "$RUNNER_TEMP/ynx-shopd-native-listing" ./internal/commerce/cmd/shopd
      - uses: actions/upload-artifact@v4
        if: always() && needs.change-scope.outputs.listing-only == 'true'
        with:
          name: ynx-shop-native-listing-service-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/shop-listing-evidence
            ${{ runner.temp }}/shop-listing-checks.log
            ${{ runner.temp }}/ynx-shopd-native-listing
      - name: Check original Native Seller fulfillment and cold original recovery only
        if: needs.change-scope.outputs.fulfillment-checks == 'true'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ynx-shop-fulfillment-tools" --no-package-lock --ignore-scripts \
            esbuild@0.25.9 @noble/curves@2.2.0 @noble/hashes@2.2.0
          node apps/seller-console/native/check-fulfillment-cli.mjs "$RUNNER_TEMP/ynx-shop-fulfillment-tools/node_modules" "$RUNNER_TEMP/fulfillment-http-fixture.mjs"
          YNX_SHOP_FULFILLMENT_EVIDENCE_DIR="$RUNNER_TEMP/shop-fulfillment-evidence" \
          YNX_SHOP_FULFILLMENT_CLI_FIXTURE="$RUNNER_TEMP/fulfillment-http-fixture.mjs" \
            go test -mod=readonly -race -tags commerce_v2 ./internal/commerce -run '^TestFulfillmentCLIActualHTTPNativePaidColdOriginalRecovery$' -count=1 -v
      - name: Check original Native return decisions and exact legacy semantic compatibility
        if: needs.change-scope.outputs.return-decision-checks == 'true'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ynx-shop-return-decision-tools" --no-package-lock --ignore-scripts \
            esbuild@0.25.9 @noble/curves@2.2.0 @noble/hashes@2.2.0
          node apps/seller-console/native/check-return-decision-cli.mjs "$RUNNER_TEMP/ynx-shop-return-decision-tools/node_modules" "$RUNNER_TEMP/return-decision-http-fixture.mjs"
          YNX_SHOP_RETURN_DECISION_EVIDENCE_DIR="$RUNNER_TEMP/shop-return-decision-evidence" \
          YNX_SHOP_RETURN_DECISION_CLI_FIXTURE="$RUNNER_TEMP/return-decision-http-fixture.mjs" \
            go test -mod=readonly -race -tags commerce_v2 ./internal/commerce -run '^(TestOriginalReturnDecision|TestReturnDecisionCLIActualHTTP|TestSellerMutationLookupTransitionReadsLaterStateWithoutAnotherTransition)' -count=1 -v
          go build -mod=readonly -tags commerce_v2 -o "$RUNNER_TEMP/ynx-shopd-return-decision" ./internal/commerce/cmd/shopd
      - uses: actions/upload-artifact@v4
        if: always() && needs.change-scope.outputs.return-decision-checks == 'true'
        with:
          name: ynx-shop-return-decision-service-evidence
