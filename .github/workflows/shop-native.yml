      - uses: actions/upload-artifact@v4
        if: always() && needs.change-scope.outputs.fulfillment-checks == 'true'
        with:
          name: ynx-shop-fulfillment-original-evidence
          path: ${{ runner.temp }}/shop-fulfillment-evidence
      - name: Check inventory CLI against the original official Native SDK input
        if: needs.change-scope.outputs.navigation-only != 'true' && needs.change-scope.outputs.source-only != 'true' && needs.change-scope.outputs.fulfillment-only != 'true' && needs.change-scope.outputs.return-decision-only != 'true' && needs.change-scope.outputs.notification-only != 'true' && needs.change-scope.outputs.listing-only != 'true' && needs.change-scope.outputs.native-client-only != 'true'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ynx-shop-inventory-tools" --no-package-lock --ignore-scripts \
            esbuild@0.25.9 @noble/curves@2.2.0 @noble/hashes@2.2.0
          node apps/seller-console/native/check-inventory-cli.mjs "$RUNNER_TEMP/ynx-shop-inventory-tools/node_modules" "$RUNNER_TEMP/inventory-http-fixture.mjs" "$RUNNER_TEMP/warehouse-http-fixture.mjs"
          YNX_SHOP_INVENTORY_CLI_FIXTURE="$RUNNER_TEMP/inventory-http-fixture.mjs" \
            go test -mod=readonly -race -tags commerce_v2 ./internal/commerce -run '^TestInventoryBatchCLIActualHTTP' -count=1 -v
          YNX_SHOP_WAREHOUSE_CLI_FIXTURE="$RUNNER_TEMP/warehouse-http-fixture.mjs" \
            go test -mod=readonly -race -tags commerce_v2 ./internal/commerce -run '^TestWarehouseCLIActualHTTP' -count=1 -v

  android-app-candidate:
    needs: change-scope
    if: needs.change-scope.outputs.navigation-only != 'true' && needs.change-scope.outputs.source-only != 'true' && needs.change-scope.outputs.fulfillment-only != 'true' && needs.change-scope.outputs.return-decision-only != 'true' && needs.change-scope.outputs.notification-only != 'true' && needs.change-scope.outputs.listing-only != 'true' && needs.change-scope.outputs.apple-view-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Supply the original pinned Native compiler dependencies
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ynx-shop-native-tools" --no-package-lock --ignore-scripts \
            esbuild@0.25.9 @noble/curves@2.2.0 @noble/hashes@2.2.0
          ln -s "$RUNNER_TEMP/ynx-shop-native-tools/node_modules" apps/shop/node_modules
      - name: Build the actual Android app and check original intent recovery
        env:
          YNX_SHOP_API_URL: https://shop-api.ynxweb4.com
        run: |
          set -euo pipefail
          bash apps/shop/native/android/gradlew -p apps/shop/native/android --no-daemon \
            :app:assembleDebug :app:testDebugUnitTest --tests com.ynxweb4.shop.NativeIntentObservationTest --tests com.ynxweb4.shop.NativeInvoiceJourneyTest --tests com.ynxweb4.shop.OriginalOrderLinkTest
      - uses: actions/upload-artifact@v4
        with:
          name: ynx-shop-android-debug
          path: |
            apps/shop/native/android/app/build/outputs/apk/debug/*.apk
            apps/shop/native/android/app/build/test-results/testDebugUnitTest/*.xml
            apps/shop/native/android/app/build/generated/commerce-native-r9/assets/native-session/sdk-manifest.json

  language-regression:
    needs: change-scope
    if: needs.change-scope.outputs.navigation-only != 'true' && needs.change-scope.outputs.source-only != 'true' && needs.change-scope.outputs.fulfillment-only != 'true' && needs.change-scope.outputs.return-decision-only != 'true' && needs.change-scope.outputs.notification-only != 'true' && needs.change-scope.outputs.listing-only != 'true'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check production language selection and legacy preference preservation
        run: |
          set -euo pipefail
          xcrun swiftc apps/shop/native/ios/YNXShop/ShopLanguage.swift \
            apps/shop/native/ios/tests/ShopLanguageChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-language-checks"
          "$RUNNER_TEMP/ynx-shop-language-checks"
          xcrun swiftc -frontend -parse apps/shop/native/ios/YNXShop/ShopModel.swift \
            apps/shop/native/ios/YNXShop/ContentView.swift

  macos-candidate:
    needs: [change-scope, language-regression]
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/shop/native/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Supply exact dependencies for the normal macOS Native recipe
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ynx-shop-native-tools" --no-package-lock --ignore-scripts \
            esbuild@0.25.9 @noble/curves@2.2.0 @noble/hashes@2.2.0
          ln -s "$RUNNER_TEMP/ynx-shop-native-tools/node_modules" ../../node_modules
      - name: Build the registered macOS consumer
        run: |
          set -euo pipefail
          xcodebuild -project YNXShop.xcodeproj -scheme YNXShopMac -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/YNXShopMacDerivedData" \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/ynx-shop-macos-build.log"
      - name: Preserve the normal app and its generated SDK provenance
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/YNXShopMacDerivedData/Build/Products/Debug/YNX Shop.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")" = com.ynxweb4.shop
          test -x "$APP_PATH/Contents/MacOS/YNX Shop"
          SDK_PATH="$APP_PATH/Contents/Resources/native-session"
          node - "$SDK_PATH" <<'JS'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const root = process.argv[2], manifest = JSON.parse(fs.readFileSync(path.join(root, 'sdk-manifest.json')));
          const bytes = fs.readFileSync(path.join(root, 'wallet-auth-native-consumer.mjs'));
          if (manifest.platform !== 'apple' || manifest.constructor !== 'createNativeProductSessionClient' ||
              manifest.bytes !== bytes.length || manifest.sha256 !== crypto.createHash('sha256').update(bytes).digest('hex'))
            throw Error('Packaged Native module differs from its generated provenance');
          JS
          cp "$SDK_PATH/sdk-manifest.json" "$RUNNER_TEMP/ynx-shop-macos-sdk-manifest.json"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/YNXShop-macos-candidate.zip"
          shasum -a 256 "$RUNNER_TEMP/YNXShop-macos-candidate.zip" > "$RUNNER_TEMP/ynx-shop-macos-candidate.sha256"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Produce the actual normal Seller and checkout native-price fixture
        if: needs.change-scope.outputs.apple-view-only != 'true'
        working-directory: .
        env:
          P07_PUBLIC_NATIVE_PRICE_ORDER_FIXTURE: ${{ runner.temp }}/ynx-shop-public-native-price-order.json
        run: go test -mod=readonly -tags commerce_v2 ./internal/commerce -run '^TestNativePriceNormalSellerHTTPOrderDATA$' -count=1
      - name: Check literal searches and late catalog responses with the actual model
        if: needs.change-scope.outputs.apple-view-only != 'true'
        env:
          YNX_SHOP_NATIVE_PRICE_FIXTURE: ${{ runner.temp }}/ynx-shop-public-native-price-order.json
        run: |
          set -euo pipefail
          SDK_PIN="$RUNNER_TEMP/YNXShopMacDerivedData/Build/Intermediates.noindex/YNXShop.build/Debug/YNXShopMac.build/DerivedSources/commerce-native-r9/NativeSDKPin.swift"
          test -f "$SDK_PIN"
          SOURCES=()
          for SOURCE in YNXShop/*.swift; do
            case "$SOURCE" in
              */ContentView.swift|*/SellerWorkspace.swift|*/YNXShopApp.swift) ;;
              *) SOURCES+=("$SOURCE") ;;
            esac
          done
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/ShopModelCatalogRefreshChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-catalog-search-checks"
          "$RUNNER_TEMP/ynx-shop-catalog-search-checks" | tee "$RUNNER_TEMP/ynx-shop-macos-catalog-search.log"
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/LocalStorageStartupChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-locked-startup-checks"
          "$RUNNER_TEMP/ynx-shop-locked-startup-checks" | tee "$RUNNER_TEMP/ynx-shop-macos-locked-startup.log"
          for CHECK in CatalogCartChecks AgentComparisonChecks AgentModelChecks SellerConsumerChecks SellerModelChecks SellerSetupChecks SellerInvitationChecks SellerStoreProfileChecks NativePaymentProjectionChecks OriginalMainPayNavigationChecks OriginalMainPayReviewChecks OriginalMainPayReconciliationChecks SellerFulfillmentChecks SellerRefundReviewChecks NativePriceChecks; do
            xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" "tests/$CHECK.swift" -o "$RUNNER_TEMP/ynx-shop-$CHECK"
            "$RUNNER_TEMP/ynx-shop-$CHECK" | tee "$RUNNER_TEMP/ynx-shop-$CHECK.log"
          done
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/NativeEngineChecks.swift -o "$RUNNER_TEMP/ynx-shop-native-profile-engine-checks"
          for PROFILE in buyer seller; do
            YNX_SHOP_NATIVE_ENGINE_ASSETS="$RUNNER_TEMP/YNXShopMacDerivedData/Build/Products/Debug/YNX Shop.app/Contents/Resources/native-session" \
            YNX_SHOP_NATIVE_ENGINE_PROFILE="$PROFILE" \
              "$RUNNER_TEMP/ynx-shop-native-profile-engine-checks" | tee "$RUNNER_TEMP/ynx-shop-native-$PROFILE-engine.log"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ynx-shop-macos-candidate
          path: |
            ${{ runner.temp }}/YNXShop-macos-candidate.zip
            ${{ runner.temp }}/ynx-shop-macos-build.log
            ${{ runner.temp }}/ynx-shop-macos-sdk-manifest.json
            ${{ runner.temp }}/ynx-shop-macos-candidate.sha256
            ${{ runner.temp }}/ynx-shop-macos-catalog-search.log
            ${{ runner.temp }}/ynx-shop-macos-locked-startup.log
            ${{ runner.temp }}/ynx-shop-CatalogCartChecks.log
            ${{ runner.temp }}/ynx-shop-AgentComparisonChecks.log
            ${{ runner.temp }}/ynx-shop-AgentModelChecks.log
            ${{ runner.temp }}/ynx-shop-SellerConsumerChecks.log
            ${{ runner.temp }}/ynx-shop-SellerModelChecks.log
            ${{ runner.temp }}/ynx-shop-SellerSetupChecks.log
            ${{ runner.temp }}/ynx-shop-SellerInvitationChecks.log
            ${{ runner.temp }}/ynx-shop-SellerStoreProfileChecks.log
            ${{ runner.temp }}/ynx-shop-NativePaymentProjectionChecks.log
            ${{ runner.temp }}/ynx-shop-OriginalMainPayNavigationChecks.log
            ${{ runner.temp }}/ynx-shop-OriginalMainPayReviewChecks.log
            ${{ runner.temp }}/ynx-shop-OriginalMainPayReconciliationChecks.log
            ${{ runner.temp }}/ynx-shop-SellerFulfillmentChecks.log
            ${{ runner.temp }}/ynx-shop-SellerRefundReviewChecks.log
            ${{ runner.temp }}/ynx-shop-NativePriceChecks.log
            ${{ runner.temp }}/ynx-shop-native-buyer-engine.log
            ${{ runner.temp }}/ynx-shop-native-seller-engine.log

  ios-simulator:
    needs: [change-scope, language-regression]
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/shop/native/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Supply exact public dependencies for the normal Native R9 recipe
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ynx-shop-native-tools" --no-package-lock --ignore-scripts \
            esbuild@0.25.9 @noble/curves@2.2.0 @noble/hashes@2.2.0
          ln -s "$RUNNER_TEMP/ynx-shop-native-tools/node_modules" ../../node_modules
          node -e 'const r=require("node:module").createRequire(process.cwd()+"/YNXShop.xcodeproj/package-check.cjs");if(r("esbuild").version!=="0.25.9")throw Error("Native compiler mismatch")'
      - name: Prepare exact original Pay source for controlled contract tests
        working-directory: .
        run: |
          node apps/shop/native/scripts/prepare-pay-operation-test-source.mjs "$RUNNER_TEMP/ynx-shop-pay-original-source"
          echo "YNX_SHOP_FIXED_PAY_RECOVERY_SOURCE_ROOT=$RUNNER_TEMP/ynx-shop-pay-original-source" >> "$GITHUB_ENV"
      - name: Check original Main intent navigation contract
        run: node --test ../pay-intent-navigation.test.mjs
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project YNXShop.xcodeproj \
            -scheme YNXShop \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/YNXShopDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/ynx-shop-ios-build.log"
      - name: Check invoice preview context using the actual generated Native pin
        if: needs.change-scope.outputs.apple-view-only != 'true'
        run: |
          set -euo pipefail
          SDK_PIN="$(find "$RUNNER_TEMP/YNXShopDerivedData" -path '*/commerce-native-r9/NativeSDKPin.swift' -print -quit)"
          test -n "$SDK_PIN"
          SOURCES=()
          for SOURCE in YNXShop/*.swift; do
            case "$SOURCE" in
              */ContentView.swift|*/SellerWorkspace.swift|*/YNXShopApp.swift) ;;
              *) SOURCES+=("$SOURCE") ;;
            esac
          done
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/InvoicePreviewContextChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-invoice-preview-checks"
          "$RUNNER_TEMP/ynx-shop-invoice-preview-checks"
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/NativeAPIChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-native-api-checks"
          "$RUNNER_TEMP/ynx-shop-native-api-checks"
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/OriginalOrderLinkChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-original-order-link-checks"
          "$RUNNER_TEMP/ynx-shop-original-order-link-checks"
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/CartCheckoutChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-cart-checkout-checks"
          "$RUNNER_TEMP/ynx-shop-cart-checkout-checks"
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/BuyerJourneyChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-buyer-journey-checks"
          "$RUNNER_TEMP/ynx-shop-buyer-journey-checks"
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/NativeInvoiceJourneyChecks.swift \
            -o "$RUNNER_TEMP/ynx-shop-native-invoice-journey-checks"
          "$RUNNER_TEMP/ynx-shop-native-invoice-journey-checks"
          xcrun swiftc "${SOURCES[@]}" "$SDK_PIN" tests/BuyerOriginalOrderLifecycleChecks.swift -o "$RUNNER_TEMP/ynx-shop-buyer-original-lifecycle-checks"
          YNX_SHOP_REFUNDED_FIXTURE=../testdata/native-refunded-order.json "$RUNNER_TEMP/ynx-shop-buyer-original-lifecycle-checks"
      - name: Boot, install, launch, and exercise deep link
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone") and x["isAvailable"]))')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH="$RUNNER_TEMP/YNXShopDerivedData/Build/Products/Debug-iphonesimulator/YNXShop.app"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.ynxweb4.shop
          python3 - "$DEVICE_ID" <<'PY'
          import subprocess
          import sys

          subprocess.run(
              ["xcrun", "simctl", "openurl", sys.argv[1], "ynxshop://wallet-auth/callback"],
              check=True,
              timeout=20,
          )
          PY
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/ynx-shop-deeplink.png"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/YNXShop-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ynx-shop-ios-simulator
          path: |
            ${{ runner.temp }}/YNXShop-simulator.zip
            ${{ runner.temp }}/ynx-shop-ios-build.log
            ${{ runner.temp }}/ynx-shop-deeplink.png
