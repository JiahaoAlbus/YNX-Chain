name: AI V6 original recovery optional receipt DATA
on:
  push:
    branches: [codex/wallet-auth49-recovery-optional-receipt-20261107]
permissions:
  contents: read
jobs:
  optional-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - run: node packages/wallet-auth/scripts/ci/ai-v6-recovery-optional-receipt.mjs
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-v6-recovery-optional-receipt-source
          path: |
            AI_V6_RECOVERY_OPTIONAL_RECEIPT_DATA/RESULT.json
            AI_V6_RECOVERY_OPTIONAL_RECEIPT_DATA/compile.*
            AI_V6_RECOVERY_OPTIONAL_RECEIPT_DATA/run.*
            canonical-common-source-package
          if-no-files-found: error
