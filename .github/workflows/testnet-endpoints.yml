name: testnet-endpoint-compatibility
on:
  pull_request:
    paths:
      - 'chain-metadata/**'
      - 'configs/**'
      - 'sdk/**'
      - 'internal/faucet/**'
      - 'scripts/verify/**'
      - 'scripts/ops/generate-testnet-endpoints.mjs'
      - '.github/workflows/testnet-endpoints.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: make testnet-endpoint-config-check testnet-endpoint-migration-check
      - run: go test -race -count=1 ./internal/faucet ./cmd/ynx-faucetd
      - run: bash scripts/verify/sdk-check.sh
