name: docs-compliance

on:
  push:
    branches:
      - main
      - codex/final-docs-compliance
    paths:
      - ".github/workflows/docs-compliance.yml"
      - "Makefile"
      - "docs/**"
      - "release/**"
      - "scripts/lib/deterministic-zip.mjs"
      - "scripts/package/docs-release.mjs"
      - "scripts/verify/**"
      - "scripts/validate/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs-compliance.yml"
      - "Makefile"
      - "docs/**"
      - "release/**"
      - "scripts/lib/deterministic-zip.mjs"
      - "scripts/package/docs-release.mjs"
      - "scripts/verify/**"
      - "scripts/validate/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-compliance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authority-gate:
    name: Public disclosure authority gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Verify immutable GitHub Actions pins
        run: node scripts/verify/github-actions-pins-check.mjs

      - name: Validate authoritative facts
        run: make public-disclosure-check

      - name: Validate documentation package
        run: make docs-compliance-check

      - name: Reject placeholders and fake claims
        run: make no-placeholder-check

      - name: Scan source and release records for secrets
        run: make secret-scan

      - name: Validate objective release-state boundaries
        run: make objective-state-check

      - name: Build deterministic website content artifact
        run: |
          make docs-release-package
          node scripts/verify/docs-release-package-check.mjs

      - name: Upload website content candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ynx-website-content-${{ github.sha }}
          path: tmp/packages/docs-release/
          if-no-files-found: error
          retention-days: 30
