name: Network governance prefix checks

on:
  push:
    branches: [codex/network-governance-prefix-ci]

permissions:
  contents: read

jobs:
  focused:
    if: github.repository == 'JiahaoAlbus/YNX-Chain' && github.ref == 'refs/heads/codex/network-governance-prefix-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check participation and helper fixed-prefix paths
        shell: bash
        run: |
          set -o pipefail
          go test -mod=readonly -race -p 1 -count=1 ./apps/network/participation -run '^TestParticipationUsesFixedGovernancePrefix$' -v | tee "$RUNNER_TEMP/p09-part.log"
          grep -Eq '^--- PASS: TestParticipationUsesFixedGovernancePrefix \(' "$RUNNER_TEMP/p09-part.log"
          go test -mod=readonly -race -p 1 -count=1 ./cmd/ynx-network-helper -run '^TestParticipationGovernancePrefixedAssembly$' -v | tee "$RUNNER_TEMP/p09-helper.log"
          grep -Eq '^--- PASS: TestParticipationGovernancePrefixedAssembly \(' "$RUNNER_TEMP/p09-helper.log"
          go test -mod=readonly -race -p 1 -count=1 ./apps/network/governanceview -run '^TestGovernanceUpstreamAccessAndMethodStatus$' -v | tee "$RUNNER_TEMP/p09-status.log"
          grep -Eq '^--- PASS: TestGovernanceUpstreamAccessAndMethodStatus \(' "$RUNNER_TEMP/p09-status.log"
