name: monitor-ci

on:
  push:
    branches:
      - main
      - codex/final-monitor
    paths:
      - "apps/monitor/**"
      - "infra/caddy/ynx-monitor.caddy.example"
      - "infra/monitor/ynx-monitor.env.example"
      - "infra/systemd/ynx-monitor*.example.*"
      - "infra/systemd/ynx-indexerd.example.service"
      - "infra/systemd/ynx-explorerd.example.service"
      - "scripts/verify/monitor-deployment-check.sh"
      - "docs/security/MONITOR_THREAT_MODEL.md"
      - "release/monitor/**"
      - "product-release.json"
      - "EVIDENCE_INDEX.md"
      - "FEATURE_COMPLETION_EVIDENCE.md"
      - ".github/workflows/monitor-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/monitor/**"
      - "infra/caddy/ynx-monitor.caddy.example"
      - "infra/monitor/ynx-monitor.env.example"
      - "infra/systemd/ynx-monitor*.example.*"
      - "infra/systemd/ynx-indexerd.example.service"
      - "infra/systemd/ynx-explorerd.example.service"
      - "scripts/verify/monitor-deployment-check.sh"
      - "docs/security/MONITOR_THREAT_MODEL.md"
      - "release/monitor/**"
      - "product-release.json"
      - "EVIDENCE_INDEX.md"
      - "FEATURE_COMPLETION_EVIDENCE.md"
      - ".github/workflows/monitor-ci.yml"

permissions:
  contents: read

concurrency:
  group: monitor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-build:
    name: Monitor security, tests and reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/monitor
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/monitor/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run Monitor security gate
        env:
          YNX_MONITOR_SOURCE_COMMIT: ${{ github.sha }}
        run: npm run security:check

      - name: Validate scoped Monitor deployment assets
        run: bash ../../scripts/verify/monitor-deployment-check.sh

      - name: Upload source-bound security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ynx-monitor-security-${{ github.sha }}
          path: release/monitor/security
          if-no-files-found: error
          retention-days: 30
