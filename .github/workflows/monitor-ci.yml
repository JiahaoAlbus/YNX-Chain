name: monitor-ci

on:
  push:
    branches:
      - main
      - codex/final-monitor
    paths:
      - "apps/monitor/**"
      - "docs/security/MONITOR_THREAT_MODEL.md"
      - "release/monitor/**"
      - "product-release.json"
      - "EVIDENCE_INDEX.md"
      - "FEATURE_COMPLETION_EVIDENCE.md"
      - ".github/workflows/monitor-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/monitor/**"
      - "docs/security/MONITOR_THREAT_MODEL.md"
      - "release/monitor/**"
      - "product-release.json"
      - "EVIDENCE_INDEX.md"
      - "FEATURE_COMPLETION_EVIDENCE.md"
      - ".github/workflows/monitor-ci.yml"

permissions:
  contents: read

concurrency:
  group: monitor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-build:
    name: Monitor security, tests and reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/monitor
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/monitor/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run Monitor security gate
        env:
          YNX_MONITOR_SOURCE_COMMIT: ${{ github.sha }}
        run: npm run security:check

      - name: Upload source-bound security evidence
        uses: actions/upload-artifact@v4
        with:
          name: ynx-monitor-security-${{ github.sha }}
          path: release/monitor/security
          if-no-files-found: error
          retention-days: 30
