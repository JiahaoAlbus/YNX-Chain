name: WPR Required loan private facade MODEL controls
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/wallet-auth/native/original-wallet-product-required-loan.*
      - packages/wallet-auth/native/original-wpr-materialization-*.mjs
      - packages/wallet-auth/test/wpr-required-loan*
      - scripts/ci/wpr-required-loan*.mjs
      - .github/workflows/wpr-required-loan-facade.yml
jobs:
  facade-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/wpr-required-loan-facade.mjs 2>&1 | tee wpr-required-loan.log
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - run: node scripts/ci/wpr-required-loan-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wpr-required-loan-source
          path: |
            wpr-required-loan.log
            wpr-required-loan-controls
            canonical-common-source-package
