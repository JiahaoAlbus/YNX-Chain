name: Wallet desktop Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [codex/wallet-desktop-cli-sdk-20260813]
    paths:
      - apps/wallet-desktop/**
      - packages/wallet-auth/**
      - .github/workflows/wallet-desktop-linux-appimage.yml

permissions:
  contents: read

jobs:
  linux-x64-appimage-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/wallet-desktop/package-lock.json
      - name: Install dependencies and test frozen contract boundary
        run: |
          npm ci --ignore-scripts --prefix packages/wallet-auth
          npm ci --prefix apps/wallet-desktop
          npm test --prefix apps/wallet-desktop
      - name: Build AppImage only
        run: npm run dist:linux-appimage --prefix apps/wallet-desktop
      - name: First launch, second launch and fail-closed RPC on native runner
        env:
          EVIDENCE: ${{ runner.temp }}/wallet-desktop-appimage.json
          OUT_DIR: ${{ runner.temp }}/wallet-desktop-appimage-evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool
          mkdir -p "$OUT_DIR"
          APPIMAGE="$(find apps/wallet-desktop/dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          APPIMAGE="$(realpath "$APPIMAGE")"
          chmod +x "$APPIMAGE"
          EXTRACT_ROOT="$RUNNER_TEMP/wallet-appimage-extracted"
          mkdir -p "$EXTRACT_ROOT"
          (cd "$EXTRACT_ROOT" && "$APPIMAGE" --appimage-extract >/dev/null)
          EXECUTABLE="$EXTRACT_ROOT/squashfs-root/AppRun"
          SANDBOX="$EXTRACT_ROOT/squashfs-root/chrome-sandbox"
          test -x "$EXECUTABLE"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          test "$(stat -c '%U:%G' "$SANDBOX")" = root:root
          test "$(stat -c '%a' "$SANDBOX")" = 4755

          run_phase() {
            expected_launches="$1"
            rpc_url="$2"
            phase="$3"
            YNX_WALLET_EVIDENCE_PATH="$EVIDENCE" YNX_WALLET_RPC_URL="$rpc_url" xvfb-run -a bash -c '
              set -euo pipefail
              executable="$1"
              evidence="$2"
              expected="$3"
              log="$4"
              title_evidence="$5"
              export APPDIR="$(dirname "$executable")"
              "$executable" --disable-gpu > "$log" 2>&1 &
              app_pid=$!
              for attempt in {1..30}; do
                launches=$(node -e "try{process.stdout.write(String(require(process.argv[1]).launches))}catch{}" "$evidence")
                test "$launches" = "$expected" && break
                sleep 1
              done
              if ! kill -0 "$app_pid"; then
                cat "$log"
                exit 1
              fi
              xdotool search --name "YNX Wallet Testnet Preview" getwindowname > "$title_evidence"
              kill "$app_pid"
              wait "$app_pid" || true
            ' _ "$EXECUTABLE" "$EVIDENCE" "$expected_launches" "$OUT_DIR/$phase.log" "$OUT_DIR/$phase-window-title.txt"
            cp "$EVIDENCE" "$OUT_DIR/$phase-app-evidence.json"
          }

          run_phase 1 https://evm.ynxweb4.com cold
          node -e "const e=require(process.env.EVIDENCE);if(e.launches!==1||!e.visibleShellReady||!e.window.visible||e.window.title!=='YNX Wallet Testnet Preview'||!e.rpc.available||e.rpc.chainId!=='0x1917'||e.signingEnabled||e.accountCreated||e.balanceClaimed||e.transactionCreated)process.exit(1)"
          run_phase 2 https://evm.ynxweb4.com second
          node -e "const e=require(process.env.EVIDENCE);if(e.launches!==2||!e.rpc.available||e.rpc.chainId!=='0x1917'||e.signingEnabled)process.exit(1)"
          run_phase 3 http://127.0.0.1:1 failed-rpc
          node -e "const e=require(process.env.EVIDENCE);if(e.launches!==3||e.rpc.available||e.rpc.chainId!==null||e.signingEnabled)process.exit(1)"

          node - <<'NODE'
          const fs = require('fs');
          const evidence = JSON.parse(fs.readFileSync(process.env.EVIDENCE, 'utf8'));
          const result = {
            schemaVersion: 1,
            architecture: 'x86_64',
            portableFormat: 'AppImage',
            nativeRunner: 'ubuntu-24.04',
            runtimeMode: 'AppImage payload extracted and executed through AppRun on the native runner',
            runtimeLaunchFlags: ['--disable-gpu'],
            chromiumProcessSandboxEnabled: true,
            sandboxMode: 'setuid chrome-sandbox root:root/4755',
            coldLaunch: true,
            secondLaunch: true,
            processObserved: true,
            coldWindowTitleObserved: true,
            secondWindowTitleObserved: true,
            appReportedWindowVisible: true,
            appReportedWindowTitle: 'YNX Wallet Testnet Preview',
            chainId: '0x1917',
            rpcFailureClosed: !evidence.rpc.available && evidence.rpc.chainId === null,
            signingEnabled: false,
            accountCreated: false,
            balanceClaimed: false,
            transactionCreated: false,
            productionSigned: false
          };
          fs.writeFileSync(`${process.env.OUT_DIR}/lifecycle.json`, `${JSON.stringify(result, null, 2)}\n`);
          NODE
      - name: Record AppImage artifact evidence
        env:
          OUT_DIR: ${{ runner.temp }}/wallet-desktop-appimage-evidence
        run: |
          APPIMAGE="$(find apps/wallet-desktop/dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          sha256sum "$APPIMAGE" | tee "$OUT_DIR/SHA256SUMS.txt"
          stat -c '%n %s' "$APPIMAGE" | tee "$OUT_DIR/BYTES.txt"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const out = process.env.OUT_DIR;
          const [sha256] = fs.readFileSync(path.join(out, 'SHA256SUMS.txt'), 'utf8').trim().split(/\s+/);
          const bytes = Number(fs.readFileSync(path.join(out, 'BYTES.txt'), 'utf8').trim().split(/\s+/).at(-1));
          const lifecycle = JSON.parse(fs.readFileSync(path.join(out, 'lifecycle.json'), 'utf8'));
          const manifest = {
            schemaVersion: 1,
            productId: 'wallet-desktop',
            version: '0.1.0',
            sourceCommit: process.env.GITHUB_SHA,
            workflowRunId: Number(process.env.GITHUB_RUN_ID),
            artifact: {
              filename: 'ynx-wallet-desktop-0.1.0-x86_64.AppImage',
              format: 'AppImage',
              architecture: 'x86_64',
              bytes,
              sha256,
              minimumOS: 'Ubuntu 24.04 directly tested; broader Linux compatibility not evidenced',
              signingClass: 'unsigned_linux_desktop_testnet_candidate',
              productionSigned: false,
              installationApplicable: false,
              portableRuntimeTestedOnNativeRunner: true
            },
            lifecycle
          };
          fs.writeFileSync(path.join(out, 'artifact-manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ynx-wallet-desktop-linux-x64-appimage
          path: |
            apps/wallet-desktop/dist/*.AppImage
            ${{ runner.temp }}/wallet-desktop-appimage-evidence/**
          if-no-files-found: error

  verify-uploaded-artifact:
    needs: linux-x64-appimage-native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ynx-wallet-desktop-linux-x64-appimage
          path: downloaded
      - name: Require manifest and verify every downloaded AppImage field
        run: |
          APPIMAGE="$(find downloaded -type f -name '*.AppImage' -print -quit)"
          MANIFEST="$(find downloaded -type f -name 'artifact-manifest.json' -print -quit)"
          LIFECYCLE="$(find downloaded -type f -name 'lifecycle.json' -print -quit)"
          test -n "$APPIMAGE"
          test -n "$MANIFEST"
          test -n "$LIFECYCLE"
          ACTUAL_SHA256="$(sha256sum "$APPIMAGE" | cut -d ' ' -f 1)"
          ACTUAL_BYTES="$(stat -c '%s' "$APPIMAGE")"
          EXPECTED_SHA256="$(node -p "require('./' + process.argv[1]).artifact.sha256" "$MANIFEST")"
          EXPECTED_BYTES="$(node -p "require('./' + process.argv[1]).artifact.bytes" "$MANIFEST")"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          node -e "const m=require('./'+process.argv[1]);const l=require('./'+process.argv[2]);if(m.sourceCommit!==process.env.GITHUB_SHA||m.artifact.minimumOS!=='Ubuntu 24.04 directly tested; broader Linux compatibility not evidenced'||m.artifact.signingClass!=='unsigned_linux_desktop_testnet_candidate'||m.artifact.productionSigned||m.artifact.installationApplicable||!m.artifact.portableRuntimeTestedOnNativeRunner||!l.coldLaunch||!l.secondLaunch||!l.processObserved||!l.coldWindowTitleObserved||!l.secondWindowTitleObserved||l.chainId!=='0x1917'||!l.rpcFailureClosed||l.signingEnabled||l.accountCreated||l.balanceClaimed||l.transactionCreated||l.productionSigned||!l.chromiumProcessSandboxEnabled||l.sandboxMode!=='setuid chrome-sandbox root:root/4755')process.exit(1)" "$MANIFEST" "$LIFECYCLE"
          mkdir -p downloaded-verification
          ACTUAL_SHA256="$ACTUAL_SHA256" ACTUAL_BYTES="$ACTUAL_BYTES" node - <<'NODE'
          const fs = require('fs');
          const result = {
            schemaVersion: 1,
            sourceCommit: process.env.GITHUB_SHA,
            workflowRunId: Number(process.env.GITHUB_RUN_ID),
            uploadArtifactDownloaded: true,
            manifestPresent: true,
            lifecyclePresent: true,
            sha256Verified: true,
            bytesVerified: true,
            sha256: process.env.ACTUAL_SHA256,
            bytes: Number(process.env.ACTUAL_BYTES)
          };
          fs.writeFileSync('downloaded-verification/downloaded-verification.json', `${JSON.stringify(result, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ynx-wallet-desktop-linux-x64-appimage-download-verification
          path: downloaded-verification/downloaded-verification.json
          if-no-files-found: error
