name: Wallet desktop current installers

on:
  workflow_dispatch:
  push:
    branches: [codex/wallet-dedicated-auth-v2-20260906]
    paths:
      - apps/wallet-desktop/**
      - packages/wallet-auth/**
      - .github/workflows/wallet-desktop-current.yml

permissions:
  contents: read

jobs:
  current-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, platform: windows, arch: x64, unpacked: win-unpacked}
          - {runner: windows-11-arm, platform: windows, arch: arm64, unpacked: win-arm64-unpacked}
          - {runner: ubuntu-24.04, platform: linux, arch: x64, unpacked: linux-unpacked}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: arm64, unpacked: linux-arm64-unpacked}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Preserve committed bytes in this disposable runner checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - name: Check native architecture and install pinned dependencies
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node -e 'if(process.arch!==process.env.EXPECTED_ARCH)process.exit(1)'
          npm ci --ignore-scripts --prefix packages/wallet-auth
          npm ci --prefix apps/wallet-desktop
          npm test --prefix apps/wallet-desktop
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location apps/wallet-desktop
          node node_modules/electron-builder/cli.js --win nsis "--$env:TARGET_ARCH" --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Build Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          USE_SYSTEM_FPM: 'true'
        run: |
          set -euo pipefail
          sudo gem install fpm --version 1.15.1 --no-document
          test "$(fpm --version)" = 1.15.1
          cd apps/wallet-desktop
          node node_modules/electron-builder/cli.js --linux deb AppImage "--$TARGET_ARCH" --publish never
      - name: Verify every packaged Wallet and SDK source file
        shell: bash
        env:
          UNPACKED: ${{ matrix.unpacked }}
        run: |
          set -euo pipefail
          node apps/wallet-desktop/scripts/release-provenance.mjs "apps/wallet-desktop/dist/$UNPACKED/resources" apps/wallet-desktop/dist
      - name: Install Windows and verify two locked cold starts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem apps/wallet-desktop/dist/*.exe)
          if ($installer.Count -ne 1) { throw 'Expected one exact installer' }
          $install = Start-Process $installer[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installation failed' }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\@ynx-chain\wallet-desktop\YNX Wallet.exe'
          if (-not (Test-Path $exe)) {
            $matches = @(Get-ChildItem $env:LOCALAPPDATA -Filter 'YNX Wallet.exe' -File -Recurse -ErrorAction SilentlyContinue)
            if ($matches.Count -ne 1) { throw 'Installed executable is ambiguous or missing' }
            $exe = $matches[0].FullName
          }
          node apps/wallet-desktop/scripts/release-provenance.mjs (Join-Path (Split-Path $exe) 'resources') apps/wallet-desktop/dist
          if ($LASTEXITCODE -ne 0) { throw 'Installed source verification failed' }
          $env:YNX_WALLET_PROFILE_PATH = Join-Path $env:RUNNER_TEMP 'wallet-current-qa-profile'
          $env:YNX_WALLET_EVIDENCE_PATH = Join-Path $env:GITHUB_WORKSPACE 'apps\wallet-desktop\dist\installed-smoke.json'
          for ($phase = 1; $phase -le 2; $phase++) {
            $app = Start-Process $exe -PassThru
            $ready = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              Start-Sleep -Seconds 1
              if (Test-Path $env:YNX_WALLET_EVIDENCE_PATH) {
                $e = Get-Content $env:YNX_WALLET_EVIDENCE_PATH -Raw | ConvertFrom-Json
                if ($e.launches -eq $phase) { $ready = $true; break }
              }
            }
            if (-not $ready -or -not $e.visibleShellReady -or -not $e.window.visible -or -not $e.keySecurity.locked -or $e.signingEnabled -or $e.providerAuthority.accountCreated -ne $false -or $e.appVersion -ne '0.6.4') { throw 'Locked cold-start check failed' }
            $app.Refresh()
            if ($app.HasExited -or -not $app.CloseMainWindow() -or -not $app.WaitForExit(15000)) { throw 'Native application lifecycle failed' }
          }
          # This proves installed launch only; no account, signing, callback or transfer claim.
      - name: Install Linux and verify two locked cold starts
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find apps/wallet-desktop/dist -maxdepth 1 -name '*.deb')
          test "${#packages[@]}" = 1
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool "$(realpath "${packages[0]}")"
          node apps/wallet-desktop/scripts/release-provenance.mjs "/opt/YNX Wallet/resources" apps/wallet-desktop/dist
          export YNX_WALLET_PROFILE_PATH="$RUNNER_TEMP/wallet-current-qa-profile"
          export YNX_WALLET_EVIDENCE_PATH="$GITHUB_WORKSPACE/apps/wallet-desktop/dist/installed-smoke.json"
          for phase in 1 2; do
            xvfb-run -a bash -c '
              set -euo pipefail
              "/opt/YNX Wallet/ynx-wallet-desktop" > "$RUNNER_TEMP/wallet-current-launch-$1.log" 2>&1 &
              app_pid=$!
              trap "kill $app_pid 2>/dev/null || true" EXIT
              ready=false
              for attempt in {1..45}; do
                if node -e '\''const fs=require("fs");let e;try{e=JSON.parse(fs.readFileSync(process.env.YNX_WALLET_EVIDENCE_PATH,"utf8"))}catch{process.exit(1)}if(e.launches!==Number(process.argv[1])||!e.visibleShellReady||!e.window.visible||!e.keySecurity.locked||e.signingEnabled||e.providerAuthority.accountCreated!==false||e.appVersion!=="0.6.4")process.exit(1)'\'' "$1"; then ready=true; break; fi
                sleep 1
              done
              test "$ready" = true
              kill -0 "$app_pid"
              xdotool search --name "YNX Wallet" getwindowname
              kill -TERM "$app_pid"
              wait "$app_pid" || true
              trap - EXIT
            ' _ "$phase"
          done
          # AppImage is packaged and hashed; this step installs and launches DEB only.
      - name: Upload exact artifacts and available evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wallet-current-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            apps/wallet-desktop/dist/*.exe
            apps/wallet-desktop/dist/*.deb
            apps/wallet-desktop/dist/*.AppImage
            apps/wallet-desktop/dist/release-manifest.json
            apps/wallet-desktop/dist/installed-smoke.json
            ${{ runner.temp }}/wallet-current-launch-*.log
