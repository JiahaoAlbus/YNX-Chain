name: Pay Web official hosted browser validation P0-228

on:
  push:
    branches:
      - codex/p0-pay-wallet-connectivity-20260821
    paths:
      - .github/workflows/pay-web-hosted-browser-preflight-p0226.yml

permissions:
  contents: read

jobs:
  hosted-chromium-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MESSAGE: "evidence(pay): validate official public candidate"
      CANDIDATE_ARCHIVE: release/pay/ynx-pay-web-5f4ce98e-static.tar.gz
      CANDIDATE_SHA256: ae552951d8e569f04aced60db69e3c11422910cc1098a6e7061b0e84005ad09e
      SOURCE_COMMIT: 5f4ce98eb458550b976c17e3bc6d77cce4081a59
      SOURCE_TREE: 8f0c25c4d86eb22a564f3c7aeff9db6709a9b9f0
      ORIGIN: https://pay.ynxweb4.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bind the single authorized push
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.head_commit.message }}" = "$EXPECTED_MESSAGE"
          test "${{ github.ref }}" = "refs/heads/codex/p0-pay-wallet-connectivity-20260821"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Prepare isolated exact candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pay-p0228-evidence"
          extraction="$RUNNER_TEMP/pay-p0228-extraction"
          profile="$RUNNER_TEMP/pay-p0228-profile"
          test ! -e "$evidence"
          test ! -e "$extraction"
          test ! -e "$profile"
          mkdir -p "$evidence" "$extraction" "$profile"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$CANDIDATE_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$CANDIDATE_ARCHIVE" -C "$extraction"
          test -f "$extraction/dist/index.html"
          test -f "$extraction/dist/build-identity.json"
          node - "$extraction/dist/build-identity.json" "$SOURCE_COMMIT" "$SOURCE_TREE" <<'NODE'
          const fs = require('node:fs');
          const [identityPath, expectedCommit, expectedTree] = process.argv.slice(2);
          const identity = JSON.parse(fs.readFileSync(identityPath, 'utf8'));
          if (identity.sourceCommit !== expectedCommit || identity.sourceTree !== expectedTree) {
            throw new Error(`identity mismatch: ${JSON.stringify(identity)}`);
          }
          NODE
          cp "$extraction/dist/build-identity.json" "$evidence/build-identity.json"
          sha256sum "$CANDIDATE_ARCHIVE" "$extraction/dist/index.html" "$extraction/dist/build-identity.json" > "$evidence/preflight-sha256.txt"
          stat -c '%n bytes=%s' "$CANDIDATE_ARCHIVE" "$extraction/dist/index.html" "$extraction/dist/build-identity.json" > "$evidence/preflight-bytes.txt"
          printf '%s\n' "$SOURCE_COMMIT" > "$evidence/source-commit.txt"
          printf '%s\n' "$SOURCE_TREE" > "$evidence/source-tree.txt"

      - name: Install hosted Chromium
        shell: bash
        working-directory: apps/pay
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Verify official exact resources and backend health
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pay-p0228-evidence"
          extraction="$RUNNER_TEMP/pay-p0228-extraction"
          node - "$extraction/dist/release-manifest.json" "$evidence/resource-list.txt" <<'NODE'
          const fs = require('node:fs');
          const [manifestPath, outputPath] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const paths = ['index.html', 'build-identity.json', 'metadata.json', 'release-manifest.json'];
          for (const entry of manifest.files) paths.push(entry.path);
          fs.writeFileSync(outputPath, `${[...new Set(paths)].join('\n')}\n`);
          NODE
          while IFS= read -r resource_path; do
            test -n "$resource_path"
            safe_name="${resource_path//\//_}"
            curl --fail --silent --show-error --location --max-time 20 \
              --dump-header "$evidence/$safe_name.headers" \
              --output "$evidence/$safe_name.body" \
              --write-out '%{http_code}\n' \
              "$ORIGIN/$resource_path" > "$evidence/$safe_name.status"
          done < "$evidence/resource-list.txt"
          curl --fail --silent --show-error --location --max-time 20 \
            --dump-header "$evidence/health.headers" \
            --output "$evidence/health.body" \
            --write-out '%{http_code}\n' \
            "$ORIGIN/health" > "$evidence/health.status"
          node - "$extraction/dist" "$evidence" "$SOURCE_COMMIT" "$SOURCE_TREE" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const [dist, evidence, expectedCommit, expectedTree] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(path.join(dist, 'release-manifest.json'), 'utf8'));
          const resources = new Map(manifest.files.map((entry) => [entry.path, entry]));
          for (const resourcePath of ['index.html', 'build-identity.json', 'metadata.json', 'release-manifest.json']) {
            if (!resources.has(resourcePath)) {
              const body = fs.readFileSync(path.join(dist, resourcePath));
              resources.set(resourcePath, {
                path: resourcePath,
                bytes: body.length,
                sha256: crypto.createHash('sha256').update(body).digest('hex'),
              });
            }
          }
          const results = [];
          for (const [resourcePath, expected] of resources) {
            const safeName = resourcePath.replaceAll('/', '_');
            const status = fs.readFileSync(path.join(evidence, `${safeName}.status`), 'utf8').trim();
            const body = fs.readFileSync(path.join(evidence, `${safeName}.body`));
            const sha256 = crypto.createHash('sha256').update(body).digest('hex');
            if (status !== '200' || body.length !== expected.bytes || sha256 !== expected.sha256) {
              throw new Error(`${resourcePath}: official status/bytes/SHA mismatch`);
            }
            results.push({ path: resourcePath, status: 200, bytes: body.length, sha256 });
          }
          const identity = JSON.parse(fs.readFileSync(path.join(evidence, 'build-identity.json.body'), 'utf8'));
          if (identity.sourceCommit !== expectedCommit || identity.sourceTree !== expectedTree) {
            throw new Error('official build identity source mismatch');
          }
          const identityHeaders = fs.readFileSync(path.join(evidence, 'build-identity.json.headers'), 'utf8').toLowerCase();
          if (!identityHeaders.includes('content-type: application/json') || !identityHeaders.includes('cache-control: no-store')) {
            throw new Error('official build identity headers mismatch');
          }
          const healthStatus = fs.readFileSync(path.join(evidence, 'health.status'), 'utf8').trim();
          const health = JSON.parse(fs.readFileSync(path.join(evidence, 'health.body'), 'utf8'));
          if (healthStatus !== '200' || health.service !== 'ynx-payd' || health.network !== 'YNX Testnet' || health.chainId !== 6423) {
            throw new Error('official backend health mismatch');
          }
          fs.writeFileSync(path.join(evidence, 'official-resource-summary.json'), `${JSON.stringify({
            origin: process.env.ORIGIN,
            sourceCommit: expectedCommit,
            sourceTree: expectedTree,
            resources: results,
            health: { status: 200, service: health.service, network: health.network, chainId: health.chainId },
          }, null, 2)}\n`);
          NODE

      - name: Cold and second hosted Chromium launch
        shell: bash
        working-directory: apps/pay
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/pay-p0228-evidence" "$RUNNER_TEMP/pay-p0228-profile" "$ORIGIN" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require('playwright');
          const [evidenceDir, profileDir, origin] = process.argv.slice(2);

          const run = async (phase) => {
            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];
            const networkResponses = [];
            const context = await chromium.launchPersistentContext(profileDir, {
              headless: true,
              viewport: { width: 1440, height: 1000 },
            });
            try {
              const pages = context.pages();
              const page = pages[0] || await context.newPage();
              page.on('console', (message) => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('pageerror', (error) => pageErrors.push(String(error)));
              page.on('requestfailed', (request) => failedRequests.push({
                url: request.url(),
                errorText: request.failure()?.errorText || 'unknown',
              }));
              page.on('response', (response) => networkResponses.push({
                url: response.url(),
                status: response.status(),
              }));
              const capture = async (stage) => {
                const state = await page.evaluate(() => ({
                  url: location.href,
                  title: document.title,
                  lang: document.documentElement.lang,
                  bodyText: document.body.innerText,
                  html: document.documentElement.outerHTML,
                }));
                const record = {
                  phase,
                  stage,
                  ...state,
                  openPages: context.pages().map((item) => item.url()),
                  consoleErrors: [...consoleErrors],
                  pageErrors: [...pageErrors],
                  failedRequests: [...failedRequests],
                  networkResponses: [...networkResponses],
                };
                fs.writeFileSync(path.join(evidenceDir, `${phase}-${stage}.json`), `${JSON.stringify(record, null, 2)}\n`);
                try {
                  await page.screenshot({ path: path.join(evidenceDir, `${phase}-${stage}.png`), fullPage: true });
                } catch (error) {
                  fs.writeFileSync(path.join(evidenceDir, `${phase}-${stage}-screenshot-error.txt`), `${error.stack || error}\n`);
                }
                return record;
              };
              await capture('before-goto');
              await page.goto(`${origin}/`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await capture('before-load');
              await page.waitForLoadState('load', { timeout: 30000 });
              await capture('before-brand-ready');
              await page.getByText('YNX Pay', { exact: true }).waitFor({ state: 'visible', timeout: 30000 });
              await capture('before-disconnected-sign-in');
              await page.getByRole('button', { name: 'Sign in' }).waitFor({ state: 'visible', timeout: 30000 });
              await capture('before-settings-ready');
              await page.getByRole('button', { name: 'Settings' }).waitFor({ state: 'visible', timeout: 30000 });
              await capture('before-invoice-input-ready');
              await page.getByRole('textbox', { name: 'Invoice, Split, or service bill' }).waitFor({ state: 'visible', timeout: 30000 });
              const snapshot = await page.evaluate(() => ({
                url: location.href,
                title: document.title,
                lang: document.documentElement.lang,
                bodyText: document.body.innerText,
              }));
              const openPages = context.pages().map((item) => item.url());
              if (snapshot.url !== `${origin}/`) throw new Error(`${phase}: unstable URL ${snapshot.url}`);
              if (snapshot.title !== 'YNX Pay') throw new Error(`${phase}: unexpected title ${snapshot.title}`);
              if (snapshot.lang !== 'en') throw new Error(`${phase}: default language ${snapshot.lang}`);
              if (!snapshot.bodyText.includes('Sign in')) throw new Error(`${phase}: disconnected Sign in state missing`);
              if (!snapshot.bodyText.includes('Confirm before you pay')) throw new Error(`${phase}: Pay readiness copy missing`);
              if (snapshot.bodyText.includes('Connection details') || snapshot.bodyText.includes('Connect a wallet')) {
                throw new Error(`${phase}: chooser or connected details rendered without user action`);
              }
              if (snapshot.bodyText.includes('0x1917') || /0x[a-fA-F0-9]{40}/.test(snapshot.bodyText)) {
                throw new Error(`${phase}: fabricated account or chain`);
              }
              if (openPages.length !== 1 || openPages[0] !== `${origin}/`) {
                throw new Error(`${phase}: tab invariant failed ${JSON.stringify(openPages)}`);
              }
              if (consoleErrors.length || pageErrors.length || failedRequests.length) {
                throw new Error(`${phase}: browser errors ${JSON.stringify({ consoleErrors, pageErrors, failedRequests })}`);
              }
              const result = { phase, ...snapshot, openPages, consoleErrors, pageErrors, failedRequests, networkResponses };
              fs.writeFileSync(path.join(evidenceDir, `${phase}.json`), `${JSON.stringify(result, null, 2)}\n`);
              await capture('terminal-ready');
              return result;
            } catch (error) {
              try {
                const page = context.pages()[0];
                if (page) {
                  const state = await page.evaluate(() => ({
                    url: location.href,
                    title: document.title,
                    lang: document.documentElement.lang,
                    bodyText: document.body.innerText,
                    html: document.documentElement.outerHTML,
                  }));
                  fs.writeFileSync(path.join(evidenceDir, `${phase}-failure-state.json`), `${JSON.stringify({
                    phase,
                    ...state,
                    openPages: context.pages().map((item) => item.url()),
                    consoleErrors,
                    pageErrors,
                    failedRequests,
                    networkResponses,
                  }, null, 2)}\n`);
                  await page.screenshot({ path: path.join(evidenceDir, `${phase}-failure.png`), fullPage: true });
                }
              } catch (captureError) {
                fs.writeFileSync(path.join(evidenceDir, `${phase}-failure-capture-error.txt`), `${captureError.stack || captureError}\n`);
              }
              throw error;
            } finally {
              await context.close();
            }
          };

          (async () => {
            const cold = await run('cold');
            const second = await run('second');
            fs.writeFileSync(path.join(evidenceDir, 'summary.json'), `${JSON.stringify({
              schemaVersion: 1,
              sourceCommit: process.env.SOURCE_COMMIT,
              sourceTree: process.env.SOURCE_TREE,
              origin,
              allowedLoadStates: ['domcontentloaded', 'load'],
              forbiddenLoadState: 'networkidle',
              userSensitiveActions: false,
              cold,
              second,
            }, null, 2)}\n`);
          })().catch((error) => {
            fs.writeFileSync(path.join(evidenceDir, 'failure.txt'), `${error.stack || error}\n`);
            process.exitCode = 1;
          });
          NODE

      - name: Freeze isolated run evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pay-p0228-evidence"
          test -d "$evidence"
          find "$evidence" -type f ! -name artifact-sha256.txt ! -name artifact-bytes.txt -print0 | sort -z | xargs -0 sha256sum > "$evidence/artifact-sha256.txt"
          find "$evidence" -type f ! -name artifact-sha256.txt ! -name artifact-bytes.txt -printf '%P bytes=%s\n' | sort > "$evidence/artifact-bytes.txt"

      - name: Upload isolated hosted browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pay-web-official-browser-validation-p0228-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/pay-p0228-evidence
