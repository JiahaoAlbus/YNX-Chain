name: Synthetic Commit Header Controls

on:
  push:
    branches:
      - codex/perf-before59-stream-observer-20261128

permissions:
  contents: read

concurrency:
  group: synthetic-commit-header-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up source Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Verify synthetic header controls and bounded stream
        env:
          GOMAXPROCS: '2'
          GOTOOLCHAIN: local
          YNX_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          YNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(go env GOVERSION)" = "go$(awk '/^go / {print $2}' go.mod)"
          python3 -B scripts/verify/before59-observer-source-check.py
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          test "$(wc -c < .github/workflows/resource-market-ci.yml)" -lt 512000
          export YNX_HEADER_TREE="$(git rev-parse 'HEAD^{tree}')"
          export YNX_HEADER_FORK_TREE="$(git rev-parse 'HEAD:third_party/cometbft')"
          mkdir "$RUNNER_TEMP/ynx-synthetic-header-public"
          set +e
          go test -mod=readonly -json -p 1 -count=1 -timeout=90s -run '^(TestBefore59(CostOriginalEngineTransferResult|AllObserverStagesPreserveOriginalBlockExecutor|ObserverAllStagesPreserveOriginalStateEveryHeight|SyntheticStreamOnlyCost)|TestCommitHeaderProbeRealBlockExecutor|TestOperatorCommitObservationBoundedSamplesAndNormalStopGuard|TestSyntheticCommitHeaderCaptureDoesNotReviveAttempts|TestSyntheticCommitHeaderCaptureDoesNotReviveFailedPersistence|TestSyntheticCommitHeaderCaptureStateSyncInvalidates|TestSyntheticCommitHeaderConcurrentReaders|TestSyntheticCommitHeaderRealEngineOffOnEquivalent|TestSyntheticCommitHeaderAndTimingAtomicSnapshot|TestSyntheticCommitHeaderOriginalClockCallback|TestSyntheticCommitHeaderIdentityOverflowRefuses|TestSyntheticHeaderStream.*)$' ./cmd/ynx-comet ./internal/consensus > "$RUNNER_TEMP/ynx-synthetic-header-public/events.jsonl"
          YNX_HEADER_GO_STATUS=$?
          set -e
          printf 'YNX-SYNTHETIC-HEADER-RAW-BEGIN/v1 source=%s run=%s attempt=%s exit=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$YNX_HEADER_GO_STATUS"
          cat "$RUNNER_TEMP/ynx-synthetic-header-public/events.jsonl"
          printf 'YNX-SYNTHETIC-HEADER-RAW-END/v1 source=%s run=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          test "$YNX_HEADER_GO_STATUS" -eq 0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          python3 -B - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          package = 'github.com/JiahaoAlbus/YNX-Chain/cmd/ynx-comet'
          consensus = 'github.com/JiahaoAlbus/YNX-Chain/internal/consensus'
          names = ['TestBefore59CostOriginalEngineTransferResult', 'TestBefore59SyntheticStreamOnlyCost', 'TestBefore59AllObserverStagesPreserveOriginalBlockExecutor', 'TestBefore59ObserverAllStagesPreserveOriginalStateEveryHeight', 'TestCommitHeaderProbeRealBlockExecutor', 'TestSyntheticCommitHeaderCaptureDoesNotReviveAttempts', 'TestSyntheticCommitHeaderCaptureDoesNotReviveFailedPersistence', 'TestSyntheticCommitHeaderCaptureStateSyncInvalidates', 'TestSyntheticCommitHeaderConcurrentReaders', 'TestSyntheticCommitHeaderRealEngineOffOnEquivalent', 'TestSyntheticCommitHeaderAndTimingAtomicSnapshot', 'TestSyntheticCommitHeaderOriginalClockCallback']
          names += ['TestSyntheticHeaderStreamOriginalCallback', 'TestSyntheticHeaderStreamPreStartCallbackUnknown', 'TestSyntheticHeaderStreamChangedAttemptUnknown', 'TestSyntheticHeaderStreamOptionsFailClosed', 'TestSyntheticHeaderStreamRawTimingProjection', 'TestSyntheticHeaderStreamCloseDoesNotRetryTimedOutFinish', 'TestSyntheticHeaderStreamNormalNodeNoActivityUnknown', 'TestSyntheticHeaderStreamActualPrivateFile', 'TestSyntheticHeaderStreamRejectsLossAndWrongOrder', 'TestSyntheticHeaderStreamOriginalIdentityAndBoundedRetirement', 'TestSyntheticHeaderStreamCloseFailuresRetainCustody']
          names += ['TestSyntheticHeaderStreamOnlyOptions', 'TestSyntheticHeaderStreamOnly130ApplicationCallbacks', 'TestSyntheticHeaderStreamOnlyNormalNodeNoActivity', 'TestSyntheticHeaderStreamOnlyBindIdentity', 'TestSyntheticHeaderStreamOnlyCounterOverflow', 'TestOperatorCommitObservationBoundedSamplesAndNormalStopGuard']
          children = ['TestSyntheticCommitHeaderRealEngineOffOnEquivalent/' + layout for layout in ('atomic-json', 'snapshot-journal', 'block-journal')]
          children += ['TestSyntheticHeaderStreamRejectsLossAndWrongOrder/' + name for name in ('first-cause-bytes', 'queue-full', 'byte-limit', 'invalid', 'gap', 'capture-loss', 'receipt-exists')]
          children += ['TestSyntheticHeaderStreamOriginalIdentityAndBoundedRetirement/' + name for name in ('stream-same-size-write-after-readback', 'stream-hardlink-after-readback', 'receipt-same-size-write-after-readback', 'receipt-hardlink-after-readback', 'replaced-path', 'timeout-preserves-debt')]
          children += ['TestSyntheticHeaderStreamCloseFailuresRetainCustody/' + name for name in ('constructor', 'worker')]
          overflow = 'TestSyntheticCommitHeaderIdentityOverflowRefuses'
          overflow_children = [overflow + '/' + name for name in ('epoch', 'attempt')]
          out = Path(os.environ['RUNNER_TEMP']) / 'ynx-synthetic-header-public'
          raw = (out / 'events.jsonl').read_bytes()
          events = [json.loads(line) for line in raw.splitlines()]
          def qualify(stream):
              if any(e.get('Action') in ('fail', 'skip', 'build-fail') or ('Package' in e and e['Package'] not in (package, consensus)) for e in stream):
                  raise RuntimeError('synthetic header control failed, skipped or changed package')
              if {e['Test'] for e in stream if e.get('Test')} != set(names + children + [overflow] + overflow_children):
                  raise RuntimeError('unexpected or missing synthetic header control')
              for pkg, required in ((package, names + children), (consensus, [overflow] + overflow_children)):
                  bounds = [(i, e.get('Action')) for i, e in enumerate(stream) if e.get('Package') == pkg and not e.get('Test') and e.get('Action') in ('start', 'pass')]
                  if len(bounds) != 2 or [action for _, action in bounds] != ['start', 'pass']:
                      raise RuntimeError('synthetic header package did not execute exactly once: ' + pkg)
                  positions = {}
                  for name in required:
                      found = [(i, e.get('Package'), e.get('Action')) for i, e in enumerate(stream) if e.get('Test') == name and e.get('Action') in ('run', 'pass', 'skip', 'fail')]
                      if len(found) != 2 or [(p, action) for _, p, action in found] != [(pkg, 'run'), (pkg, 'pass')] or not bounds[0][0] < found[0][0] < found[1][0] < bounds[1][0]:
                          raise RuntimeError('synthetic header control did not run and pass exactly once: ' + name)
                      positions[name] = (found[0][0], found[1][0])
                  for child in (children if pkg == package else overflow_children):
                      parent = child.split('/', 1)[0]
                      if not positions[parent][0] < positions[child][0] < positions[child][1] < positions[parent][1]:
                          raise RuntimeError('synthetic header child escaped parent: ' + child)
          qualify(events)
          def qualify_cost(stream):
              marker = 'YNX_SYNTHETIC_STREAM_ONLY_AB '
              cost_lines = [e['Output'].split(marker, 1)[1].strip() for e in stream
                            if e.get('Test') == 'TestBefore59SyntheticStreamOnlyCost' and e.get('Action') == 'output'
                            and marker in e.get('Output', '')]
              if len(cost_lines) != 1:
                  raise RuntimeError('original stream-only cost event missing or repeated')
              def unique_object(pairs):
                  out = {}
                  for key, value in pairs:
                      if key in out: raise RuntimeError('duplicate original cost field')
                      out[key] = value
                  return out
              cost = json.loads(cost_lines[0], object_pairs_hook=unique_object)
              records = cost.get('records')
              if (cost.get('version') != 'YNX-SYNTHETIC-STREAM-ONLY-AB/v1' or cost.get('source') != os.environ['GITHUB_SHA']
                      or cost.get('nodeStarted') is not False or cost.get('runtimeAuthorized') is not False
                      or cost.get('independentFinality') is not False or type(cost.get('pid')) is not int or cost['pid'] <= 0
                      or cost.get('clock') != 'CLOCK_MONOTONIC' or not re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', cost.get('bootID', ''))
                      or not re.fullmatch(r'[0-9]+:[0-9]+', cost.get('timeNamespace', ''))
                      or any(not re.fullmatch(r'[0-9a-f]{64}', cost.get(key, '')) for key in ('testBinarySHA256', 'inputSHA256', 'blockHash', 'appHash'))
                      or type(cost.get('height')) is not int or cost['height'] <= 0
                      or type(cost.get('processMaxRSSKiBSharedLifetime')) is not int or cost['processMaxRSSKiBSharedLifetime'] <= 0
                      or type(records) is not list or len(records) != 20):
                  raise RuntimeError('original stream-only cost identity or count differs')
              for i, record in enumerate(records):
                  round_number = i // 2
                  if (type(record.get('round')) is not int or record['round'] != round_number
                          or type(record.get('enabled')) is not bool or record['enabled'] != ((round_number % 2 == 0) == (i % 2 == 0))
                          or type(record.get('warmup')) is not bool or record['warmup'] != (round_number < 2)
                          or any(type(record.get(key)) is not int or record[key] < 0 for key in ('engineFixtureNs', 'probeAndStreamStopNs', 'observerCloseNs', 'allocatedBytes', 'streamBytes'))
                          or (record['enabled'] and (record['streamBytes'] == 0 or not re.fullmatch(r'[0-9a-f]{64}', record.get('streamSHA256', ''))))
                          or (not record['enabled'] and (record['streamBytes'] != 0 or record['observerCloseNs'] != 0 or 'streamSHA256' in record))):
                      raise RuntimeError('original stream-only cost round differs')
              for enabled, suffix in ((False, 'Off'), (True, 'On')):
                  for value_key, median_key in (('engineFixtureNs', 'medianEngineFixtureNs'), ('probeAndStreamStopNs', 'medianProbeAndStreamStopNs')):
                      values = sorted(r[value_key] for r in records if r['enabled'] is enabled and not r['warmup'])
                      if len(values) != 8 or type(cost.get(median_key + suffix)) is not int or cost[median_key + suffix] != values[3] + (values[4] - values[3]) // 2:
                          raise RuntimeError('original stream-only cost median differs from rounds')
              return cost
          cost = qualify_cost(events)
          cost_mutants = [json.loads(json.dumps(cost)) for _ in range(5)]
          cost_mutants[0]['source'] = '0' * 40
          cost_mutants[1]['records'].pop()
          cost_mutants[2]['medianEngineFixtureNsOn'] += 1
          cost_mutants[3]['records'][0]['enabled'] = not cost_mutants[3]['records'][0]['enabled']
          cost_mutants[4]['medianEngineFixtureNsOn'] = True
          for altered in cost_mutants:
              candidate = [dict(e) for e in events]
              output = next(e for e in candidate if e.get('Test') == 'TestBefore59SyntheticStreamOnlyCost' and 'YNX_SYNTHETIC_STREAM_ONLY_AB ' in e.get('Output', ''))
              output['Output'] = 'YNX_SYNTHETIC_STREAM_ONLY_AB ' + json.dumps(altered) + '\n'
              try:
                  qualify_cost(candidate)
              except RuntimeError:
                  continue
              raise RuntimeError('synthetic header cost negative control was accepted')
          mutants = [[dict(e) for e in events] for _ in range(4)]
          mutants[0].append(dict(Package='unexpected/package', Action='start'))
          next(e for e in mutants[1] if e.get('Test') == names[0] and e.get('Action') == 'run')['Package'] = consensus
          mutants[2] = [e for e in mutants[2] if e.get('Test') != overflow_children[0]]
          next(e for e in mutants[3] if e.get('Test') == children[0] and e.get('Action') == 'pass')['Action'] = 'skip'
          for mutant in mutants:
              try:
                  qualify(mutant)
              except RuntimeError:
                  continue
              raise RuntimeError('synthetic header stream negative control was accepted')
          metadata = dict(version='YNX-SYNTHETIC-HEADER-CONTROLS/v1', sourceCommit=os.environ['GITHUB_SHA'], sourceTree=os.environ['YNX_HEADER_TREE'], forkTree=os.environ['YNX_HEADER_FORK_TREE'], eventName=os.environ['GITHUB_EVENT_NAME'], pullRequestHead=os.environ['YNX_PR_HEAD'], pullRequestBase=os.environ['YNX_PR_BASE'], runId=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'], job=os.environ['GITHUB_JOB'], eventsBytes=len(raw), eventsSha256=hashlib.sha256(raw).hexdigest(), tests=names + [overflow], children=children + overflow_children, runtimeAuthorized=False, independentFinalityVerified=False)
          metadata_line = json.dumps(metadata, sort_keys=True, separators=(',', ':'))
          (out / 'metadata.json').write_text(metadata_line + '\n')
          print('YNX-SYNTHETIC-HEADER-METADATA/v1 ' + metadata_line)
          print('YNX_SYNTHETIC_HEADER_CONTROLS ' + json.dumps(dict(sourceCommit=os.environ['GITHUB_SHA'], tests=names + [overflow], runtimeAuthorized=False, independentFinalityVerified=False), sort_keys=True))
          PY
      - name: Preserve only original synthetic control events
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-synthetic-header-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ynx-synthetic-header-public/events.jsonl
            ${{ runner.temp }}/ynx-synthetic-header-public/metadata.json
          if-no-files-found: error
          retention-days: 7
