name: Synthetic Commit Header Controls

on:
  push:
    branches:
      - codex/perf-commit-header-observer-20261122
      - codex/ynx-pq-perf-integration
    paths:
      - .github/workflows/pq-synthetic-header-controls.yml
      - .github/workflows/resource-market-ci.yml
      - cmd/ynx-comet/**
      - internal/consensus/**
      - third_party/cometbft/**
      - go.mod
      - go.sum
  pull_request:
    branches:
      - codex/ynx-pq-perf-integration
    paths:
      - .github/workflows/pq-synthetic-header-controls.yml
      - .github/workflows/resource-market-ci.yml
      - cmd/ynx-comet/**
      - internal/consensus/**
      - third_party/cometbft/**
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: synthetic-commit-header-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up source Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Verify five synthetic header controls
        env:
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(wc -c < .github/workflows/resource-market-ci.yml)" -lt 512000
          export YNX_HEADER_TREE="$(git rev-parse 'HEAD^{tree}')"
          mkdir "$RUNNER_TEMP/ynx-synthetic-header-public"
          set +e
          go test -mod=readonly -json -p 1 -count=1 -timeout=90s -run '^(TestCommitHeaderProbeRealBlockExecutor|TestSyntheticCommitHeaderCaptureDoesNotReviveAttempts|TestSyntheticCommitHeaderCaptureDoesNotReviveFailedPersistence|TestSyntheticCommitHeaderCaptureStateSyncInvalidates|TestSyntheticCommitHeaderConcurrentReaders)$' ./cmd/ynx-comet > "$RUNNER_TEMP/ynx-synthetic-header-public/events.jsonl"
          YNX_HEADER_GO_STATUS=$?
          set -e
          printf 'YNX-SYNTHETIC-HEADER-RAW-BEGIN/v1 source=%s run=%s attempt=%s exit=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$YNX_HEADER_GO_STATUS"
          cat "$RUNNER_TEMP/ynx-synthetic-header-public/events.jsonl"
          printf 'YNX-SYNTHETIC-HEADER-RAW-END/v1 source=%s run=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          test "$YNX_HEADER_GO_STATUS" -eq 0
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          package = 'github.com/JiahaoAlbus/YNX-Chain/cmd/ynx-comet'
          names = ['TestCommitHeaderProbeRealBlockExecutor', 'TestSyntheticCommitHeaderCaptureDoesNotReviveAttempts', 'TestSyntheticCommitHeaderCaptureDoesNotReviveFailedPersistence', 'TestSyntheticCommitHeaderCaptureStateSyncInvalidates', 'TestSyntheticCommitHeaderConcurrentReaders']
          out = Path(os.environ['RUNNER_TEMP']) / 'ynx-synthetic-header-public'
          raw = (out / 'events.jsonl').read_bytes()
          events = [json.loads(line) for line in raw.splitlines()]
          if any(e.get('Action') in ('fail', 'skip', 'build-fail') for e in events):
              raise RuntimeError('synthetic header control failed or skipped')
          if [(e.get('Package'), e.get('Action')) for e in events if not e.get('Test') and e.get('Action') in ('start', 'pass')] != [(package, 'start'), (package, 'pass')]:
              raise RuntimeError('synthetic header package did not execute exactly once')
          if {e['Test'] for e in events if e.get('Test')} != set(names):
              raise RuntimeError('unexpected or missing synthetic header control')
          for name in names:
              if [(e.get('Package'), e.get('Action')) for e in events if e.get('Test') == name and e.get('Action') in ('run', 'pass', 'skip', 'fail')] != [(package, 'run'), (package, 'pass')]:
                  raise RuntimeError('synthetic header control did not run and pass exactly once: ' + name)
          metadata = dict(version='YNX-SYNTHETIC-HEADER-CONTROLS/v1', sourceCommit=os.environ['GITHUB_SHA'], sourceTree=os.environ['YNX_HEADER_TREE'], runId=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'], job=os.environ['GITHUB_JOB'], eventsBytes=len(raw), eventsSha256=hashlib.sha256(raw).hexdigest(), tests=names, runtimeAuthorized=False, independentFinalityVerified=False)
          (out / 'metadata.json').write_text(json.dumps(metadata, sort_keys=True, separators=(',', ':')) + '\n')
          print('YNX_SYNTHETIC_HEADER_CONTROLS ' + json.dumps(dict(sourceCommit=os.environ['GITHUB_SHA'], tests=names, runtimeAuthorized=False, independentFinalityVerified=False), sort_keys=True))
          PY
      - name: Preserve only original synthetic control events
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-synthetic-header-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ynx-synthetic-header-public/events.jsonl
            ${{ runner.temp }}/ynx-synthetic-header-public/metadata.json
          if-no-files-found: error
          retention-days: 7
