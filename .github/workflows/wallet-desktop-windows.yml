name: Wallet desktop Windows

on:
  workflow_dispatch:
  push:
    branches: [codex/wallet-desktop-cli-sdk-20260813, codex/wallet-pq-sdk-r1-20261018, codex/wallet-pq-action-transport-20261019, codex/wallet-ide-native-close-r140-20261019, codex/wallet-sdk332-r140-compat-20261019, codex/wallet-joint-child-cleanup-debt-20261023, codex/wallet-auth4-deploy-material-20261023, codex/wallet-r154-paired-source-20261023, codex/wallet-developer-contract-client-20261023, codex/wallet-r159-typed-native-20261023, codex/wallet-artifact-contract-20261024]
    paths:
      - apps/wallet-desktop/**
      - packages/wallet-auth/**
      - .github/workflows/wallet-desktop-windows.yml

  pull_request:
    paths:
      - packages/wallet-auth/**
      - .github/workflows/wallet-desktop-windows.yml

permissions:
  contents: read

jobs:
  ide-native-close-order:
    if: github.ref == 'refs/heads/codex/wallet-ide-native-close-r140-20261019' || github.head_ref == 'codex/wallet-ide-native-close-r140-20261019'
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Check actual Native cleanup bodies with public dependencies
        run: node packages/wallet-auth/native/tests/ide-close-order/run.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ide-native-close-order-evidence
          path: ${{ runner.temp }}/ynx-ide-close-evidence-*/*
          if-no-files-found: error

  sdk-action-transport:
    name: SDK action transport DATA delta
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/wallet-pq-action-transport-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: packages/wallet-auth/package-lock.json
      - name: Install exact SDK dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --fund=false --prefix packages/wallet-auth
      - name: Run only new byte-envelope, original snapshot binding and type controls
        run: npm run test:pq-action-transport --prefix packages/wallet-auth
      - name: Pack SDK332 and compare every archive member to the exact Git blob
        run: |
          mkdir -p "$RUNNER_TEMP/sdk332"
          npm pack ./packages/wallet-auth --ignore-scripts --pack-destination "$RUNNER_TEMP/sdk332" --json > "$RUNNER_TEMP/sdk332/npm-pack.json"
          python3 <<'PY'
          import hashlib,json,os,pathlib,subprocess,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'sdk332'
          package=json.loads((root/'npm-pack.json').read_text())[0]
          assert package['version']=='1.3.0-pq.3.32-auth.1'
          archive=root/package['filename'];seen=set();rows=[]
          with tarfile.open(archive,'r:gz') as tar:
            for m in tar.getmembers():
              p=pathlib.PurePosixPath(m.name)
              assert m.isfile() and p.parts[0]=='package' and not p.is_absolute() and '..' not in p.parts
              rel=str(p.relative_to('package'));assert rel not in seen;seen.add(rel)
              raw=tar.extractfile(m).read();assert raw==subprocess.check_output(['git','show','HEAD:packages/wallet-auth/'+rel]),rel
              rows.append({'path':rel,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          assert seen=={f['path'] for f in package['files']}
          report={'commit':os.environ['GITHUB_SHA'],'version':package['version'],'archive':archive.name,'bytes':archive.stat().st_size,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'files':rows,'NativeBuild':False,'AppBuild':False,'grant':False,'publicRelease':False}
          (root/'git-blob-readback.json').write_text(json.dumps(report,indent=2)+'\n')
          print('SDK332 exact Git blob members:',len(rows))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk332-action-transport-candidate
          path: ${{ runner.temp }}/sdk332/*
          if-no-files-found: error
