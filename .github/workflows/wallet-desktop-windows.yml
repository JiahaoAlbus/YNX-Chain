              assert m.isfile() and p.parts[0]=='package' and not p.is_absolute() and '..' not in p.parts
              rel=str(p.relative_to('package'));assert rel not in seen;seen.add(rel)
              raw=tar.extractfile(m).read();assert raw==subprocess.check_output(['git','show','HEAD:packages/wallet-auth/'+rel]),rel
              rows.append({'path':rel,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          assert seen=={f['path'] for f in package['files']}
          report={'commit':os.environ['GITHUB_SHA'],'version':package['version'],'archive':archive.name,'bytes':archive.stat().st_size,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'files':rows,'NativeBuild':False,'AppBuild':False,'grant':False,'publicRelease':False}
          (root/'git-blob-readback.json').write_text(json.dumps(report,indent=2)+'\n')
