name: Wallet CLI Windows arm64 native lifecycle

on:
  workflow_dispatch:
  push:
    branches: [codex/wallet-desktop-cli-sdk-20260813]
    paths:
      - .github/workflows/wallet-cli-windows-arm64-native.yml

permissions:
  contents: read

jobs:
  windows-arm64-cli-native:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.0
          cache: true
      - name: Install preflight, upgrade, cold start, second start, Testnet, fail closed and uninstall
        shell: pwsh
        env:
          ARCHIVE: release/wallet-cli/windows-installers/ynx-wallet-cli-windows-arm64-installer.zip
          VECTOR: packages/wallet-auth/testdata/product-session-http-proof-v1.json
          EVIDENCE_DIR: ${{ runner.temp }}\wallet-cli-windows-arm64-evidence
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw 'runner is not native ARM64' }
          $expectedArchiveSha = '8e2e1b173b8de63a93a368f658e318cbc4ac142af9345d3010a3e0957ef130fc'
          $expectedArchiveBytes = 4586536
          $expectedBinarySha = 'a99614f399643f44ffd9beef484d306d4b3b62971010cd3dce8c4ee79164ff9f'
          $expectedBinaryBytes = 8487424
          $archiveItem = Get-Item $env:ARCHIVE
          if ($archiveItem.Length -ne $expectedArchiveBytes -or (Get-FileHash $archiveItem.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedArchiveSha) { throw 'committed installer archive integrity mismatch' }

          $stage = Join-Path $env:RUNNER_TEMP 'wallet-cli-arm64-current'
          Expand-Archive $archiveItem.FullName $stage
          $inner = Get-Content (Join-Path $stage 'manifest.json') -Raw | ConvertFrom-Json
          $payload = Join-Path $stage 'ynx-wallet-cli.exe'
          $payloadSignature = Get-AuthenticodeSignature $payload
          if ($inner.architecture -ne 'arm64' -or $inner.binarySha256 -ne $expectedBinarySha -or $inner.binaryBytes -ne $expectedBinaryBytes -or (Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedBinarySha -or $payloadSignature.Status -ne 'NotSigned' -or $inner.productionSigned) { throw 'installer payload boundary mismatch' }

          $installRoot = Join-Path $env:LOCALAPPDATA 'YNX Wallet CLI'
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          $exe = Join-Path $installRoot 'ynx-wallet-cli.exe'
          go build -trimpath -buildvcs=false -ldflags '-buildid= -X main.version=preflight-arm64-native-ci' -o $exe ./cmd/ynx-wallet-cli
          if ($LASTEXITCODE -ne 0) { throw 'preflight build failed' }
          $preflight = & $exe version | ConvertFrom-Json
          if ($preflight.version -ne 'preflight-arm64-native-ci') { throw 'preflight install failed' }

          & (Join-Path $stage 'install.ps1')
          if (-not (Test-Path $exe)) { throw 'current installer did not preserve canonical executable' }
          $current = & $exe version | ConvertFrom-Json
          if ($current.version -ne '95bd2aad56bd8b72246f3f0e9529d699f09550ad' -or $current.productionSigned) { throw 'upgrade identity mismatch' }
          $cold = & $exe version | ConvertFrom-Json
          $second = & $exe version | ConvertFrom-Json
          if ($cold.version -ne $current.version -or $second.version -ne $current.version) { throw 'cold or second start identity mismatch' }
          $vector = & $exe verify-vector -file $env:VECTOR | ConvertFrom-Json
          $sign = & $exe sign-self-test | ConvertFrom-Json
          $chain = & $exe chain-status -timeout 15s | ConvertFrom-Json
          if (-not $vector.verified -or -not $sign.verified -or $sign.privateKeyPersisted -or $chain.chainId -ne '0x1917') { throw 'runtime contract or Testnet verification failed' }

          $failureOutput = & $exe chain-status -rpc http://127.0.0.1:1 2>&1
          if ($LASTEXITCODE -eq 0 -or ($failureOutput -join "`n") -notmatch 'RPC must use HTTPS') { throw 'invalid RPC did not fail closed' }
          & (Join-Path $stage 'uninstall.ps1')
          if (Test-Path $exe) { throw 'uninstall did not remove executable' }

          New-Item -ItemType Directory -Path $env:EVIDENCE_DIR -Force | Out-Null
          [ordered]@{
            schemaVersion = 1
            sourceCommit = $env:GITHUB_SHA
            workflowRunId = [long]$env:GITHUB_RUN_ID
            architecture = 'arm64'
            nativeRunner = 'windows-11-arm'
            installer = [ordered]@{
              filename = $archiveItem.Name
              format = 'zip PowerShell user installer'
              bytes = $archiveItem.Length
              sha256 = $expectedArchiveSha
              payloadBytes = $expectedBinaryBytes
              payloadSha256 = $expectedBinarySha
              minimumOS = 'Windows 10 or Windows Server 2016 declared by existing installer; Windows 11 arm64 directly tested'
              signingClass = 'unsigned_windows_user_installer_candidate'
              authenticodeStatus = $payloadSignature.Status.ToString()
              productionSigned = $false
            }
            lifecycle = [ordered]@{
              preflightInstalled = $true
              upgradeVerified = $true
              coldStart = $true
              secondStart = $true
              vectorVerified = $true
              ephemeralSigningSelfTestVerified = $true
              privateKeyPersisted = $false
              chainId = '0x1917'
              rpcFailureClosed = $true
              uninstallVerified = $true
              transactionCreated = $false
              balanceClaimed = $false
              productionSigned = $false
            }
          } | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $env:EVIDENCE_DIR 'lifecycle.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ynx-wallet-cli-windows-arm64-native
          path: |
            release/wallet-cli/windows-installers/ynx-wallet-cli-windows-arm64-installer.zip
            ${{ runner.temp }}\wallet-cli-windows-arm64-evidence\lifecycle.json
          if-no-files-found: error

  verify-uploaded-artifact:
    needs: windows-arm64-cli-native
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ynx-wallet-cli-windows-arm64-native
          path: downloaded
      - name: Require lifecycle evidence and verify downloaded installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw 'download verifier is not native ARM64' }
          $archive = Get-ChildItem downloaded -Filter 'ynx-wallet-cli-windows-arm64-installer.zip' -File -Recurse | Select-Object -First 1
          $evidenceFile = Get-ChildItem downloaded -Filter 'lifecycle.json' -File -Recurse | Select-Object -First 1
          if (-not $archive -or -not $evidenceFile) { throw 'downloaded artifact is incomplete' }
          $evidence = Get-Content $evidenceFile.FullName -Raw | ConvertFrom-Json
          $sha = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($evidence.sourceCommit -ne $env:GITHUB_SHA -or $archive.Length -ne 4586536 -or $sha -ne '8e2e1b173b8de63a93a368f658e318cbc4ac142af9345d3010a3e0957ef130fc' -or -not $evidence.lifecycle.preflightInstalled -or -not $evidence.lifecycle.upgradeVerified -or -not $evidence.lifecycle.coldStart -or -not $evidence.lifecycle.secondStart -or -not $evidence.lifecycle.vectorVerified -or -not $evidence.lifecycle.ephemeralSigningSelfTestVerified -or $evidence.lifecycle.privateKeyPersisted -or $evidence.lifecycle.chainId -ne '0x1917' -or -not $evidence.lifecycle.rpcFailureClosed -or -not $evidence.lifecycle.uninstallVerified -or $evidence.lifecycle.productionSigned -or $evidence.installer.authenticodeStatus -ne 'NotSigned') { throw 'downloaded release boundary mismatch' }
          [ordered]@{sourceCommit=$env:GITHUB_SHA;workflowRunId=[long]$env:GITHUB_RUN_ID;uploadArtifactDownloaded=$true;lifecyclePresent=$true;sha256Verified=$true;bytesVerified=$true;sha256=$sha;bytes=$archive.Length} | ConvertTo-Json -Depth 4 | Set-Content downloaded-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ynx-wallet-cli-windows-arm64-native-download-verification
          path: downloaded-verification.json
          if-no-files-found: error
