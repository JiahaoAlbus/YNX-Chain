name: Developer Windows package proof

on:
  workflow_dispatch:
  push:
    branches: [codex/final-developer, codex/ynx-code-platform-v1]
    paths:
      - "apps/developer/**"
      - "packages/developer-client/**"
      - ".github/workflows/developer-windows.yml"

permissions:
  contents: read

concurrency:
  group: developer-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-cold-launch:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned workspace dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned Developer dependencies
        working-directory: apps/developer
        run: npm ci --ignore-scripts
      - name: Client tests
        working-directory: packages/developer-client
        run: npm test
      - name: Web and desktop boundary tests
        working-directory: apps/developer
        run: npm test
      - name: Install Windows App Packaging tools
        run: |
          winget install --id Microsoft.WindowsSDK.10.0.26100 --exact --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { Write-Host "Windows SDK is already installed or winget reported no available upgrade; package-windows.ps1 will resolve MakeAppx.exe or fail closed." }
          exit 0
      - name: Build portable Windows package
        working-directory: apps/developer
        run: ./scripts/package-windows.ps1
      - name: Install and cold-launch portable package
        working-directory: apps/developer
        run: ./scripts/verify-windows-package.ps1
      - name: Install and cold-launch MSIX package
        working-directory: apps/developer
        run: ./scripts/verify-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ynx-developer-testnet-preview-windows-x64-unsigned
          path: |
            apps/developer/.ynx-developer-windows-candidates/**/ynx-developer-testnet-preview-windows-x64-unsigned.zip
            apps/developer/.ynx-developer-windows-candidates/**/ynx-developer-testnet-preview-windows-x64-test-signed.msix
            apps/developer/.ynx-developer-windows-candidates/**/ynx-developer-testnet-preview-windows-x64-test-signed.cer
            apps/developer/.ynx-developer-windows-candidates/**/windows-package.json
            apps/developer/.ynx-developer-windows-candidates/**/windows-installer.json
            apps/developer/.ynx-developer-windows-candidates/**/windows-msix-install-evidence.json
            apps/developer/.ynx-developer-windows-candidates/**/windows-native-self-test.json
            apps/developer/.ynx-developer-windows-candidates/**/windows-install-evidence.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
