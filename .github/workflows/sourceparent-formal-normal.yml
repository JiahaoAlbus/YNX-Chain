name: SourceParent formal normal source and ABI intake
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/wallet-auth/native/source-parent/**
      - packages/wallet-auth/go/sourceparentprofile/**
      - packages/wallet-auth/scripts/sourceparent-normal-inputs*
      - packages/wallet-auth/test/sourceparent-*
      - packages/wallet-auth/test/fixtures/source-parent-abi/**
      - packages/wallet-auth/docs/sourceparent-formal-normal-integration.md
      - packages/wallet-auth/package.json
      - scripts/ci/sourceparent-formal-*
      - .github/workflows/sourceparent-formal-normal.yml
jobs:
  new-source-abi-package-only:
    # This topic validates its new issuer merge in the dedicated normal job.
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/wallet-auth49-ide-relay-issuance-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/sourceparent-formal-normal.mjs 2>&1 | tee sourceparent-formal-normal.log
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - run: node scripts/ci/sourceparent-formal-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sourceparent-formal-normal-source
          path: |
            sourceparent-formal-normal.log
            sourceparent-formal-normal-controls/*.json
            canonical-common-source-package
