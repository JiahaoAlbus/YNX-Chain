name: Exact 491188 Public NIST Vector Control

on:
  push:
    branches:
      - codex/perf-client-nist-491188-publish-20261128

permissions:
  contents: read

concurrency:
  group: perf-client-491188-nist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact Tools source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify original NIST event controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -B - <<'PY'
          import importlib.util, pathlib, sys, unittest
          path=pathlib.Path('scripts/loadtest/test_pq_perf_client_nist_ci.py')
          spec=importlib.util.spec_from_file_location('original_nist_ci_controls',path)
          module=importlib.util.module_from_spec(spec);sys.modules[spec.name]=module;spec.loader.exec_module(module)
          suite=unittest.defaultTestLoader.loadTestsFromModule(module)
          if suite.countTestCases()!=8: raise RuntimeError('exact NIST controls inventory differs')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun!=8 or result.skipped or not result.wasSuccessful(): raise RuntimeError('NIST controls failed or skipped')
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"

  original-public-vectors:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Tools source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - name: Checkout exact original 491188 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 491188519d038b361ce04faa80137e79a409bd0e
          path: client
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Go 1.26.11 toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.11
          cache: false
      - name: Run original public NIST vector test under original Window
        env:
          YNX_TOOLS_SOURCE: ${{ github.workspace }}/tools
          YNX_CLIENT_SOURCE: ${{ github.workspace }}/client
          YNX_PRIVATE_WORK: ${{ runner.temp }}/ynx-491188-nist-private
          YNX_PUBLIC_OUTPUT: ${{ runner.temp }}/ynx-491188-nist-public
        run: |
          set -euo pipefail
          mkdir -m 700 "$YNX_PRIVATE_WORK"
          python3 -B "$YNX_TOOLS_SOURCE/scripts/loadtest/pq-perf-client-491188-nist-ci.py"
      - name: Preserve original public NIST events
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-client-491188-nist-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ynx-491188-nist-public/nist-test-original.log
            ${{ runner.temp }}/ynx-491188-nist-public/nist-test-events.jsonl
            ${{ runner.temp }}/ynx-491188-nist-public/metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve original bounded NIST failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-client-491188-nist-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ynx-491188-nist-public/failure-*
          if-no-files-found: ignore
          retention-days: 7
