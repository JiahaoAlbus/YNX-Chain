name: AI V6 carrier wellformed Unicode delta
on:
  workflow_dispatch:
  push:
    branches: [codex/wallet-auth49-ai-v6-carrier-wellformed-20261107]
  pull_request:
    paths:
      - packages/wallet-auth/src/original-ai-task-response-carrier-v6-data.mjs
      - packages/wallet-auth/test/ai-v6-response-carrier-wellformed.test.mjs
      - packages/wallet-auth/scripts/ci/ai-v6-response-carrier-wellformed.mjs
      - .github/workflows/ai-v6-response-carrier-wellformed.yml
permissions:
  contents: read
jobs:
  metadata-unicode-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - run: node packages/wallet-auth/scripts/ci/ai-v6-response-carrier-wellformed.mjs
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ai-v6-carrier-wellformed-source-data
          if-no-files-found: error
          path: |
            AI_V6_RESPONSE_CARRIER_WELLFORMED_DATA
            canonical-common-source-package
