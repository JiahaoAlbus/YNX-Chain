name: Wallet Auth AI V6 mobile r4 snapshot delta
on:
  workflow_dispatch:
  push:
    branches: [codex/wallet-auth49-ai-v6-mobile-snapshot-r4-20261107]
  pull_request:
    paths:
      - packages/wallet-auth/src/original-ai-task-action-v6-mobile*
      - packages/wallet-auth/test/ai-v6-mobile-r4*
      - packages/wallet-auth/test/fixtures/ai-v6-mobile-r4/**
      - packages/wallet-auth/scripts/ci/ai-v6-mobile-snapshot-r4.mjs
      - .github/workflows/wallet-auth-ai-v6-mobile-r4.yml
permissions:
  contents: read
jobs:
  r4-plain-snapshot-cancel-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - run: node packages/wallet-auth/scripts/ci/ai-v6-mobile-snapshot-r4.mjs
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ai-v6-mobile-r4-source-model
          if-no-files-found: error
          path: |
            AI_V6_MOBILE_R4_DATA
            canonical-common-source-package
