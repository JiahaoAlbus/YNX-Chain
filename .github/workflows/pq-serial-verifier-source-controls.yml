name: Serial Original Verifier Source Controls

on:
  push:
    branches:
      - codex/perf-serial-verifier-v7-20261128
  pull_request:
    branches:
      - codex/perf-before59-manifest-binding-20261122

permissions:
  contents: read

concurrency:
  group: serial-original-verifier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run staged, Linux verifier, and synthetic header DATA controls
        env:
          YNX_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          YNX_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          export YNX_SERIAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          export YNX_SERIAL_FORK="$(git rev-parse 'HEAD:third_party/cometbft')"
          mkdir "$RUNNER_TEMP/ynx-serial-verifier-public"
          python3 -B - <<'PY'
          import hashlib, importlib.util, io, json, os, pathlib, platform, sys, unittest
          if sys.platform != 'linux': raise RuntimeError('actual original Linux controls required')
          root=pathlib.Path('scripts/loadtest'); out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ynx-serial-verifier-public'
          groups=[('staged','test_pq_staged_independent_scheduler.py',23),('serial','test_pq_serial_verifier_admission.py',28),('header-data','test_pq_synthetic_header_stream_data.py',11),('header-driver-data','test_pq_synthetic_header_driver_data.py',8),('commit-validation','test_pq_commit_validation_readback.py',13),('initialization','test_pq_initialization_measurements.py',37),('go-evidence-parser','test_pq_synthetic_header_cross_source_ci.py',7)]
          metadata=dict(version='YNX-SERIAL-VERIFIER-CONTROLS/v1',sourceCommit=os.environ['GITHUB_SHA'],sourceTree=os.environ['YNX_SERIAL_TREE'],forkTree=os.environ['YNX_SERIAL_FORK'],eventName=os.environ['GITHUB_EVENT_NAME'],pullRequestHead=os.environ['YNX_PR_HEAD'],pullRequestBase=os.environ['YNX_PR_BASE'],runId=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],job=os.environ['GITHUB_JOB'],platform=sys.platform,kernel=platform.release(),groups=[],runtimeAuthorized=False,independentFinalityVerified=False)
          for name,file,count in groups:
              spec=importlib.util.spec_from_file_location('original_serial_ci_'+name,root/file)
              module=importlib.util.module_from_spec(spec);sys.modules[spec.name]=module;spec.loader.exec_module(module)
              suite=unittest.defaultTestLoader.loadTestsFromModule(module)
              if suite.countTestCases()!=count:raise RuntimeError('exact original test inventory differs: '+name)
              stream=io.StringIO(); result=unittest.TextTestRunner(stream=stream,verbosity=2).run(suite)
              raw=stream.getvalue().encode('utf-8');(out/(name+'.log')).write_bytes(raw)
              print('YNX-SERIAL-CONTROLS-BEGIN/v1 group=%s source=%s run=%s attempt=%s' % (name,os.environ['GITHUB_SHA'],os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT']))
              print(raw.decode('utf-8'),end='')
              print('YNX-SERIAL-CONTROLS-END/v1 group=%s' % name)
              if result.testsRun!=count or result.skipped or not result.wasSuccessful():raise RuntimeError('original controls failed or skipped: '+name)
              metadata['groups'].append(dict(name=name,testsRun=result.testsRun,skipped=len(result.skipped),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()))
          line=json.dumps(metadata,sort_keys=True,separators=(',',':'))
          (out/'metadata.json').write_text(line+'\n')
          print('YNX-SERIAL-CONTROLS-METADATA/v1 '+line)
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
      - name: Preserve original control evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-serial-verifier-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ynx-serial-verifier-public/staged.log
            ${{ runner.temp }}/ynx-serial-verifier-public/serial.log
            ${{ runner.temp }}/ynx-serial-verifier-public/header-data.log
            ${{ runner.temp }}/ynx-serial-verifier-public/header-driver-data.log
            ${{ runner.temp }}/ynx-serial-verifier-public/commit-validation.log
            ${{ runner.temp }}/ynx-serial-verifier-public/initialization.log
            ${{ runner.temp }}/ynx-serial-verifier-public/go-evidence-parser.log
            ${{ runner.temp }}/ynx-serial-verifier-public/metadata.json
          if-no-files-found: error
          retention-days: 7

  original-go-writer-and-reader:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact Tools source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - name: Checkout exact original synthetic writer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ec8710b30673414487115f4fad6aa51a778d6284
          path: producer
          persist-credentials: false
      - name: Set up original Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: producer/go.mod
          cache: false
      - name: Run original synthetic writer and bounded DATA reader
        env:
          YNX_TOOLS_SOURCE: ${{ github.workspace }}/tools
          YNX_PRODUCER_SOURCE: ${{ github.workspace }}/producer
          YNX_PRIVATE_WORK: ${{ runner.temp }}/ynx-header-cross-private
          YNX_PUBLIC_OUTPUT: ${{ runner.temp }}/ynx-header-cross-public
        run: |
          set -euo pipefail
          test "$(git -C "$YNX_TOOLS_SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$YNX_TOOLS_SOURCE" status --porcelain --untracked-files=all)"
          test -z "$(git -C "$YNX_TOOLS_SOURCE" ls-files --others --ignored --exclude-standard)"
          mkdir -m 700 "$YNX_PRIVATE_WORK"
          python3 -B "$YNX_TOOLS_SOURCE/scripts/loadtest/pq-synthetic-header-cross-source-ci.py"
          test -z "$(git -C "$YNX_TOOLS_SOURCE" status --porcelain --untracked-files=all)"
          test -z "$(git -C "$YNX_PRODUCER_SOURCE" status --porcelain --untracked-files=all)"
      - name: Preserve only public Go events and DATA summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-synthetic-header-cross-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ynx-header-cross-public/go-events.jsonl
            ${{ runner.temp }}/ynx-header-cross-public/metadata.json
          if-no-files-found: error
          retention-days: 7
