name: YNX Mail CI

on:
  push:
    branches:
      - codex/integrate-finance-suite
    paths:
      - "apps/mail/**"
      - "internal/mail/**"
      - ".github/workflows/mail-ci.yml"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches:
      - main
    paths:
      - "apps/mail/**"
      - "internal/mail/**"
      - ".github/workflows/mail-ci.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ynx-mail-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mail:
    name: Mail correctness, privacy and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mail/package-lock.json
      - name: Go unit tests
        run: go test ./internal/mail
      - name: Go race detector
        run: go test -race ./internal/mail
      - name: Go vet
        run: go vet ./internal/mail
      - name: Product contract tests
        run: |
          npm ci --prefix apps/mail
          npm test --prefix apps/mail
          npm audit --prefix apps/mail --audit-level=high --registry=https://registry.npmjs.org
      - name: Product build
        run: |
          npm run build --prefix apps/mail
          npm run supply-chain --prefix apps/mail
      - name: Runtime smoke
        run: npm run smoke --prefix apps/mail

  wallet-contract:
    name: Canonical Wallet registration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/wallet-auth/package-lock.json
      - run: npm ci --prefix packages/wallet-auth
      - run: node --test packages/wallet-auth/test/registry.test.mjs packages/wallet-auth/test/gateway-node-host.test.mjs
