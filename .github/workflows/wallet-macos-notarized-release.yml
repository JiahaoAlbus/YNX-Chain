name: wallet-macos-notarized-release

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact 40-character source commit to build
        required: true
        type: string
      release_tag:
        description: Immutable release tag (wallet-macos-notarized-v*)
        required: true
        type: string
      publish_release:
        description: Publish the notarized native DMG and exact manifest after every gate passes
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: wallet-macos-notarized-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  notarized-release:
    runs-on: macos-15
    timeout-minutes: 55
    environment: wallet-macos-production
    env:
      YNX_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      YNX_RELEASE_TAG: ${{ inputs.release_tag }}
      YNX_PUBLISH_RELEASE: ${{ inputs.publish_release }}
      YNX_APPLE_TEAM_ID: ${{ secrets.YNX_APPLE_TEAM_ID }}
      YNX_DEVELOPER_ID_APPLICATION: ${{ secrets.YNX_MACOS_DEVELOPER_ID_APPLICATION }}
      YNX_DEVELOPER_ID_P12_BASE64: ${{ secrets.YNX_MACOS_DEVELOPER_ID_P12_BASE64 }}
      YNX_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.YNX_MACOS_DEVELOPER_ID_P12_PASSWORD }}
      YNX_NOTARY_KEY_ID: ${{ secrets.YNX_APPLE_NOTARY_KEY_ID }}
      YNX_NOTARY_ISSUER_ID: ${{ secrets.YNX_APPLE_NOTARY_ISSUER_ID }}
      YNX_NOTARY_PRIVATE_KEY_P8_BASE64: ${{ secrets.YNX_APPLE_NOTARY_PRIVATE_KEY_P8_BASE64 }}
      YNX_WALLETCONNECT_PROJECT_ID: ${{ secrets.YNX_WALLETCONNECT_PROJECT_ID }}
      YNX_WALLETCONNECT_APP_GROUP: ${{ secrets.YNX_WALLETCONNECT_APP_GROUP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_source_sha }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"
      - name: Fail closed unless source, tag, identity and notarization inputs are exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$YNX_EXPECTED_SOURCE_SHA"
          [[ "$YNX_EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' apps/wallet/macos/Info.plist)"
          EXPECTED_RELEASE_TAG="wallet-macos-notarized-v$APP_VERSION-${YNX_EXPECTED_SOURCE_SHA:0:8}"
          test "$YNX_RELEASE_TAG" = "$EXPECTED_RELEASE_TAG"
          [[ "$YNX_APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          test "$YNX_APPLE_TEAM_ID" != FAKETEAMID
          [[ "$YNX_DEVELOPER_ID_APPLICATION" == "Developer ID Application:"*"($YNX_APPLE_TEAM_ID)" ]]
          test -n "$YNX_DEVELOPER_ID_P12_BASE64"
          test -n "$YNX_DEVELOPER_ID_P12_PASSWORD"
          [[ "$YNX_NOTARY_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$YNX_NOTARY_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          test -n "$YNX_NOTARY_PRIVATE_KEY_P8_BASE64"
          [[ "$YNX_WALLETCONNECT_PROJECT_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          [[ "$YNX_WALLETCONNECT_APP_GROUP" =~ ^group\.[A-Za-z0-9.-]{3,120}$ ]]
          if git ls-remote --exit-code --tags origin "refs/tags/$YNX_RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists; refusing replacement" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
      - name: Verify immutable Actions and frozen bundled contracts
        run: |
          set -euo pipefail
          ruby -e 'source=File.read(".github/workflows/wallet-macos-notarized-release.yml"); mutable=source.scan(/^\s*-\s+uses:\s+([^\s#]+)/).flatten.reject{|use| use.start_with?("./") || use.match?(/@[0-9a-f]{40}$/)}; abort "mutable action pins: #{mutable.join(",")}" unless mutable.empty?'
          bash -n apps/wallet/macos/scripts/verify-notarized-dmg.sh
          ruby apps/wallet/macos/scripts/verify-notarized-release-source.rb
          test "$(git hash-object packages/wallet-auth/central-registry.json)" = 754737194f02834da9f5833a493f4633b4cc18eb
          test "$(shasum -a 256 packages/wallet-auth/central-registry.json | awk '{print $1}')" = 337145be4cbdd3b642f7fd263e1b06e20f512f8cd4981033109ba65c9856becd
          test "$(git hash-object release/integration/wallet-auth-public-endpoint-service-discovery-matrix.json)" = d402fcdc844aa39bd5ee351a99d93acb4852dc37
          test "$(shasum -a 256 release/integration/wallet-auth-public-endpoint-service-discovery-matrix.json | awk '{print $1}')" = d344c607c2bbbf7bb0d9d3662b424976d0d6c4ff20428025dd1e2fb92bf31392
      - name: Test native fail-closed boundaries
        run: |
          bash apps/wallet/macos/scripts/prepare-reown-macos.sh "$GITHUB_WORKSPACE/apps/wallet/macos"
          swift test --package-path apps/wallet/macos
      - name: Import Developer ID identity into an isolated keychain
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE="$RUNNER_TEMP/ynx-developer-id.p12"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_$YNX_NOTARY_KEY_ID.p8"
          KEYCHAIN="$RUNNER_TEMP/ynx-wallet-signing.keychain-db"
          ORIGINAL_KEYCHAINS="$RUNNER_TEMP/ynx-wallet-original-keychains.txt"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security list-keychains -d user > "$ORIGINAL_KEYCHAINS"
          printf 'YNX_SIGNING_KEYCHAIN=%s\nYNX_NOTARY_KEY_PATH=%s\nYNX_DEVELOPER_ID_P12_PATH=%s\nYNX_ORIGINAL_KEYCHAINS_PATH=%s\n' "$KEYCHAIN" "$NOTARY_KEY" "$CERTIFICATE" "$ORIGINAL_KEYCHAINS" >> "$GITHUB_ENV"
          printf '%s' "$YNX_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERTIFICATE"
          printf '%s' "$YNX_NOTARY_PRIVATE_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY"
          test -s "$CERTIFICATE"
          test -s "$NOTARY_KEY"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$YNX_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -Fq "$YNX_DEVELOPER_ID_APPLICATION"
      - name: Build, Developer ID sign, notarize and staple the universal app and DMG
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$GITHUB_WORKSPACE/apps/wallet/macos"
          OUTPUT="$RUNNER_TEMP/ynx-wallet-notarized"
          APP="$OUTPUT/YNX Wallet.app"
          DMG_ROOT="$OUTPUT/dmg-root"
          PROOF="$GITHUB_WORKSPACE/apps/wallet/proof/ci-macos-notarized"
          ARM_SCRATCH="$RUNNER_TEMP/wallet-macos-notarized-arm64"
          X86_SCRATCH="$RUNNER_TEMP/wallet-macos-notarized-x86_64"
          bash "$PACKAGE/scripts/prepare-reown-macos.sh" "$PACKAGE" "$ARM_SCRATCH"
          bash "$PACKAGE/scripts/prepare-reown-macos.sh" "$PACKAGE" "$X86_SCRATCH"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PACKAGE/Info.plist")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PACKAGE/Info.plist")"
          DMG_NAME="YNX-Wallet-macOS-$APP_VERSION-universal-notarized.dmg"
          DMG="$PROOF/$DMG_NAME"
          WALLETCONNECT_ENTITLEMENTS="$RUNNER_TEMP/ynx-wallet-walletconnect.entitlements"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$PROOF"
          swift build --package-path "$PACKAGE" --configuration release --triple arm64-apple-macosx13.0 --scratch-path "$ARM_SCRATCH"
          swift build --package-path "$PACKAGE" --configuration release --triple x86_64-apple-macosx13.0 --scratch-path "$X86_SCRATCH"
          ARM_BIN="$(swift build --package-path "$PACKAGE" --configuration release --triple arm64-apple-macosx13.0 --scratch-path "$ARM_SCRATCH" --show-bin-path)"
          X86_BIN="$(swift build --package-path "$PACKAGE" --configuration release --triple x86_64-apple-macosx13.0 --scratch-path "$X86_SCRATCH" --show-bin-path)"
          cp "$PACKAGE/Info.plist" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :YNXWalletConnectProjectID $YNX_WALLETCONNECT_PROJECT_ID" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :YNXWalletConnectAppGroup $YNX_WALLETCONNECT_APP_GROUP" "$APP/Contents/Info.plist"
          cp "$PACKAGE/YNXWallet-WalletConnect.entitlements" "$WALLETCONNECT_ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Set :com.apple.security.application-groups:0 $YNX_WALLETCONNECT_APP_GROUP" "$WALLETCONNECT_ENTITLEMENTS"
          cp packages/wallet-auth/central-registry.json "$APP/Contents/Resources/central-registry.json"
          cp release/integration/wallet-auth-public-endpoint-service-discovery-matrix.json "$APP/Contents/Resources/wallet-auth-public-endpoint-service-discovery-matrix.json"
          cp apps/wallet/REOWN_WALLETKIT_LICENSE.md "$APP/Contents/Resources/REOWN_WALLETKIT_LICENSE.md"
          test -s "$APP/Contents/Resources/REOWN_WALLETKIT_LICENSE.md"
          lipo -create "$ARM_BIN/YNXWalletMac" "$X86_BIN/YNXWalletMac" -output "$APP/Contents/MacOS/YNXWalletMac"
          chmod 755 "$APP/Contents/MacOS/YNXWalletMac"
          codesign --force --sign "$YNX_DEVELOPER_ID_APPLICATION" --keychain "$YNX_SIGNING_KEYCHAIN" --options runtime --timestamp --entitlements "$WALLETCONNECT_ENTITLEMENTS" "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          CODESIGN_INSPECTION="$RUNNER_TEMP/ynx-macos-codesign-inspection.txt"
          ENTITLEMENTS_INSPECTION="$RUNNER_TEMP/ynx-macos-entitlements-inspection.plist"
          codesign -dv --verbose=4 "$APP" 2> "$CODESIGN_INSPECTION"
          grep -Fq "Authority=$YNX_DEVELOPER_ID_APPLICATION" "$CODESIGN_INSPECTION"
          grep -Fq "TeamIdentifier=$YNX_APPLE_TEAM_ID" "$CODESIGN_INSPECTION"
          grep -Fq 'flags=0x10000(runtime)' "$CODESIGN_INSPECTION"
          codesign -d --entitlements :- "$APP" > "$ENTITLEMENTS_INSPECTION" 2> /dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$ENTITLEMENTS_INSPECTION")" = "$YNX_WALLETCONNECT_APP_GROUP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :YNXWalletConnectAppGroup' "$APP/Contents/Info.plist")" = "$YNX_WALLETCONNECT_APP_GROUP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :YNXWalletConnectProjectID' "$APP/Contents/Info.plist")" = "$YNX_WALLETCONNECT_PROJECT_ID"
          jq -n \
            '{schemaVersion:1,ownerNativeIdentityVerified:true,developerIdSignatureVerified:true,hardenedRuntimeVerified:true,applicationGroupPresent:true,projectIdPresent:true,protectedValuesRecorded:false,notarizationSubmitted:false,stapled:false,gatekeeperAccepted:false,applicationInstalled:false,applicationLaunched:false}' \
            > "$PROOF/protected-signing-preflight.json"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUTPUT/app-submission.zip"
          xcrun notarytool submit "$OUTPUT/app-submission.zip" --key "$YNX_NOTARY_KEY_PATH" --key-id "$YNX_NOTARY_KEY_ID" --issuer "$YNX_NOTARY_ISSUER_ID" --wait --output-format json | tee "$PROOF/notarytool-app.json"
          jq -e '.status == "Accepted" and (.id | type == "string" and length > 0)' "$PROOF/notarytool-app.json" >/dev/null
          xcrun stapler staple "$APP" | tee "$PROOF/stapler-app.txt"
          xcrun stapler validate "$APP" | tee "$PROOF/stapler-app-validation.txt"
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 | tee "$PROOF/gatekeeper-app.txt"
          grep -F 'source=Notarized Developer ID' "$PROOF/gatekeeper-app.txt"
          codesign --verify --deep --strict --verbose=4 "$APP"

          mkdir -p "$DMG_ROOT"
          ditto "$APP" "$DMG_ROOT/YNX Wallet.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "YNX Wallet $APP_VERSION" -srcfolder "$DMG_ROOT" -format UDZO -ov "$DMG"
          hdiutil verify "$DMG" | tee "$PROOF/hdiutil-verify.txt"
          xcrun notarytool submit "$DMG" --key "$YNX_NOTARY_KEY_PATH" --key-id "$YNX_NOTARY_KEY_ID" --issuer "$YNX_NOTARY_ISSUER_ID" --wait --output-format json | tee "$PROOF/notarytool-dmg.json"
          jq -e '.status == "Accepted" and (.id | type == "string" and length > 0)' "$PROOF/notarytool-dmg.json" >/dev/null
          xcrun stapler staple "$DMG" | tee "$PROOF/stapler-dmg.txt"
          xcrun stapler validate "$DMG" | tee "$PROOF/stapler-dmg-validation.txt"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG" 2>&1 | tee "$PROOF/gatekeeper-dmg.txt"
          grep -F 'source=Notarized Developer ID' "$PROOF/gatekeeper-dmg.txt"
          shasum -a 256 "$DMG" | tee "$PROOF/DMG-SHA256SUMS"
          wc -c "$DMG" | tee "$PROOF/DMG-BYTES"
          lipo -archs "$APP/Contents/MacOS/YNXWalletMac" | tee "$PROOF/architectures.txt"
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist" | tee "$PROOF/minimum-os.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" | tee "$PROOF/bundle-identifier.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" | tee "$PROOF/app-version.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist" | tee "$PROOF/app-build.txt"
          APP_NOTARY_ID="$(jq -r '.id' "$PROOF/notarytool-app.json")"
          DMG_NOTARY_ID="$(jq -r '.id' "$PROOF/notarytool-dmg.json")"
          printf 'YNX_RELEASE_APP_VERSION=%s\n' "$APP_VERSION" >> "$GITHUB_ENV"
          printf 'YNX_RELEASE_APP_BUILD=%s\n' "$APP_BUILD" >> "$GITHUB_ENV"
          printf 'YNX_RELEASE_DMG=%s\n' "$DMG" >> "$GITHUB_ENV"
          printf 'YNX_RELEASE_DMG_NAME=%s\n' "$DMG_NAME" >> "$GITHUB_ENV"
          printf 'YNX_APP_NOTARY_ID=%s\n' "$APP_NOTARY_ID" >> "$GITHUB_ENV"
          printf 'YNX_DMG_NOTARY_ID=%s\n' "$DMG_NOTARY_ID" >> "$GITHUB_ENV"
      - name: Mount final DMG, install the contained app and verify runtime boundaries
        shell: bash
        run: bash apps/wallet/macos/scripts/verify-notarized-dmg.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ynx-wallet-macos-notarized
          path: apps/wallet/proof/ci-macos-notarized
          if-no-files-found: error
      - name: Publish immutable notarized release when explicitly requested
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROOF="$GITHUB_WORKSPACE/apps/wallet/proof/ci-macos-notarized"
          gh release create "$YNX_RELEASE_TAG" "$YNX_RELEASE_DMG" "$PROOF/native-dmg-release-manifest.json" --target "$YNX_EXPECTED_SOURCE_SHA" --title "YNX Wallet macOS notarized $YNX_RELEASE_TAG" --notes "Developer ID signed and Apple-notarized native DMG produced by workflow run $GITHUB_RUN_ID from exact source $YNX_EXPECTED_SOURCE_SHA. The final DMG was mounted, copied to an isolated Applications directory, cold/second launched, connected to Testnet 0x1917, and rejected a malformed callback. Authorization, account, sign, send, recovery, physical biometric, App Store and Website publication require separate evidence."
          RELEASE_URL="$(gh release view "$YNX_RELEASE_TAG" --json url --jq .url)"
          test -n "$RELEASE_URL"
          jq -n --arg sourceCommit "$YNX_EXPECTED_SOURCE_SHA" --arg releaseTag "$YNX_RELEASE_TAG" --arg releaseUrl "$RELEASE_URL" --arg artifactName "$YNX_RELEASE_DMG_NAME" --arg artifactSha256 "$(shasum -a 256 "$YNX_RELEASE_DMG" | awk '{print $1}')" --argjson artifactBytes "$(stat -f '%z' "$YNX_RELEASE_DMG")" '{schemaVersion:1,sourceCommit:$sourceCommit,releaseTag:$releaseTag,releaseUrl:$releaseUrl,artifactName:$artifactName,artifactSha256:$artifactSha256,artifactBytes:$artifactBytes,githubReleasePublished:true,websitePublished:false,appStoreReleased:false}' > "$PROOF/github-release-publication-receipt.json"
          gh release upload "$YNX_RELEASE_TAG" "$PROOF/github-release-publication-receipt.json"
      - name: Remove isolated signing material
        if: always()
        shell: bash
        run: |
          bash apps/wallet/macos/scripts/cleanup-signing-material.sh
