name: YNX AI task runtime

on:
  workflow_dispatch:
    inputs:
      portable_receiver_only:
        description: Run only the new portable receiver interoperability scope
        type: boolean
        default: false
  push:
    branches: [codex/ecosystem-ai, codex/final-ai, "codex/ai-receiver-ci/**", "codex/ai-runtime-ci/**"]
    paths: &runtime-paths
      - "internal/aiproduct/**"
      - "internal/aigateway/**"
      - "internal/aitaskclient/**"
      - "internal/authtasklocal/**"
      - "internal/authaitaskv6/**"
      - "cmd/ynx-ai-task/**"
      - "cmd/ynx-ai-gatewayd/**"
      - "apps/ai/*.go"
      - "apps/ai/ORIGINAL_AUTH_QUALIFIED_RECEIVER_INTAKE.json"
      - "apps/ai/scripts/webdav-interop-*"
      - "apps/ai/scripts/receiver-interop-r2/**"
      - "apps/ai/scripts/run-qualified-receiver-ci.py"
      - "packages/auth-grant-policy/go/**"
      - "packages/auth-grant-runtime/go/**"
      - "packages/auth-grant-history-client/go/**"
      - "packages/open-protocol/go/**"
      - "packages/wallet-auth/go/taskactionv6/**"
      - "packages/wallet-auth/native/original-task-read-receiver-qualification-runner.mjs"
      - "internal/ynxbatch/**"
      - "internal/accountaddress/**"
      - "internal/securelink/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ynx-ai-runtime.yml"
  pull_request:
    paths: *runtime-paths

permissions:
  contents: read

jobs:
  task-runtime:
    if: ${{ !startsWith(github.ref, 'refs/heads/codex/ai-receiver-ci/') && !inputs.portable_receiver_only && !startsWith(github.ref, 'refs/heads/codex/ai-runtime-ci/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOFLAGS: ""
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify normal task, model and startup packages
        run: go test -mod=readonly -race -p 2 ./internal/aiproduct ./internal/aigateway ./internal/aitaskclient ./internal/authaitaskv6 ./cmd/ynx-ai-task ./cmd/ynx-ai-gatewayd ./apps/ai
      - name: Verify independent exact model disclosure records
        working-directory: packages/auth-grant-runtime/go
        run: go test -mod=readonly -race -p 1 -run '^Test(ExactIndependentModelDisclosureRounds|DynamicOriginalModelDisclosure)$' -count=1 -timeout=60s -v .
      - name: Verify exact original qualified receiver producer cohort
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          intake = json.loads(pathlib.Path("apps/ai/ORIGINAL_AUTH_QUALIFIED_RECEIVER_INTAKE.json").read_text())
          for item in intake["imports"]:
              body = pathlib.Path(item["target"]).read_bytes()
              assert len(body) == item["source"]["bytes"], item["target"]
              assert hashlib.sha256(body).hexdigest() == item["source"]["sha256"], item["target"]
          assert len(intake["imports"]) == 6
          PY
          node --check packages/wallet-auth/native/original-task-read-receiver-qualification-runner.mjs
      - name: Verify original registered receiver consumer refusal and Source debt
        shell: bash
        run: |
          set -euo pipefail
          task_receiver_evidence="$RUNNER_TEMP/p08-registered-receiver-evidence"
          mkdir -p "$task_receiver_evidence"
          LINK_REGISTERED_RECEIVER_EVIDENCE="$task_receiver_evidence" go test -mod=readonly -race -p 1 -tags=link_registered_receiver_interop ./internal/aiproduct -run '^TestLINKP08RegisteredReceiverNormalConsumer$' -count=1 -timeout=90s -json | tee "$task_receiver_evidence/consumer.jsonl"
          python3 - "$task_receiver_evidence/consumer.jsonl" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          test = "TestLINKP08RegisteredReceiverNormalConsumer"
          expected = {test, test + "/ordered-partial-drain", test + "/early-parent-close-keeps-debt"}
          for name in expected:
              assert any(e.get("Action") == "run" and e.get("Test") == name for e in events), name
              assert any(e.get("Action") == "pass" and e.get("Test") == name for e in events), name
          assert not any(e.get("Action") in {"skip", "fail"} for e in events)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p08-registered-receiver-public-evidence
          path: |
            ${{ runner.temp }}/p08-registered-receiver-evidence/consumer.jsonl
            ${{ runner.temp }}/p08-registered-receiver-evidence/ordered-partial-drain.json
            ${{ runner.temp }}/p08-registered-receiver-evidence/early-parent-close-keeps-debt.json

  official-webdav:
    if: ${{ !startsWith(github.ref, 'refs/heads/codex/ai-receiver-ci/') && !inputs.portable_receiver_only && !startsWith(github.ref, 'refs/heads/codex/ai-runtime-ci/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Provision fixed official upstream in isolated runner storage
        shell: bash
        run: |
          set -euo pipefail
          task_dav_root="$RUNNER_TEMP/p08-official-webdav"
          mkdir -p "$task_dav_root/upstream" "$task_dav_root/evidence" "$task_dav_root/wsgidav/cache"
          python apps/ai/scripts/webdav-interop-ci-guard.test.py
          python apps/ai/scripts/webdav-interop-provision.py "$task_dav_root" --download
          TMPDIR="$task_dav_root/wsgidav/cache" python -m pip --isolated install --disable-pip-version-check --no-cache-dir --no-compile --no-deps --no-index --find-links "$task_dav_root/upstream/wheels" --require-hashes --target "$task_dav_root/upstream/wsgidav-site" -r "$task_dav_root/upstream/requirements.lock"
      - name: Build normal CLI and verify actual upstream original-operation recovery
        shell: bash
        run: |
          set -euo pipefail
          task_dav_root="$RUNNER_TEMP/p08-official-webdav"
          python apps/ai/scripts/webdav-interop-wsgidav.py "$task_dav_root/wsgidav" > "$task_dav_root/evidence/launcher.log" 2>&1 &
          task_dav_launcher=$!
          echo "$task_dav_launcher" > "$task_dav_root/launcher.pid"
          trap 'kill -TERM "$task_dav_launcher" 2>/dev/null || true; wait "$task_dav_launcher" || true' EXIT
          for attempt in $(seq 1 100); do
            test -s "$task_dav_root/wsgidav/connection.private.json" && break
            if ! kill -0 "$task_dav_launcher" 2>/dev/null; then cat "$task_dav_root/evidence/launcher.log"; exit 1; fi
            sleep 0.1
          done
          test -s "$task_dav_root/wsgidav/connection.private.json"
          go build -mod=readonly -o "$task_dav_root/ynx-ai-task" ./cmd/ynx-ai-task
          P08_WEBDAV_CONNECTION_FILE="$task_dav_root/wsgidav/connection.private.json" P08_WEBDAV_CLI_BINARY="$task_dav_root/ynx-ai-task" go test -mod=readonly -race -p 1 ./internal/aiproduct ./internal/aitaskclient -run '^(TestP08WebDAV|TestP08PagesOfficialExactReportDelivery$)' -count=1 -timeout=90s -v | tee "$task_dav_root/evidence/normal-integration.log"
      - name: Stop only the isolated owned upstream
        if: always()
        shell: bash
        run: |
          task_dav_root="$RUNNER_TEMP/p08-official-webdav"
          if test -f "$task_dav_root/launcher.pid"; then
            kill -TERM "$(cat "$task_dav_root/launcher.pid")" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p08-official-webdav-public-evidence
          path: ${{ runner.temp }}/p08-official-webdav/evidence/

  qualified-receiver:
    if: ${{ !startsWith(github.ref, 'refs/heads/codex/ai-runtime-ci/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
      GOMAXPROCS: "2"
      GOMEMLIMIT: "1536MiB"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
      - name: Retrieve exact official SDK receiver package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receiver-input" "$RUNNER_TEMP/receiver-evidence"
          gh api repos/JiahaoAlbus/YNX-Chain/actions/artifacts/13600724295/zip > "$RUNNER_TEMP/receiver-input/sdk.zip"
          python3 - "$RUNNER_TEMP/receiver-input" <<'PY'
          import hashlib, pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          archive = root / "sdk.zip"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "55bad46dc639933b93d0e65f9a209b21ef0e42328c1f975c5fe1c272f384e7fd"
          with zipfile.ZipFile(archive) as z:
              names = [n for n in z.namelist() if n.endswith("ynx-chain-wallet-auth-1.3.0-pq.3.32-auth.49.tgz")]
              assert len(names) == 1
              body = z.read(names[0])
          assert len(body) == 9560015 and hashlib.sha256(body).hexdigest() == "83d5a1e90285c07f573f2f059d354a08c4556719b6f67b5c9f53174a6a56913f"
          (root / "sdk.tgz").write_bytes(body)
          PY
      - name: Run exact portable original receiver consumer
        run: python3 apps/ai/scripts/run-qualified-receiver-ci.py --sdk-tgz "$RUNNER_TEMP/receiver-input/sdk.tgz" --evidence "$RUNNER_TEMP/receiver-evidence"
      - name: Verify receiver-only refusal before task operation reservation
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -race -p 1 -tags=link_registered_receiver_interop ./internal/aiproduct -run '^TestP08NativeReceiverDispatchReadiness$' -count=1 -timeout=60s -json | tee "$RUNNER_TEMP/receiver-evidence/dispatch-readiness.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p08-qualified-receiver-portable-public-evidence
          path: ${{ runner.temp }}/receiver-evidence/

  task-recovery-delta:
    if: ${{ startsWith(github.ref, 'refs/heads/codex/ai-runtime-ci/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
      GOMAXPROCS: "2"
      GOMEMLIMIT: "1536MiB"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify normal startup refusal and existing query-only registration
        if: ${{ github.ref == 'refs/heads/codex/ai-runtime-ci/startup-recovery' }}
        run: go test -mod=readonly -race -p 1 ./internal/aiproduct -run '^(TestP08NormalTaskRuntimeOriginalFactoriesAndPartialClose|TestP08TaskCallerQueryOnlyNeverDispatchesEffect)$' -count=1 -timeout=60s -v
      - name: Verify cancellation at the original Auth return boundary and cold recovery
        if: ${{ github.ref != 'refs/heads/codex/ai-runtime-ci/model-disclosure' && github.ref != 'refs/heads/codex/ai-runtime-ci/startup-recovery' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -race -p 1 ./internal/aiproduct -run '^(TestP08CancelDuringDispatchReturn|TestP08CancelledOriginalSettlement.*|TestP08ConversationCancelPreservesAuthUnknownColdOriginalQuery|TestP08DispatchAndOriginalReconcile)$' -count=1 -timeout=120s -json | tee "$RUNNER_TEMP/cancel-dispatch-return.jsonl"
      - name: Verify exact disclosure intake and normal consumer compilation
        if: ${{ github.ref == 'refs/heads/codex/ai-runtime-ci/model-disclosure' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -race -p 1 ./internal/aiproduct ./apps/ai -run '^$'
          cd packages/auth-grant-runtime/go
          go test -mod=readonly -race -p 1 -run '^TestDynamicOriginalModelDisclosure$' -count=1 -timeout=60s -v .
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.ref != 'refs/heads/codex/ai-runtime-ci/model-disclosure' && github.ref != 'refs/heads/codex/ai-runtime-ci/startup-recovery' }}
        with:
          name: p08-cancel-dispatch-return-evidence
          path: ${{ runner.temp }}/cancel-dispatch-return.jsonl
