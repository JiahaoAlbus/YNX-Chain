name: YNX AI task runtime

on:
  workflow_dispatch:
  push:
    branches: [codex/ecosystem-ai, codex/final-ai]
    paths: &runtime-paths
      - "internal/aiproduct/**"
      - "internal/aigateway/**"
      - "internal/aitaskclient/**"
      - "internal/authtasklocal/**"
      - "internal/authaitaskv6/**"
      - "cmd/ynx-ai-task/**"
      - "cmd/ynx-ai-gatewayd/**"
      - "apps/ai/*.go"
      - "apps/ai/scripts/webdav-interop-*"
      - "packages/auth-grant-policy/go/**"
      - "packages/auth-grant-runtime/go/**"
      - "packages/auth-grant-history-client/go/**"
      - "packages/open-protocol/go/**"
      - "packages/wallet-auth/go/taskactionv6/**"
      - "internal/ynxbatch/**"
      - "internal/accountaddress/**"
      - "internal/securelink/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ynx-ai-runtime.yml"
  pull_request:
    paths: *runtime-paths

permissions:
  contents: read

jobs:
  task-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOFLAGS: ""
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify normal task, model and startup packages
        run: go test -mod=readonly -race -p 2 ./internal/aiproduct ./internal/aigateway ./internal/aitaskclient ./internal/authaitaskv6 ./cmd/ynx-ai-task ./cmd/ynx-ai-gatewayd ./apps/ai
      - name: Verify original registered receiver consumer refusal and Source debt
        shell: bash
        run: |
          set -euo pipefail
          task_receiver_evidence="$RUNNER_TEMP/p08-registered-receiver-evidence"
          mkdir -p "$task_receiver_evidence"
          LINK_REGISTERED_RECEIVER_EVIDENCE="$task_receiver_evidence" go test -mod=readonly -race -p 1 -tags=link_registered_receiver_interop ./internal/aiproduct -run '^TestLINKP08RegisteredReceiverNormalConsumer$' -count=1 -timeout=90s -json | tee "$task_receiver_evidence/consumer.jsonl"
          python3 - "$task_receiver_evidence/consumer.jsonl" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          test = "TestLINKP08RegisteredReceiverNormalConsumer"
          expected = {test, test + "/ordered-partial-drain", test + "/early-parent-close-keeps-debt"}
          for name in expected:
              assert any(e.get("Action") == "run" and e.get("Test") == name for e in events), name
              assert any(e.get("Action") == "pass" and e.get("Test") == name for e in events), name
          assert not any(e.get("Action") in {"skip", "fail"} for e in events)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p08-registered-receiver-public-evidence
          path: |
            ${{ runner.temp }}/p08-registered-receiver-evidence/consumer.jsonl
            ${{ runner.temp }}/p08-registered-receiver-evidence/ordered-partial-drain.json
            ${{ runner.temp }}/p08-registered-receiver-evidence/early-parent-close-keeps-debt.json

  official-webdav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOMAXPROCS: "2"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Provision fixed official upstream in isolated runner storage
        shell: bash
        run: |
          set -euo pipefail
          task_dav_root="$RUNNER_TEMP/p08-official-webdav"
          mkdir -p "$task_dav_root/upstream" "$task_dav_root/evidence" "$task_dav_root/wsgidav/cache"
          python apps/ai/scripts/webdav-interop-ci-guard.test.py
          python apps/ai/scripts/webdav-interop-provision.py "$task_dav_root" --download
          TMPDIR="$task_dav_root/wsgidav/cache" python -m pip --isolated install --disable-pip-version-check --no-cache-dir --no-compile --no-deps --no-index --find-links "$task_dav_root/upstream/wheels" --require-hashes --target "$task_dav_root/upstream/wsgidav-site" -r "$task_dav_root/upstream/requirements.lock"
      - name: Build normal CLI and verify actual upstream original-operation recovery
        shell: bash
        run: |
          set -euo pipefail
          task_dav_root="$RUNNER_TEMP/p08-official-webdav"
          python apps/ai/scripts/webdav-interop-wsgidav.py "$task_dav_root/wsgidav" > "$task_dav_root/evidence/launcher.log" 2>&1 &
          task_dav_launcher=$!
          echo "$task_dav_launcher" > "$task_dav_root/launcher.pid"
          trap 'kill -TERM "$task_dav_launcher" 2>/dev/null || true; wait "$task_dav_launcher" || true' EXIT
          for attempt in $(seq 1 100); do
            test -s "$task_dav_root/wsgidav/connection.private.json" && break
            if ! kill -0 "$task_dav_launcher" 2>/dev/null; then cat "$task_dav_root/evidence/launcher.log"; exit 1; fi
            sleep 0.1
          done
          test -s "$task_dav_root/wsgidav/connection.private.json"
          go build -mod=readonly -o "$task_dav_root/ynx-ai-task" ./cmd/ynx-ai-task
          P08_WEBDAV_CONNECTION_FILE="$task_dav_root/wsgidav/connection.private.json" P08_WEBDAV_CLI_BINARY="$task_dav_root/ynx-ai-task" go test -mod=readonly -race -p 1 ./internal/aiproduct ./internal/aitaskclient -run '^(TestP08WebDAV|TestP08PagesOfficialExactReportDelivery$)' -count=1 -timeout=90s -v | tee "$task_dav_root/evidence/normal-integration.log"
      - name: Stop only the isolated owned upstream
        if: always()
        shell: bash
        run: |
          task_dav_root="$RUNNER_TEMP/p08-official-webdav"
          if test -f "$task_dav_root/launcher.pid"; then
            kill -TERM "$(cat "$task_dav_root/launcher.pid")" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p08-official-webdav-public-evidence
          path: ${{ runner.temp }}/p08-official-webdav/evidence/
