name: pq-durable-python-source

on:
  push:
    branches:
      - codex/perf-durable-driver-20261121
    paths:
      - ".github/workflows/pq-durable-python-source.yml"
      - "scripts/loadtest/**"

permissions:
  contents: read

# This is NOT chain-core-${ref}. It cannot replace its unknown pending run,
# has no workflow_dispatch and never starts the private synthetic business job.
concurrency:
  group: pq-durable-python-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original315:
    name: Original315 Python controls only - no runtime qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1
      - name: Verify source-only wrapper and owned fixture accounting
        run: python3 -B scripts/loadtest/test_pq_durable_source_controls_ci.py -v
      - name: Execute exact original315 under original Linux resources
        run: python3 -B scripts/loadtest/pq-durable-source-controls-ci.py
      - name: Preserve only original control output and public resource summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pq-original315-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pq-durable-source-controls-public/SUMMARY.json
            ${{ runner.temp }}/pq-durable-source-controls-public/RESULT.json
            ${{ runner.temp }}/pq-durable-source-controls-public/original-controls.log
          if-no-files-found: error
          retention-days: 30
