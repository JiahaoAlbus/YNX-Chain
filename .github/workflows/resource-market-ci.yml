              sourcePins={leaf: dict(sha256=digest(source / leaf)) for leaf in leaves},
              binaryPin=dict(path=str(binary), sha256=digest(binary)))
          if profile == 'consensus-e2e-retained-history-v1':
              plan['caps'] = dict(activeMs=105000, cleanupMs=15000, totalMs=120000,
                  ownedRSSBytes=1073741824, threads=320, ownedProcesses=16,
                  privateBytes=536870912, buildBytes=1073741824, logBytes=1048576,
                  diskFloorBytes=1073741824, rootReserveBytes=445644800,
                  compileReserveBytes=1073741824, availableMemoryFloorBytes=1207959552,
