          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          deploy_source = workspace / 'scripts/deploy/deploy-consensus-candidate.sh'
          cases = []
          def execute(name, command, expected_exit, env):
              result = subprocess.run(command, capture_output=True, timeout=30, cwd=case, env=env, check=False)
