name: Resource Market Candidate Gates

on:
  pull_request:
    paths:
      - 'apps/resource-market/**'
      - 'internal/resourcemarket/**'
      - 'internal/resourceproduct/**'
      - 'internal/productstore/**'
      - 'internal/canonicalwallet/**'
      - 'scripts/validate/**'
      - 'scripts/verify/resource-market*'
      - '.github/workflows/resource-market-ci.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit for the isolated PQ branch only
        required: false
        type: string
      paired_n1:
        description: Run one guarded N1 trial1 PQ component pair after correctness gates
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    if: github.ref != 'refs/heads/codex/ynx-pq-public-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install patched Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.13'
          check-latest: false
          cache: true
      - name: Record toolchains
        run: go version && node --version && npm --version
      - name: Runtime filler and secret gates
        run: |
          bash scripts/validate/no-placeholder-check.sh
          bash scripts/validate/secret-scan.sh
      - name: Go correctness and race gates
        run: |
          go vet ./internal/resourcemarket ./internal/resourceproduct ./internal/productstore ./internal/canonicalwallet ./apps/resource-market
          go test -count=1 ./internal/resourcemarket ./internal/resourceproduct ./internal/productstore ./internal/canonicalwallet ./apps/resource-market
          go test -race -count=1 ./internal/resourcemarket ./internal/resourceproduct
      - name: Go vulnerability gate
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./internal/resourcemarket ./internal/resourceproduct ./internal/productstore ./internal/canonicalwallet ./apps/resource-market
      - name: Locked browser dependencies and audit
        working-directory: apps/resource-market
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Local API and DAST smoke
        run: bash apps/resource-market/check.sh
      - name: Build and inspect candidate artifact
        run: |
          if node apps/resource-market/scripts/package-release.mjs /tmp/resource-market-unsafe-output; then
            echo "unsafe output path was accepted" >&2
            exit 1
          fi
          node apps/resource-market/scripts/package-release.mjs release/resource-market-artifacts/ci-a
          node apps/resource-market/scripts/package-release.mjs release/resource-market-artifacts/ci-b
          diff -qr release/resource-market-artifacts/ci-a release/resource-market-artifacts/ci-b
          bash scripts/validate/secret-scan.sh
      - name: Upload unsigned candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-market-candidate-${{ github.sha }}
          path: release/resource-market-artifacts/ci-a
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  focused-go:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ynx-pq-public-upgrade' && inputs.candidate_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOMAXPROCS: '2'
      GOGC: '50'
      GOMEMLIMIT: '1536MiB'
      CGO_ENABLED: '0'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Record exact candidate identity
        id: identity
        run: |
          git rev-parse HEAD
          go version
          git status --porcelain
      - name: Verify pure dual-PQ protocol and account authorization
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=180s ./internal/ynxbatch ./internal/ynxauth ./internal/ynxconsensusauth
      - name: Install pinned contract build runtime
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Generate canonical IDE contract fixture
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run hardhat:build -- contracts/devtools/SampleEVMWriteCounter.sol contracts/tokens/SampleYNXTCompatibleERC20.sol
          npm run contracts:selectors
          test -s artifacts/contracts/devtools/SampleEVMWriteCounter.sol/SampleEVMWriteCounter.json
          test -s artifacts/contracts/tokens/SampleYNXTCompatibleERC20.sol/SampleYNXTCompatibleERC20.json
          sha256sum contracts/devtools/SampleEVMWriteCounter.sol artifacts/contracts/devtools/SampleEVMWriteCounter.sol/SampleEVMWriteCounter.json artifacts/ynx-selector-metadata.json
          sha256sum contracts/tokens/SampleYNXTCompatibleERC20.sol artifacts/contracts/tokens/SampleYNXTCompatibleERC20.sol/SampleYNXTCompatibleERC20.json
      - name: Verify native ledger and HTTP PQ integration
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=180s ./internal/chain ./internal/api
      - name: Compile production entry points
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=90s -run '^$' ./cmd/ynx-chaind ./cmd/ynx-app-gatewayd ./internal/consensus ./internal/appgateway ./internal/paygateway
      - name: Verify complete state bridge and sponsor continuity
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          go test -p 1 -count=1 -timeout=180s -run '^(TestConsensusMigration|TestConsensusSponsor)' ./internal/chain
          go test -p 1 -count=1 -timeout=180s ./internal/consensus
      - name: Verify account session policy and merchant ownership
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=180s ./internal/appgateway ./internal/paygateway
      - name: Verify Whole BFT gateway and native container readback
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=180s ./internal/bftgateway ./cmd/ynx-bft-gatewayd
      - name: Checkout frozen owned performance client separately
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 45058e7f764529421870a5fc41264da86b9ab2a0
          path: qa-owned-performance-client
          persist-credentials: false
      - name: Verify eight frozen client correctness functions
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: qa-owned-performance-client
        timeout-minutes: 3
        env:
          GOMAXPROCS: '1'
          GOGC: '50'
          GOMEMLIMIT: '384MiB'
        run: |
          test "$(git rev-parse HEAD)" = '45058e7f764529421870a5fc41264da86b9ab2a0'
          test "$(git rev-parse HEAD:cmd/ynx-consensus-perf-client)" = 'a454a180b9bf1b58be7b493c3cf578d6a8800532'
          sha256sum --check <<'PINS'
          0752ebc6b56979c9db353b47351a3742aeb7fb00f1116ce3fd33363c20c907cf  cmd/ynx-consensus-perf-client/main.go
          ad1ae8423a9bc57fc650b8fead3daa95f5cb301bdb6bbdd7642412ccbc53ae1e  cmd/ynx-consensus-perf-client/main_test.go
          cb4491f456ea25c6605c04980e204a9988fb007369b9a4e5a2120d66da44ad6a  cmd/ynx-consensus-perf-client/ready_sender.go
          69539678c4634780d8c54b87b43fd1b07570f63303a85380fe415f911a7abc13  cmd/ynx-consensus-perf-client/ready_sender_readback.go
          6d20cf3e959db5d7758c0fc5656523e0df2d9fa16e03d830d70f74a48aad2bba  cmd/ynx-consensus-perf-client/ready_sender_readback_test.go
          e3c1812d73a1c60e57dc7a3704224c111d1d2c095155d406153b1fbb758b6ed3  cmd/ynx-consensus-perf-client/ready_sender_test.go
          d0c8b0e0a04d145d409d6bc97981903664f1c0b0da908b4384c4441d62b52c9c  cmd/ynx-consensus-perf-client/ready_summary.go
          PINS
          go test -p 1 ./cmd/ynx-consensus-perf-client -run '^(TestReadySenderFastAccountAdvancesBeforeSlowPeer|TestReadySupplyRejectsUnknownBeforeSigning|TestFinalSubmissionRequiresDurableEvidenceAndHonestCounts|TestFullHistoryFinalCountsAndLatencyRejectIncompleteBusinessEvidence|TestReadySenderCumulativeCountsMatchCompleteHistoryAfterOutOfOrderHandoffs|TestJournalFinalCountsAndSenderGateRequirePublishedView|TestReadySenderReadbackBindsFixtureAndRecoversOnlyCompleteIdentities|TestReadySenderStreamingReadbackBoundsAndConsumerErrors)$' -count=1 -timeout=30s -v
      - name: Emit public inverse interop fixture
        id: interop
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        env:
          YNX_BATCH_INTEROP_OUT: /tmp/ynx-go-public-interop.json
        run: |
          go test -p 1 -count=1 -timeout=90s -run '^TestRealSigner$' ./internal/ynxbatch
          test -s "$YNX_BATCH_INTEROP_OUT"
          sha256sum "$YNX_BATCH_INTEROP_OUT"
      - name: Upload public signature fixture
        if: ${{ !cancelled() && steps.interop.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-public-go-interop-${{ github.sha }}
          path: /tmp/ynx-go-public-interop.json
          if-no-files-found: error
          retention-days: 7

  pq-paired-n1:
    needs: focused-go
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ynx-pq-public-upgrade' && inputs.candidate_sha == github.sha && inputs.paired_n1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOMAXPROCS: '1'
      GOGC: '50'
      GOMEMLIMIT: '512MiB'
      CGO_ENABLED: '0'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact paired candidate with baseline ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Set private case paths
        run: |
          printf '%s\n' "YNX_PAIR_CI_CASE=$RUNNER_TEMP/ynx-pq-pair-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "YNX_PAIR_CI_RECEIPT=$RUNNER_TEMP/ynx-pq-pair-guard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
      - name: Verify bounded preparation and Linux process ownership controls
        run: |
          node --test scripts/loadtest/pq-paired-recipe.test.mjs
          python3 scripts/loadtest/test_pq_paired_linux_window.py
          test "$(git rev-parse HEAD)" = '${{ inputs.candidate_sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Prepare one exact-source N1 trial1 overlay
        run: |
          node scripts/loadtest/prepare-pq-paired-benchmark.mjs --source-root "$GITHUB_WORKSPACE" --commit '${{ inputs.candidate_sha }}' --output-dir "$YNX_PAIR_CI_CASE" --n 1 --trial 1 --write
      - name: Execute single guarded PQ component pair
        id: performance
        timeout-minutes: 3
        run: |
          python3 scripts/loadtest/pq-paired-linux-window.py --prepared "$YNX_PAIR_CI_CASE/prepared.json" --receipt "$YNX_PAIR_CI_RECEIPT" --execute
      - name: Upload QA measurement and guard receipt
        if: ${{ always() && steps.performance.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-paired-n1-trial1-${{ github.sha }}
          path: |
            ${{ env.YNX_PAIR_CI_CASE }}/pq-paired-result.json
            ${{ env.YNX_PAIR_CI_RECEIPT }}
            ${{ env.YNX_PAIR_CI_CASE }}/go.stdout.log
            ${{ env.YNX_PAIR_CI_CASE }}/go.stderr.log
          if-no-files-found: warn
          retention-days: 7
