          for item in fixture['negativeCases']:
              index = item['caseIndex']
              if not isinstance(index, str) or not re.fullmatch('[0-2]', index) or item['expectedExitCode'] != '1':
                  raise RuntimeError('transaction negative case selects invalid independent context')
              invoke(item['name'], commands[int(index)], item['request'], item['cliExpectedCode'], 1)
          if {p.name for p in case.iterdir()} != set(original) or any((case / name).read_bytes() != raw for name, raw in original.items()):
              raise RuntimeError('transaction verifier changed original public context/materials')
          receipt = dict(version='YNX-PQ-TRANSACTION-PROOF-CLI-RECEIPT/v1', commit=os.environ['GITHUB_SHA'], runId=os.environ['GITHUB_RUN_ID'],
              fixtureSHA256=sha(fixture_raw), binaryPin=binary_pin, cases=results, syntheticOnly=True, normalCLIExecuted=True,
              originalSourcesUnchanged=True, dataAuthorized=False, nativeRootAuthorized=False, runtimeStarted=False, publicDeployment=False, pqActivation=False)
          with (root / 'ynx-pq-transaction-proof-cli-public-receipt.json').open('x') as target:
              target.write(json.dumps(receipt, sort_keys=True, separators=(',', ':')) + '\n')
          print('YNX_PQ_TRANSACTION_PROOF_CLI ' + json.dumps(receipt, sort_keys=True, separators=(',', ':')))
          PY
      - name: Verify stopped-source publication and original Host ABI through normal binaries
        id: pqhostsourcecli
        if: ${{ success() && github.event_name == 'push' }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY'
          import base64, hashlib, json, os, re, stat, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          case = root / 'ynx-proof-host-source-public'
          def sha(raw):
              return hashlib.sha256(raw).hexdigest()
          def unique(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise RuntimeError('duplicate normal source-delivery field')
                  value[key] = item
              return value
          def decode(raw):
              return json.loads(raw, object_pairs_hook=unique)
          def read(path, maximum):
              info = path.lstat()
              if (path.resolve(strict=True) != path or not stat.S_ISREG(info.st_mode)
                      or info.st_nlink != 1 or info.st_mode & 0o022 or not 0 < info.st_size <= maximum):
                  raise RuntimeError('bounded original regular public fixture required')
              return path.read_bytes()
          metadata_raw = read(case / 'metadata.json', 16384)
          metadata = decode(metadata_raw)
          if set(metadata) != {'sourcePlanSHA256', 'sourcePlanPath', 'deliveryPath', 'sourceId', 'epoch', 'requestPath', 'expectedVerifierCode'}:
              raise RuntimeError('exact persisted source fixture metadata required')
          if (metadata['sourcePlanPath'] != str(case / 'source-plan.json')
                  or metadata['deliveryPath'] != str(case / 'delivery')
                  or metadata['requestPath'] != str(case / 'request.json')
                  or metadata['expectedVerifierCode'] != 'VERIFIED_TRANSACTION_DATA'):
              raise RuntimeError('persisted fixture cannot choose an alternate caller or output')
          plan_path, destination = Path(metadata['sourcePlanPath']), Path(metadata['deliveryPath'])
          plan_raw = read(plan_path, 48 << 20)
          if sha(plan_raw) != metadata['sourcePlanSHA256']:
              raise RuntimeError('source plan differs from the original core fixture pin')
          plan = decode(plan_raw)
          request_raw = read(Path(metadata['requestPath']), 128 << 20)
          request = decode(request_raw)
          if (plan['sourceId'] != metadata['sourceId'] or plan['epoch'] != metadata['epoch']
                  or request['version'] != 'YNX-CONSENSUS-TRANSACTION-PROOF-VERIFY-REQUEST/v1'
                  or request['expected'] != plan['expectedTransaction']):
              raise RuntimeError('original operator plan and verifier request binding differ')
          candidate = root / 'ynx-pq-linux-runtime-candidate'
          runtime_raw = read(candidate / 'SOURCE.json', 65536)
          runtime = decode(runtime_raw)
          if runtime['commit'] != os.environ['GITHUB_SHA'] or runtime['runtimeStarted'] is not False:
              raise RuntimeError('normal binary source identity differs from this fixed CI source')
          binary_pins = {}
          for name in ('ynx-comet', 'ynx-consensus-proof-verify'):
              binary = candidate / name
              raw = read(binary, 128 << 20)
              pin = dict(bytes=len(raw), sha256=sha(raw))
              if raw[:6] != b'\x7fELF\x02\x01' or raw[18:20] != b'\x3e\x00' or pin != runtime['binaries'][name]:
                  raise RuntimeError('source delivery requires the actual independently built normal ELF pin')
              binary_pins[name] = pin
          environment = dict(PATH='/usr/bin:/bin', GOMAXPROCS='2', GOGC='50', GOMEMLIMIT='1536MiB')
          observations = []
          def invoke(name, command, body, maximum, expected_exit=0):
              completed = subprocess.run(command, input=body, capture_output=True, env=environment,
                  cwd=case, timeout=25, check=False)
              if completed.returncode != expected_exit or completed.stderr or not 0 < len(completed.stdout) <= maximum:
                  raise RuntimeError('normal source/Host caller failed at ' + name)
              value = decode(completed.stdout)
              observations.append(dict(name=name, exitCode=completed.returncode,
                  stdoutSHA256=sha(completed.stdout), stdoutBytes=str(len(completed.stdout))))
              return value
          publish = [str(candidate / 'ynx-comet'), 'export-proof-host-source',
              '--source-plan', str(plan_path), '--source-plan-sha256', metadata['sourcePlanSHA256'],
              '--output', str(destination)]
          delivery = invoke('export-stopped-original-source', publish, b'', 16384)
          if (set(delivery) != {'version', 'manifestPath', 'manifestSHA256', 'sourcePath', 'sourceSHA256', 'sourceId', 'epoch', 'publicDataOnly', 'nativeRootAuthorized', 'deploymentVerified'}
                  or delivery['version'] != 'YNX-CONSENSUS-PROOF-HOST-DELIVERY-RECEIPT/v1'
                  or delivery['manifestPath'] != str(destination / 'delivery.json')
                  or delivery['sourcePath'] != str(destination / 'host-source.json')
                  or delivery['sourceId'] != metadata['sourceId'] or delivery['epoch'] != metadata['epoch']
                  or delivery['publicDataOnly'] is not True or delivery['nativeRootAuthorized'] is not False
                  or delivery['deploymentVerified'] is not False):
              raise RuntimeError('publisher receipt lost exact binding or claimed authority')
          manifest_raw = read(destination / 'delivery.json', 16384)
          if sha(manifest_raw) != delivery['manifestSHA256']:
              raise RuntimeError('normal publisher manifest readback pin differs')
          manifest = decode(manifest_raw)
          originals = {'delivery.json': manifest_raw}
          for item in manifest['files']:
              if Path(item['name']).name != item['name']:
                  raise RuntimeError('delivery catalog attempted a non-leaf source')
              raw = read(destination / item['name'], 1 << 30)
              if str(len(raw)) != item['bytes'] or sha(raw) != item['sha256']:
                  raise RuntimeError('normal delivery file pin differs')
              originals[item['name']] = raw
          host = [str(candidate / 'ynx-consensus-proof-verify'), '--host-trust-source',
              delivery['sourcePath'], '--host-trust-source-sha256', delivery['sourceSHA256']]
          def check_host(operation, fingerprint, label=None):
              body = json.dumps(dict(version='YNX-CONSENSUS-PROOF-HOST-REQUEST/v1', operation=operation,
                  sourceId=metadata['sourceId'], epoch=metadata['epoch'], sourceFingerprint=fingerprint), separators=(',', ':')).encode()
              result = invoke(label or 'host-' + operation, host, body, 104521276)
              if set(result) != {'version', 'code', 'context'} or result['version'] != 'YNX-CONSENSUS-PROOF-HOST-RESULT/v1' or result['code'] != 'EXPORTED_PROOF_TRUST_DATA':
                  raise RuntimeError('normal original Host ABI did not export source DATA')
              context = result['context']
              if (context['version'] != 'YNX-CONSENSUS-PROOF-HOST-CONTEXT/v1' or context['classification'] != 'data'
                      or context['sourceId'] != metadata['sourceId'] or context['epoch'] != metadata['epoch']
                      or context['sourceSHA256'] != delivery['sourceSHA256'] or context['currentChecked'] is not True
                      or any(context[key] is not False for key in ('nativeRootAuthorized', 'sourceDeploymentQualified', 'proofVerified'))
                      or context['expectedTransaction'] != request['expected']
                      or context['contextPath'] != str(destination / 'trust-context.json')):
                  raise RuntimeError('normal Host changed original source/transaction binding or granted authority')
              if not re.fullmatch('[0-9a-f]{64}', context['sourceFingerprint']) or operation == 'current' and context['sourceFingerprint'] != fingerprint:
                  raise RuntimeError('normal current check did not retain the original source identity')
              for field, name, pin in (('sourceBytes', 'host-source.json', 'sourceSHA256'),
                      ('lifecycleBytes', 'lifecycle.json', 'lifecycleSHA256'), ('contextBytes', 'trust-context.json', 'contextSHA256')):
                  raw = base64.b64decode(context[field], validate=True)
                  if raw != originals[name] or sha(raw) != context[pin]:
                      raise RuntimeError('normal Host did not retain exact original public bytes')
              return context
          context = check_host('acquire', '')
          fingerprint = context['sourceFingerprint']
          context = check_host('current', fingerprint)
          verified = invoke('original-transaction-proof', [str(candidate / 'ynx-consensus-proof-verify'),
              '--trust-context', context['contextPath'], '--trust-context-sha256', context['contextSHA256']], request_raw, 1 << 20)
          if set(verified) != {'version', 'code', 'result'} or verified['version'] != 'YNX-CONSENSUS-TRANSACTION-PROOF-VERIFY-RESULT/v1' or verified['code'] != metadata['expectedVerifierCode']:
              raise RuntimeError('normal transaction proof verifier did not close the source delivery path')
          result, expected = verified['result'], request['expected']
          if (result['classification'] != 'data' or result['transactionType'] != expected['transactionType']
                  or result['transactionHash'] != expected['transactionHash'] or result['nativeWireHash'] != expected['nativeWireHash']
                  or result['height'] != expected['block']['headerHeight'] or result['index'] != expected['index']
                  or result['included'] is not True or result['finalized'] is not True or result['executionSuccessful'] is not True
                  or result['executionCode'] != '0' or result['outcome'] != 'succeeded' or result['nativeGrant'] is not False):
              raise RuntimeError('normal verifier lost original inclusion/execution DATA binding')
          check_host('current', fingerprint, 'host-current-after-proof')
          if set(p.name for p in destination.iterdir()) != set(originals) or any((destination / name).read_bytes() != raw for name, raw in originals.items()):
              raise RuntimeError('readonly Host/proof verification changed the delivered original bytes')
          if read(plan_path, 48 << 20) != plan_raw or read(Path(metadata['requestPath']), 128 << 20) != request_raw:
              raise RuntimeError('normal source delivery changed original pinned plan/request')
          receipt = dict(version='YNX-PROOF-HOST-SOURCE-CLI-INTEROP/v1', commit=os.environ['GITHUB_SHA'], runId=os.environ['GITHUB_RUN_ID'],
              metadataSHA256=sha(metadata_raw), sourcePlanSHA256=metadata['sourcePlanSHA256'], runtimeSOURCEsha256=sha(runtime_raw),
              binaryPins=binary_pins, deliveryManifestSHA256=delivery['manifestSHA256'], sourceSHA256=delivery['sourceSHA256'],
              sourceFingerprint=fingerprint, cases=observations, syntheticOnly=True, normalCLIExecuted=True,
              originalDeliveredBytesUnchanged=True, transactionProofVerified=True, nativeRootAuthorized=False,
              sourceDeploymentQualified=False, actualCometNode=False, installedWallet=False, publicDeployment=False, pqActivation=False)
          with (root / 'ynx-proof-host-source-cli-public-receipt.json').open('x') as output:
              output.write(json.dumps(receipt, sort_keys=True, separators=(',', ':')) + '\n')
          print('YNX_PROOF_HOST_SOURCE_CLI ' + json.dumps(receipt, sort_keys=True, separators=(',', ':')))
          PY
      - name: Upload only public Host delivery and normal CLI receipt
        if: ${{ !cancelled() && steps.pqhostsourcecli.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-proof-host-source-public-delivery-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ynx-proof-host-source-public/delivery
            ${{ runner.temp }}/ynx-proof-host-source-cli-public-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload only public transaction proof fixture and normal CLI receipt
        if: ${{ !cancelled() && steps.pqtransactionproofcli.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-transaction-proof-public-interop-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ynx-pq-consensus-transaction-proof-public.json
            ${{ runner.temp }}/ynx-pq-transaction-proof-cli-public-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload only public consensus proof fixture and normal CLI receipt
        if: ${{ !cancelled() && steps.pqproofcli.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-consensus-proof-public-interop-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ynx-pq-consensus-light-proof-public.json
            ${{ runner.temp }}/ynx-pq-consensus-proof-cli-public-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload only public Linux runtime candidate
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-linux-runtime-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-pq-linux-runtime-candidate
          if-no-files-found: error
          retention-days: 7

  proof-verifier-macos:
    needs: focused-go
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/ynx-pq-perf-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GOMAXPROCS: '2'
      GOGC: '50'
      GOMEMLIMIT: '1536MiB'
      CGO_ENABLED: '0'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOTOOLCHAIN: local
    steps:
      - name: Checkout the same verified protocol source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the original pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Build only the existing offline verifier for macOS callers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          umask 077
          YNX_MAC_VERIFIER="$RUNNER_TEMP/ynx-pq-macos-proof-verifier"
          export YNX_MAC_VERIFIER
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -m 0700 "$YNX_MAC_VERIFIER"
          df -Pk "$RUNNER_TEMP"
          awk '/MemAvailable:/ {print}' /proc/meminfo
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 2097152
          for YNX_MAC_ARCH in arm64 amd64; do
            GOOS=darwin GOARCH="$YNX_MAC_ARCH" go build -p 1 -trimpath -o "$YNX_MAC_VERIFIER/ynx-consensus-proof-verify-darwin-$YNX_MAC_ARCH" ./cmd/ynx-consensus-proof-verify
          done
          python3 -B - <<'PY'
          import hashlib, json, os, struct, subprocess
          from pathlib import Path
          root = Path(os.environ['YNX_MAC_VERIFIER'])
          def pin(path):
              with path.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              return dict(bytes=path.stat().st_size, sha256=digest)
          binaries = {}
          for arch, cpu in (('arm64', 0x0100000c), ('amd64', 0x01000007)):
              name = 'ynx-consensus-proof-verify-darwin-' + arch
              path = root / name
              with path.open('rb') as source:
                  head = source.read(32)
              if len(head) != 32 or head[:4] != b'\xcf\xfa\xed\xfe' or struct.unpack('<I', head[4:8])[0] != cpu or struct.unpack('<I', head[12:16])[0] != 2:
                  raise RuntimeError('normal verifier is not the selected macOS Mach-O executable')
              binaries[name] = pin(path)
              if not 1 << 20 < binaries[name]['bytes'] <= 128 << 20:
                  raise RuntimeError('macOS verifier exceeds the original per-binary bound')
          names = ('internal/consensus/pq_light_proof.go', 'internal/consensus/pq_transaction_proof.go',
              'cmd/ynx-consensus-proof-verify/main.go', 'cmd/ynx-consensus-proof-verify/trust.go', 'cmd/ynx-consensus-proof-verify/transaction.go')
          record = dict(version='YNX-PQ-MACOS-PROOF-VERIFIER-CANDIDATE/v1', commit=os.environ['GITHUB_SHA'], runId=os.environ['GITHUB_RUN_ID'],
              platforms=['darwin/arm64', 'darwin/amd64'], goVersion=subprocess.check_output(['go', 'version'], text=True).strip(),
              goMod=pin(Path('go.mod')), goSum=pin(Path('go.sum')), cometForkTree=subprocess.check_output(['git','rev-parse','HEAD:third_party/cometbft'], text=True).strip(),
              sources={name:pin(Path(name)) for name in names}, binaries=binaries,
              lightRequestContract='YNX-CONSENSUS-PROOF-VERIFY-REQUEST/v1', transactionRequestContract='YNX-CONSENSUS-TRANSACTION-PROOF-VERIFY-REQUEST/v1',
              transactionResultContract='YNX-CONSENSUS-TRANSACTION-PROOF-VERIFY-RESULT/v1', crossCompiled=True,
              executedOnMacOS=False, productInstalled=False, nativeRootAuthorized=False, publicDeployment=False, pqActivation=False,
              purpose='existing offline DATA verifier for the original Wallet builder; no keys, signing, trust context or service')
          with (root / 'SOURCE.json').open('x') as target:
              target.write(json.dumps(record, sort_keys=True, separators=(',', ':')) + '\n')
          print('YNX_MACOS_PROOF_VERIFIER ' + json.dumps(record, sort_keys=True, separators=(',', ':')))
          PY
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Upload only public macOS verifier executables and exact source pins
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-macos-proof-verifier-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-pq-macos-proof-verifier
          if-no-files-found: error
          retention-days: 7

  pq-paired-n1:
    needs: focused-go
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ynx-pq-public-upgrade' && inputs.candidate_sha == github.sha && inputs.paired_n1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOMAXPROCS: '1'
      GOGC: '50'
      GOMEMLIMIT: '512MiB'
      CGO_ENABLED: '0'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact paired candidate with baseline ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Set private case paths
        run: |
          printf '%s\n' "YNX_PAIR_CI_CASE=$RUNNER_TEMP/ynx-pq-pair-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "YNX_PAIR_CI_RECEIPT=$RUNNER_TEMP/ynx-pq-pair-guard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
      - name: Verify bounded preparation and Linux process ownership controls
        run: |
          node --test scripts/loadtest/pq-paired-recipe.test.mjs
          python3 scripts/loadtest/test_pq_paired_linux_window.py
          test "$(git rev-parse HEAD)" = '${{ inputs.candidate_sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Prepare one exact-source N1 trial1 overlay
        run: |
          node scripts/loadtest/prepare-pq-paired-benchmark.mjs --source-root "$GITHUB_WORKSPACE" --commit '${{ inputs.candidate_sha }}' --output-dir "$YNX_PAIR_CI_CASE" --n 1 --trial 1 --write
      - name: Execute single guarded PQ component pair
        id: performance
        timeout-minutes: 3
        run: |
          python3 scripts/loadtest/pq-paired-linux-window.py --prepared "$YNX_PAIR_CI_CASE/prepared.json" --receipt "$YNX_PAIR_CI_RECEIPT" --execute
      - name: Upload QA measurement and guard receipt
        if: ${{ always() && steps.performance.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-paired-n1-trial1-${{ github.sha }}
          path: |
            ${{ env.YNX_PAIR_CI_CASE }}/pq-paired-result.json
            ${{ env.YNX_PAIR_CI_RECEIPT }}
            ${{ env.YNX_PAIR_CI_CASE }}/go.stdout.log
            ${{ env.YNX_PAIR_CI_CASE }}/go.stderr.log
          if-no-files-found: warn
          retention-days: 7
