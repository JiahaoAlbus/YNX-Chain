          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['YNX_REMOTE_BUILD']).resolve()
          def pin(path):
              with path.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              return dict(bytes=path.stat().st_size, sha256=digest)
          binaries = {name: pin(root / name) for name in
              ('consensus.test', 'ynx-consensus-pq-remote-signer')}
          source = dict(version='YNX-PQ-REMOTE-SIGNER-PROCESS-BUILD/v1',
              commit=os.environ['GITHUB_SHA'], platform='linux/amd64',
              sourceLeaves={'internal/consensus/pq_remote_process_test.go':
                  pin(root / 'pq_remote_process_test.go')['sha256']}, binaries=binaries)
          with (root / 'SOURCE.json').open('x') as target:
              target.write(json.dumps(source, sort_keys=True, separators=(',', ':')) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              for name, value in (('YNX_REMOTE_MANIFEST_SHA', pin(root / 'SOURCE.json')['sha256']),
                      ('YNX_REMOTE_TEST_SHA', binaries['consensus.test']['sha256']),
                      ('YNX_REMOTE_DAEMON_SHA', binaries['ynx-consensus-pq-remote-signer']['sha256'])):
                  target.write(name + '=' + value + '\n')
          print('YNX_REMOTE_PROCESS_BUILD_PINS ' + json.dumps(dict(commit=os.environ['GITHUB_SHA'],
              manifestSHA256=pin(root / 'SOURCE.json')['sha256'], binaries=binaries,
              sourceLeaves=source['sourceLeaves']), sort_keys=True, separators=(',', ':')))
          PY
