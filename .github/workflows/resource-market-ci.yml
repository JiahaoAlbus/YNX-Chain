name: Resource Market Candidate Gates

on:
  push:
    branches:
      - 'codex/ynx-pq-public-upgrade'
      - 'codex/ynx-pq-perf-integration'
    paths:
      - 'internal/ynxbatch/**'
      - 'internal/ynxauth/**'
      - 'internal/ynxconsensusauth/**'
      - 'internal/chain/**'
      - 'internal/consensus/**'
      - 'internal/api/**'
      - 'internal/bftgateway/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'third_party/cometbft/**'
      - 'scripts/loadtest/**'
      - 'scripts/ops/validate-private-consensus-copy.py'
      - 'scripts/ops/test_validate_private_consensus_copy.py'
      - 'scripts/ops/validate-pq-remote-signer-process.py'
      - 'scripts/ops/test_validate_pq_remote_signer_process.py'
      - 'scripts/ops/ynx-consensus-pq-remote-signer*'
      - 'scripts/deploy/deploy-consensus-candidate.sh'
      - 'scripts/deploy/consensus-candidate-failure-retention.test.mjs'
      - 'scripts/verify/consensus-production-package-check*'
      - 'scripts/verify/consensus-candidate-deploy-gate.sh'
      - 'scripts/verify/verify-consensus-candidate.sh'
      - 'scripts/ops/public-bft-production-driver.sh'
      - 'scripts/ops/write-owner-handover-packet.mjs'
      - 'scripts/ops/write-production-custody-review-packet.mjs'
      - 'scripts/ops/public-bft-cutover-transaction.sh'
      - 'scripts/ops/public-bft-operator-transition.sh'
      - 'scripts/ops/remote/public-bft-operator-transition.sh'
      - 'scripts/ops/remote/public-bft-final-snapshot.sh'
      - 'scripts/ops/public-bft-validator-registration.sh'
      - 'scripts/ops/remote/public-bft-dependencies.sh'
      - 'scripts/ops/remote/public-bft-ingress.sh'
      - 'scripts/verify/public-bft-candidate-binding.mjs'
      - 'scripts/verify/public-bft-production-candidate-check.sh'
      - 'scripts/verify/public-bft-production-driver-check.sh'
      - 'scripts/verify/lib/owner-handover.mjs'
      - 'scripts/verify/validate-owner-handover-receipt.mjs'
      - 'scripts/verify/validate-production-custody-review.mjs'
      - 'scripts/verify/owner-handover-check.sh'
      - 'scripts/verify/production-custody-review-check.sh'
      - 'scripts/verify/public-bft-cutover-transaction-check.sh'
      - 'scripts/verify/public-bft-operator-transition-check.sh'
      - 'scripts/verify/public-bft-validator-registration-check.sh'
      - 'scripts/verify/public-bft-gateway-dependencies-check.sh'
      - 'scripts/verify/public-bft-gateway-ingress-check.sh'
      - 'scripts/verify/validate-public-bft-cutover-approval.mjs'
      - 'scripts/verify/validate-public-bft-cutover-approval-evidence.mjs'
      - 'scripts/ops/rollback-consensus-candidate*'
      - 'scripts/fixtures/verify-pq-wallet-restored/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/resource-market-ci.yml'
  pull_request:
    paths:
      - 'apps/resource-market/**'
      - 'internal/resourcemarket/**'
      - 'internal/resourceproduct/**'
      - 'internal/productstore/**'
      - 'internal/canonicalwallet/**'
      - 'scripts/validate/**'
      - 'scripts/verify/resource-market*'
      - '.github/workflows/resource-market-ci.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit for the isolated PQ branch only
        required: false
        type: string
      paired_n1:
        description: Run one guarded N1 trial1 PQ component pair after correctness gates
        required: false
        default: false
        type: boolean
      consensus_e2e:
        description: Run the separately authorized bounded four-validator transition once
        required: false
        default: false
        type: boolean
      consensus_e2e_retained_history:
        description: Run one separately authorized four-validator transition with a fixed 512 MiB retained-history budget and unchanged other limits
        required: false
        default: false
        type: boolean
      consensus_remote_e2e_retained_history:
        description: Run one separately authorized bounded four-validator transition with one normal remote signer and unchanged retained-history limits
        required: false
        default: false
        type: boolean
      remote_signer_process:
        description: Run one separately authorized normal signer process window without starting a node
        required: false
        default: false
        type: boolean
      remote_checkpoint_layout:
        description: One actual checkpoint layout for this separately authorized signer window
        required: false
        default: atomic-json
        type: choice
        options:
          - atomic-json
          - snapshot-journal
          - block-journal
      remote_process_authorization:
        description: Exact external authorization reference for the selected normal signer process window
        required: false
        default: ''
        type: string
      remote_manifest_sha256:
        description: Independent manifest SHA256 from the successful source-only build
        required: false
        type: string
      remote_test_sha256:
        description: Independent consensus.test SHA256 from the successful source-only build
        required: false
        type: string
      remote_daemon_sha256:
        description: Independent normal signer binary SHA256 from the successful source-only build
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref != 'refs/heads/codex/ynx-pq-public-upgrade' && github.ref != 'refs/heads/codex/ynx-pq-perf-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install patched Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.13'
          check-latest: false
          cache: true
      - name: Record toolchains
        run: go version && node --version && npm --version
      - name: Runtime filler and secret gates
        run: |
          bash scripts/validate/no-placeholder-check.sh
          bash scripts/validate/secret-scan.sh
      - name: Go correctness and race gates
        run: |
          go vet ./internal/resourcemarket ./internal/resourceproduct ./internal/productstore ./internal/canonicalwallet ./apps/resource-market
          go test -count=1 ./internal/resourcemarket ./internal/resourceproduct ./internal/productstore ./internal/canonicalwallet ./apps/resource-market
          go test -race -count=1 ./internal/resourcemarket ./internal/resourceproduct
      - name: Go vulnerability gate
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./internal/resourcemarket ./internal/resourceproduct ./internal/productstore ./internal/canonicalwallet ./apps/resource-market
      - name: Locked browser dependencies and audit
        working-directory: apps/resource-market
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Local API and DAST smoke
        run: bash apps/resource-market/check.sh
      - name: Build and inspect candidate artifact
        run: |
          if node apps/resource-market/scripts/package-release.mjs /tmp/resource-market-unsafe-output; then
            echo "unsafe output path was accepted" >&2
            exit 1
          fi
          node apps/resource-market/scripts/package-release.mjs release/resource-market-artifacts/ci-a
          node apps/resource-market/scripts/package-release.mjs release/resource-market-artifacts/ci-b
          diff -qr release/resource-market-artifacts/ci-a release/resource-market-artifacts/ci-b
          bash scripts/validate/secret-scan.sh
      - name: Upload unsigned candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-market-candidate-${{ github.sha }}
          path: release/resource-market-artifacts/ci-a
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  focused-go:
    if: (github.ref == 'refs/heads/codex/ynx-pq-public-upgrade' || github.ref == 'refs/heads/codex/ynx-pq-perf-integration') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.candidate_sha == github.sha))
    concurrency:
      group: ynx-pq-fixed-source-refs/heads/codex/ynx-pq-public-upgrade
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOMAXPROCS: '2'
      GOGC: '50'
      GOMEMLIMIT: '1536MiB'
      CGO_ENABLED: '0'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          # Fixed historical counterexamples and production-baseline ancestry
          # must remain available as the candidate branch grows. Fetch the
          # full commit graph without downloading all historical file bodies.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Record exact candidate identity
        id: identity
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test "$(git rev-parse --is-shallow-repository)" = false
          git merge-base --is-ancestor aa97f102fc72ee89ef3c61b6125256b288694b39 HEAD
          go version
          git status --porcelain
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            YNX_WINDOW_SELECTIONS=0
            for YNX_WINDOW_SELECTED in '${{ inputs.paired_n1 }}' '${{ inputs.consensus_e2e }}' '${{ inputs.consensus_e2e_retained_history }}' '${{ inputs.consensus_remote_e2e_retained_history }}' '${{ inputs.remote_signer_process }}'; do
              case "$YNX_WINDOW_SELECTED" in
                true) YNX_WINDOW_SELECTIONS=$((YNX_WINDOW_SELECTIONS + 1)) ;;
                false|'') ;;
                *) exit 1 ;;
              esac
            done
            test "$YNX_WINDOW_SELECTIONS" -le 1
          fi
      - name: Verify pure dual-PQ protocol and account authorization
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=180s ./internal/ynxbatch ./internal/ynxauth ./internal/ynxconsensusauth ./scripts/fixtures/verify-pq-wallet-restored
      - name: Verify forked engine keys and actual consensus objects
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 4
        run: go test -p 1 -count=1 -timeout=180s github.com/cometbft/cometbft/crypto/ynxpq github.com/cometbft/cometbft/crypto/encoding github.com/cometbft/cometbft/proto/tendermint/crypto github.com/cometbft/cometbft/proto/tendermint/types github.com/cometbft/cometbft/types
      - name: Compile forked state and consensus engine without starting nodes
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        run: go test -p 1 -count=1 -timeout=90s -run '^$' github.com/cometbft/cometbft/state github.com/cometbft/cometbft/consensus
      - name: Verify exact-height maintenance stop with real engine commit and cold stores
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        run: go test -p 1 -count=1 -timeout=90s -run '^TestYNXHeightHalt' github.com/cometbft/cometbft/state github.com/cometbft/cometbft/consensus github.com/cometbft/cometbft/blocksync github.com/cometbft/cometbft/node
      - name: Reproduce and repair same-directory database ownership without starting nodes
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          YNX_DB_CASE="$RUNNER_TEMP/ynx-pq-db-lifecycle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir "$YNX_DB_CASE"
          cp third_party/cometbft/node/node.go "$YNX_DB_CASE/fixed-node.go"
          trap 'cp "$YNX_DB_CASE/fixed-node.go" third_party/cometbft/node/node.go' EXIT
          git show 359766879bdb1fa10114394c58ab287c5b8996ae:third_party/cometbft/node/node.go > "$YNX_DB_CASE/original-node.go"
          # Retain the exact original and supply only the new optional field
          # needed by separate current API leaves to compile against it. Nil
          # never starts maintenance work; original close logic stays broken.
          python3 -B - "$YNX_DB_CASE/original-node.go" <<'PY'
          import pathlib, sys
          source = pathlib.Path(sys.argv[1])
          raw = source.read_bytes()
          anchor = b'type Node struct {\n'
          if raw.count(anchor) != 1 or b'heightHalt *heightHaltControl' in raw:
              raise RuntimeError('unexpected frozen original node API')
          with source.with_name('original-node-upstream.go').open('xb') as saved:
              saved.write(raw)
          field = b'\theightHalt *heightHaltControl // optional API only; nil in original DB regression\n'
          source.write_bytes(raw.replace(anchor, anchor + field, 1))
          PY
          cp "$YNX_DB_CASE/original-node.go" third_party/cometbft/node/node.go
          set +e
          go test -p 1 -count=1 -timeout=60s -run '^TestNodeOwnedDatabaseSameDirectoryReopen$' github.com/cometbft/cometbft/node > "$YNX_DB_CASE/original-red.log" 2>&1
          YNX_DB_RED_STATUS=$?
          set -e
          cp "$YNX_DB_CASE/fixed-node.go" third_party/cometbft/node/node.go
          trap - EXIT
          cat "$YNX_DB_CASE/original-red.log"
          test "$YNX_DB_RED_STATUS" -ne 0
          grep -F 'tx_index underlying Close calls = 0, want exactly one' "$YNX_DB_CASE/original-red.log"
          go test -p 1 -count=1 -timeout=60s -run '^(TestNodeOwnedDatabase|TestIndexerOwnedDatabase)' github.com/cometbft/cometbft/node github.com/cometbft/cometbft/state/txindex
      - name: Verify real profile state transition and historical store without starting nodes
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=90s -run '^TestYNXProfileActualStateUpdateHeaderAndHistoricalStore$' github.com/cometbft/cometbft/state
      - name: Reproduce and repair real Commit and engine checkpoint read ordering
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          YNX_CHECKPOINT_CASE="$RUNNER_TEMP/ynx-pq-checkpoint-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir "$YNX_CHECKPOINT_CASE"
          cp third_party/cometbft/state/ynx_authority.go "$YNX_CHECKPOINT_CASE/fixed-authority.go"
          trap 'cp "$YNX_CHECKPOINT_CASE/fixed-authority.go" third_party/cometbft/state/ynx_authority.go' EXIT
          git show efdf467acd18bd56e267a37a411a6245b59f05f2:third_party/cometbft/state/ynx_authority.go > third_party/cometbft/state/ynx_authority.go
          set +e
          go test -p 1 -count=1 -timeout=60s -run '^TestPQEngineCheckpointReadSurvivesApplicationCommitBeforeStoreSave$' ./internal/consensus > "$YNX_CHECKPOINT_CASE/original-red.log" 2>&1
          YNX_CHECKPOINT_RED_STATUS=$?
          set -e
          cp "$YNX_CHECKPOINT_CASE/fixed-authority.go" third_party/cometbft/state/ynx_authority.go
          trap - EXIT
          cat "$YNX_CHECKPOINT_CASE/original-red.log"
          test "$YNX_CHECKPOINT_RED_STATUS" -ne 0
          grep -F 'real P params lost during Commit gap: application authority differs' "$YNX_CHECKPOINT_CASE/original-red.log"
          go test -p 1 -count=1 -timeout=90s -run '^TestPQEngineCheckpointReadSurvivesApplicationCommitBeforeStoreSave$' ./internal/consensus
      - name: Verify bounded remote signer transport and unchanged legacy protobuf vectors
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=90s -run '^(TestYNXRemote.*|TestPrivvalVectors)$' github.com/cometbft/cometbft/privval
      - name: Verify actual engine signing caller uses committed height key and round context
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=90s -run '^(TestYNXActualSignVoteConsumesHeightKeyAndRoundContext|TestYNXActualRemoteCallerPassesCheckpointBeforeHeightKeyAndSign)$' github.com/cometbft/cometbft/consensus
      - name: Measure fresh single and bounded concurrent dual signature paths
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          if git diff --quiet 66d29db440c7e3864ec855734f77bf5a0ae65ee2 HEAD -- internal/ynxbatch; then
            echo 'Reuse exact unchanged provider measurements from successful run 39098054802 (22 combined benchmark rows retained in CI_RUN18 evidence).'
          else
            go test -p 1 ./internal/ynxbatch -run '^$' -bench '^BenchmarkParallelProvider(FreshN1Sign|FreshN1Verify|Concurrent)$' -benchtime=10x -count=1 -timeout=90s
          fi
      - name: Measure actual policy certificate cache consumer cold and warm paths
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          if git diff --quiet 8d5080e6caacdcd069ef205978e9b67e760c0a55 HEAD -- internal/chain internal/ynxauth internal/ynxbatch; then
            echo 'Unchanged certificate consumer source: reuse the six actual CI19 rows in docs/protocol/evidence/CI_RUN19_39099736825.json.'
          else
            go test -p 1 ./internal/chain -run '^$' -bench '^BenchmarkPQCertificateConsumer$' -benchtime=10x -count=1 -timeout=90s
          fi
      - name: Install pinned contract build runtime
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Verify failed candidate deployment preserves services and signing history
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: node --test scripts/deploy/consensus-candidate-failure-retention.test.mjs scripts/verify/consensus-production-package-check.test.mjs
      - name: Verify original-state operator transition preserves custody and uncertain attempts
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          bash scripts/verify/public-bft-operator-transition-check.sh
      - name: Compile frozen measured production overlay without executing cases
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        env:
          GOMAXPROCS: '1'
          GOGC: '50'
          GOMEMLIMIT: '512MiB'
        run: |
          YNX_OVERLAY_COMPILE_CASE="$RUNNER_TEMP/ynx-pq-overlay-compile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/loadtest/prepare-pq-paired-benchmark.mjs --source-root "$GITHUB_WORKSPACE" --commit '${{ github.sha }}' --output-dir "$YNX_OVERLAY_COMPILE_CASE" --n 16 --trial 1 --write
          go test -overlay "$YNX_OVERLAY_COMPILE_CASE/overlay.json" -p 1 ./internal/chain -run '^$' -count=1 -timeout=90s
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Generate canonical IDE contract fixture
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run hardhat:build -- contracts/devtools/SampleEVMWriteCounter.sol contracts/tokens/SampleYNXTCompatibleERC20.sol
          npm run contracts:selectors
          git diff --exit-code -- artifacts
          test -s artifacts/contracts/devtools/SampleEVMWriteCounter.sol/SampleEVMWriteCounter.json
          test -s artifacts/contracts/tokens/SampleYNXTCompatibleERC20.sol/SampleYNXTCompatibleERC20.json
          sha256sum contracts/devtools/SampleEVMWriteCounter.sol artifacts/contracts/devtools/SampleEVMWriteCounter.sol/SampleEVMWriteCounter.json artifacts/ynx-selector-metadata.json
          sha256sum contracts/tokens/SampleYNXTCompatibleERC20.sol artifacts/contracts/tokens/SampleYNXTCompatibleERC20.sol/SampleYNXTCompatibleERC20.json
      - name: Verify native ledger and HTTP PQ integration
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=180s ./internal/chain ./internal/api
      - name: Compile production entry points
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        env:
          YNX_CONSENSUS_OPERATOR_FIXTURE_OUT: ${{ runner.temp }}/ynx-consensus-operator-public-inputs
        run: |
          go test -p 1 -count=1 -timeout=90s -run '^$' ./cmd/ynx-chaind ./internal/consensus
          go test -p 1 -count=1 -timeout=90s ./cmd/ynx-abci ./cmd/ynx-comet ./cmd/ynx-consensus-keycheck ./cmd/ynx-consensus-pq-key-init ./cmd/ynx-consensus-pq-remote-signer ./cmd/ynx-consensus-proof-verify
          go test -p 1 -count=1 -timeout=90s -run '^(TestExportConsensusState|TestRunNodeConsensusExport|TestConsensusExport)' ./cmd/ynx-chaind
          go test -p 1 -count=1 -timeout=90s ./cmd/ynx-consensus-package
      - name: Verify complete state bridge and sponsor continuity
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        env:
          YNX_PQ_LIGHT_PROOF_FIXTURE_OUT: ${{ runner.temp }}/ynx-pq-consensus-light-proof-public.json
          YNX_PQ_TRANSACTION_PROOF_FIXTURE_OUT: ${{ runner.temp }}/ynx-pq-consensus-transaction-proof-public.json
          YNX_PROOF_HOST_SOURCE_FIXTURE_OUT: ${{ runner.temp }}/ynx-proof-host-source-public
        run: |
          go test -p 1 -count=1 -timeout=180s -run '^(TestConsensusMigration|TestConsensusSponsor)' ./internal/chain
          YNX_PQ_NETWORK_E2E='' go test -p 1 -count=1 -timeout=180s ./internal/consensus
      - name: Verify normal Host source producer with original signed transaction fixture
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 2
        env:
          YNX_PQ_HOST_PUBLIC_FIXTURE: ${{ runner.temp }}/ynx-pq-consensus-transaction-proof-public.json
        run: go test -p 1 -count=1 -timeout=90s -run '^TestProofHostFromOriginalSignedPublicFixture$' ./cmd/ynx-consensus-proof-verify
      - name: Reproduce signed-history overwrite and unsafe rollback callers
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          set -euo pipefail
          YNX_HISTORY_SCRIPT_CASE="$RUNNER_TEMP/ynx-history-scripts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir "$YNX_HISTORY_SCRIPT_CASE"
          cp internal/consensus/production.go "$YNX_HISTORY_SCRIPT_CASE/fixed-production.go"
          cp scripts/ops/rollback-consensus-candidate.sh "$YNX_HISTORY_SCRIPT_CASE/fixed-rollback.sh"
          trap 'cp "$YNX_HISTORY_SCRIPT_CASE/fixed-production.go" internal/consensus/production.go; cp "$YNX_HISTORY_SCRIPT_CASE/fixed-rollback.sh" scripts/ops/rollback-consensus-candidate.sh' EXIT
          # Restore only the original real script generator. Replacing the
          # entire old file would remove newer operator APIs and manufacture a
          # compile error instead of reproducing the history overwrite.
          python3 -B - <<'PY'
          import re, subprocess
          from pathlib import Path
          path = Path('internal/consensus/production.go')
          fixed = path.read_text()
          old = subprocess.check_output(['git', 'show', '3a72627aae36a94b61d3c771ad14e313f3510361:internal/consensus/production.go'], text=True)
          def span(text):
              start = re.search(r'^func writeProductionRoleScripts\(', text, re.M)
              if start is None:
                  raise RuntimeError('original script generator missing')
              following = re.search(r'^func ', text[start.end():], re.M)
              return start.start(), len(text) if following is None else start.end() + following.start()
          a, b = span(fixed)
          c, d = span(old)
          path.write_text(fixed[:a] + old[c:d] + fixed[b:])
          PY
          set +e
          go test -p 1 -count=1 -timeout=60s -v -run '^TestProductionRoleScriptsPreserveSignedStateAndUnknownResults$/^existing-signed-install$' ./internal/consensus > "$YNX_HISTORY_SCRIPT_CASE/original-install-red.log" 2>&1
          YNX_HISTORY_INSTALL_RED=$?
          set -e
          cp "$YNX_HISTORY_SCRIPT_CASE/fixed-production.go" internal/consensus/production.go
          cat "$YNX_HISTORY_SCRIPT_CASE/original-install-red.log"
          test "$YNX_HISTORY_INSTALL_RED" -ne 0
          grep -Fq 'PRODUCTION_SCRIPT_HISTORY_NOT_PRESERVED' "$YNX_HISTORY_SCRIPT_CASE/original-install-red.log"
