          env = dict(environment, DEPLOY_DRY_RUN='1', ENV_FILE=str(env_file), CONSENSUS_CANDIDATE_PACKAGE=str(case / 'candidate-block-journal'),
              CONSENSUS_CANDIDATE_OPERATOR_PLAN_SHA256=manifest['layouts'][2]['operatorPlanHash'], CONSENSUS_CANDIDATE_RUNTIME_BUNDLE=str(candidate),
              CONSENSUS_CANDIDATE_RUNTIME_COMMIT=os.environ['GITHUB_SHA'], CONSENSUS_CANDIDATE_RUNTIME_MANIFEST_SHA256=sha(source_raw),
