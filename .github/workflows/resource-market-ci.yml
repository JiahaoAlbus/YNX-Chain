              originalInputsUnchanged=True, syntheticOnly=True, normalCLIExecuted=True, runtimeStarted=False, publicDeployment=False, pqActivation=False)
          with (root / 'ynx-consensus-operator-cli-public-receipt.json').open('x') as target:
