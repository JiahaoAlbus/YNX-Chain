          set -eu
          umask 077
          YNX_E2E_CASE="$RUNNER_TEMP/ynx-pq-network-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          jq -e '.cleanupComplete == true' "$YNX_E2E_CASE.receipt.json" >/dev/null
          set -o noclobber
          python3 -B scripts/loadtest/pq-network-file-sizes.py \
            --ephemeral-parent "$RUNNER_TEMP" \
            --case "$YNX_E2E_CASE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            > "$YNX_E2E_CASE.file-sizes.json"
      - name: Preserve only public network-test logs and guard receipt
        if: ${{ always() && (steps.pqnetwork.outcome == 'success' || steps.pqnetwork.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-network-e2e-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ynx-pq-network-${{ github.run_id }}-${{ github.run_attempt }}.receipt.json
            ${{ runner.temp }}/ynx-pq-network-${{ github.run_id }}-${{ github.run_attempt }}/prepared.json
            ${{ runner.temp }}/ynx-pq-network-${{ github.run_id }}-${{ github.run_attempt }}/go.stdout.log
            ${{ runner.temp }}/ynx-pq-network-${{ github.run_id }}-${{ github.run_attempt }}/go.stderr.log
            ${{ runner.temp }}/ynx-pq-network-${{ github.run_id }}-${{ github.run_attempt }}.file-sizes.json
          if-no-files-found: warn
          retention-days: 7
      # The external client was independently fixed and all 13 functions passed
      # at aa25500; see PERF_SEGMENTED_CLIENT_AA255_NORMAL09_ACTUAL_R1.json.
      # The repaired source is also pinned below for the integration run.
      - name: Checkout fixed repaired performance client
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aa25500bdb13c52e56133ec0876651257cf31a1a
          path: qa-owned-performance-client
          persist-credentials: false
      - name: Verify fixed segmented client integration with original assertions
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: qa-owned-performance-client
        timeout-minutes: 3
        env:
          GOMAXPROCS: '1'
          GOGC: '50'
          GOMEMLIMIT: '384MiB'
        run: |
          test "$(git rev-parse HEAD)" = 'aa25500bdb13c52e56133ec0876651257cf31a1a'
          test "$(git rev-parse HEAD:cmd/ynx-consensus-perf-client)" = '1614f4ad2bc419612f3aba5bde492ad24a9920b6'
          test "$(git rev-parse HEAD:go.mod)" = 'b9d7b1000986dad89c87ca0a1e1758636b5f6cdc'
          test "$(git rev-parse HEAD:go.sum)" = '4d4aa4b7ef8b33d85552eb5dc2f862efd268d4b2'
          go test -p 1 -count=1 -timeout=90s -v -run '^(TestReadyIntentSegmentsPersistAndStreamExactSignedInputs|TestReadyIntentSegmentsNeverRetryFailedOrUncertainPersistence|TestReadyIntentSegmentsRejectMissingCorruptAndWrongBinding|TestReadySenderSegmentedIntentBarrierAndRecovery|TestReadySenderSegmentedIntentFailureNeverSubmits|TestReadyIntentFormatSelectionRejectsMixedMissingAndEscapedReceipts|TestSegmentedIntentOptionsRequireBoundedEvidenceMode|TestReadySenderFastAccountAdvancesBeforeSlowPeer|TestReadySenderReadbackBindsFixtureAndRecoversOnlyCompleteIdentities|TestReadyIntentPrefixRetainsOnlyWholeValidatedWaves|TestReadyIntentPrefixWithoutReportNeverPromotesUnknownToAcknowledged|TestReadyIntentSharedSegmentDecoderRejectsWrongPrefix|TestReadyIntentPartialSelectionRequiresPlanAndNeverDowngradesAcknowledgedCorruption)$' ./cmd/ynx-consensus-perf-client
      - name: Emit public inverse interop fixture
        id: interop
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        env:
          YNX_BATCH_INTEROP_OUT: /tmp/ynx-go-public-interop.json
        run: |
          go test -p 1 -count=1 -timeout=90s -run '^TestRealSigner$' ./internal/ynxbatch
          test -s "$YNX_BATCH_INTEROP_OUT"
          sha256sum "$YNX_BATCH_INTEROP_OUT"
      - name: Upload public signature fixture
        if: ${{ !cancelled() && steps.interop.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-public-go-interop-${{ github.sha }}
          path: /tmp/ynx-go-public-interop.json
          if-no-files-found: error
          retention-days: 7
      - name: Build fixed-source offline migration validation tools
        if: ${{ success() && github.event_name == 'push' }}
        run: |
          YNX_OFFLINE_TOOLS="$RUNNER_TEMP/ynx-pq-offline-migration-tools"
          export YNX_OFFLINE_TOOLS
          umask 077
          mkdir "$YNX_OFFLINE_TOOLS"
          go build -p 1 -trimpath -ldflags "-s -w -X main.buildCommit=$GITHUB_SHA -X main.buildRelease=pq-offline-validation" -o "$YNX_OFFLINE_TOOLS/ynx-chaind" ./cmd/ynx-chaind
          go build -p 1 -trimpath -ldflags '-s -w' -o "$YNX_OFFLINE_TOOLS/ynx-consensus-package" ./cmd/ynx-consensus-package
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['YNX_OFFLINE_TOOLS'])
          binaries = {}
          for name in ('ynx-chaind', 'ynx-consensus-package'):
              path = root / name
              with path.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              binaries[name] = dict(bytes=path.stat().st_size, sha256=digest)
          record = dict(version='YNX-PQ-OFFLINE-MIGRATION-TOOLS/v1', commit=os.environ['GITHUB_SHA'],
              runId=os.environ['GITHUB_RUN_ID'], platform='linux/amd64', binaries=binaries,
              purpose='offline copied-state validation; not installed or activated')
          (root / 'SOURCE.json').write_text(json.dumps(record, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf8')
          PY
      - name: Upload public offline migration validation tools
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-offline-migration-tools-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-pq-offline-migration-tools
          if-no-files-found: error
          retention-days: 7
      - name: Build public Linux runtime candidate without starting services
        if: ${{ success() && github.event_name == 'push' }}
        timeout-minutes: 3
        run: |
          YNX_RUNTIME_CANDIDATE="$RUNNER_TEMP/ynx-pq-linux-runtime-candidate"
          export YNX_RUNTIME_CANDIDATE
          umask 077
          mkdir "$YNX_RUNTIME_CANDIDATE" "$YNX_RUNTIME_CANDIDATE/operator"
          for YNX_RUNTIME_COMMAND in ynx-abci ynx-comet ynx-consensus-pq-key-init; do
            go build -p 1 -trimpath -o "$YNX_RUNTIME_CANDIDATE/$YNX_RUNTIME_COMMAND" "./cmd/$YNX_RUNTIME_COMMAND"
          done
          cp "$YNX_REMOTE_BUILD/ynx-consensus-pq-remote-signer" "$YNX_RUNTIME_CANDIDATE/ynx-consensus-pq-remote-signer"
          YNX_RUNTIME_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -p 1 -trimpath -ldflags "-X main.buildCommit=$GITHUB_SHA -X main.buildRelease=pq-source-candidate-$GITHUB_SHA -X main.buildTime=$YNX_RUNTIME_BUILD_TIME" -o "$YNX_RUNTIME_CANDIDATE/ynx-bft-gatewayd" ./cmd/ynx-bft-gatewayd
          for YNX_RUNTIME_OPERATOR in ynx-consensus-pq-remote-signer.service.in ynx-consensus-pq-remote-signer-launch.sh ynx-consensus-pq-remote-signer.conf.in; do
            cp "scripts/ops/$YNX_RUNTIME_OPERATOR" "$YNX_RUNTIME_CANDIDATE/operator/$YNX_RUNTIME_OPERATOR"
          done
          bash -n "$YNX_RUNTIME_CANDIDATE/operator/ynx-consensus-pq-remote-signer-launch.sh"
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['YNX_RUNTIME_CANDIDATE'])
          names = ('ynx-abci', 'ynx-comet', 'ynx-bft-gatewayd',
              'ynx-consensus-pq-remote-signer', 'ynx-consensus-pq-key-init')
          def pin(path):
              with path.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              return dict(bytes=path.stat().st_size, sha256=digest)
          binaries = {}
          for name in names:
              path = root / name
              with path.open('rb') as source:
                  header = source.read(20)
              if header[:6] != b'\x7fELF\x02\x01' or header[18:20] != b'\x3e\x00':
                  raise RuntimeError('candidate requires actual Linux amd64 ELF')
              binaries[name] = pin(path)
          if not all(1 << 20 < p['bytes'] <= 128 << 20 for p in binaries.values()) or sum(p['bytes'] for p in binaries.values()) > 512 << 20:
              raise RuntimeError('candidate binary artifact size bound exceeded')
          operator = {p.name:pin(p) for p in (root / 'operator').iterdir()}
          record = dict(version='YNX-PQ-LINUX-RUNTIME-CANDIDATE/v1',
              commit=os.environ['GITHUB_SHA'], runId=os.environ['GITHUB_RUN_ID'], platform='linux/amd64',
              cometForkTree=subprocess.check_output(['git','rev-parse','HEAD:third_party/cometbft'],text=True).strip(),
              goMod=pin(Path('go.mod')), goSum=pin(Path('go.sum')),
              binaries=binaries, operator=operator, runtimeStarted=False,
              publicDeployment=False, pqActivation=False,
              purpose='normal entrypoint binaries and operator configuration only; no keys, credentials, ledger or signing history')
          (root / 'SOURCE.json').write_text(json.dumps(record, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf8')
          print('YNX_LINUX_RUNTIME_CANDIDATE ' + json.dumps(record, sort_keys=True, separators=(',', ':')))
          PY
      - name: Upload only public Linux runtime candidate
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-linux-runtime-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-pq-linux-runtime-candidate
          if-no-files-found: error
          retention-days: 7

  pq-paired-n1:
    needs: focused-go
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ynx-pq-public-upgrade' && inputs.candidate_sha == github.sha && inputs.paired_n1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOMAXPROCS: '1'
      GOGC: '50'
      GOMEMLIMIT: '512MiB'
      CGO_ENABLED: '0'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact paired candidate with baseline ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Set private case paths
        run: |
          printf '%s\n' "YNX_PAIR_CI_CASE=$RUNNER_TEMP/ynx-pq-pair-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "YNX_PAIR_CI_RECEIPT=$RUNNER_TEMP/ynx-pq-pair-guard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
      - name: Verify bounded preparation and Linux process ownership controls
        run: |
          node --test scripts/loadtest/pq-paired-recipe.test.mjs
          python3 scripts/loadtest/test_pq_paired_linux_window.py
          test "$(git rev-parse HEAD)" = '${{ inputs.candidate_sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Prepare one exact-source N1 trial1 overlay
        run: |
          node scripts/loadtest/prepare-pq-paired-benchmark.mjs --source-root "$GITHUB_WORKSPACE" --commit '${{ inputs.candidate_sha }}' --output-dir "$YNX_PAIR_CI_CASE" --n 1 --trial 1 --write
      - name: Execute single guarded PQ component pair
        id: performance
        timeout-minutes: 3
        run: |
          python3 scripts/loadtest/pq-paired-linux-window.py --prepared "$YNX_PAIR_CI_CASE/prepared.json" --receipt "$YNX_PAIR_CI_RECEIPT" --execute
      - name: Upload QA measurement and guard receipt
        if: ${{ always() && steps.performance.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-paired-n1-trial1-${{ github.sha }}
          path: |
            ${{ env.YNX_PAIR_CI_CASE }}/pq-paired-result.json
            ${{ env.YNX_PAIR_CI_RECEIPT }}
            ${{ env.YNX_PAIR_CI_CASE }}/go.stdout.log
            ${{ env.YNX_PAIR_CI_CASE }}/go.stderr.log
          if-no-files-found: warn
          retention-days: 7
