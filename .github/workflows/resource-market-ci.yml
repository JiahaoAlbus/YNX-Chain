name: Resource Market Candidate Gates

on:
  push:
    branches:
      - 'codex/ynx-pq-public-upgrade'
      - 'codex/ynx-pq-perf-integration'
    paths:
      - 'internal/ynxbatch/**'
      - 'internal/ynxauth/**'
      - 'internal/ynxconsensusauth/**'
      - 'internal/chain/**'
      - 'internal/consensus/**'
      - 'internal/api/**'
      - 'internal/bftgateway/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'third_party/cometbft/**'
      - 'scripts/loadtest/**'
      - 'scripts/ops/validate-private-consensus-copy.py'
      - 'scripts/ops/test_validate_private_consensus_copy.py'
      - 'scripts/deploy/deploy-consensus-candidate.sh'
      - 'scripts/deploy/consensus-candidate-failure-retention.test.mjs'
      - 'scripts/fixtures/verify-pq-wallet-restored/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/resource-market-ci.yml'
  pull_request:
    paths:
      - 'apps/resource-market/**'
      - 'internal/resourcemarket/**'
      - 'internal/resourceproduct/**'
      - 'internal/productstore/**'
      - 'internal/canonicalwallet/**'
      - 'scripts/validate/**'
      - 'scripts/verify/resource-market*'
      - '.github/workflows/resource-market-ci.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit for the isolated PQ branch only
        required: false
        type: string
      paired_n1:
        description: Run one guarded N1 trial1 PQ component pair after correctness gates
        required: false
        default: false
        type: boolean
      consensus_e2e:
        description: Run the separately authorized bounded four-validator transition once
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    if: github.ref != 'refs/heads/codex/ynx-pq-public-upgrade' && github.ref != 'refs/heads/codex/ynx-pq-perf-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install patched Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.13'
          check-latest: false
          cache: true
      - name: Record toolchains
        run: go version && node --version && npm --version
      - name: Runtime filler and secret gates
        run: |
          bash scripts/validate/no-placeholder-check.sh
          bash scripts/validate/secret-scan.sh
      - name: Go correctness and race gates
        run: |
          go vet ./internal/resourcemarket ./internal/resourceproduct ./internal/productstore ./internal/canonicalwallet ./apps/resource-market
          go test -count=1 ./internal/resourcemarket ./internal/resourceproduct ./internal/productstore ./internal/canonicalwallet ./apps/resource-market
          go test -race -count=1 ./internal/resourcemarket ./internal/resourceproduct
      - name: Go vulnerability gate
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./internal/resourcemarket ./internal/resourceproduct ./internal/productstore ./internal/canonicalwallet ./apps/resource-market
      - name: Locked browser dependencies and audit
        working-directory: apps/resource-market
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Local API and DAST smoke
        run: bash apps/resource-market/check.sh
      - name: Build and inspect candidate artifact
        run: |
          if node apps/resource-market/scripts/package-release.mjs /tmp/resource-market-unsafe-output; then
            echo "unsafe output path was accepted" >&2
            exit 1
          fi
          node apps/resource-market/scripts/package-release.mjs release/resource-market-artifacts/ci-a
          node apps/resource-market/scripts/package-release.mjs release/resource-market-artifacts/ci-b
          diff -qr release/resource-market-artifacts/ci-a release/resource-market-artifacts/ci-b
          bash scripts/validate/secret-scan.sh
      - name: Upload unsigned candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-market-candidate-${{ github.sha }}
          path: release/resource-market-artifacts/ci-a
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  focused-go:
    if: (github.ref == 'refs/heads/codex/ynx-pq-public-upgrade' || github.ref == 'refs/heads/codex/ynx-pq-perf-integration') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.candidate_sha == github.sha))
    concurrency:
      group: ynx-pq-fixed-source-refs/heads/codex/ynx-pq-public-upgrade
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOMAXPROCS: '2'
      GOGC: '50'
      GOMEMLIMIT: '1536MiB'
      CGO_ENABLED: '0'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 64
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Record exact candidate identity
        id: identity
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          go version
          git status --porcelain
      - name: Verify pure dual-PQ protocol and account authorization
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=180s ./internal/ynxbatch ./internal/ynxauth ./internal/ynxconsensusauth ./scripts/fixtures/verify-pq-wallet-restored
      - name: Verify forked engine keys and actual consensus objects
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 4
        run: go test -p 1 -count=1 -timeout=180s github.com/cometbft/cometbft/crypto/ynxpq github.com/cometbft/cometbft/crypto/encoding github.com/cometbft/cometbft/proto/tendermint/crypto github.com/cometbft/cometbft/proto/tendermint/types github.com/cometbft/cometbft/types
      - name: Compile forked state and consensus engine without starting nodes
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        run: go test -p 1 -count=1 -timeout=90s -run '^$' github.com/cometbft/cometbft/state github.com/cometbft/cometbft/consensus
      - name: Reproduce and repair same-directory database ownership without starting nodes
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          YNX_DB_CASE="$RUNNER_TEMP/ynx-pq-db-lifecycle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir "$YNX_DB_CASE"
          cp third_party/cometbft/node/node.go "$YNX_DB_CASE/fixed-node.go"
          trap 'cp "$YNX_DB_CASE/fixed-node.go" third_party/cometbft/node/node.go' EXIT
          git show 359766879bdb1fa10114394c58ab287c5b8996ae:third_party/cometbft/node/node.go > "$YNX_DB_CASE/original-node.go"
          cp "$YNX_DB_CASE/original-node.go" third_party/cometbft/node/node.go
          set +e
          go test -p 1 -count=1 -timeout=60s -run '^TestNodeOwnedDatabaseSameDirectoryReopen$' github.com/cometbft/cometbft/node > "$YNX_DB_CASE/original-red.log" 2>&1
          YNX_DB_RED_STATUS=$?
          set -e
          cp "$YNX_DB_CASE/fixed-node.go" third_party/cometbft/node/node.go
          trap - EXIT
          cat "$YNX_DB_CASE/original-red.log"
          test "$YNX_DB_RED_STATUS" -ne 0
          grep -F 'tx_index underlying Close calls = 0, want exactly one' "$YNX_DB_CASE/original-red.log"
          go test -p 1 -count=1 -timeout=60s -run '^(TestNodeOwnedDatabase|TestIndexerOwnedDatabase)' github.com/cometbft/cometbft/node github.com/cometbft/cometbft/state/txindex
      - name: Verify real profile state transition and historical store without starting nodes
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=90s -run '^TestYNXProfileActualStateUpdateHeaderAndHistoricalStore$' github.com/cometbft/cometbft/state
      - name: Reproduce and repair real Commit and engine checkpoint read ordering
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          YNX_CHECKPOINT_CASE="$RUNNER_TEMP/ynx-pq-checkpoint-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir "$YNX_CHECKPOINT_CASE"
          cp third_party/cometbft/state/ynx_authority.go "$YNX_CHECKPOINT_CASE/fixed-authority.go"
          trap 'cp "$YNX_CHECKPOINT_CASE/fixed-authority.go" third_party/cometbft/state/ynx_authority.go' EXIT
          git show efdf467acd18bd56e267a37a411a6245b59f05f2:third_party/cometbft/state/ynx_authority.go > third_party/cometbft/state/ynx_authority.go
          set +e
          go test -p 1 -count=1 -timeout=60s -run '^TestPQEngineCheckpointReadSurvivesApplicationCommitBeforeStoreSave$' ./internal/consensus > "$YNX_CHECKPOINT_CASE/original-red.log" 2>&1
          YNX_CHECKPOINT_RED_STATUS=$?
          set -e
          cp "$YNX_CHECKPOINT_CASE/fixed-authority.go" third_party/cometbft/state/ynx_authority.go
          trap - EXIT
          cat "$YNX_CHECKPOINT_CASE/original-red.log"
          test "$YNX_CHECKPOINT_RED_STATUS" -ne 0
          grep -F 'real P params lost during Commit gap: application authority differs' "$YNX_CHECKPOINT_CASE/original-red.log"
          go test -p 1 -count=1 -timeout=90s -run '^TestPQEngineCheckpointReadSurvivesApplicationCommitBeforeStoreSave$' ./internal/consensus
      - name: Verify bounded remote signer transport and unchanged legacy protobuf vectors
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=90s -run '^(TestYNXRemote.*|TestPrivvalVectors)$' github.com/cometbft/cometbft/privval
      - name: Verify actual engine signing caller uses committed height key and round context
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=90s -run '^(TestYNXActualSignVoteConsumesHeightKeyAndRoundContext|TestYNXActualRemoteCallerPassesCheckpointBeforeHeightKeyAndSign)$' github.com/cometbft/cometbft/consensus
      - name: Measure fresh single and bounded concurrent dual signature paths
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          if git diff --quiet 66d29db440c7e3864ec855734f77bf5a0ae65ee2 HEAD -- internal/ynxbatch; then
            echo 'Reuse exact unchanged provider measurements from successful run 39098054802 (22 combined benchmark rows retained in CI_RUN18 evidence).'
          else
            go test -p 1 ./internal/ynxbatch -run '^$' -bench '^BenchmarkParallelProvider(FreshN1Sign|FreshN1Verify|Concurrent)$' -benchtime=10x -count=1 -timeout=90s
          fi
      - name: Measure actual policy certificate cache consumer cold and warm paths
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          if git diff --quiet 8d5080e6caacdcd069ef205978e9b67e760c0a55 HEAD -- internal/chain internal/ynxauth internal/ynxbatch; then
            echo 'Unchanged certificate consumer source: reuse the six actual CI19 rows in docs/protocol/evidence/CI_RUN19_39099736825.json.'
          else
            go test -p 1 ./internal/chain -run '^$' -bench '^BenchmarkPQCertificateConsumer$' -benchtime=10x -count=1 -timeout=90s
          fi
      - name: Install pinned contract build runtime
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Verify failed candidate deployment preserves services and signing history
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: node --test scripts/deploy/consensus-candidate-failure-retention.test.mjs
      - name: Compile frozen measured production overlay without executing cases
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        env:
          GOMAXPROCS: '1'
          GOGC: '50'
          GOMEMLIMIT: '512MiB'
        run: |
          YNX_OVERLAY_COMPILE_CASE="$RUNNER_TEMP/ynx-pq-overlay-compile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/loadtest/prepare-pq-paired-benchmark.mjs --source-root "$GITHUB_WORKSPACE" --commit '${{ github.sha }}' --output-dir "$YNX_OVERLAY_COMPILE_CASE" --n 16 --trial 1 --write
          go test -overlay "$YNX_OVERLAY_COMPILE_CASE/overlay.json" -p 1 ./internal/chain -run '^$' -count=1 -timeout=90s
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Generate canonical IDE contract fixture
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 3
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run hardhat:build -- contracts/devtools/SampleEVMWriteCounter.sol contracts/tokens/SampleYNXTCompatibleERC20.sol
          npm run contracts:selectors
          git diff --exit-code -- artifacts
          test -s artifacts/contracts/devtools/SampleEVMWriteCounter.sol/SampleEVMWriteCounter.json
          test -s artifacts/contracts/tokens/SampleYNXTCompatibleERC20.sol/SampleYNXTCompatibleERC20.json
          sha256sum contracts/devtools/SampleEVMWriteCounter.sol artifacts/contracts/devtools/SampleEVMWriteCounter.sol/SampleEVMWriteCounter.json artifacts/ynx-selector-metadata.json
          sha256sum contracts/tokens/SampleYNXTCompatibleERC20.sol artifacts/contracts/tokens/SampleYNXTCompatibleERC20.sol/SampleYNXTCompatibleERC20.json
      - name: Verify native ledger and HTTP PQ integration
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=180s ./internal/chain ./internal/api
      - name: Compile production entry points
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          go test -p 1 -count=1 -timeout=90s -run '^$' ./cmd/ynx-chaind ./internal/consensus
          go test -p 1 -count=1 -timeout=90s ./cmd/ynx-abci ./cmd/ynx-comet ./cmd/ynx-consensus-pq-key-init ./cmd/ynx-consensus-pq-remote-signer
          go test -p 1 -count=1 -timeout=90s -run '^(TestExportConsensusState|TestRunNodeConsensusExport|TestConsensusExport)' ./cmd/ynx-chaind
          go test -p 1 -count=1 -timeout=90s ./cmd/ynx-consensus-package
      - name: Verify complete state bridge and sponsor continuity
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          go test -p 1 -count=1 -timeout=180s -run '^(TestConsensusMigration|TestConsensusSponsor)' ./internal/chain
          YNX_PQ_NETWORK_E2E='' go test -p 1 -count=1 -timeout=180s ./internal/consensus
      - name: Reproduce historical AA policy counterexamples against the original state validator
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          YNX_AA_FIXED_STATE="$RUNNER_TEMP/ynx-aa-fixed-state.go"
          YNX_AA_OLD_LOG="$RUNNER_TEMP/ynx-aa-original-state-red.log"
          cp internal/consensus/state.go "$YNX_AA_FIXED_STATE"
          trap 'cp "$YNX_AA_FIXED_STATE" internal/consensus/state.go' EXIT
          git show af1cbaf94313e628e212aabad60d05d85c2aa3fc:internal/consensus/state.go > internal/consensus/state.go
          set +e
          go test -p 1 -count=1 -timeout=90s -v -run '^TestAACommittedHistory' ./internal/consensus > "$YNX_AA_OLD_LOG" 2>&1
          YNX_AA_OLD_CODE=$?
          set -e
          cat "$YNX_AA_OLD_LOG"
          cp "$YNX_AA_FIXED_STATE" internal/consensus/state.go
          trap - EXIT
          test "$YNX_AA_OLD_CODE" -ne 0
          test "$(grep -c 'rechecksummed AA history bypassed the original-height authority rule' "$YNX_AA_OLD_LOG")" -eq 3
          grep -F 'AA history accepted an execution beyond the actual committed checkpoint' "$YNX_AA_OLD_LOG"
          go test -p 1 -count=1 -timeout=90s -v -run '^TestAACommittedHistory' ./internal/consensus
      - name: Verify Whole BFT gateway and native container readback
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=180s ./internal/bftgateway ./cmd/ynx-bft-gatewayd
      - name: Verify existing Chain readback and recovery after protocol integration
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && github.ref == 'refs/heads/codex/ynx-pq-perf-integration' }}
        run: go test -p 1 -count=1 -timeout=180s ./internal/mutationfreeze ./internal/indexer ./internal/explorer ./internal/faucet ./cmd/ynx-indexerd
      - name: Verify existing Chain SDK after protocol integration
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && github.ref == 'refs/heads/codex/ynx-pq-perf-integration' }}
        run: node --test sdk/js/index.test.mjs
      - name: Emit application-backed public Wallet HTTP fixture
        id: walletfixture
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        env:
          YNX_PQ_WALLET_FIXTURE_OUT: ${{ runner.temp }}/ynx-pq-wallet-public-http-fixture.json
        run: |
          go test -p 1 -count=1 -timeout=90s -run '^TestGatewayPQWalletPublicHTTPFixture$' ./internal/bftgateway
          test -s "$YNX_PQ_WALLET_FIXTURE_OUT"
          sha256sum "$YNX_PQ_WALLET_FIXTURE_OUT"
      - name: Upload only public Wallet HTTP fixture
        if: ${{ !cancelled() && steps.walletfixture.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-wallet-public-http-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-pq-wallet-public-http-fixture.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify shared Wallet policy and Chain payment authorization regressions
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: go test -p 1 -count=1 -timeout=90s -run '^(TestClassicSession.*|TestAccountPolicyConfigRequiresExplicitExactOriginAndNetwork|TestBFTPaySerializesNonceAndReturnsZeroFeeIdempotentReplay|TestBFTPayRejectsInconsistentCommittedResponse|TestMerchantBindingRejectsForeignIntentAndInvoiceWithoutEffects|TestMerchantBindingRejectsMissingUntrustedOrUnavailableOriginal)$' ./internal/appgateway ./internal/paygateway
      - name: Reproduce private verifier process-exit telemetry counterexample
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          YNX_EXIT_CASE="$RUNNER_TEMP/ynx-pq-private-exit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir "$YNX_EXIT_CASE"
          cp scripts/ops/validate-private-consensus-copy.py "$YNX_EXIT_CASE/fixed-wrapper.py"
          trap 'cp "$YNX_EXIT_CASE/fixed-wrapper.py" scripts/ops/validate-private-consensus-copy.py' EXIT
          git show 30230a9ab1f691e30fb590d89cb465bf5c1e1a30:scripts/ops/validate-private-consensus-copy.py > "$YNX_EXIT_CASE/original-wrapper.py"
          cp "$YNX_EXIT_CASE/original-wrapper.py" scripts/ops/validate-private-consensus-copy.py
          set +e
          (cd scripts/ops && python3 -B -m unittest test_validate_private_consensus_copy.PrivateCopyControls.test_exit_mm_race_requires_final_same_identity_zombie -v) > "$YNX_EXIT_CASE/original-red.log" 2>&1
          YNX_EXIT_RED_STATUS=$?
          set -e
          cp "$YNX_EXIT_CASE/fixed-wrapper.py" scripts/ops/validate-private-consensus-copy.py
          trap - EXIT
          cat "$YNX_EXIT_CASE/original-red.log"
          test "$YNX_EXIT_RED_STATUS" -ne 0
          grep -F 'PRIVATE_COPY_EXIT_MM_TRANSITION_REJECTED' "$YNX_EXIT_CASE/original-red.log"
      - name: Verify Linux window controls without starting a node
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          python3 -B scripts/loadtest/test_pq_paired_linux_window.py
          python3 -B scripts/loadtest/test_pq_network_file_sizes.py
          python3 -B -m unittest discover -s scripts/ops -p 'test_validate_private_consensus_copy.py' -v
      - name: Run the authorized bounded four-validator transition
        id: pqnetwork
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.consensus_e2e && inputs.candidate_sha == github.sha && !inputs.paired_n1 }}
        timeout-minutes: 3
        run: |
          YNX_E2E_CASE="$RUNNER_TEMP/ynx-pq-network-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          YNX_E2E_BUILD="$YNX_E2E_CASE.build"
          export YNX_E2E_CASE YNX_E2E_BUILD
          umask 077
          mkdir "$YNX_E2E_CASE" "$YNX_E2E_BUILD"
          go test -p 1 -c -o "$YNX_E2E_BUILD/consensus.test" ./internal/consensus
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          case = Path(os.environ['YNX_E2E_CASE']).resolve()
          binary = Path(os.environ['YNX_E2E_BUILD']).resolve() / 'consensus.test'
          leaf = 'internal/consensus/pq_network_e2e_test.go'
          def digest(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(65536), b''):
                      h.update(chunk)
              return h.hexdigest()
          plan = dict(profile='consensus-e2e', sourceRoot=str(source),
              commit=os.environ['GITHUB_SHA'], executionAuthorized=False,
              workingDirectory=str(source / 'internal/consensus'),
              command=[str(binary), '-test.run=^TestPQNetworkFourValidatorOriginalStateTransitionAndRestart$',
                  '-test.count=1', '-test.timeout=120s', '-test.v'],
              environment=dict(GOMAXPROCS='2', GOGC='50', GOMEMLIMIT='1536MiB',
                  YNX_PQ_NETWORK_E2E='authorized-four-node-window'),
              sourcePins={leaf: dict(sha256=digest(source / leaf))},
              binaryPin=dict(path=str(binary), sha256=digest(binary)))
          with open(case / 'prepared.json', 'x', encoding='utf8') as f:
              json.dump(plan, f, separators=(',', ':'))
              f.write('\n')
          PY
          python3 -B scripts/loadtest/pq-paired-linux-window.py --consensus-e2e --prepared "$YNX_E2E_CASE/prepared.json" --receipt "$YNX_E2E_CASE.receipt.json" --execute
      - name: Record public retained network-file size metadata after owned cleanup
        if: ${{ always() && (steps.pqnetwork.outcome == 'success' || steps.pqnetwork.outcome == 'failure') }}
        run: |
          set -eu
          umask 077
          YNX_E2E_CASE="$RUNNER_TEMP/ynx-pq-network-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          jq -e '.cleanupComplete == true' "$YNX_E2E_CASE.receipt.json" >/dev/null
          set -o noclobber
          python3 -B scripts/loadtest/pq-network-file-sizes.py \
            --ephemeral-parent "$RUNNER_TEMP" \
            --case "$YNX_E2E_CASE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            > "$YNX_E2E_CASE.file-sizes.json"
      - name: Preserve only public network-test logs and guard receipt
        if: ${{ always() && (steps.pqnetwork.outcome == 'success' || steps.pqnetwork.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-network-e2e-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ynx-pq-network-${{ github.run_id }}-${{ github.run_attempt }}.receipt.json
            ${{ runner.temp }}/ynx-pq-network-${{ github.run_id }}-${{ github.run_attempt }}/prepared.json
            ${{ runner.temp }}/ynx-pq-network-${{ github.run_id }}-${{ github.run_attempt }}/go.stdout.log
            ${{ runner.temp }}/ynx-pq-network-${{ github.run_id }}-${{ github.run_attempt }}/go.stderr.log
            ${{ runner.temp }}/ynx-pq-network-${{ github.run_id }}-${{ github.run_attempt }}.file-sizes.json
          if-no-files-found: warn
          retention-days: 7
      # The external client was independently fixed and all 13 functions passed
      # at aa25500; see PERF_SEGMENTED_CLIENT_AA255_NORMAL09_ACTUAL_R1.json.
      # The repaired source is also pinned below for the integration run.
      - name: Checkout fixed repaired performance client
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aa25500bdb13c52e56133ec0876651257cf31a1a
          path: qa-owned-performance-client
          persist-credentials: false
      - name: Verify fixed segmented client integration with original assertions
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: qa-owned-performance-client
        timeout-minutes: 3
        env:
          GOMAXPROCS: '1'
          GOGC: '50'
          GOMEMLIMIT: '384MiB'
        run: |
          test "$(git rev-parse HEAD)" = 'aa25500bdb13c52e56133ec0876651257cf31a1a'
          test "$(git rev-parse HEAD:cmd/ynx-consensus-perf-client)" = '1614f4ad2bc419612f3aba5bde492ad24a9920b6'
          test "$(git rev-parse HEAD:go.mod)" = 'b9d7b1000986dad89c87ca0a1e1758636b5f6cdc'
          test "$(git rev-parse HEAD:go.sum)" = '4d4aa4b7ef8b33d85552eb5dc2f862efd268d4b2'
          go test -p 1 -count=1 -timeout=90s -v -run '^(TestReadyIntentSegmentsPersistAndStreamExactSignedInputs|TestReadyIntentSegmentsNeverRetryFailedOrUncertainPersistence|TestReadyIntentSegmentsRejectMissingCorruptAndWrongBinding|TestReadySenderSegmentedIntentBarrierAndRecovery|TestReadySenderSegmentedIntentFailureNeverSubmits|TestReadyIntentFormatSelectionRejectsMixedMissingAndEscapedReceipts|TestSegmentedIntentOptionsRequireBoundedEvidenceMode|TestReadySenderFastAccountAdvancesBeforeSlowPeer|TestReadySenderReadbackBindsFixtureAndRecoversOnlyCompleteIdentities|TestReadyIntentPrefixRetainsOnlyWholeValidatedWaves|TestReadyIntentPrefixWithoutReportNeverPromotesUnknownToAcknowledged|TestReadyIntentSharedSegmentDecoderRejectsWrongPrefix|TestReadyIntentPartialSelectionRequiresPlanAndNeverDowngradesAcknowledgedCorruption)$' ./cmd/ynx-consensus-perf-client
      - name: Emit public inverse interop fixture
        id: interop
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        env:
          YNX_BATCH_INTEROP_OUT: /tmp/ynx-go-public-interop.json
        run: |
          go test -p 1 -count=1 -timeout=90s -run '^TestRealSigner$' ./internal/ynxbatch
          test -s "$YNX_BATCH_INTEROP_OUT"
          sha256sum "$YNX_BATCH_INTEROP_OUT"
      - name: Upload public signature fixture
        if: ${{ !cancelled() && steps.interop.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-public-go-interop-${{ github.sha }}
          path: /tmp/ynx-go-public-interop.json
          if-no-files-found: error
          retention-days: 7
      - name: Build fixed-source offline migration validation tools
        if: ${{ success() && github.event_name == 'push' }}
        run: |
          YNX_OFFLINE_TOOLS="$RUNNER_TEMP/ynx-pq-offline-migration-tools"
          export YNX_OFFLINE_TOOLS
          umask 077
          mkdir "$YNX_OFFLINE_TOOLS"
          go build -p 1 -trimpath -ldflags "-s -w -X main.buildCommit=$GITHUB_SHA -X main.buildRelease=pq-offline-validation" -o "$YNX_OFFLINE_TOOLS/ynx-chaind" ./cmd/ynx-chaind
          go build -p 1 -trimpath -ldflags '-s -w' -o "$YNX_OFFLINE_TOOLS/ynx-consensus-package" ./cmd/ynx-consensus-package
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['YNX_OFFLINE_TOOLS'])
          binaries = {}
          for name in ('ynx-chaind', 'ynx-consensus-package'):
              path = root / name
              with path.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              binaries[name] = dict(bytes=path.stat().st_size, sha256=digest)
          record = dict(version='YNX-PQ-OFFLINE-MIGRATION-TOOLS/v1', commit=os.environ['GITHUB_SHA'],
              runId=os.environ['GITHUB_RUN_ID'], platform='linux/amd64', binaries=binaries,
              purpose='offline copied-state validation; not installed or activated')
          (root / 'SOURCE.json').write_text(json.dumps(record, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf8')
          PY
      - name: Upload public offline migration validation tools
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-offline-migration-tools-${{ github.sha }}
          path: ${{ runner.temp }}/ynx-pq-offline-migration-tools
          if-no-files-found: error
          retention-days: 7

  pq-paired-n1:
    needs: focused-go
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ynx-pq-public-upgrade' && inputs.candidate_sha == github.sha && inputs.paired_n1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOMAXPROCS: '1'
      GOGC: '50'
      GOMEMLIMIT: '512MiB'
      CGO_ENABLED: '0'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact paired candidate with baseline ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Set private case paths
        run: |
          printf '%s\n' "YNX_PAIR_CI_CASE=$RUNNER_TEMP/ynx-pq-pair-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "YNX_PAIR_CI_RECEIPT=$RUNNER_TEMP/ynx-pq-pair-guard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
      - name: Verify bounded preparation and Linux process ownership controls
        run: |
          node --test scripts/loadtest/pq-paired-recipe.test.mjs
          python3 scripts/loadtest/test_pq_paired_linux_window.py
          test "$(git rev-parse HEAD)" = '${{ inputs.candidate_sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Prepare one exact-source N1 trial1 overlay
        run: |
          node scripts/loadtest/prepare-pq-paired-benchmark.mjs --source-root "$GITHUB_WORKSPACE" --commit '${{ inputs.candidate_sha }}' --output-dir "$YNX_PAIR_CI_CASE" --n 1 --trial 1 --write
      - name: Execute single guarded PQ component pair
        id: performance
        timeout-minutes: 3
        run: |
          python3 scripts/loadtest/pq-paired-linux-window.py --prepared "$YNX_PAIR_CI_CASE/prepared.json" --receipt "$YNX_PAIR_CI_RECEIPT" --execute
      - name: Upload QA measurement and guard receipt
        if: ${{ always() && steps.performance.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynx-pq-paired-n1-trial1-${{ github.sha }}
          path: |
            ${{ env.YNX_PAIR_CI_CASE }}/pq-paired-result.json
            ${{ env.YNX_PAIR_CI_RECEIPT }}
            ${{ env.YNX_PAIR_CI_CASE }}/go.stdout.log
            ${{ env.YNX_PAIR_CI_CASE }}/go.stderr.log
          if-no-files-found: warn
          retention-days: 7
