name: Social Device C13 actual Auth PUBLIC boundary
on:
  push:
    branches: [codex/wallet-auth49-social-device-c13-ci-20261108]
  pull_request:
    paths:
      - packages/wallet-auth/test/fixtures/social-device-c13-matching-profile/**
      - scripts/ci/social-device-c13-boundary*
      - .github/workflows/social-device-c13-boundary.yml
  workflow_dispatch:
jobs:
  new-device-c13-public-only:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/wallet-auth49-social-device-c13-ci-20261108'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/social-device-c13-boundary.mjs 2>&1 | tee social-device-c13-boundary.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: social-device-c13-public-boundary
          path: |
            social-device-c13-boundary.log
            ${{ runner.temp }}/social-device-c13-boundary-*/**/*.json
            ${{ runner.temp }}/social-device-c13-boundary-*/**/*.stdout
            ${{ runner.temp }}/social-device-c13-boundary-*/**/*.stderr
