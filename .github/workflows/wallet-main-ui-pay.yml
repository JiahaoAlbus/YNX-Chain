name: Wallet Main UI and Pay

on:
  pull_request:
    paths:
      - apps/wallet-desktop/src/**
      - apps/wallet-desktop/test/**
      - .github/workflows/wallet-main-ui-pay.yml
  push:
    branches:
      - codex/wallet-main-*
      - codex/wallet-control-matched-main-*
    paths:
      - apps/wallet-desktop/src/**
      - apps/wallet-desktop/test/**
      - .github/workflows/wallet-main-ui-pay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallet-main-ui-pay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-ui-pay-controls:
    name: Main UI and Pay controls (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/wallet-desktop
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      # Bounded local JS/Node controls: signing-only dynamic SDK imports are not
      # entered. No dependency install, Native compile, Electron, profiles, keys,
      # network writes, signing or publication is part of this job.
      - name: Pay, navigation, shutdown and locale controls
        run: |
          node --version
          node --test test/native-pay-broadcast-ui.test.mjs test/native-pay-product-ui.test.mjs test/main-standalone-pay-navigation.test.mjs test/wallet-main-shutdown-sync-failure.test.mjs test/wallet-locale.test.mjs test/empty-account-guidance-mounted.test.mjs test/wallet-pq-account-initial-ui.test.mjs test/wallet-pq-key-ui.test.mjs test/qa-profile-selection.test.mjs
      - name: Normal mounted resolver heading locale control
        run: node --test --test-name-pattern 'resolver page title uses normal locale' test/approved-desktop-ui.test.mjs
      - name: Same original approved public policy custody controls
        run: node --test --test-name-pattern 'approved public' test/original-device-registration-controller.test.mjs
      - name: Normal Pay late-review custody through Main startup and close
        run: node --test test/wallet-native-pay-late-review-close.test.mjs test/wallet-native-pay-product.test.mjs test/wallet-native-pay-product-startup.test.mjs
      - name: Asset refresh and invoice locale controls
        run: node --test test/asset-refresh-race.test.mjs test/invoice-reference-locale.test.mjs
      - name: Native amount input controls
        run: node --test test/transfer-view-owner.test.mjs test/transfer-preparation-error-ui.test.mjs
      # Ethers and its locked dependencies are already tracked in this normal
      # source image and materialized by checkout. No install or scripts run.
      - name: Original source proof readback and Main canonical identity controls
        run: node --test --test-name-pattern 'canonical .*recovery|canonical reader|source proof|late source proof loss|desktop canonical transaction identity|cold cached mint proof|reader attestation completion' test/cross-chain.test.mjs
      - name: Cross-chain original terminal observation and timeout controls
        run: node --test --test-name-pattern 'original (Main terminal|terminal|) ?observation|terminal recovery from|confirm times out|timed-out start' src/features/cross-chain/cctp-flow.test.mjs src/features/cross-chain/cctp-reconcile-delta.test.mjs src/features/cross-chain/cctp-ui-wait.test.mjs
      - name: PQ operator trust, original query, and submission controls
        run: node --test test/operator-deployment-identity.test.mjs test/original-policy-raw-bytes.test.mjs test/original-policy-binding.test.mjs test/operator-query-http-observation.test.mjs src/features/pq-transaction/node-transport.test.mjs src/features/pq-transaction/node-finality-transport.test.mjs src/features/pq-transaction/typed-action-query-node.test.mjs src/features/pq-transaction/submission-adversarial.test.mjs
      - name: Pay original order binding through the normal client
        run: node --test test/wallet-native-pay-original-order.test.mjs
      - name: First DEVICE account approval and existing pair/completion boundaries
        run: |
          node --test test/wallet-device-first-account-approval.test.mjs test/wallet-device-registration-ui.test.mjs
          node --test --test-name-pattern "normal original account approval keeps|cold completion opens a fresh matching Source phase" test/original-device-registration-controller.test.mjs
