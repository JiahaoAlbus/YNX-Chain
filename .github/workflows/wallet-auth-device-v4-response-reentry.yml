name: Device V4 response reentry delta
on:
  workflow_dispatch:
  push:
    branches: [codex/wallet-auth49-device-v4-response-reentry-20261107]
  pull_request:
    paths:
      - packages/wallet-auth/src/original-product-device-v4-management-client.js
      - packages/wallet-auth/test/device-v4-management-response-reentry.test.mjs
      - packages/wallet-auth/scripts/ci/device-v4-management-response-reentry.mjs
permissions:
  contents: read
jobs:
  response-reentry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - run: node packages/wallet-auth/scripts/ci/device-v4-management-response-reentry.mjs
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: device-v4-response-reentry-data
          if-no-files-found: error
          path: |
            DEVICE_V4_RESPONSE_REENTRY_DATA
            canonical-common-source-package
