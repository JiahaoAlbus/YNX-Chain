name: wallet-ios

on:
  workflow_dispatch:
  push:
    branches: [main, codex/ecosystem-wallet-auth, codex/final-wallet-auth]
    paths: ["apps/wallet/**", "packages/wallet-auth/**", ".github/workflows/wallet-ios.yml"]
  pull_request:
    paths: ["apps/wallet/**", "packages/wallet-auth/**", ".github/workflows/wallet-ios.yml"]

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/wallet-auth/package-lock.json
            apps/wallet/package-lock.json
      - name: Verify immutable GitHub Actions pins
        run: node scripts/verify/github-actions-pins-check.mjs wallet-ios.yml
      - name: Use the release-locked npm
        run: npm install --global npm@11.5.1
      - run: npm ci
        working-directory: packages/wallet-auth
      - run: npm test
        working-directory: packages/wallet-auth
      - run: npm ci
        working-directory: apps/wallet
      - run: npm run check
        working-directory: apps/wallet
      - run: npx pod-install ios
        working-directory: apps/wallet
      - name: Build locally signed iOS Simulator app
        working-directory: apps/wallet
        run: >-
          xcodebuild -workspace ios/YNXWallet.xcworkspace -scheme YNXWallet
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- clean build
      - name: Verify installed Wallet onboarding and invalid deep link
        timeout-minutes: 20
        working-directory: apps/wallet
        run: |
          set -euo pipefail
          APP="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphonesimulator/YNXWallet.app' -print -quit)"
          test -n "$APP"
          mkdir -p proof/ci-ios
          codesign --verify --strict "$APP"
          codesign -d --entitlements - "$APP" > proof/ci-ios/simulator-entitlements.plist
          TEMPLATE="$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const d=JSON.parse(s).devices;for(const [runtime,items] of Object.entries(d)){const item=items.find(x=>x.isAvailable&&x.name.startsWith("iPhone"));if(item){console.log(`${item.deviceTypeIdentifier}\t${runtime}`);return}}process.exit(1)})')"
          IFS=$'\t' read -r DEVICE_TYPE RUNTIME <<< "$TEMPLATE"
          DEVICE="$(xcrun simctl create "YNX Wallet CI ${GITHUB_RUN_ID}" "$DEVICE_TYPE" "$RUNTIME")"
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              xcrun simctl io "$DEVICE" screenshot proof/ci-ios/installed-ui-failure.png || true
              xcrun simctl spawn "$DEVICE" log show --last 8m --style compact --predicate 'process == "YNXWallet" OR process == "SpringBoard"' > proof/ci-ios/wallet-springboard.log || true
            fi
            xcrun simctl shutdown "$DEVICE" || true
            xcrun simctl delete "$DEVICE" || true
            exit "$result"
          }
          trap cleanup EXIT
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl get_app_container "$DEVICE" com.ynxweb4.wallet app > proof/ci-ios/app-container.txt
          xcodebuild -project qa/ios/YNXWalletInstalledQA.xcodeproj -scheme YNXWalletInstalledQA \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/ynx-wallet-installed-ui-derived" \
            -resultBundlePath proof/ci-ios/InstalledUI.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
          xcrun xcresulttool export attachments --path proof/ci-ios/InstalledUI.xcresult --output-path proof/ci-ios/attachments
          test -n "$(find proof/ci-ios/attachments -name '*.png' -print -quit)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ynx-wallet-ios-simulator
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphonesimulator/YNXWallet.app
            apps/wallet/proof/ci-ios
          if-no-files-found: error
