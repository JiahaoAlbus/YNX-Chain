name: Wallet Web repaired v11 lifecycle hosted browser preflight P0

on:
  push:
    branches:
      - codex/wallet-web-pwa-extensions-20260813
    paths:
      - .github/workflows/wallet-web-public-preflight-p0.yml

permissions:
  contents: read

jobs:
  preflight:
    if: "github.event.head_commit.message == 'evidence(wallet-web): preflight stable v11 second launch p0189'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Create isolated evidence carrier
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wallet-web-p0189-evidence"
          test ! -e "$out"
          mkdir -p "$out/resources" "$out/browser"

      - name: Fetch and verify four immutable resources
        shell: bash
        run: |
          set -euo pipefail
          base='https://wallet-3re0s0lx4-jiahaoalbus-projects.vercel.app'
          out="$RUNNER_TEMP/wallet-web-p0189-evidence/resources"
          fetch() {
            name="$1"
            uri="$2"
            expected_bytes="$3"
            expected_sha="$4"
            http_code="$(curl --proto '=https' --tlsv1.2 --silent --show-error --max-time 20 --connect-timeout 8 --max-redirs 0 --dump-header "$out/${name}.headers" --output "$out/${name}.body" --write-out '%{http_code}' "${base}${uri}")"
            printf '%s\n' "$http_code" > "$out/${name}.status"
            wc -c < "$out/${name}.body" | tr -d ' ' > "$out/${name}.bytes"
            sha256sum "$out/${name}.body" | awk '{print $1}' > "$out/${name}.sha256"
            test "$http_code" = 200
            test "$(cat "$out/${name}.bytes")" = "$expected_bytes"
            test "$(cat "$out/${name}.sha256")" = "$expected_sha"
          }
          fetch root '/' 821 2df10866a35b074a6fb366439197646dd4e979bc83bdae3aba0ba6db3802986c
          fetch build-identity '/build-identity.json' 267 caf151b49ea9c8ae55ca070aa05b2fda90ab2e7f5f6cb73dd4b9bc3c59ee1377
          fetch manifest '/manifest.webmanifest' 632 d2d131267483327ece949c5b8402c2dd80352bb15e791ea5571c879682ceba92
          fetch sw '/sw.js' 4862 cf8a043c2159842ce4c63213477a4f62e931fb1ca08061d6fb92b833a48af1d3
          node -e "const fs=require('fs');const value=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/wallet-web-p0189-evidence/resources/build-identity.body','utf8'));if(value.sourceCommit!=='7df37ca32a643a403bd23a7f555354261f789441')process.exit(1)"
          awk 'BEGIN{IGNORECASE=1;ok=0} /^cache-control:/ && /no-store/{ok=1} END{exit ok?0:1}' "$out/build-identity.headers"
          awk 'BEGIN{IGNORECASE=1;ok=0} /^cache-control:/ && /no-store/{ok=1} END{exit ok?0:1}' "$out/sw.headers"

      - name: Install browser harness dependencies
        run: npm ci --ignore-scripts --prefix apps/wallet-web

      - name: Prove v8 to v11 persistent-profile recovery in hosted Chrome
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/p0189-browser-probe.mjs" <<'NODE'
          import { createRequire } from "node:module";
          import { readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const require = createRequire(join(process.env.GITHUB_WORKSPACE, "apps/wallet-web/package.json"));
          const { chromium } = require("playwright");
          const base = "https://wallet-3re0s0lx4-jiahaoalbus-projects.vercel.app/";
          const profile = join(process.env.RUNNER_TEMP, "p0189-chrome-profile");
          const evidence = join(process.env.RUNNER_TEMP, "wallet-web-p0189-evidence", "browser");
          const executablePath = "/usr/bin/google-chrome";
          const result = { schemaVersion: 2, candidate: base, sourceCommit: "7df37ca32a643a403bd23a7f555354261f789441", persistentProfile: true, executablePath, expectedCacheVersion: "ynx-wallet-web-v11", legacyCacheVersion: "ynx-wallet-web-v8", installedProvider: false, accountAuthorized: false, signingOrTransaction: false, passed: false };
          const bounded = (promise, ms, label) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timed out after ${ms}ms`)), ms))]);
          const waitForWalletReady = page => page.waitForFunction(async expectedSource => {
            const app = document.querySelector("main#app");
            const shell = app?.querySelector(":scope > .shell");
            const heading = shell?.querySelector('section[aria-labelledby="title"] > h1#title');
            const status = shell?.querySelector('[role="status"][aria-live="polite"]');
            const chooser = shell?.querySelector("#wallet-chooser");
            const download = shell?.querySelector("#download[href]");
            const metamask = shell?.querySelector("#metamask[href]");
            const identity = await fetch("./build-identity.json", { cache: "no-store" }).then(response => response.ok ? response.json() : null).catch(() => null);
            const keys = await caches.keys();
            const controllerVersion = await new Promise(resolve => {
              const controller = navigator.serviceWorker.controller;
              if (!controller) return resolve(null);
              const channel = new MessageChannel();
              const timer = setTimeout(() => resolve(null), 1000);
              channel.port1.onmessage = event => { clearTimeout(timer); resolve(event.data?.cache || null); };
              controller.postMessage({ type: "YNX_WALLET_PWA_VERSION" }, [channel.port2]);
            });
            const text = document.body?.innerText || "";
            return Boolean(shell && heading && status && chooser && download && metamask) && document.documentElement.lang === "en" && document.documentElement.dataset.pwa === "ready" && document.title === "YNX Wallet — Testnet companion" && identity?.sourceCommit === expectedSource && controllerVersion === "ynx-wallet-web-v11" && keys.length === 1 && keys[0] === "ynx-wallet-web-v11" && !/PWA shell integrity verification failed|PWA shell 完整性验证失败/i.test(text);
          }, result.sourceCommit, { timeout: 20000 });
          const snapshot = page => page.evaluate(async () => {
            const buildIdentity = await fetch("./build-identity.json", { cache: "no-store" }).then(response => response.json());
            return ({
            documentId: globalThis.__ynxWalletReadinessDocumentId ||= crypto.randomUUID(),
            url: location.href,
            title: document.title,
            text: document.body.innerText,
            html: document.documentElement.outerHTML,
            pwaState: document.documentElement.dataset.pwa || null,
            recoveryMarker: new URL(location.href).searchParams.has("ynx-sw-upgrade"),
            controller: navigator.serviceWorker.controller?.scriptURL || null,
            cacheNames: await caches.keys(),
            registrations: (await navigator.serviceWorker.getRegistrations()).map(value => ({ scope: value.scope, installing: value.installing?.state || null, waiting: value.waiting?.state || null, active: value.active?.state || null, activeScript: value.active?.scriptURL || null })),
            controlledVersion: await new Promise(resolve => {
              const controller = navigator.serviceWorker.controller;
              if (!controller) return resolve(null);
              const channel = new MessageChannel();
              const timer = setTimeout(() => resolve(null), 1000);
              channel.port1.onmessage = event => { clearTimeout(timer); resolve(event.data?.cache || null); };
              controller.postMessage({ type: "YNX_WALLET_PWA_VERSION" }, [channel.port2]);
            }),
            buildIdentity
          }); });
          const verifyV11Integrity = page => page.evaluate(async () => {
            const { ASSET_INTEGRITY } = await import("./asset-integrity.js");
            const cache = await caches.open("ynx-wallet-web-v11");
            const rows = [];
            for (const [key, expected] of Object.entries(ASSET_INTEGRITY)) {
              const response = await cache.match(key);
              if (!response) { rows.push({ key, expected, actual: null, match: false }); continue; }
              const digest = await crypto.subtle.digest("SHA-256", await response.arrayBuffer());
              const actual = [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, "0")).join("");
              rows.push({ key, expected, actual, match: actual === expected });
            }
            return { ready: rows.length === Object.keys(ASSET_INTEGRITY).length && rows.every(row => row.match), rows };
          });
          const observeConvergence = async page => {
            const deadline = Date.now() + 22000;
            const timeline = [];
            let sawV8 = true;
            let firstV8Removal = null;
            while (Date.now() < deadline) {
              try {
                const value = await snapshot(page);
                timeline.push({ at: new Date().toISOString(), url: value.url, pwaState: value.pwaState, cacheNames: value.cacheNames, controlledVersion: value.controlledVersion, registrations: value.registrations });
                if (value.cacheNames.includes("ynx-wallet-web-v8")) sawV8 = true;
                if (sawV8 && !value.cacheNames.includes("ynx-wallet-web-v8") && !firstV8Removal) firstV8Removal = { at: new Date().toISOString(), state: value, integrity: await verifyV11Integrity(page) };
                if (value.pwaState === "ready" && value.controlledVersion === "ynx-wallet-web-v11" && value.cacheNames.length === 1 && value.cacheNames[0] === "ynx-wallet-web-v11") return { timeline, firstV8Removal, final: value };
              } catch (error) {
                timeline.push({ at: new Date().toISOString(), transientNavigationError: String(error) });
              }
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            throw new Error(`v11 lifecycle convergence timed out; timeline=${JSON.stringify(timeline.slice(-10))}`);
          };
          const normal = value => value.url === base && value.title === "YNX Wallet — Testnet companion" && value.pwaState === "ready" && !value.recoveryMarker && Boolean(value.controller) && value.controlledVersion === "ynx-wallet-web-v11" && value.cacheNames.length === 1 && value.cacheNames[0] === "ynx-wallet-web-v11" && value.registrations.length === 1 && value.registrations[0].active === "activated" && value.buildIdentity?.sourceCommit === result.sourceCommit && !/PWA shell integrity verification failed|PWA shell 完整性验证失败/i.test(value.text);
          const stableWindow = (samples, stableMilliseconds) => {
            let candidate = null;
            for (const sample of samples) {
              if (!sample.ready) { candidate = null; continue; }
              if (!candidate || candidate.documentId !== sample.documentId) candidate = { documentId: sample.documentId, since: sample.atMs };
              if (sample.atMs - candidate.since >= stableMilliseconds) return sample;
            }
            return null;
          };
          const stableFixtures = (() => {
            const positive = stableWindow([{atMs:0,documentId:"a",ready:true},{atMs:800,documentId:"a",ready:true},{atMs:1600,documentId:"a",ready:true}],1500);
            const navigationReset = stableWindow([{atMs:0,documentId:"a",ready:true},{atMs:800,documentId:"b",ready:true},{atMs:1600,documentId:"b",ready:true}],1500);
            const readinessReset = stableWindow([{atMs:0,documentId:"a",ready:true},{atMs:800,documentId:"a",ready:false},{atMs:2400,documentId:"a",ready:true}],1500);
            if (!positive || navigationReset || readinessReset) throw new Error("navigation-aware stability fixtures failed");
            return { positive: true, navigationReset: true, readinessReset: true };
          })();
          result.stabilityFixtures = stableFixtures;
          const waitForStableDocument = async (page, { timeout = 25000, stableMilliseconds = 1500, label = "stable Wallet document" } = {}) => {
            const deadline = Date.now() + timeout;
            const samples = [];
            let latestState = null;
            while (Date.now() < deadline) {
              const atMs = Date.now();
              try {
                latestState = await snapshot(page);
                samples.push({ atMs, documentId: latestState.documentId, ready: normal(latestState), url: latestState.url, pwaState: latestState.pwaState, controlledVersion: latestState.controlledVersion, cacheNames: latestState.cacheNames, registrationActive: latestState.registrations[0]?.active || null });
                const stable = stableWindow(samples, stableMilliseconds);
                if (stable && stable.documentId === latestState.documentId) return { state: latestState, stableMilliseconds, samples };
              } catch (error) {
                samples.push({ atMs, documentId: null, ready: false, transientNavigationError: String(error) });
              }
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            throw new Error(`${label} timed out after ${timeout}ms; samples=${JSON.stringify(samples.slice(-20))}`);
          };
          let context;
          let page;
          let stage = "launch-first";
          const firstNetwork = [];
          const firstErrors = [];
          const firstNetworkErrors = [];
          const ignoredFavicon404 = message => message.type() === "error" && message.location()?.url === `${base}favicon.ico` && /404/.test(message.text());
          try {
            context = await bounded(chromium.launchPersistentContext(profile, { executablePath, headless: true, viewport: { width: 1280, height: 900 } }), 30000, "first Chrome launch");
            page = context.pages()[0] || await context.newPage();
            page.on("console", message => { if (message.type() === "error" && !ignoredFavicon404(message)) firstErrors.push({ text: message.text(), location: message.location() }); });
            page.on("pageerror", error => firstErrors.push(String(error)));
            page.on("response", response => { if (response.url().startsWith(base)) { const row = { url: response.url(), status: response.status(), fromServiceWorker: response.fromServiceWorker() }; firstNetwork.push(row); if (!response.ok() && !(response.url() === `${base}favicon.ico` && response.status() === 404)) firstNetworkErrors.push(row); } });
            let measuredRootDocumentRequests = 0;
            page.on("request", request => { const url = new URL(request.url()); if (request.isNavigationRequest() && url.origin === new URL(base).origin && url.pathname === "/") measuredRootDocumentRequests += 1; });
            stage = "establish-v8-only-precondition";
            await bounded(page.goto(`${base}manifest.webmanifest`, { waitUntil: "domcontentloaded", timeout: 20000 }), 25000, "same-origin seed document");
            await bounded(page.evaluate(async () => {
              if ((await navigator.serviceWorker.getRegistrations()).length) throw new Error("fresh profile unexpectedly has a service worker registration");
              if ((await caches.keys()).length) throw new Error("fresh profile unexpectedly has cache state");
              const cache = await caches.open("ynx-wallet-web-v8");
              await cache.put("./legacy-v8-marker", new Response("legacy-v8", { headers: { "content-type": "text/plain" } }));
            }), 5000, "seed v8-only state");
            result.firstBeforeUpgrade = await snapshot(page);
            await writeFile(join(evidence, "first-before-upgrade.html"), result.firstBeforeUpgrade.html);
            delete result.firstBeforeUpgrade.html;
            if (result.firstBeforeUpgrade.controller || result.firstBeforeUpgrade.registrations.length || result.firstBeforeUpgrade.cacheNames.length !== 1 || result.firstBeforeUpgrade.cacheNames[0] !== "ynx-wallet-web-v8") throw new Error("measured lifecycle did not begin with only the v8 cache and no worker");
            stage = "navigate-product-from-v8";
            await bounded(page.goto(base, { waitUntil: "domcontentloaded", timeout: 20000 }), 25000, "first product navigation from v8-only state");
            result.initialDocument = await page.evaluate(() => ({ url: location.href, title: document.title, text: document.body?.innerText || "", html: document.documentElement.outerHTML }));
            await writeFile(join(evidence, "initial-dom.html"), result.initialDocument.html);
            delete result.initialDocument.html;
            await page.screenshot({ path: join(evidence, "initial-dom.png"), fullPage: true });
            stage = "observe-v11-product-convergence";
            result.lifecycle = await bounded(observeConvergence(page), 24000, "v11 product lifecycle convergence");
            stage = "wait-first-source-bound-wallet-ui";
            await bounded(Promise.all([
              waitForWalletReady(page),
              page.waitForFunction(() => location.href === "https://wallet-3re0s0lx4-jiahaoalbus-projects.vercel.app/", null, { timeout: 20000 })
            ]), 22000, "source-bound v11 Wallet UI");
            result.firstStability = await bounded(waitForStableDocument(page, { label: "first stable source-bound Wallet document" }), 27000, "first stable source-bound Wallet document");
            result.firstAfterUpgrade = result.firstStability.state;
            result.measuredRootDocumentRequests = measuredRootDocumentRequests;
            result.firstPageCount = context.pages().length;
            result.firstConsoleErrors = firstErrors;
            result.firstNetwork = firstNetwork;
            result.firstNetworkErrors = firstNetworkErrors;
            await page.screenshot({ path: join(evidence, "first-after-v8-upgrade.png"), fullPage: true });
            await writeFile(join(evidence, "first-after-v8-upgrade.html"), result.firstAfterUpgrade.html);
            delete result.firstAfterUpgrade.html;
            if (!result.lifecycle.firstV8Removal?.integrity?.ready) throw new Error("v8 disappeared before a directly verified complete v11 integrity cache");
            if (!normal(result.firstAfterUpgrade) || result.firstPageCount !== 1 || firstErrors.length || firstNetworkErrors.length || measuredRootDocumentRequests < 1 || measuredRootDocumentRequests > 2) throw new Error("first hosted Chrome lifecycle gate failed");
            stage = "close-first-process";
            await context.close(); context = null; page = null;

            stage = "launch-second";
            context = await bounded(chromium.launchPersistentContext(profile, { executablePath, headless: true, viewport: { width: 1280, height: 900 } }), 30000, "second Chrome launch");
            page = context.pages()[0] || await context.newPage();
            const secondErrors = [];
            const secondNetwork = [];
            const secondNetworkErrors = [];
            page.on("console", message => { if (message.type() === "error" && !ignoredFavicon404(message)) secondErrors.push({ text: message.text(), location: message.location() }); });
            page.on("pageerror", error => secondErrors.push(String(error)));
            page.on("response", response => { if (response.url().startsWith(base)) { const row = { url: response.url(), status: response.status(), fromServiceWorker: response.fromServiceWorker() }; secondNetwork.push(row); if (!response.ok() && !(response.url() === `${base}favicon.ico` && response.status() === 404)) secondNetworkErrors.push(row); } });
            let secondRootDocumentRequests = 0;
            page.on("request", request => { const url = new URL(request.url()); if (request.isNavigationRequest() && url.origin === new URL(base).origin && url.pathname === "/") secondRootDocumentRequests += 1; });
            stage = "navigate-second";
            await bounded(page.goto(base, { waitUntil: "domcontentloaded", timeout: 20000 }), 25000, "second candidate navigation");
            stage = "wait-second-source-bound-wallet-ui";
            await bounded(Promise.all([
              waitForWalletReady(page),
              page.waitForFunction(async () => (await caches.keys()).includes("ynx-wallet-web-v11") && !(await caches.keys()).includes("ynx-wallet-web-v8"), null, { timeout: 15000 })
            ]), 18000, "second source-bound Wallet UI");
            stage = "wait-second-navigation-aware-stability";
            result.secondStability = await bounded(waitForStableDocument(page, { label: "second stable source-bound Wallet document" }), 27000, "second stable source-bound Wallet document");
            result.secondLaunch = result.secondStability.state;
            result.secondRootDocumentRequests = secondRootDocumentRequests;
            result.secondPageCount = context.pages().length;
            result.secondConsoleErrors = secondErrors;
            result.secondNetwork = secondNetwork;
            result.secondNetworkErrors = secondNetworkErrors;
            await page.screenshot({ path: join(evidence, "second-launch.png"), fullPage: true });
            await writeFile(join(evidence, "second-launch.html"), result.secondLaunch.html);
            delete result.secondLaunch.html;
            result.passed = normal(result.firstAfterUpgrade) && normal(result.secondLaunch) && result.lifecycle.firstV8Removal?.integrity?.ready === true && result.firstStability.stableMilliseconds >= 1500 && result.secondStability.stableMilliseconds >= 1500 && result.measuredRootDocumentRequests >= 1 && result.measuredRootDocumentRequests <= 2 && result.secondRootDocumentRequests >= 1 && result.secondRootDocumentRequests <= 2 && result.firstPageCount === 1 && result.secondPageCount === 1 && firstErrors.length === 0 && firstNetworkErrors.length === 0 && secondErrors.length === 0 && secondNetworkErrors.length === 0;
          } catch (error) {
            result.error = { stage, name: error?.name || "Error", message: error?.message || String(error) };
            result.firstConsoleErrors = firstErrors;
            result.firstNetwork = firstNetwork;
            result.firstNetworkErrors = firstNetworkErrors;
            if (page) {
              const failure = await page.evaluate(async () => ({
                url: location.href,
                title: document.title,
                text: document.body?.innerText || "",
                html: document.documentElement?.outerHTML || "",
                controller: navigator.serviceWorker.controller?.scriptURL || null,
                cacheNames: await caches.keys(),
                registrations: (await navigator.serviceWorker.getRegistrations()).map(value => ({ scope: value.scope, active: value.active?.scriptURL || null }))
              })).catch(captureError => ({ captureError: String(captureError) }));
              result.failureSnapshot = { ...failure, html: undefined };
              if (failure.html !== undefined) await writeFile(join(evidence, "failure.html"), failure.html);
              await page.screenshot({ path: join(evidence, "failure.png"), fullPage: true }).catch(() => {});
            }
          } finally {
            if (context) await context.close().catch(() => {});
            await writeFile(join(evidence, "hosted-chrome.json"), `${JSON.stringify(result, null, 2)}\n`);
          }
          console.log(JSON.stringify(result, null, 2));
          process.exit(result.passed ? 0 : 1);
          NODE
          node "$RUNNER_TEMP/p0189-browser-probe.mjs"

      - name: Freeze isolated hosted evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wallet-web-p0189-evidence"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Upload isolated immutable hosted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-web-v11-stable-second-launch-preflight-p0189
          path: ${{ runner.temp }}/wallet-web-p0189-evidence
          if-no-files-found: error
          retention-days: 7
