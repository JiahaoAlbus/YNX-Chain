name: Wallet Web v11 no-store immutable candidate hosted browser preflight P0

on:
  push:
    branches:
      - codex/wallet-web-pwa-extensions-20260813
    paths:
      - .github/workflows/wallet-web-public-preflight-p0.yml

permissions:
  contents: read

jobs:
  preflight:
    if: "github.event.head_commit.message == 'evidence(wallet-web): preflight source-bound v11 readiness p0185'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Create isolated evidence carrier
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wallet-web-p0185-evidence"
          test ! -e "$out"
          mkdir -p "$out/resources" "$out/browser"

      - name: Fetch and verify four immutable resources
        shell: bash
        run: |
          set -euo pipefail
          base='https://wallet-3tjtzd8sy-jiahaoalbus-projects.vercel.app'
          out="$RUNNER_TEMP/wallet-web-p0185-evidence/resources"
          fetch() {
            name="$1"
            uri="$2"
            expected_bytes="$3"
            expected_sha="$4"
            http_code="$(curl --proto '=https' --tlsv1.2 --silent --show-error --max-time 20 --connect-timeout 8 --max-redirs 0 --dump-header "$out/${name}.headers" --output "$out/${name}.body" --write-out '%{http_code}' "${base}${uri}")"
            printf '%s\n' "$http_code" > "$out/${name}.status"
            wc -c < "$out/${name}.body" | tr -d ' ' > "$out/${name}.bytes"
            sha256sum "$out/${name}.body" | awk '{print $1}' > "$out/${name}.sha256"
            test "$http_code" = 200
            test "$(cat "$out/${name}.bytes")" = "$expected_bytes"
            test "$(cat "$out/${name}.sha256")" = "$expected_sha"
          }
          fetch root '/' 821 2df10866a35b074a6fb366439197646dd4e979bc83bdae3aba0ba6db3802986c
          fetch build-identity '/build-identity.json' 267 7d40d0e536dcc7cdf90aba0279670dd727d7c573d8eeb1e23b4d9c89a9979294
          fetch manifest '/manifest.webmanifest' 632 d2d131267483327ece949c5b8402c2dd80352bb15e791ea5571c879682ceba92
          fetch sw '/sw.js' 4509 9c54d420a14a3e0843b8d55449eee9117dd3fe0193dd79d87ac3b9232a106715
          node -e "const fs=require('fs');const value=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/wallet-web-p0185-evidence/resources/build-identity.body','utf8'));if(value.sourceCommit!=='abe18043259374ee58f90580af582100ab0649cd')process.exit(1)"
          awk 'BEGIN{IGNORECASE=1;ok=0} /^cache-control:/ && /no-store/{ok=1} END{exit ok?0:1}' "$out/build-identity.headers"
          awk 'BEGIN{IGNORECASE=1;ok=0} /^cache-control:/ && /no-store/{ok=1} END{exit ok?0:1}' "$out/sw.headers"

      - name: Install browser harness dependencies
        run: npm ci --ignore-scripts --prefix apps/wallet-web

      - name: Prove v8 to v11 persistent-profile recovery in hosted Chrome
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/p0185-browser-probe.mjs" <<'NODE'
          import { createRequire } from "node:module";
          import { readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const require = createRequire(join(process.env.GITHUB_WORKSPACE, "apps/wallet-web/package.json"));
          const { chromium } = require("playwright");
          const base = "https://wallet-3tjtzd8sy-jiahaoalbus-projects.vercel.app/";
          const profile = join(process.env.RUNNER_TEMP, "p0185-chrome-profile");
          const evidence = join(process.env.RUNNER_TEMP, "wallet-web-p0185-evidence", "browser");
          const executablePath = "/usr/bin/google-chrome";
          const result = { schemaVersion: 1, candidate: base, sourceCommit: "abe18043259374ee58f90580af582100ab0649cd", persistentProfile: true, executablePath, expectedCacheVersion: "ynx-wallet-web-v11", legacyCacheVersion: "ynx-wallet-web-v8", installedProvider: false, accountAuthorized: false, signingOrTransaction: false, passed: false };
          const bounded = (promise, ms, label) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timed out after ${ms}ms`)), ms))]);
          const waitForWalletReady = page => page.waitForFunction(async expectedSource => {
            const app = document.querySelector("main#app");
            const shell = app?.querySelector(":scope > .shell");
            const heading = shell?.querySelector('section[aria-labelledby="title"] > h1#title');
            const status = shell?.querySelector('[role="status"][aria-live="polite"]');
            const chooser = shell?.querySelector("#wallet-chooser");
            const download = shell?.querySelector("#download[href]");
            const metamask = shell?.querySelector("#metamask[href]");
            const identity = await fetch("./build-identity.json", { cache: "no-store" }).then(response => response.ok ? response.json() : null).catch(() => null);
            const text = document.body?.innerText || "";
            return Boolean(shell && heading && status && chooser && download && metamask) && document.documentElement.lang === "en" && document.title === "YNX Wallet — Testnet companion" && identity?.sourceCommit === expectedSource && !/PWA shell integrity verification failed|PWA shell 完整性验证失败/i.test(text);
          }, result.sourceCommit, { timeout: 15000 });
          const snapshot = page => page.evaluate(async () => ({
            url: location.href,
            title: document.title,
            text: document.body.innerText,
            html: document.documentElement.outerHTML,
            controller: navigator.serviceWorker.controller?.scriptURL || null,
            cacheNames: await caches.keys(),
            registrations: (await navigator.serviceWorker.getRegistrations()).map(value => ({ scope: value.scope, active: value.active?.scriptURL || null })),
            controlledVersion: await new Promise(resolve => {
              const controller = navigator.serviceWorker.controller;
              if (!controller) return resolve(null);
              const channel = new MessageChannel();
              const timer = setTimeout(() => resolve(null), 1000);
              channel.port1.onmessage = event => { clearTimeout(timer); resolve(event.data?.cache || null); };
              controller.postMessage({ type: "YNX_WALLET_PWA_VERSION" }, [channel.port2]);
            }),
            buildIdentity: fetch("./build-identity.json", { cache: "no-store" }).then(response => response.json())
          }));
          const normal = value => value.url === base && value.title === "YNX Wallet — Testnet companion" && Boolean(value.controller) && value.buildIdentity?.sourceCommit === result.sourceCommit && !/PWA shell integrity verification failed|PWA shell 完整性验证失败/i.test(value.text);
          let context;
          let page;
          let stage = "launch-first";
          const firstNetwork = [];
          const firstErrors = [];
          try {
            context = await bounded(chromium.launchPersistentContext(profile, { executablePath, headless: true, viewport: { width: 1280, height: 900 } }), 30000, "first Chrome launch");
            page = context.pages()[0] || await context.newPage();
            page.on("console", message => { if (message.type() === "error") firstErrors.push(message.text()); });
            page.on("pageerror", error => firstErrors.push(String(error)));
            page.on("response", response => { if (response.url().startsWith(base)) firstNetwork.push({ url: response.url(), status: response.status(), fromServiceWorker: response.fromServiceWorker() }); });
            stage = "navigate-first";
            await bounded(page.goto(base, { waitUntil: "domcontentloaded", timeout: 20000 }), 25000, "first candidate navigation");
            result.initialDocument = await page.evaluate(() => ({ url: location.href, title: document.title, text: document.body?.innerText || "", html: document.documentElement.outerHTML }));
            await writeFile(join(evidence, "initial-dom.html"), result.initialDocument.html);
            delete result.initialDocument.html;
            await page.screenshot({ path: join(evidence, "initial-dom.png"), fullPage: true });
            stage = "wait-first-source-bound-wallet-ui";
            await bounded(waitForWalletReady(page), 18000, "first source-bound Wallet UI");
            stage = "seed-v8";
            await bounded(page.evaluate(async () => { const cache = await caches.open("ynx-wallet-web-v8"); await cache.put("./legacy-v8-marker", new Response("legacy-v8", { headers: { "content-type": "text/plain" } })); }), 5000, "seed v8 state");
            result.firstBeforeUpgrade = await snapshot(page);
            await writeFile(join(evidence, "first-before-upgrade.html"), result.firstBeforeUpgrade.html);
            delete result.firstBeforeUpgrade.html;
            if (!result.firstBeforeUpgrade.cacheNames.includes("ynx-wallet-web-v8")) throw new Error("legacy v8 cache seed missing");
            stage = "reload-v11";
            await bounded(page.reload({ waitUntil: "domcontentloaded", timeout: 20000 }), 25000, "upgrade reload");
            stage = "wait-v11-recovery";
            await bounded(Promise.all([
              waitForWalletReady(page),
              page.waitForFunction(async () => (await caches.keys()).includes("ynx-wallet-web-v11") && !(await caches.keys()).includes("ynx-wallet-web-v8"), null, { timeout: 15000 })
            ]), 18000, "source-bound v11 recovery");
            result.firstAfterUpgrade = await snapshot(page);
            result.firstPageCount = context.pages().length;
            result.firstConsoleErrors = firstErrors;
            result.firstNetwork = firstNetwork;
            await page.screenshot({ path: join(evidence, "first-after-v8-upgrade.png"), fullPage: true });
            await writeFile(join(evidence, "first-after-v8-upgrade.html"), result.firstAfterUpgrade.html);
            delete result.firstAfterUpgrade.html;
            if (!normal(result.firstAfterUpgrade) || result.firstPageCount !== 1 || firstErrors.length || result.firstAfterUpgrade.controlledVersion !== "ynx-wallet-web-v11") throw new Error("first hosted Chrome gate failed");
            stage = "close-first-process";
            await context.close(); context = null; page = null;

            stage = "launch-second";
            context = await bounded(chromium.launchPersistentContext(profile, { executablePath, headless: true, viewport: { width: 1280, height: 900 } }), 30000, "second Chrome launch");
            page = context.pages()[0] || await context.newPage();
            const secondErrors = [];
            page.on("console", message => { if (message.type() === "error") secondErrors.push(message.text()); });
            page.on("pageerror", error => secondErrors.push(String(error)));
            stage = "navigate-second";
            await bounded(page.goto(base, { waitUntil: "domcontentloaded", timeout: 20000 }), 25000, "second candidate navigation");
            stage = "wait-second-source-bound-wallet-ui";
            await bounded(Promise.all([
              waitForWalletReady(page),
              page.waitForFunction(async () => (await caches.keys()).includes("ynx-wallet-web-v11") && !(await caches.keys()).includes("ynx-wallet-web-v8"), null, { timeout: 15000 })
            ]), 18000, "second source-bound Wallet UI");
            result.secondLaunch = await snapshot(page);
            result.secondPageCount = context.pages().length;
            result.secondConsoleErrors = secondErrors;
            await page.screenshot({ path: join(evidence, "second-launch.png"), fullPage: true });
            await writeFile(join(evidence, "second-launch.html"), result.secondLaunch.html);
            delete result.secondLaunch.html;
            result.passed = normal(result.firstAfterUpgrade) && normal(result.secondLaunch) && result.firstPageCount === 1 && result.secondPageCount === 1 && !result.firstAfterUpgrade.cacheNames.includes("ynx-wallet-web-v8") && result.firstAfterUpgrade.cacheNames.includes("ynx-wallet-web-v11") && !result.secondLaunch.cacheNames.includes("ynx-wallet-web-v8") && result.secondLaunch.cacheNames.includes("ynx-wallet-web-v11") && result.firstAfterUpgrade.controlledVersion === "ynx-wallet-web-v11" && result.secondLaunch.controlledVersion === "ynx-wallet-web-v11" && firstErrors.length === 0 && secondErrors.length === 0;
          } catch (error) {
            result.error = { stage, name: error?.name || "Error", message: error?.message || String(error) };
            result.firstConsoleErrors = firstErrors;
            result.firstNetwork = firstNetwork;
            if (page) {
              const failure = await page.evaluate(async () => ({
                url: location.href,
                title: document.title,
                text: document.body?.innerText || "",
                html: document.documentElement?.outerHTML || "",
                controller: navigator.serviceWorker.controller?.scriptURL || null,
                cacheNames: await caches.keys(),
                registrations: (await navigator.serviceWorker.getRegistrations()).map(value => ({ scope: value.scope, active: value.active?.scriptURL || null }))
              })).catch(captureError => ({ captureError: String(captureError) }));
              result.failureSnapshot = { ...failure, html: undefined };
              if (failure.html !== undefined) await writeFile(join(evidence, "failure.html"), failure.html);
              await page.screenshot({ path: join(evidence, "failure.png"), fullPage: true }).catch(() => {});
            }
          } finally {
            if (context) await context.close().catch(() => {});
            await writeFile(join(evidence, "hosted-chrome.json"), `${JSON.stringify(result, null, 2)}\n`);
          }
          console.log(JSON.stringify(result, null, 2));
          process.exit(result.passed ? 0 : 1);
          NODE
          node "$RUNNER_TEMP/p0185-browser-probe.mjs"

      - name: Freeze isolated hosted evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wallet-web-p0185-evidence"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Upload isolated immutable hosted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-web-v11-source-bound-readiness-preflight-p0185
          path: ${{ runner.temp }}/wallet-web-p0185-evidence
          if-no-files-found: error
          retention-days: 7
