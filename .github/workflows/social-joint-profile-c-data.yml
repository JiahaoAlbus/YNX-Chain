name: Social joint-profile sole Go C DATA bridge
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/wallet-auth/native/social-fresh-joint-profile-v1/cabi/**
      - packages/wallet-auth/native/social-fresh-joint-profile-v1/body.go
      - packages/wallet-auth/scripts/social-joint-profile-c-data-inputs.mjs
      - scripts/ci/social-joint-profile-c-data.mjs
      - .github/workflows/social-joint-profile-c-data.yml
jobs:
  new-caller-owned-data-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.13'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/social-joint-profile-c-data.mjs 2>&1 | tee social-joint-profile-c-data.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: social-joint-profile-c-data-only
          path: |
            social-joint-profile-c-data.log
            ${{ runner.temp }}/social-joint-c-data-*/*.stdout
            ${{ runner.temp }}/social-joint-c-data-*/*.stderr
            ${{ runner.temp }}/social-joint-c-data-*/RESULT.json
