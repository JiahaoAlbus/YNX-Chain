name: Linux DEVICE V4 Source-v2 SDK normal intake
on:
  push:
    branches: [codex/wallet-auth49-linux-device-source-v2-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-linux-sdk-and-source-package:
    if: github.ref == 'refs/heads/codex/wallet-auth49-linux-device-source-v2-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.7.0'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - name: New4 integrations and strict types only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/linux-device-v4-source-sdk-intake.mjs 2>&1 | tee linux-device-v4-source-sdk-intake.log
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-device-v4-source-sdk-normal
          if-no-files-found: error
          path: |
            linux-device-v4-source-sdk-intake.log
            canonical-common-source-package
