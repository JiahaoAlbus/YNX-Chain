name: Server TLS Source SDK minimal intake
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/wallet-auth/native/original-server-tls-source-*.mjs
      - packages/wallet-auth/native/original-server-tls-source-*.d.mts
      - packages/wallet-auth/test/server-tls-sdk-intake*
      - scripts/ci/server-tls-sdk-intake.mjs
      - .github/workflows/server-tls-sdk-intake.yml
jobs:
  new-intake-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/server-tls-sdk-intake.mjs 2>&1 | tee server-tls-sdk-intake.log
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - run: node scripts/ci/server-tls-sdk-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: server-tls-sdk-intake-normal-source
          path: |
            server-tls-sdk-intake.log
            server-tls-sdk-intake-controls
            canonical-common-source-package
