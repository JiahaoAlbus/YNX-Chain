name: Network resource retire ordering
on:
  push:
    branches: [codex/network-resource-retire-ci]
permissions:
  contents: read
jobs:
  focused:
    if: github.repository == 'JiahaoAlbus/YNX-Chain' && github.ref == 'refs/heads/codex/network-resource-retire-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check concurrent retire and join
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -o pipefail
          go test -mod=readonly -race -p 1 -count=1 ./apps/network/internal/authresourcesource -run '^TestOriginalRetireCompletesBeforeSharedJoin$' -v | tee "$RUNNER_TEMP/p09-retire.log"
          grep -Eq '^--- PASS: TestOriginalRetireCompletesBeforeSharedJoin \(' "$RUNNER_TEMP/p09-retire.log"
