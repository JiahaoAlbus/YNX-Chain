name: wallet-ios-faucet-verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-simulator-verification:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      YNX_IOS_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/wallet-auth/package-lock.json
            apps/wallet/package-lock.json
      - name: Verify immutable workflow pins and source identity
        run: |
          node scripts/verify/github-actions-pins-check.mjs
          test "$(git rev-parse HEAD)" = "$YNX_IOS_EXPECTED_SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Prepare isolated provenance directory
        run: |
          printf 'YNX_IOS_QA_DIR=%s\n' "$RUNNER_TEMP/ynx-wallet-ios-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          export YNX_IOS_QA_DIR="$RUNNER_TEMP/ynx-wallet-ios-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node apps/wallet/scripts/ios-simulator-qa.mjs prepare
      - name: Use release-locked npm
        run: npm install --global npm@11.5.1
      - name: Install Wallet Auth dependencies
        run: npm ci
        working-directory: packages/wallet-auth
      - name: Install Wallet dependencies
        run: npm ci
        working-directory: apps/wallet
      - name: Swift Foundation host and bridge verification
        shell: bash
        run: |
          set -euo pipefail
          host_out="$RUNNER_TEMP/ynx-ios-faucet-host"
          bridge_out="$RUNNER_TEMP/ynx-ios-faucet-bridge"
          python3 apps/wallet/modules/ynx-faucet-transport/ios/Tests/run-macos-host-tests.py --output "$host_out"
          python3 apps/wallet/modules/ynx-faucet-transport/ios/Tests/run-macos-bridge-tests.py --output "$bridge_out"
          node - "$host_out/result.json" "$bridge_out/result.json" "$YNX_IOS_QA_DIR/proof/foundation-summary.json" <<'NODE'
          const fs = require("node:fs");
          const [hostPath, bridgePath, output] = process.argv.slice(2);
          const host = JSON.parse(fs.readFileSync(hostPath));
          const bridge = JSON.parse(fs.readFileSync(bridgePath));
          if (!host.passed || !bridge.passed) process.exit(1);
          fs.writeFileSync(output, JSON.stringify({
            host: { passed: host.passed, cases: host.swiftCases, wireChecks: host.wireChecks, requestCounts: host.requestCounts },
            bridge: { passed: bridge.passed, cases: bridge.swiftCases, wireChecks: bridge.wireChecks, requestCounts: bridge.requestCounts },
            publicEndpointUsed: false, requestOrResponseBodiesRetained: false
          }, null, 2) + "\n");
          NODE
      - name: Faucet JavaScript contracts and typecheck
        working-directory: apps/wallet
        run: |
          npx tsx --test src/chain/faucetAdmission.test.ts src/chain/faucetClaim.test.ts src/chain/faucetNativeSession.test.ts src/chain/faucetReceipt.test.ts
          npm run typecheck
      - name: Verify Expo prebuild is reproducible
        working-directory: apps/wallet
        run: |
          npx expo prebuild --platform ios --no-install
          git diff --exit-code -- app.json ios
      - name: Resolve Expo modules and CocoaPods
        working-directory: apps/wallet
        run: |
          npx expo-modules-autolinking resolve --platform apple > "$YNX_IOS_QA_DIR/proof/expo-autolinking.txt"
          npx --yes pod-install@1.0.9 ios
      - name: Build unsigned iOS Simulator target
        working-directory: apps/wallet
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/YNXWallet.xcworkspace -scheme YNXWallet \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$YNX_IOS_QA_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee "$YNX_IOS_QA_DIR/proof/xcodebuild.log"
      - name: Record compiled Faucet gate and artifact hashes
        run: node apps/wallet/scripts/ios-simulator-qa.mjs compiled
      - name: Verify evidence contains no retained request material
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eri 'private.?key|mnemonic|seed phrase|recovery key|authorization:|bearer |"body"[[:space:]]*:' "$YNX_IOS_QA_DIR/proof"; then
            exit 1
          fi
          shasum -a 256 "$YNX_IOS_QA_DIR"/proof/* > "$YNX_IOS_QA_DIR/proof/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ynx-wallet-ios-faucet-verify-${{ github.sha }}
          path: ${{ env.YNX_IOS_QA_DIR }}/proof
          if-no-files-found: error
          retention-days: 7
