name: Calendar

on:
  workflow_dispatch:
  push:
    branches:
      - codex/integrate-finance-suite
    paths:
      - "apps/calendar/**"
      - "internal/calendar/**"
      - "release/calendar/**"
      - "release/integration/calendar-contract.json"
      - "packages/wallet-auth/**"
      - ".github/workflows/calendar.yml"
  pull_request:
    paths:
      - "apps/calendar/**"
      - "internal/calendar/**"
      - "release/calendar/**"
      - "release/integration/calendar-contract.json"
      - "packages/wallet-auth/**"
      - ".github/workflows/calendar.yml"

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/calendar/package-lock.json
      - name: Verify Go service
        run: |
          go test ./internal/calendar ./apps/calendar/...
          go test -race ./internal/calendar
          go vet ./internal/calendar ./apps/calendar/...
      - name: Verify Web, release evidence and builds
        working-directory: apps/calendar
        run: |
          npm ci
          npm test
          npm run build
          npm run build:statectl
          npm run check:ios:portable
      - name: Verify canonical Wallet contract
        working-directory: packages/wallet-auth
        run: |
          npm ci
          node --test test/registry.test.mjs
