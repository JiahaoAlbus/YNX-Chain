name: IDE matched-Control supplier PUBLIC DATA
on:
  push:
    branches: [codex/wallet-auth49-ide-control-matched-whole-supplier-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public3-no-native-assets:
    if: github.ref == 'refs/heads/codex/wallet-auth49-ide-control-matched-whole-supplier-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.7.0'
      - name: Only PUBLIC3 contract negatives, no supplier A files or Native
        shell: bash
        run: |
          set -euo pipefail
          node --test control-matched-public.test.mjs 2>&1 | tee ide-control-matched-public3.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ide-control-matched-public3-data
          if-no-files-found: error
          path: ide-control-matched-public3.log
