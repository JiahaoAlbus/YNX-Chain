name: SourceParent GCC source compatibility intake
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/wallet-auth/native/source-parent/**
      - packages/wallet-auth/scripts/sourceparent-normal-inputs.mjs
      - packages/wallet-auth/test/sourceparent-gcc-normal.test.mjs
      - scripts/ci/sourceparent-gcc-normal.mjs
      - .github/workflows/sourceparent-gcc-normal.yml
jobs:
  new-data-and-source-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/sourceparent-gcc-normal.mjs 2>&1 | tee sourceparent-gcc-normal.log
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sourceparent-gcc-normal-source
          path: |
            sourceparent-gcc-normal.log
            canonical-common-source-package
