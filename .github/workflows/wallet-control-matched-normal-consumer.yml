name: Wallet CONTROL matched normal consumer PUBLIC DATA
on:
  workflow_dispatch:
  push:
    branches: [codex/wallet-auth49-control-matched-normal-consumer-20261108]
permissions:
  contents: read
jobs:
  public-entry-negatives-only:
    if: github.ref == 'refs/heads/codex/wallet-auth49-control-matched-normal-consumer-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.7.0'
      - name: Only new PUBLIC3; no Native or A artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/wallet-control-matched-normal-consumer.mjs 2>&1 | tee wallet-control-matched-public.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wallet-control-matched-public-data
          if-no-files-found: error
          path: wallet-control-matched-public.log
