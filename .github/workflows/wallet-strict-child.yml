name: Wallet strict child custody
on:
  push:
    branches:
      - 'codex/sdk-strict-child-custody-20261114'
  pull_request:
    paths:
      - 'packages/wallet-auth/native/strict-child.mjs'
      - 'packages/wallet-auth/test/strict-child.test.mjs'
      - '.github/workflows/wallet-strict-child.yml'
permissions:
  contents: read
jobs:
  strict-child:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test packages/wallet-auth/test/strict-child.test.mjs
