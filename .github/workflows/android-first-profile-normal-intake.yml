name: Android first registration profile SDK intake
on:
  push:
    branches: [codex/android-first-profile-normal-intake-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-profile-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.7.0'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - run: node packages/wallet-auth/test/first-device-profile/first-profile-binding.mjs "$PWD/packages/wallet-auth"
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-first-profile-source-package
          path: canonical-common-source-package
          if-no-files-found: error
