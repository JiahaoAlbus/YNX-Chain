name: Wallet desktop SBOM and provenance

on:
  workflow_dispatch:
  push:
    branches: [codex/wallet-desktop-cli-sdk-20260813]
    paths:
      - .github/workflows/wallet-desktop-sbom-provenance.yml

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/wallet-desktop/package-lock.json
      - name: Install exact dependency graph and test desktop boundary
        run: |
          npm ci --ignore-scripts --prefix packages/wallet-auth
          npm ci --prefix apps/wallet-desktop
          npm test --prefix apps/wallet-desktop
      - name: Generate source-bound CycloneDX SBOM and provenance
        env:
          OUT: ${{ runner.temp }}/wallet-desktop-sbom-provenance
        run: |
          mkdir -p "$OUT"
          npm sbom --sbom-format cyclonedx --prefix apps/wallet-desktop > "$OUT/wallet-desktop.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and .metadata.component.name == "wallet-desktop" and .metadata.component.purl == "pkg:npm/%40ynx-chain/wallet-desktop@0.1.0" and (.components | length > 0)' "$OUT/wallet-desktop.cdx.json"
          if grep -Fq "$HOME" "$OUT/wallet-desktop.cdx.json"; then exit 1; fi
          sha256sum \
            apps/wallet-desktop/package.json \
            apps/wallet-desktop/package-lock.json \
            packages/wallet-auth/package.json \
            packages/wallet-auth/package-lock.json \
            packages/wallet-auth/testdata/product-session-http-proof-v1.json > "$OUT/materials.sha256"
          jq -n \
            --arg sourceCommit "$GITHUB_SHA" \
            --argjson workflowRunId "$GITHUB_RUN_ID" \
            --arg node "$(node --version)" \
            --arg npm "$(npm --version)" \
            --arg runner "$(uname -srm)" \
            --rawfile materials "$OUT/materials.sha256" \
            '{schemaVersion:1,subject:"YNX Wallet desktop source dependency graph",sourceCommit:$sourceCommit,workflowRunId:$workflowRunId,builder:{runner:"ubuntu-24.04-x64",kernel:$runner,node:$node,npm:$npm},materials:($materials|split("\n")|map(select(length>0)|capture("^(?<sha256>[a-f0-9]{64})  (?<path>.*)$"))),protocol:"YNX_PRODUCT_SESSION_HTTP_PROOF_V1",evmChainId:"0x1917",artifactRuntimeTested:false,accountClaimed:false,balanceClaimed:false,transactionCreated:false,signingClass:"unsigned_ci_metadata",productionSigned:false,downloadHosted:false,deployedPublic:false,storeReleased:false}' > "$OUT/provenance.json"
          OUT="$OUT" node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const files = ['wallet-desktop.cdx.json', 'provenance.json'];
          const artifacts = files.map(filename => {
            const data = fs.readFileSync(path.join(process.env.OUT, filename));
            return {filename, bytes:data.length, sha256:crypto.createHash('sha256').update(data).digest('hex'), minimumOS:'N/A metadata; generated on Ubuntu 24.04.4 x64', signingClass:'unsigned_ci_metadata', productionSigned:false};
          });
          const manifest = {schemaVersion:1,sourceCommit:process.env.GITHUB_SHA,workflowRunId:Number(process.env.GITHUB_RUN_ID),artifacts,desktopRuntimeClaimed:false,downloadHosted:false,deployedPublic:false,storeReleased:false};
          fs.writeFileSync(path.join(process.env.OUT, 'manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          jq -e '.artifacts | length == 2' "$OUT/manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ynx-wallet-desktop-sbom-provenance
          path: ${{ runner.temp }}/wallet-desktop-sbom-provenance
          if-no-files-found: error

  verify-downloaded-artifact:
    needs: generate-and-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ynx-wallet-desktop-sbom-provenance
          path: downloaded
      - name: Verify every downloaded metadata artifact
        run: |
          manifest="$(find downloaded -name manifest.json -type f -print -quit)"
          test -n "$manifest"
          MANIFEST="$manifest" node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, 'utf8'));
          if (manifest.sourceCommit !== process.env.GITHUB_SHA || manifest.artifacts.length !== 2 || manifest.desktopRuntimeClaimed || manifest.downloadHosted || manifest.deployedPublic || manifest.storeReleased) process.exit(1);
          for (const expected of manifest.artifacts) {
            const file = path.join(path.dirname(process.env.MANIFEST), expected.filename);
            const data = fs.readFileSync(file);
            if (data.length !== expected.bytes || crypto.createHash('sha256').update(data).digest('hex') !== expected.sha256 || expected.productionSigned || expected.signingClass !== 'unsigned_ci_metadata') process.exit(1);
          }
          const provenance = JSON.parse(fs.readFileSync(path.join(path.dirname(process.env.MANIFEST), 'provenance.json'), 'utf8'));
          if (provenance.sourceCommit !== process.env.GITHUB_SHA || provenance.materials.length !== 5 || provenance.artifactRuntimeTested || provenance.productionSigned || provenance.downloadHosted || provenance.deployedPublic || provenance.storeReleased) process.exit(1);
          fs.writeFileSync('downloaded-verification.json', `${JSON.stringify({schemaVersion:1,sourceCommit:process.env.GITHUB_SHA,workflowRunId:Number(process.env.GITHUB_RUN_ID),downloaded:true,manifestPresent:true,artifactCount:2,bytesVerified:true,sha256Verified:true}, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ynx-wallet-desktop-sbom-provenance-download-verification
          path: downloaded-verification.json
          if-no-files-found: error
