name: Android private registration client SDK inputs
on:
  push:
    branches: [codex/wallet-auth49-android-registration-client-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration-delta-and-package:
    if: github.ref == 'refs/heads/codex/wallet-auth49-android-registration-client-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.7.0'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - name: New registration orchestration and Host boundary controls
        shell: bash
        run: |
          set -euo pipefail
          export YNX_REGISTRATION_TEST_OUT="$GITHUB_WORKSPACE/registration-private-public-output"
          node scripts/ci/android-registration-private-client.mjs 2>&1 | tee registration-private-public-controls.log
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-registration-private-sdk-normal-inputs
          if-no-files-found: error
          path: |
            registration-private-public-controls.log
            registration-private-public-output
            canonical-common-source-package
