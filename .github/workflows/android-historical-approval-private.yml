name: Android private historical approval
on:
  push:
    branches: [codex/wallet-auth49-android-historical-approval-private-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-approval-and-package:
    if: github.ref == 'refs/heads/codex/wallet-auth49-android-historical-approval-private-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.7.0'
      - run: npm ci --ignore-scripts --prefix packages/wallet-auth
      - name: Build fixed pending bundle and run new DATA controls
        shell: bash
        run: |
          set -euo pipefail
          export YNX_HISTORICAL_APPROVAL_OUT="$GITHUB_WORKSPACE/historical-approval-output"
          node scripts/ci/android-historical-approval-private.mjs 2>&1 | tee historical-approval-controls.log
      - run: node packages/wallet-auth/scripts/ci/canonical-common-source-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-historical-approval-private-sdk-inputs
          if-no-files-found: error
          path: |
            historical-approval-controls.log
            historical-approval-output
            canonical-common-source-package
