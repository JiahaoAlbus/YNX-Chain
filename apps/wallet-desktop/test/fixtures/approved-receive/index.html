<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUBLIC Receive presentation fixture — not Wallet authority</title><link rel="stylesheet" href="../../../src/approved-wallet-tokens.css"><link rel="stylesheet" href="../../../src/desktop-receive-design.css"><style>body{margin:0;background:var(--ynx-bg);color:var(--ynx-text);font:14px var(--ynx-font)}.public-label{height:56px;margin:0;border-bottom:1px solid var(--ynx-border);padding:16px 24px;box-sizing:border-box;color:var(--ynx-text-secondary);font-size:12px}.preview-stage{margin-left:232px;width:calc(100% - 262px);padding-top:44px}dialog#receive-sheet{position:relative;inset:auto;margin:0 auto}.resolver-stage{width:602px;margin:auto}.receive-design>p:not([id]):not([class]){display:none}</style></head><body><p class="public-label">PUBLIC UI 对比夹具 · 非原生 Wallet／账户权限／Source 验收 · 1440 × 900 · 数据由实际公开编码器生成</p><main class="preview-stage"><dialog open id="receive-sheet"><div class="dialog-heading"><h2>收款</h2><button type="button" data-close="receive-sheet">关闭</button></div><p>Send only YNX Testnet assets to this address.</p><canvas id="receive-qr" hidden aria-label="收款二维码"></canvas><p id="receive-qr-status" role="status"></p><button id="download-receiving-png" disabled>保存收款 PNG</button><label for="receive-address">收款地址</label><input id="receive-address" readonly><button id="copy-receiving-link">复制收款链接</button><button id="copy-address">复制地址</button><p class="muted">显示、扫码、复制、分享指向同一网络与同一地址。<br>切换账户或网络时旧二维码立即失效。</p><p id="receive-status" role="status"></p><details id="receive-compatibility"><summary>EVM 兼容地址格式</summary><input id="receive-evm-address" readonly></details></dialog><section id="resolver" class="resolver-stage" hidden></section></main><script type="module">
import {createReceiveCodeUI} from '../../../src/receive-code-ui.mjs';import {createAddressResolverUI} from '../../../src/receive-address-resolver-ui.mjs';
const q=new URLSearchParams(location.search),theme=q.get('theme')==='dark'?'dark':'light',state=q.get('state')||'ynx';document.documentElement.dataset.theme=theme;
const data=await fetch('./public-data.json').then(r=>r.json()),context={open:true,account:data.account,keyRevision:1,networkId:'ynx_6423-1'};
window.ynxWallet={receiveCompatibilityCode:async()=>({ok:true,value:data.compatibility})};
const ui=createReceiveCodeUI({canvas:document.getElementById('receive-qr'),status:document.getElementById('receive-qr-status'),exportButton:document.getElementById('download-receiving-png'),getContext:()=>context,requestCode:()=>state==='loading'?new Promise(()=>{}):Promise.resolve(state==='unavailable'?{ok:false,error:{code:'PUBLIC_UNAVAILABLE'}}:{ok:true,value:data.native})});
if(state.startsWith('resolver')){document.getElementById('receive-sheet').hidden=true;const root=document.getElementById('resolver');root.hidden=false;const component=createAddressResolverUI({root,getContext:()=>context,api:{resolveReceivingAddress:async input=>state==='resolver-ready'?{ok:true,value:{source:input.address,target:data.compatibility.account,direction:input.direction,networkId:'ynx_6423-1',canonicalOwner:data.compatibility.account,method:'same-account-encoding'}}:{ok:false,error:{code:state==='resolver-invalid'?'RECEIVE_RESOLVER_INVALID':'RECEIVE_RESOLVER_UNCONFIRMED'}}}});component.input.value=state==='resolver-invalid'?'0x123':data.account;component.input.dispatchEvent(new Event('input'));await component.resolve();}else{await(state==='evm'?ui.refreshCompatibility(data.account):ui.refresh(data.account));}
</script></body></html>
