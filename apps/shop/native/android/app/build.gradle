plugins { id "com.android.application" }
def shopApi = System.getenv("YNX_SHOP_API_URL") ?: "http://10.0.2.2:8095"
android {
    namespace "com.ynxweb4.shop"
    compileSdk 36
    defaultConfig {
        applicationId "com.ynxweb4.shop"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "0.3.0-testnet-preview"
        buildConfigField "String", "API_BASE_URL", "\"" + shopApi + "\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [usesCleartextTraffic:"false"]
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders = [usesCleartextTraffic:"true"]
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation "junit:junit:4.13.2"; testImplementation "org.json:json:20250517" }

def nativeSDKOutput = layout.buildDirectory.dir("generated/commerce-native-r9")
def generateCommerceNativeSDK = tasks.register("generateCommerceNativeSDK", Exec) {
    inputs.files(file("../../scripts/generate-wallet-sdk.mjs"), file("../../../../seller-console/scripts/current-wallet-sdk.mjs"), file("../../../../seller-console/vendor/ynx-chain-wallet-auth-1.2.0-r9.tgz"))
    inputs.dir(file("src/main/assets/native-session"))
    outputs.dir(nativeSDKOutput)
    commandLine(System.getenv("NODE_BINARY") ?: "node", file("../../scripts/generate-wallet-sdk.mjs").absolutePath, "android", nativeSDKOutput.get().asFile.absolutePath)
}
android.sourceSets.main.assets.setSrcDirs([nativeSDKOutput.map { new File(it.asFile, "assets") }])
android.sourceSets.main.java.srcDir(nativeSDKOutput.map { new File(it.asFile, "sources") })
tasks.named("preBuild").configure { dependsOn(generateCommerceNativeSDK) }
