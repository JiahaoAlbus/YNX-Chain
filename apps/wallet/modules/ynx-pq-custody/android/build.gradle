plugins { id 'com.android.library'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.ynx.wallet.pq'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                    "-DYNX_AUTH_MOBILE_ARCHIVE=${project.findProperty('ynxAuthMobilePQArchive') ?: ''}",
                    "-DYNX_ACCOUNT_PROOF_INCLUDE_ROOTS=${project.findProperty('ynxAccountProofIncludeRoots') ?: ''}"
                if (project.findProperty('ynxAndroidDeviceApproval') == 'true') {
                    arguments '-DYNX_ANDROID_DEVICE_APPROVAL=ON',
                        "-DYNX_APPROVAL_AUTH_INCLUDE=${project.findProperty('ynxApprovalAuthInclude') ?: ''}",
                        "-DYNX_APPROVAL_PLAN_INCLUDE=${project.findProperty('ynxApprovalPlanInclude') ?: ''}",
                        "-DYNX_APPROVAL_FAILURE_INCLUDE=${project.findProperty('ynxApprovalFailureInclude') ?: ''}",
                        "-DYNX_APPROVAL_CORE_INCLUDE=${project.findProperty('ynxApprovalCoreInclude') ?: ''}"
                } else {
                    arguments '-DYNX_ANDROID_DEVICE_APPROVAL=OFF'
                }
            }
        }
    }
    buildFeatures { prefab true }
    externalNativeBuild { cmake { path 'CMakeLists.txt' } }
}
dependencies { implementation 'com.facebook.react:react-android'; implementation 'com.facebook.fbjni:fbjni' }
