// Independent TLS-only QA app. Not included in Wallet/Expo's Gradle project.
plugins {
  id 'com.android.application' version '8.12.0'
  id 'org.jetbrains.kotlin.android' version '2.1.20'
}
android {
  namespace 'com.ynxweb4.faucettransport.tlsruntimeqa'
  compileSdk 36
  defaultConfig {
    applicationId 'com.ynxweb4.faucettransport.tlsruntimeqa'
    minSdk 26
    targetSdk 36
    versionCode 1
    versionName '1-tls-runtime-qa'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
  sourceSets {
    main {
      manifest.srcFile '../src/androidTest/tls/AndroidManifest.xml'
      res.srcDirs = ['../src/androidTest/tls/res']
      java.srcDirs = []
    }
  }
  buildTypes { debug { minifyEnabled false } }
}
kotlin.sourceSets.main.kotlin {
  setSrcDirs(['../src/main/java', '../src/androidTest/tls/java'])
  include '**/BoundedHttpEngine.kt'
  include '**/BoundedHttpsRuntimeInstrumentation.kt'
}
dependencies {
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
  implementation 'com.squareup.okio:okio:3.16.0'
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
}
