<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YNX Card Testnet download cover</title>
  <desc id="desc">Original cover artwork for the YNX Card Testnet simulation product.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FF"/><stop offset="0.54" stop-color="#E4EEFF"/><stop offset="1" stop-color="#C7DBFF"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A31B9"/><stop offset="1" stop-color="#0A1748"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1440" cy="120" r="240" fill="#4D86FF" opacity="0.25"/>
  <circle cx="106" cy="806" r="260" fill="#00B79F" opacity="0.16"/>
  <text x="132" y="190" font-family="Arial, sans-serif" font-size="80" font-weight="700" fill="#0A1A4D">YNX CARD</text>
  <text x="138" y="258" font-family="Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="4" fill="#1648BE">TESTNET PAYMENT SIMULATION</text>
  <text x="132" y="356" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#17254D">Practice card controls and payment flows</text>
  <text x="132" y="414" font-family="Arial, sans-serif" font-size="30" fill="#33456F">YNXT Testnet only. No real-world payment capability.</text>
  <g transform="translate(884 252) rotate(-8)">
    <rect width="560" height="360" rx="42" fill="url(#card)"/>
    <text x="54" y="84" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#FFFFFF" letter-spacing="5">YNX CARD</text>
    <text x="54" y="154" font-family="Arial, sans-serif" font-size="22" fill="#C5D8FF" letter-spacing="3">TESTNET SIMULATION</text>
    <text x="54" y="258" font-family="Arial, sans-serif" font-size="43" fill="#FFFFFF" letter-spacing="8">**** 6423</text>
    <text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#B8F5EA">YNXT TESTNET ONLY</text>
  </g>
  <text x="132" y="778" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0A1A4D">Explore as guest. Connect a wallet only when you choose a Testnet action.</text>
</svg>
