<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">YNX Card Testnet identity</title>
  <desc id="desc">Original YNX Card artwork for Testnet payment simulation only. It is not a bank card and contains no payment credentials.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0728A9"/>
      <stop offset="0.52" stop-color="#0B1B5A"/>
      <stop offset="1" stop-color="#07112E"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FA4FF" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#A6CCFF" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#5FA4FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1600" height="1000" rx="76" fill="url(#base)"/>
  <circle cx="1280" cy="160" r="270" fill="#1D6BFF" opacity="0.42" filter="url(#blur)"/>
  <circle cx="290" cy="900" r="240" fill="#00C2A8" opacity="0.2" filter="url(#blur)"/>
  <path d="M0 708 C310 560 584 830 912 678 S1350 538 1600 710" fill="none" stroke="url(#beam)" stroke-width="3"/>
  <path d="M1020 314 L1184 220 L1348 314 L1348 504 C1348 636 1260 742 1184 778 C1108 742 1020 636 1020 504 Z" fill="#EAF2FF" fill-opacity="0.1" stroke="#CDE0FF" stroke-opacity="0.72" stroke-width="5"/>
  <path d="M1134 470 L1172 508 L1244 426" fill="none" stroke="#B8F5EA" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFFFFF">
    <text x="120" y="170" font-family="Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="8">YNX CARD</text>
    <text x="126" y="240" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="5" fill="#BBD4FF">TESTNET PAYMENT SIMULATION</text>
    <text x="120" y="575" font-family="Arial, sans-serif" font-size="98" font-weight="700" letter-spacing="12">YNX **** 6423</text>
    <text x="126" y="648" font-family="Arial, sans-serif" font-size="34" letter-spacing="3" fill="#D4E4FF">YNXT TESTNET ONLY</text>
    <text x="126" y="856" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#B8F5EA">NO REAL-WORLD PAYMENT CAPABILITY</text>
    <text x="126" y="910" font-family="Arial, sans-serif" font-size="25" fill="#D4E4FF">Sandbox card identity. No PAN, CVV, PIN, bank funding, or merchant acceptance.</text>
  </g>
</svg>
