<!doctype html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="google" content="notranslate">
    <link rel="stylesheet" href="approval.css">
    <title>YNX Wallet — Connection request</title>
  </head>
  <body>
    <main>
      <header><img src="ynx-logo.png" alt="YNX"><span>YNX WALLET</span></header>
      <p class="eyebrow">CONNECTION REQUEST</p>
      <h1 data-extension-i18n="connectionTitle">Review connection</h1>
      <p class="intro" data-extension-i18n="connectionInfo">Only your public account is shared. Signatures and private access require separate approval.</p>
      <dl>
        <div><dt data-extension-i18n="site">Site</dt><dd id="origin">Unavailable</dd></div>
        <div><details><summary data-extension-i18n="details">Connection details</summary><dd id="browser-context">Unavailable</dd></details></div><div><dt data-hosted-i18n="ynxAccount">Account</dt><dd id="account">Unavailable</dd></div>
        <div><dt data-extension-i18n="network">Network</dt><dd>YNX Testnet · 6423</dd></div>
      </dl>
      <p id="status" role="status" aria-live="polite"></p><details id="error-details" hidden><summary data-extension-i18n="details">Details</summary><code id="error-code"></code></details>
      <div class="actions"><button id="reject" type="button" disabled data-hosted-i18n="reject">Reject</button><button id="approve" class="primary" type="button" disabled data-hosted-i18n="approve">Approve</button></div>
    </main>
    <script src="approval.js" type="module"></script>
  </body>
</html>
