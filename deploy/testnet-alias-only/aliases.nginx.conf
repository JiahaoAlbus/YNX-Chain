# Candidate http-context include for the EXISTING nginx on Core/Faucet host.
# Certificates must already exist. No old server block is replaced.
map $http_upgrade $ynx_testnet_alias_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name rpc-testnet.ynxweb4.com;
    ssl_certificate /etc/letsencrypt/live/rpc-testnet.ynxweb4.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc-testnet.ynxweb4.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:6420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ynx_testnet_alias_connection;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name faucet-testnet.ynxweb4.com;
    ssl_certificate /etc/letsencrypt/live/faucet-testnet.ynxweb4.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faucet-testnet.ynxweb4.com/privkey.pem;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:6428;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
    }
}
